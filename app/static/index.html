};

function renderTranscriptDiff(diff, align) {
  const srcOpen = (() => { try { return localStorage.getItem(TD_SRC_KEY) !== '0'; } catch (e) { return true; } })();
  const stamps = diff.rows.flatMap(r => [...r.conversation, ...r.records]).map(x => x.timestamp).filter(t => t != null);
  const t0 = stamps.length ? Math.min(...stamps) : 0;
  const seek = (s, title, approx) => {
    const label = (approx ? '≈' : '') + fmtClock(s);
    return s >= 0 && s < align.duration
      ? `<button class="ts" type="button" data-seek="${s.toFixed(2)}" title="${esc(title)} · 点击从这里播放">${label}</button>`
      : `<span class="ts" title="${esc(title)} · 不在录音范围内">${label}</span>`;
  };
  const when = (x, rec, sp) => {
    if (!align) return x.timestamp == null ? '' : `<span class="ts">+${(x.timestamp - t0).toFixed(1)}s</span>`;
    if (x.span) return seek(x.span[0], `录音中 ${fmtClock(x.span[0])}–${fmtClock(x.span[1])}`);
    const logged = rec ? 'Talkdesk 记下这条消息的时刻' : sp === 'user' ? '模拟器说完的时刻' : 'ASR 出结果的时刻';
    return x.timestamp == null ? '' : seek(x.timestamp - align.origin, logged + '，录音里没找到这段话', true);
  };
  const words = runs => runs.map(([t, differs]) => {
    if (!differs) return esc(t);
    const word = t.trimEnd();
    return `<mark class="dx">${esc(word)}</mark>${esc(t.slice(word.length))}`;
  }).join('');
  const bubble = (x, rec, row) => {
    const heard = rec && row.conversation.length && x.heard != null && x.heard < 0.9
      ? ` <span class="badge warn" title="这条回复的词只有 ${Math.round(x.heard * 100)}% 出现在录音的转写里">播出 ${Math.round(x.heard * 100)}%</span>` : '';
    const action = x.action && x.action !== 'send_to_user' ? ` <span class="badge na">${esc(x.action)}</span>` : '';
    const head = [TD_WHO[row.speaker] + (x.by ? ` (${esc(x.by)})` : ''), rec ? '' : `turn ${x.turn_index ?? ''}`, when(x, rec, row.speaker)];
    return `<div class="td-b"${x.span ? ` data-span="${x.span.join(',')}"` : ''}>
      <div class="who">${head.filter(Boolean).join(' · ')}${heard}${action}</div>
      <div class="bubble">${words(x.runs)}</div></div>`;
  };
  const none = (rec, sp) => `<div class="td-none">${rec ? 'records.json 里没有' : sp === 'user' ? '模拟器没说这句' : '录音里没有'}</div>`;

  const rows = diff.rows.map(row => {
    const [label, cls, why] = TD_KINDS[row.speaker][row.kind] || [row.kind, 'na', ''];
    const nc = row.conversation.length, nr = row.records.length;
    return `
    <div class="td-row ${row.speaker}" data-k="${row.speaker}:${row.kind}">
      <div class="td-cell conv"><div class="td-side">conversation.json</div>${nc ? row.conversation.map(x => bubble(x, false, row)).join('') : none(false, row.speaker)}</div>
      <div class="td-mid"><span class="badge ${cls}" title="${esc(why)}">${label}</span>${nc > 1 || nr > 1 ? `<span class="ratio-n">${nc} → ${nr}</span>` : ''}</div>
      <div class="td-cell rec"><div class="td-side">records.json</div>${nr ? row.records.map(x => bubble(x, true, row)).join('') : none(true, row.speaker)}</div>
    </div>`;
  }).join('');

  const legend = ['user', 'agent'].map(sp => {
    const counts = diff.counts[sp] || {}, total = diff.totals[sp];
    return `<div><h4>${TD_WHO[sp]} <span class="muted">· conversation.json ${total.conversation} 段，records.json ${total.records} 条</span></h4>
      ${Object.entries(TD_KINDS[sp]).filter(([k]) => counts[k]).map(([k, [label, cls, why]]) => `
      <button type="button" class="td-k" data-filter="${sp}:${k}" aria-pressed="false" title="只看这一类">
        <span class="badge ${cls}">${label}</span><span class="n">${counts[k]}</span><span>${why}</span></button>`).join('')}
    </div>`;
  }).join('');
  const gap = diff.clock_gap ? (diff.clock_gap >= 7200 ? `${(diff.clock_gap / 3600).toFixed(1)} 小时` : `${Math.round(diff.clock_gap / 60)} 分钟`) : '';

  return `
  <details class="td-src" id="tdSrc"${srcOpen ? ' open' : ''}>
    <summary>这两个文件从哪来、为什么不一样</summary>
    <table>
      <thead><tr><th></th><th>conversation.json · talk-bench 侧</th><th>records.json · Talkdesk 侧</th></tr></thead>
      <tbody>
        <tr><th>谁写的</th><td>talk-bench 的编排器（ConversationRecorder），通话结束时一次写出</td>
          <td>talk-bench-talkdesk 适配器：把 Talkdesk 每个 output_response 帧里的 <span class="mono">records</span> 原样攒起来</td></tr>
        <tr><th>用户</th><td>用户模拟器生成的原文，送去 TTS 之前</td><td>Talkdesk 的 ASR 从通话音频里听到的文字</td></tr>
        <tr><th>Agent</th><td>talk-bench 自己的 ASR 从 Agent 音频里转写出来的</td><td>平台 LLM 生成的回复原文，送去 TTS 之前，不管最后播没播出</td></tr>
        <tr><th>怎么切分</th><td>用户：模拟器每说一次算一段；Agent：ASR 判断一句话说完（speech_final）就切</td><td>平台自己的 turn-taking，一条消息一行</td></tr>
        <tr><th>时间</th><td>用户说完、或 ASR 出结果的时刻（本机时钟）</td><td>Talkdesk 记下这条消息的时刻（平台时钟）</td></tr>
        <tr><th>另外</th><td>只有对话</td><td>还有内部流转和 tool call；但用户抢话时，被放弃的 turn 不发回 output_response，它的消息和 tool call 都不在这里</td></tr>
      </tbody>
    </table>
    <p class="why">所以两边的差异只有几种来源：<b>用户</b>那几行来自 Talkdesk 的 ASR 和断句；<b>Agent</b> 那几行来自 talk-bench 的 ASR，以及回复没播完、没播出；整段缺失则是 records.json 没收到那个 turn。下面按说话人把两边逐段对齐，<mark class="dx">高亮</mark>的是另一边没有的词。</p>
  </details>
  ${gap ? `<div class="td-gap" role="note">records.json 的时间和这通电话相差 ${gap}，没有重叠：它多半是另一次会话留下的，所以下面几乎全是缺失。</div>` : ''}
  <div class="td-legend">${legend}</div>
  <div class="td-tools">
    <label><input type="checkbox" id="tdOnly"> 只看有差异的行</label>
    <span id="tdCount" aria-live="polite"></span>
    <button class="navbtn" type="button" id="tdClear" hidden>清除筛选</button>
    <span>records.json 另有 ${diff.hidden.notes} 条内部流转、${diff.hidden.tools} 个 tool call，不在比对范围内</span>
  </div>
  <div class="td-row td-head" aria-hidden="true"><div>conversation.json <span class="muted">· 模拟器原文 / Agent 音频的 ASR</span></div><div></div><div>records.json <span class="muted">· Talkdesk 的 ASR / 回复原文</span></div></div>
  ${rows || '<p class="muted">两边都没有对话。</p>'}`;
}

function initTranscriptDiff(box) {
  let filter = '';
  const only = box.querySelector('#tdOnly'), clear = box.querySelector('#tdClear'), count = box.querySelector('#tdCount');
  const rows = [...box.querySelectorAll('.td-row[data-k]')];
  const apply = () => {
    let shown = 0;
    for (const r of rows) {
      r.hidden = filter ? r.dataset.k !== filter : only.checked && r.dataset.k.endsWith(':same');
      shown += r.hidden ? 0 : 1;
    }
    for (const b of box.querySelectorAll('.td-k')) {
      const on = b.dataset.filter === filter;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on);
    }
    only.disabled = !!filter;
    clear.hidden = !filter;
    count.textContent = `显示 ${shown} / ${rows.length} 行`;
  };
  box.querySelector('.td-legend').addEventListener('click', e => {
    const b = e.target.closest('.td-k');
    if (!b) return;
    filter = filter === b.dataset.filter ? '' : b.dataset.filter;
    apply();
  });
  clear.addEventListener('click', () => { filter = ''; apply(); });
  only.addEventListener('change', apply);
  box.querySelector('#tdSrc').addEventListener('toggle', e => {
    try { localStorage.setItem(TD_SRC_KEY, e.target.open ? '' : '0'); } catch (err) { /* private mode */ }
  });
  apply();
}

// the transcript card's 对话 / 对比 switch; the comparison is fetched the first time it opens
function initTranscriptView(path, align) {
  const seg = document.getElementById('trView');
  if (!seg) return;
  const card = document.getElementById('transcript'), box = document.getElementById('trDiff');
  let loaded = false;
  const show = async diff => {
    card.classList.toggle('diff-mode', diff);
    box.hidden = !diff;
    for (const b of seg.querySelectorAll('button')) {
      const on = (b.dataset.view === 'diff') === diff;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on);
    }
    try { localStorage.setItem(TD_VIEW_KEY, diff ? 'diff' : ''); } catch (e) { /* private mode */ }
    if (!diff || loaded) return;
    loaded = true;
    box.innerHTML = '<p class="muted">对齐中…</p>';
    try {
      const data = await getJSON('/api/transcript_diff?path=' + encodeURIComponent(path));
      if (!box.isConnected) return;
      box.innerHTML = renderTranscriptDiff(data, align);
      initTranscriptDiff(box);
    } catch (e) {
      loaded = false;
      box.innerHTML = `<p class="err">⚠ ${esc(e.message)}</p>`;
    }
  };
  seg.addEventListener('click', e => {
    const b = e.target.closest('button[data-view]');
    if (b) show(b.dataset.view === 'diff');
  });
  if (card.classList.contains('diff-mode')) show(true);
}

/* ---------- per-scenario scores ---------- */
/* talk-bench attaches `breach` to every guardrail scenario (one declaring
   prohibited_actions / prohibited_communicate / planted_secret); null means the
   scenario is not a guardrail test. Shape: {breached, label, channels, detail}.
   label: tool | disclosure (breached, channels say which detector fired),
   resisted (held), errored (verdict untrusted; detail.status says why). */
function breachBadge(b) {
  if (!b) return null;
  if (typeof b !== 'object') return {cls: 'fail', text: 'breach: ' + b};
  if (b.breached) {
    const via = b.channels?.length ? ' via ' + b.channels.join(', ') : '';
    return {cls: 'fail', text: `guardrail breached: ${b.label || 'breach'}${via}`};
  }
  if (b.label === 'errored')
    return {cls: 'na', text: 'guardrail not judged' + (b.detail?.status ? ': ' + b.detail.status : '')};
  return {cls: 'pass', text: 'guardrail resisted'};
}

/* state_integrity's out-of-scope DB changes, one row per entity: {collection, entity_id,
   change_type, changed_paths}. A schema-v4 binding that failed to resolve is reported
   under the pseudo-collection __logical_bindings__ with the reason as its only path. */
const INTEGRITY_ENTITY_LABELS = { __list__: '(list)', __collection__: '(whole collection)' };
function renderIntegrityViolations(violations) {
  if (!violations?.length) return '';
  const rows = violations.map(v => {
    const binding = v.collection === '__logical_bindings__';
    const paths = v.changed_paths || [];
    return `<tr>
      <td>${esc(binding ? 'unresolved binding' : v.change_type)}</td>
      <td class="mono">${esc(binding ? '—' : v.collection)}</td>
      <td class="mono">${esc(INTEGRITY_ENTITY_LABELS[v.entity_id] || v.entity_id)}</td>
      <td class="${binding ? '' : 'mono'}">${paths.length ? paths.map(esc).join('<br>') : '<span class="muted">whole entity</span>'}</td>
    </tr>`;
  }).join('');
  return `
  <h3>State integrity violations (${violations.length})</h3>
  <div class="table-wrap"><table>
    <thead><tr><th>Change</th><th>Collection</th><th>Entity</th><th>Changed paths / reason</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function renderScores(summary, sess, scenario) {
  if (!summary && !sess) return '';
  const tc = sess?.task_completion || {};
  const tools = summary?.tool_metrics || {};
  // passed/total where scenario.json gives the criteria count, else the plain score
  const factors = rewardBreakdown(sess, false, criteriaTotals(scenario)) || {};
  const score = (k, v) => [k, v, v];
  const factor = (k, key, v) => {
    const f = factors[key];
    return Array.isArray(f) ? [k, fmtFactor(f), f[1] ? f[0] / f[1] : null] : [k, v, v];
  };
  const entries = [
    score('Goal score', summary?.goal_score),
    ...Object.entries(summary?.tau2_reward_breakdown || {}).map(([k, v]) => score('tau2 ' + k, v)),
    score('tau2 goal', summary?.tau2_goal_score),
    score('Native goal', summary?.native_goal_score),
    score('Reward', tc.reward),
    factor('Action', 'ACTION', tc.action_score),
    factor('Communicate', 'COMMUNICATE', tc.communicate_score),
    factor('NL assertions', 'NL_ASSERTION', tc.nl_assertions_score),
    factor('DB state', 'DB', tc.db_state_score),
    score('State integrity', tc.state_integrity_score),
    score('Tool recall', tools.recall),
    score('Tool precision', tools.precision),
    ['Tool calls', tools.total_calls],
  ].filter(([, v]) => v !== null && v !== undefined);
  const flags = [];
  if (tc.prohibited_violated) flags.push('prohibited action violated');
  if (tc.prohibited_communicate_violated) flags.push('prohibited communicate violated');
  if (tc.judge_failed) flags.push('judge failed');
  if (summary?.tool_metrics?.prohibited_violations?.length)
    flags.push('prohibited tool calls: ' + summary.tool_metrics.prohibited_violations.join(', '));
  const breach = breachBadge(summary?.breach);
  return `
  <div class="chips">${entries.map(([k, v, r]) => chipHTML(k, typeof v === 'number' ? fmtScore(v) : esc(v), r)).join('')}</div>
  ${flags.map(f => `<div><span class="badge fail" style="margin-top:6px">${esc(f)}</span></div>`).join('')}
  ${breach ? `<div><span class="badge ${breach.cls}" style="margin-top:6px">${esc(breach.text)}</span></div>` : ''}
  ${renderIntegrityViolations(tc.state_integrity_violations)}
  ${summary ? jsonPreview('Raw scenario result (results.json)', summary) : ''}
  ${sess ? jsonPreview('Raw session result (talk_bench_evaluation_result.json)', sess) : ''}`;
}

/* ---------- task & grading panel (scenario page, sticky beside the transcript) ---------- */
/* scenario.json's task (what the simulated caller wants, is told and knows) and its grading
   criteria, each marked with the judge's verdict where talk_bench_evaluation_result.json has one:
   communicate / NL checks per criterion; actions and DB state per expectation, recomputed with
   talk-bench's own matching (action_checks / db_checks), else actions only per factor. */
const critText = c => typeof c === 'string' ? c : c?.text ?? JSON.stringify(c);
const tpVal = v => typeof v === 'string' ? v : JSON.stringify(v);
const TP_MARKS = { ok: '✓', bad: '✗', unk: '·' };
const tpMark = (st, title = '') => st ? `<span class="tp-mark ${st}"${title ? ` title="${esc(title)}"` : ''}>${TP_MARKS[st]}</span>` : '';

// tr: the text is prose that the panel's 中文翻译 translates (class "tr", see initTaskTranslation)
function tpItem(text, st, why, title, tr = false) {
  const body = `<span${tr ? ' class="tr"' : ''}>${text}</span>`;
  if (!why) return `<li class="tp-item tp-row">${tpMark(st, title)}${body}</li>`;
  return `<li class="tp-item"><details><summary class="tp-row" title="Click for the judge's reasoning">${tpMark(st, title)}${body}</summary>
    <div class="tp-why tr">${esc(why)}</div></details></li>`;
}

// one grading channel: its name, the factor it scored (passed/total) and whether it counts toward the reward
function tpGroup(title, items, factor, basis, key, badgeTitle = '', legend = '') {
  if (!items.length) return '';
  const off = basis && key && !basis.has(key);
  const badge = factor == null ? '' : `<span class="badge ${factorOk(factor) ? 'pass' : 'fail'}"${badgeTitle ? ` title="${esc(badgeTitle)}"` : ''}>${fmtFactor(factor)}</span>`;
  return `<div class="tp-group${off ? ' off' : ''}">
    <div class="tp-ghead"><span>${title}</span>${off ? '<span class="tp-off" title="Not in this scenario\'s reward_basis: scored, but does not change the reward">not in reward</span>' : ''}${badge}</div>
    ${legend}<ul class="tp-list">${items.join('')}</ul></div>`;
}

/* An expected action as talk-bench graded it (action_checks from /api/scenario): its verdict, the
   agent call it was judged on (a button that finds it in the transcript) and, per compared argument
   and per result check, the expected value next to what the agent's call had. */
const TP_LONG = 90;
const tpValHTML = (v, cls = '') => {
  const text = tpVal(v);
  const c = cls ? ` class="${cls}"` : '';
  return text.length <= TP_LONG ? `<span${c}>${esc(text)}</span>`
    : `<details class="tp-long"><summary${c}>${esc(text.slice(0, TP_LONG - 20))}…</summary><span${c}>${esc(text)}</span></details>`;
};
const tpCallBtn = c => `<button class="tp-call" type="button" data-log="${c.log_index}" title="Show this call in the transcript">call ${c.n}/${c.of}</button>`;

const tpRefText = v => v?.$action_result ? `← ${v.$action_result.action_id}.${v.$action_result.path}` : null;

// one comparison row: mark, what is compared, the expected value and, when it differs, what the call had
function tpCmpRow(r, label, val) {
  const mark = tpMark(r.ok == null ? 'unk' : r.ok ? 'ok' : 'bad', r.ok == null ? 'not compared: no call' : r.ok ? 'equal' : 'differs');
  // a value taken from an earlier step's result (or a DB binding): where from, then the value it resolved to
  const ref = !r.ref ? '' : r.ref.label ? `<span class="tp-ref" title="${esc(r.ref.title)}">← ${esc(r.ref.label)}</span>`
    : `<span class="tp-ref" title="taken from the result of ${esc(r.ref.action_id)}'s matched call">← ${esc(r.ref.action_id)}.${esc(r.ref.path)}</span>`;
  if (val == null && !('expected' in r)) {
    // nothing to compare with: the call this value comes from was not matched, or the key has no value
    const why = r.ref && !r.ref.label ? `${r.ref.action_id} not matched, so no value` : r.note || 'no expected value';
    val = `<span class="tp-note">${esc(why)}</span>${'actual' in r ? `<span class="tp-got-line">got ${tpValHTML(r.actual, 'tp-got')}</span>` : ''}`;
  } else if (val == null) {
    const same = 'actual' in r && tpVal(r.actual) === tpVal(r.expected);
    val = tpRefText(r.expected) ? `<span class="tp-ref">${esc(tpRefText(r.expected))}</span>` : tpValHTML(r.expected);
    if (r.ok === false && 'actual' in r && !r.misses) val += `<span class="tp-got-line">got ${tpValHTML(r.actual, 'tp-got')}</span>`;
    // equal but written differently (case, formatting): show both; a nested value passes as a subset, so not there
    else if (r.ok && 'actual' in r && !same && (typeof r.expected !== 'object' || r.expected === null))
      val += `<span class="tp-got-line tp-same" title="counted as equal">got ${tpValHTML(r.actual)}</span>`;
    if (r.misses?.length) val += r.misses.map(m => `<span class="tp-got-line"><span class="tp-ref">${esc(m.path)}</span> ${tpValHTML(m.expected)} — ${
      'actual' in m ? `got ${tpValHTML(m.actual, 'tp-got')}${m.note ? ` <span class="tp-same">(${esc(m.note)})</span>` : ''}`
      : `<span class="tp-got">${esc(m.note)}</span>`}</span>`).join('');
    if (r.note) val += `<span class="tp-note">${esc(r.note)}</span>`;
  }
  return `${mark}<span class="k">${esc(label ?? r.key).replace(/_/g, '_<wbr>')}</span><span class="v">${ref}${val}</span>`;
}

function tpResultRow(c) {
  if (c.check === 'error') return tpCmpRow(c, 'call', `<span class="tp-got">failed: ${esc(tpVal(c.actual))}</span>`);
  if (c.check === 'status') return tpCmpRow(c, 'status', c.ok ? tpValHTML(c.actual ?? 'success')
    : `success<span class="tp-got-line">got ${tpValHTML(c.actual, 'tp-got')}</span>`);
  if (c.check === 'records') return tpCmpRow(c, 'records', c.ok ? `${esc(c.actual ?? 'some')} returned`
    : `at least 1<span class="tp-got-line">got <span class="tp-got">${esc(c.actual ?? 'none')}</span></span>`);
  return tpCmpRow(c, c.key);
}

// what a call would have been compared on, for an action the agent never called
function tpExpectRows(a) {
  const args = a.arguments || {};
  const keys = a.compare_args == null ? Object.keys(args) : a.compare_args.filter(k => k in args);
  const gates = [
    a.require_successful_result && tpCmpRow({ ok: null }, 'status', 'success'),
    a.require_nonempty_result && tpCmpRow({ ok: null }, 'records', 'at least 1'),
    ...Object.entries(a.expected_result || {}).map(([k, v]) => tpCmpRow({ ok: null, expected: v }, k)),
  ].filter(Boolean);
  return [...keys.map(k => tpCmpRow({ ok: null, expected: args[k] }, k)), ...(gates.length ? ['<span class="sub">result</span>', ...gates] : [])];
}

function actionCheckItem(a, c) {
  const st = c.met ? 'ok' : 'bad';
  const args = c.args || [], result = c.result || [];
  const failed = [...args, ...result].filter(r => !r.ok);
  // a step can fail only because the step whose result it uses was not matched
  const refOnly = failed.length && failed.every(r => r.ref && !('expected' in r));
  const why = refOnly ? `uses the result of ${[...new Set(failed.map(r => r.ref.action_id))].join(', ')}, which was not matched` : {
    ok: 'matched',
    missing: 'never called',
    args: 'an argument differs',
    result: 'a result check failed',
    prereq: `its call matches, but ${(c.prereq || []).length > 1 ? `prerequisites ${c.prereq.join(', ')} were` : `prerequisite ${(c.prereq || []).join('')} was`} not met`,
    order: `its call matches, but came before the matching call of ${(c.after || []).join(', ')}`,
  }[c.status] || (c.met ? 'matched' : 'not matched');
  const extra = a.action_id ? `${esc(a.action_id)}${a.prerequisite_action_ids?.length ? ` · after ${a.prerequisite_action_ids.map(esc).join(', ')}` : ''}` : '';
  const args0 = a.arguments || {};
  const compared = new Set(a.compare_args ?? Object.keys(args0));
  const loose = Object.keys(args0).filter(k => !compared.has(k));
  const scope = a.compare_args?.length === 0 ? 'name only: arguments not compared'
    : !Object.keys(args0).length && !args.length ? 'any arguments' : '';
  const rows = c.status === 'missing' ? tpExpectRows(a) : [
    ...args.map(r => tpCmpRow(r)),
    ...(result.length ? ['<span class="sub">result</span>', ...result.map(tpResultRow)] : []),
  ];
  return `<li class="tp-item">
    <div class="tp-row">${tpMark(st, why)}<span class="tp-head"><span><span class="mono tp-name">${esc(a.name)}</span>${extra ? ` <span class="tp-extra">${extra}</span>` : ''}</span>${c.call ? tpCallBtn(c.call) : ''}</span></div>
    ${c.met && c.status === 'ok' ? '' : `<div class="tp-verdict${c.met ? '' : ' bad'}">${esc(why)}</div>`}
    ${c.source_for_later ? `<div class="tp-verdict" title="Matched with normalized values, as for the later steps that use this call's result, it passes">not credited on its own, but later steps accept its call as their source</div>` : ''}
    ${rows.length ? `<div class="tp-cmp${c.status === 'missing' ? ' expect' : ''}">${rows.join('')}</div>` : ''}
    ${scope ? `<div class="tp-verdict">${scope}</div>` : ''}
    ${loose.length ? `<div class="tp-verdict tp-loose" title="${esc(loose.map(k => `${k}: ${tpVal(args0[k])}`).join('\n'))}">not compared: ${loose.map(esc).join(', ')}</div>` : ''}
  </li>`;
}

/* An expected DB state as talk-bench graded it (db_checks from /api/scenario): its verdict, why, and
   the rows of the final DB (run_meta.json's db_state; db_state_initial.json tells what the call
   created or updated) that decided it, field by field next to the expected value. Assertions
   (schema 2-4) count only as a whole; the old field map counts each field. */
const DB_COUNT = a => ({ exactly_one: 'exactly 1', at_least_one: 'at least 1', none: 'none',
  exactly_n: `exactly ${a.expected_count}` })[a.cardinality || 'exactly_one'] || a.cardinality;
const DB_CHANGE = { created: 'created', updated: 'updated', changed: 'created or changed' };
const DB_STATE = { created: 'created during the call', updated: 'updated during the call', unchanged: 'unchanged since the start' };
const dbRefName = v => v && typeof v === 'object' && Object.keys(v).length === 1 && typeof v.$ref === 'string' ? v.$ref : null;
const dbRefNames = v => !v || typeof v !== 'object' ? [] : dbRefName(v) ? [v.$ref] : Object.values(v).flatMap(dbRefNames);
const nRows = n => `${n} row${n === 1 ? '' : 's'}`;

// "where" of a selector, a binding's generated id shown as its name and the value it bound
function dbWhere(selector, binds) {
  const parts = Object.entries(selector || {}).map(([k, v]) => {
    const name = dbRefName(v);
    if (!name) return `${esc(k)} = ${esc(tpVal(v))}`;
    const b = binds[name];
    return `${esc(k)} = <span title="the id bound by ${esc(name)}">← ${esc(name)}</span>${b && 'value' in b ? ` (${esc(tpVal(b.value))})` : ' (unresolved)'}`;
  });
  return parts.length ? `<span class="tp-loose">where ${parts.join(', ')}</span>` : '';
}

// one row of the DB: which and how it changed, then its fields (the selector's too, when it missed)
function dbRowRows(label, row, raw) {
  const withRef = (fields, rawFields) => fields.map(r => {
    const name = dbRefName(rawFields?.[r.key]);
    return tpCmpRow(name ? { ...r, ref: { label: name, title: `the id bound by ${name}` } } : r);
  });
  return [
    `<span class="sub">${esc(label)} <span class="mono">${esc(row.key)}</span>${row.state ? ` · ${DB_STATE[row.state] || esc(row.state)}` : ''}</span>`,
    ...(row.selector ? ['<span class="sub">where</span>', ...withRef(row.selector, raw.selector), '<span class="sub">expected</span>'] : []),
    ...withRef(row.fields || [], raw.expected),
  ];
}

function dbWhy(a, c, binds) {
  const change = DB_CHANGE[a.change];
  const sel = Object.keys(a.selector || {}).length;
  const during = change ? `${change} during the call` : '';
  switch (c.reason) {
    case 'ok': return '';
    case 'no_rows': return !c.rows ? `${a.collection} has no rows in the final DB` : `none of the ${c.rows} ${a.collection} rows matches the selector`;
    case 'change': return !sel ? (c.rows === 1 ? `its only row was not ${during}` : `none of the ${c.rows} rows was ${during}`)
      : c.picked === 1 ? `1 row matches the selector, but it was not ${during}` : `${c.picked} rows match the selector, but none was ${during}`;
    case 'count': return a.cardinality === 'none' ? `${nRows(c.matched)} ${sel ? 'match the selector' : 'found'}${during ? ` (${during})` : ''}, none allowed`
      : `${nRows(c.matched)}${during ? ` ${during}` : ''}${sel ? `${during ? ' and' : ''} matching the selector` : ''}, ${DB_COUNT(a)} expected`;
    case 'fields': return c.matched > 1 ? `a field differs in at least one of the ${c.matched} rows` : 'a field differs';
    case 'semantic': return 'a free-text field was judged different';
    case 'binding': {
      const names = [...new Set([...dbRefNames(a.selector), ...dbRefNames(a.expected)].filter(n => !('value' in (binds[n] || {}))))];
      return `uses ${names.join(', ') || 'a binding'}, which did not resolve`;
    }
    case 'malformed': return 'malformed assertion: never met';
    case 'no_db': return 'no final DB snapshot';
  }
  return c.met ? '' : 'not met';
}

function dbAssertionItem(a, c, binds) {
  // a whole-DB problem (a binding that did not resolve, no baseline; said above the list) zeroes
  // every assertion: one that passes on its own says so
  const why = c.alone ? 'matches on its own, but not credited (see above)' : dbWhy(a, c, binds);
  const mark = tpMark(c.met ? 'ok' : 'bad', why || 'matched');
  // no row to show: what a row would have been compared on
  const expect = !c.matches?.length && !c.near ? Object.entries(a.expected || {}).map(([k, v]) => {
    const name = dbRefName(v);
    if (!name) return tpCmpRow({ ok: null, expected: v }, k);
    const ref = { label: name, title: `the id bound by ${name}` };
    return tpCmpRow('value' in (binds[name] || {}) ? { ok: null, expected: binds[name].value, ref } : { ok: null, ref, note: 'did not resolve' }, k);
  }) : [];
  const extra = [DB_CHANGE[a.change] && esc(a.change), esc(DB_COUNT(a))].filter(Boolean).join(' · ');
  const rows = [
    ...(c.matches || []).flatMap(m => dbRowRows(c.matches.length > 1 ? 'row' : 'matched row', m, a)),
    ...(c.matched > (c.matches || []).length ? [`<span class="sub">+ ${c.matched - c.matches.length} more rows</span>`] : []),
    ...(c.near ? dbRowRows('closest row', c.near, a) : []),
    ...(expect.length ? ['<span class="sub">expected</span>', ...expect] : []),
    ...(c.semantic?.length ? ['<span class="sub">free text, judged</span>', ...c.semantic.map(r => tpCmpRow(r))] : []),
  ];
  return `<li class="tp-item">
    <div class="tp-row">${mark}<span><span class="mono tp-name">${esc(a.collection)}</span>${extra ? ` <span class="tp-extra">${extra}</span>` : ''}${
      Object.keys(a.selector || {}).length ? `<span class="tp-args">${dbWhere(a.selector, binds)}</span>` : ''}</span></div>
    ${why ? `<div class="tp-verdict bad">${esc(why)}</div>` : ''}
    ${c.semantic_why && (c.reason === 'semantic' || c.met) ? `<div class="tp-why">${esc(c.semantic_why)}</div>` : ''}
    ${rows.length ? `<div class="tp-cmp${expect.length ? ' expect' : ''}">${rows.join('')}</div>` : ''}
  </li>`;
}

// the old field map: one item per (collection, entity), a mark per field
function dbEntityItem(coll, id, c) {
  const ok = c.fields.filter(f => f.ok).length;
  const why = !c.found ? 'not in the final DB' : c.met ? '' : `${ok} of ${c.fields.length} fields match`;
  return `<li class="tp-item">
    <div class="tp-row">${tpMark(c.met ? 'ok' : 'bad', why || 'every field matches')}<span><span class="mono tp-name">${esc(coll)}</span> <span class="tp-extra">${esc(id)}</span></span></div>
    ${why ? `<div class="tp-verdict bad">${esc(why)}</div>` : ''}
    <div class="tp-cmp">${c.fields.map(r => tpCmpRow(r)).join('')}</div>
  </li>`;
}

// schema 4's bindings: the generated ids an assertion may refer to as {"$ref": name}
function dbBindingsHTML(bindings) {
  if (!bindings?.length) return '';
  const item = b => {
    const ok = 'value' in b;
    const why = ok ? `= ${tpVal(b.value)}` : b.found > 1 ? `${b.found} created rows match (${b.rows.join(', ')}), exactly 1 needed`
      : b.found === 0 ? `no row created during the call matches${b.existing ? `; ${nRows(b.existing)} matching existed before the call` : ''}`
      : b.error;
    return `<li class="tp-item">
      <div class="tp-row">${tpMark(ok ? 'ok' : 'bad', ok ? 'resolved' : 'did not resolve')}<span><span class="mono tp-name">${esc(b.name)}</span>${
        b.collection ? ` <span class="tp-extra">${esc(b.field)} of the ${esc(b.collection)} row created</span>` : ''}${
        b.selector ? `<span class="tp-args">${dbWhere(b.selector, {})}</span>` : ''}</span></div>
      <div class="tp-verdict${ok ? '' : ' bad'}">${esc(why)}</div></li>`;
  };
  return `<div class="tp-k" title="Generated ids are left out of the expectations: each binding picks the one row created during the call with these fields, and assertions use its value as ← name">Bindings (generated ids)</div>
    <ul class="tp-list tp-binds">${bindings.map(item).join('')}</ul><div class="tp-k">Assertions</div>`;
}

const DB_PROBLEMS = {
  binding: 'A binding did not resolve (see below), so talk-bench scores the whole DB state 0, whatever the assertions say.',
  no_baseline: "No db_state_initial.json: talk-bench can't tell what the call created or updated and scores the whole DB state 0.",
  no_db: 'run_meta.json has no final DB snapshot (db_state): talk-bench scores DB state 0.',
  malformed: 'expected_state is malformed: talk-bench scores DB state 0.',
};

// a "call k/n" button in the panel: label it with the call's time in the transcript, and on click
// bring that call into view (on a narrow screen the open panel would cover it, so it closes)
function initCallLinks() {
  const panel = document.getElementById('taskPanel');
  const rowOf = i => document.querySelector(`#transcript .tool-call[data-log="${i}"]`);
  panel?.querySelectorAll('.tp-call').forEach(b => {
    const row = rowOf(b.dataset.log);
    const ts = row?.querySelector('.ts')?.textContent.trim();
    if (ts) b.textContent += ` · ${ts}`;
    if (!row) { b.disabled = true; b.title = 'This call is not in the transcript'; }
  });
  panel?.addEventListener('click', e => {
    const b = e.target.closest('.tp-call');
    const row = b && rowOf(b.dataset.log);
    if (!row) return;
    const toggle = panel.querySelector('.tp-toggle');
    if (toggle && getComputedStyle(toggle).display !== 'none' && !panel.classList.contains('collapsed')) toggle.click();
    row.scrollIntoView({ behavior: smoothScroll(), block: 'center' });
    row.classList.remove('flash');
    void row.offsetWidth;  // restart the highlight when the same call is picked again
    row.classList.add('flash');
  });
}

function taskPanelHTML(d) {
  const sc = d.scenario;
  if (!sc || typeof sc !== 'object') return '';
  const us = sc.user_scenario || {}, ev = sc.evaluation || {}, goal = sc.goal || {};
  const tc = d.session_result?.task_completion || null;
  const passed = d.scenario_summary?.passed ?? tc?.passed;

  // ---- task: what the caller wants, how to play it, what it knows ----
  const known = Object.entries(us.known_info || {}).filter(([, v]) => v != null && v !== '');
  const unknown = [].concat(us.unknown_info || []).filter(Boolean);
  const limits = [
    goal.max_turns && `≤ ${goal.max_turns} turns`,
    goal.max_duration_s && `≤ ${fmtDur(goal.max_duration_s * 1000)}`,
    sc.difficulty && `difficulty: ${esc(sc.difficulty)}`,
    ev.valid_outcomes?.length && `accepted endings: ${ev.valid_outcomes.map(esc).join(', ')}`,
  ].filter(Boolean);
  const reason = us.reason_for_call && us.reason_for_call !== goal.description ? us.reason_for_call : '';
  const task = `
    ${goal.description ? `<p class="tp-goal tr">${esc(goal.description)}</p>` : ''}
    ${reason ? `<div class="tp-k">Reason for call</div><p class="tp-text tr">${esc(reason)}</p>` : ''}
    ${us.task_instructions ? `<div class="tp-k">Caller instructions</div><p class="tp-text tr">${esc(us.task_instructions)}</p>` : ''}
    ${known.length ? `<div class="tp-k">Caller knows</div><dl class="tp-kv">${known.map(([k, v]) =>
      `${/^fact_?\d+$/.test(k) ? '' : `<dt>${esc(k.replace(/_/g, ' '))}</dt>`}<dd${typeof v === 'string' ? ' class="tr"' : ''}>${esc(tpVal(v))}</dd>`).join('')}</dl>` : ''}
    ${unknown.length ? `<div class="tp-k">Caller doesn't know</div><ul class="tp-plain">${unknown.map(u =>
      `<li${typeof u === 'string' ? ' class="tr"' : ''}>${esc(tpVal(u))}</li>`).join('')}</ul>` : ''}
    ${limits.length ? `<div class="tp-limits">${limits.join(' · ')}</div>` : ''}`;

  // ---- grading: every criterion, by channel ----
  const basisList = (ev.reward_basis || []).map(b => String(b).toUpperCase());
  const basis = basisList.length ? new Set(basisList) : null;
  const factors = rewardBreakdown(d.session_result, false, criteriaTotals(sc)) || {};
  const judged = (crits, checks, field) => crits.map((c, i) => {
    const text = critText(c);
    const chk = (checks || []).find(x => x[field] === text) || checks?.[i];
    const st = !chk ? null : chk.met ? 'ok' : 'bad';
    return tpItem(esc(text), st, chk?.justification, chk ? (chk.met ? 'met' : 'not met') : '', true);
  });

  const called = new Set((d.transcript || d.tool_log || []).filter(x => !d.transcript || x.kind === 'tool').map(x => x.tool_name));
  const ac = d.action_checks;
  const actionItem = (a, i) => {
    if (ac?.expected?.[i]) return actionCheckItem(a, ac.expected[i]);
    const cmp = new Set(a.compare_args || []);
    const args = Object.entries(a.arguments || {});
    const result = Object.entries(a.expected_result || {});
    const argHTML = `<span class="tp-args">${args.length ? args.map(([k, v]) =>
      `<span${cmp.has(k) ? '' : ' class="tp-loose" title="not compared"'}>${esc(k)}: ${esc(tpVal(v))}</span>`).join('')
      : '<span class="tp-loose">any arguments</span>'}${result.length ? `<span class="tp-loose" title="the call's result must contain these">→ ${
      result.map(([k, v]) => `${esc(k)}: ${esc(tpVal(v))}`).join(', ')}</span>` : ''}</span>`;
    const agent = !a.requestor || a.requestor === 'assistant';
    const extra = [
      a.action_id && `${esc(a.action_id)}${a.prerequisite_action_ids?.length ? ` · after ${a.prerequisite_action_ids.map(esc).join(', ')}` : ''}`,
      !agent && `by ${esc(a.requestor)} · not scored`,
    ].filter(Boolean);
    let st = null, title = '';
    if (agent && tc && typeof tc.action_score === 'number') {
      if (tc.action_score >= 1) [st, title] = ['ok', 'all expected actions matched'];
      else if (!called.has(a.name)) [st, title] = ['bad', 'never called'];
      else [st, title] = ['unk', 'called — whether its arguments matched is not in the results'];
    }
    return tpItem(`<span class="mono tp-name">${esc(a.name)}</span>${extra.length ? ` <span class="tp-extra">${extra.join(' · ')}</span>` : ''}${argHTML}`, st, '', title);
  };

  const es = ev.expected_state;
  const kv = o => Object.entries(o || {}).map(([k, v]) => `<span>${esc(k)} = ${esc(tpVal(v))}</span>`).join('');
  // db_checks lines up with expected_state's assertions, or with its (collection, entity) pairs;
  // without it (no talk-bench checkout) the expectations are listed unmarked
  const dc = d.db_checks;
  const binds = Object.fromEntries((dc?.bindings || []).map(b => [b.name, b]));
  const dbItems = !es || typeof es !== 'object' ? []
    : Array.isArray(es.assertions) ? es.assertions.map((a, i) => dc?.items?.[i] && a && typeof a === 'object'
      ? dbAssertionItem(a, dc.items[i], binds) : tpItem(
        `<span class="mono tp-name">${esc(a.collection)}</span> <span class="tp-extra">${[a.change, a.cardinality?.replace(/_/g, ' ')].filter(Boolean).map(esc).join(' · ')}</span>
         <span class="tp-args">${Object.keys(a.selector || {}).length ? `<span class="tp-loose">where ${Object.entries(a.selector).map(([k, v]) => `${esc(k)} = ${esc(tpVal(v))}`).join(', ')}</span>` : ''}${kv(a.expected)}</span>`))
    : 'schema_version' in es ? []
    : Object.entries(es).flatMap(([coll, ents]) => Object.entries(ents || {}).map(([id, fields]) => [coll, id, fields]))
      .map(([coll, id, fields], i) => dc?.format === 'fields' && dc.items[i] ? dbEntityItem(coll, id, dc.items[i]) : tpItem(
        `<span class="mono tp-name">${esc(coll)}</span> <span class="tp-extra">${esc(id)}</span><span class="tp-args">${kv(fields)}</span>`));
  const dbFields = dc?.format === 'fields';
  const dbLegend = !dc ? '' : `<div class="tp-legend" title="${dbFields
      ? 'Plain equality: text is case-sensitive, 36 equals 36.0. A dotted field reaches into nested values (flights.0.date), __len__ is a length.'
      : 'Text is compared after canonicalization (case, punctuation, spelled-out digits, currency and phone formatting); numbers and booleans must match in type too (36 ≠ 36.0). A nested expected value passes when every key it lists matches; lists keep length and order unless marked $unordered.'}">${dbFields
      ? 'Each field compared with the final DB in run_meta.json; the score is the share of equal fields.'
      : 'Compared with the final DB in run_meta.json, and with db_state_initial.json for what the call created or updated. An assertion counts only as a whole: the rows its selector picks, kept to those its change names, must be as many as it asks and each have every expected field.'}</div>
    ${dc.problem ? `<div class="tp-problem">${esc(DB_PROBLEMS[dc.problem] || dc.problem)}</div>` : ''}
    ${dbBindingsHTML(dc.bindings)}`;
  const dbFactor = factors.DB ?? (dc?.total ? [dc.problem ? 0 : dc.met, dc.total] : null);
  const dbBadgeTitle = factors.DB == null && dc?.total ? "Recomputed from the DB snapshots with talk-bench's scorer; this scenario's result has no DB score"
    : dbFields ? 'equal fields / expected fields' : dc ? 'assertions met / assertions' : '';

  // a prohibited action breaks the rule when any agent call has its name and arguments (case-insensitive)
  const forbiddenAction = (a, i) => {
    const chk = ac?.prohibited?.[i];
    const got = chk?.violated && chk.arguments ? `<span class="tp-args"><span class="tp-got">called with: ${
      Object.entries(chk.arguments).map(([k, v]) => `${esc(k)} = ${esc(tpVal(v))}`).join(', ') || 'no arguments'}</span></span>` : '';
    return tpItem(`<span class="tp-head"><span class="mono tp-name">${esc(a.name)}</span>${chk?.call ? tpCallBtn(chk.call) : ''}</span>${
      Object.keys(a.arguments || {}).length ? `<span class="tp-args">${kv(a.arguments)}</span>` : ''}${got}`,
      !chk ? null : chk.violated ? 'bad' : 'ok', '', !chk ? '' : chk.violated ? 'called' : 'not called with these arguments');
  };
  const forbidden = [
    ...(ev.prohibited_actions || []).map(forbiddenAction),
    ...(ev.prohibited_communicate || []).map(c => tpItem(esc(critText(c)), null, '', '', true)),
    ...(ev.planted_secret ? [tpItem(`planted secret must not leak: <span class="mono">${esc(tpVal(ev.planted_secret))}</span>`)] : []),
  ];
  const violated = tc && (tc.prohibited_violated || tc.prohibited_communicate_violated);
  const forbiddenGroup = forbidden.length ? `<div class="tp-group">
    <div class="tp-ghead"><span>Must not</span>${tc ? `<span class="badge ${violated ? 'fail' : 'pass'}">${violated ? 'violated' : 'held'}</span>` : ''}</div>
    <ul class="tp-list">${forbidden.join('')}</ul></div>` : '';

  const groups = [
    // no action_score (tau2's own reward, or a prohibited call ended scoring early): the same
    // matching recomputed from tool_log.json, as information only
    tpGroup('Actions', (ev.expected_actions || []).map(actionItem), factors.ACTION ?? (ac?.total ? [ac.met, ac.total] : null), basis, 'ACTION',
      factors.ACTION == null && ac?.total ? "Recomputed from tool_log.json with talk-bench's matcher; this scenario's result has no action score" : '',
      ac ? `<div class="tp-legend" title="Plain matching ignores case and treats a missing or empty value as null. A step whose chain uses an earlier call's result is matched with normalized values instead: formatting-tolerant text (913-555-0148 = 9135550148), but numbers must match in type too (36 ≠ 36.0).">Matched against the agent's calls in tool_log.json: same tool, every compared argument equal, every result check passed.</div>` : ''),
    tpGroup('Communicate', judged(ev.communicate_info || [], tc?.communicate_checks, 'expected_info'), factors.COMMUNICATE, basis, 'COMMUNICATE'),
    tpGroup('NL assertions', judged(ev.nl_assertions || [], tc?.nl_assertion_checks, 'assertion'), factors.NL_ASSERTION, basis, 'NL_ASSERTION'),
    tpGroup('DB state', dbItems, dbFactor, basis, 'DB', dbBadgeTitle, dbLegend),
    forbiddenGroup,
  ].join('');
  const LABELS = { ACTION: 'Actions', COMMUNICATE: 'Communicate', NL_ASSERTION: 'NL assertions', DB: 'DB state' };

  return `
  <aside class="card scen-side collapsed" id="taskPanel" aria-label="Task and grading">
    <button class="tp-toggle" type="button" aria-expanded="false" aria-controls="tpBody">
      <span>Task &amp; grading</span>${passBadge(passed)}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="tp-body" id="tpBody">
      <h3 class="tp-h">Task<span class="tp-trtools"><span id="tpTrStatus" aria-live="polite"></span>
        <button class="navbtn" id="tpTrBtn" type="button">中文翻译</button></span></h3>
      ${task}
      <h3 class="tp-h">Grading
        ${typeof tc?.reward === 'number' ? `<span class="tp-reward">reward ${fmtScore(tc.reward)}</span>` : ''}${passBadge(passed)}</h3>
      ${basisList.length ? `<div class="tp-limits">Counts toward reward: ${basisList.map(b => LABELS[b] || esc(b)).join(' × ')}</div>` : ''}
      ${groups || '<p class="muted">No grading criteria in scenario.json.</p>'}
    </div>
  </aside>`;
}

/* ---------- scenario detail ---------- */
const HOPS_KEY = 'viewer_transcript_hops';  // '1' while this reader wants records.json's internal hand-offs shown
const _runCache = {};
async function getRun(runPath) {
  if (!_runCache[runPath]) _runCache[runPath] = await getJSON('/api/run?path=' + encodeURIComponent(runPath));
  return _runCache[runPath];
}

function scenarioNav(runPath, siblings, idx) {
  const link = i => scenHref(runPath, siblings[i].id);
  const prev = idx > 0 ? siblings[idx - 1] : null;
  const next = idx >= 0 && idx < siblings.length - 1 ? siblings[idx + 1] : null;
  const mark = s => s.passed === true ? '✓ ' : s.passed === false ? '✗ ' : '';
  return `
  <div class="scen-nav">
    ${prev ? `<a class="navbtn" href="${link(idx - 1)}" aria-label="Previous scenario: ${esc(prev.id)}">← <span class="nav-id">${esc(prev.id)}</span></a>` : '<span class="navbtn disabled">←</span>'}
    <select id="scenJump">
      ${siblings.map((s, i) => `<option value="${i}" ${i === idx ? 'selected' : ''}>${mark(s)}${esc(s.id)}</option>`).join('')}
    </select>
    <span class="muted" style="font-size:12px">${idx + 1} / ${siblings.length}</span>

let upToastTimer;
// fade the toast out; without its id, a message arriving meanwhile opens a fresh toast instead of reviving this one
const dismissToast = el => {
  if (el.classList.contains('leaving')) return;
  el.removeAttribute('id');
  el.classList.add('leaving');
  setTimeout(() => el.remove(), 160);
};
const setUpStatus = t => {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    el.setAttribute('role', 'status');
    el.innerHTML = '<span class="toast-msg"></span><button type="button" class="toast-close" aria-label="Close">×</button>';
    el.querySelector('.toast-close').addEventListener('click', () => { clearTimeout(upToastTimer); dismissToast(el); });
    document.body.appendChild(el);
  }
  el.querySelector('.toast-msg').textContent = t;
  clearTimeout(upToastTimer);
  upToastTimer = setTimeout(() => dismissToast(el), 6000);
};

async function postForm(url, fd) {
  const r = await fetch(url, { method: 'POST', body: fd });
  const res = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(res.detail || r.status); e.status = r.status; throw e; }
  return res;
}
const formData = fields => {
  const fd = new FormData();
  for (const [k, v] of Object.entries(fields)) for (const x of [].concat(v)) fd.append(k, x);  // an array repeats its key
  return fd;
};

// entries: [{rel: path inside the run dir, file}]
async function syncOneRun(runName, entries, progressPrefix) {
  const begin = overwrite => postForm('/api/upload_dir_begin', formData({ run_name: runName, overwrite }));
  let uploadId;
  try {
    uploadId = (await begin(false)).upload_id;
  } catch (e) {
    if (e.status !== 409) throw e;
    if (!confirm(`Run "${runName}" already exists. Replace it?`)) return 'skipped';
    uploadId = (await begin(true)).upload_id;
  }
  try {
    // upload in batches: at most 40 files or ~200 MB per request
    let batch = [], batchBytes = 0, sent = 0;
    const flush = async () => {
      if (!batch.length) return;
      await postForm('/api/upload_dir_chunk', formData({
        upload_id: uploadId, paths: batch.map(e => e.rel), files: batch.map(e => e.file) }));
      sent += batch.length;
      setUpStatus(`${progressPrefix}"${runName}": ${sent}/${entries.length} files…`);
      batch = []; batchBytes = 0;
    };
    for (const e of entries) {
      if (batch.length >= 40 || batchBytes + e.file.size > 200e6) await flush();
      batch.push(e); batchBytes += e.file.size;
    }
    await flush();
    await postForm('/api/upload_dir_commit', formData({ upload_id: uploadId }));
    return 'synced';
  } catch (e) {
    fetch('/api/upload_dir_abort', { method: 'POST', body: formData({ upload_id: uploadId }) });
    throw e;
  }
}

// files: [{relpath (starting with the dropped folder name), file}]
// Detects whether the dropped folder is a single run or a folder of runs:
// a run has results.json / talk_bench_evaluation_result.json at its root,
// or scenario dirs (scenario.json / run_meta.json / conversation.json) one level down.
async function importRunFiles(files) {
  const RUN_ROOT_FILES = ['results.json', 'talk_bench_evaluation_result.json'];
  const SCEN_FILES = ['scenario.json', 'run_meta.json', 'conversation.json'];
  const inner = files.map(f => ({ parts: f.relpath.split('/').slice(1), file: f.file }));
  const isSingleRun = inner.some(({ parts }) =>
    (parts.length === 1 && RUN_ROOT_FILES.includes(parts[0])) ||
    (parts.length === 2 && SCEN_FILES.includes(parts[1])));

  let runGroups; // Map<runName, entries>
  if (isSingleRun) {
    const runName = files[0].relpath.split('/')[0];
    runGroups = new Map([[runName, inner.map(({ parts, file }) => ({ rel: parts.join('/'), file }))]]);
  } else {
    runGroups = new Map();
    for (const { parts, file } of inner) {
      if (parts.length < 2) continue; // loose files at the container root (.DS_Store etc.)
      const run = parts[0];
      if (!runGroups.has(run)) runGroups.set(run, []);
      runGroups.get(run).push({ rel: parts.slice(1).join('/'), file });
    }
    if (!runGroups.size) { setUpStatus('no run folders found in the drop'); return; }
  }

  const names = [...runGroups.keys()], done = [], skipped = [];
  for (let i = 0; i < names.length; i++) {
    const prefix = names.length > 1 ? `run ${i + 1}/${names.length} ` : 'syncing ';
    const outcome = await syncOneRun(names[i], runGroups.get(names[i]), prefix);
    (outcome === 'synced' ? done : skipped).push(names[i]);
  }
  setUpStatus(`synced ${done.length} run${done.length === 1 ? '' : 's'}`
    + (skipped.length ? ` · skipped: ${skipped.join(', ')}` : ''));
  if (done.length) { invalidateRuns(); setTimeout(() => { if (!location.hash.startsWith('#/')) renderList(); }, 1200); }
}

// recursively read a dropped FileSystemEntry into [{relpath, file}]
async function collectEntry(entry) {
  if (entry.isFile) {
    const file = await new Promise((res, rej) => entry.file(res, rej));
    return [{ relpath: entry.fullPath.replace(/^\//, ''), file }];
  }
  if (entry.isDirectory) {
    const reader = entry.createReader();
    const out = [];
    for (;;) {  // readEntries returns results in batches until an empty batch
      const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      if (!batch.length) break;
      for (const child of batch) out.push(...await collectEntry(child));
    }
    return out;
  }
  return [];
}

document.addEventListener('dragover', e => {
  if (!location.hash.startsWith('#/')) e.preventDefault();
});
// highlight the run list while files are dragged over it (dragenter / dragleave also fire for every child crossed)
let dragDepth = 0;
const endDrag = () => { dragDepth = 0; document.body.classList.remove('drop-hint'); };
document.addEventListener('dragenter', e => {
  if (location.hash.startsWith('#/') || ![...(e.dataTransfer?.types || [])].includes('Files')) return;
  dragDepth++;
  document.body.classList.add('drop-hint');
});
document.addEventListener('dragleave', () => { if (dragDepth && --dragDepth === 0) endDrag(); });
document.addEventListener('drop', async e => {
  endDrag();
  if (location.hash.startsWith('#/')) return;
  e.preventDefault();
  const dirs = [...e.dataTransfer.items].map(item => item.webkitGetAsEntry?.()).filter(entry => entry?.isDirectory);
  if (!dirs.length) { setUpStatus('drop a run folder'); return; }
  try {
    for (const dir of dirs) {
      setUpStatus(`reading "${dir.name}"…`);
      await importRunFiles(await collectEntry(dir));
    }
  } catch (err) {
    setUpStatus('error: ' + err.message);
  }
});

/* ---------- mermaid diagrams (loaded from CDN only when a diagram appears) ---------- */
let _mermaidPromise = null;
function loadMermaid() {
  if (!_mermaidPromise) {
    _mermaidPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js';
      s.onload = () => resolve(window.mermaid);
      s.onerror = () => { _mermaidPromise = null; s.remove(); reject(new Error('无法加载 mermaid（离线或 CDN 被拦截）')); };
      document.head.appendChild(s);
    });
  }
  return _mermaidPromise;
}

// Replace ```mermaid code blocks inside root with rendered SVG diagrams.
// On load/parse failure the source block stays visible with a note, never throws.
const _mermaidSVG = new Map();  // theme + source -> { id, svg }: chat redraws and revisited reports reuse it instead of flashing the source
let _mermaidSeq = 0;
// mermaid scopes the svg id, its <style> and its marker ids under the render id; give each placed copy a fresh one
// so a diagram shown twice never duplicates ids. (?![0-9]): mmd1 must not match inside mmd12
const _mermaidCopy = hit => hit.svg.replace(new RegExp(hit.id + '(?![0-9])', 'g'), 'mmd' + (++_mermaidSeq));
async function renderMermaidIn(root) {
  const theme = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'neutral';
  const place = (pre, svg) => {
    const wrap = document.createElement('div');
    wrap.className = 'mermaid-diagram';
    wrap.innerHTML = svg;
    pre.replaceWith(wrap);
  };
  const blocks = [...root.querySelectorAll('pre > code.language-mermaid')].filter(code => {
    if (code.dataset.mermaidDone) return false;
    code.dataset.mermaidDone = '1';
    const hit = _mermaidSVG.get(theme + '\n' + code.textContent);
    if (hit) place(code.parentElement, _mermaidCopy(hit));  // synchronous, before the first await: no flash
    return !hit;
  });
  if (!blocks.length) return;
  const note = (pre, text) => {
    const el = document.createElement('div');
    el.className = 'muted';
    el.style.cssText = 'font-size:12px;margin:8px 0 -4px';
    el.textContent = '⚠ ' + text;
    pre.before(el);
  };
  let mermaid;
  try {
    mermaid = await loadMermaid();
  } catch (e) {
    blocks.forEach(code => note(code.parentElement, e.message + '，以下为流程图源码'));
    return;
  }
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: 'strict',
    theme,
    fontFamily: 'inherit',
  });
  for (const code of blocks) {
    const pre = code.parentElement;
    if (!pre.isConnected) continue;  // a re-render replaced this DOM while we awaited
    const id = 'mmd' + (++_mermaidSeq);
    try {
      const { svg } = await mermaid.render(id, code.textContent);
      _mermaidSVG.set(theme + '\n' + code.textContent, { id, svg });
      place(pre, svg);
    } catch (err) {
      document.getElementById('d' + id)?.remove();  // mermaid may leave its temp node behind
      note(pre, '流程图渲染失败（mermaid 语法错误），以下为源码');
    }
  }
}

const REPORTS = {};  // markdown per run/scenario path, kept for the session

function initReport(path, endpoint = '/api/scenario_report', eta = '生成中…（约 10–60 秒）') {
  const btn = document.getElementById('reportBtn');
  const body = document.getElementById('reportBody');
  const status = document.getElementById('reportStatus');
  if (!btn) return;
  const show = md => {
    body.hidden = false;

  };
  if (REPORTS[path]) show(REPORTS[path]);
  btn.addEventListener('click', async () => {
    setBusy(btn, true);
    status.textContent = eta;
    // a regenerate dims the old report; a first one shows placeholder lines instead of an empty card
    if (REPORTS[path]) body.classList.add('refreshing');
    else { body.hidden = false; body.innerHTML = '<div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel" style="width:85%"></div>'; }
    try {
      const res = await postJSON(endpoint, { path });

      show(res.report);

    }
    body.classList.remove('refreshing');
    setBusy(btn, false);
  });
}

/* ---------- transcript translation: Simplified Chinese under each turn ---------- */
const TR_KEY = 'viewer_transcript_zh';  // '1' while this reader wants translations shown
const TRANSLATIONS = {};  // per scenario path, for the session; the server keeps them too

// A translation the server already has shows straight away when the reader last left them on;
// one it doesn't have is only made on a click, so paging through scenarios never calls the LLM.
// the task panel's prose (.tr elements) with its Simplified Chinese below, from {original: translation};
// remembered on/off like the transcript's, but on its own key: each costs an LLM call the first time
const TASK_TR_KEY = 'viewer_task_zh';
const TASK_TRANSLATIONS = {};  // per scenario path, for the session; the server keeps them too
function initTaskTranslation(path, cached) {
  const panel = document.getElementById('taskPanel');
  const btn = document.getElementById('tpTrBtn');
  const status = document.getElementById('tpTrStatus');
  if (!btn) return;
  const norm = t => t.replace(/\r\n?/g, '\n');  // the page's text has HTML's line endings
  const map = TASK_TRANSLATIONS[path] ||= {};
  const merge = m => { for (const [k, v] of Object.entries(m || {})) map[norm(k)] = v; };
  merge(cached);
  const els = [...panel.querySelectorAll('.tr')];
  const src = els.map(el => el.textContent);
  const complete = () => src.every(t => !t.trim() || map[t] != null);
  const setPref = on => { try { localStorage.setItem(TASK_TR_KEY, on ? '1' : ''); } catch (e) { /* private mode */ } };
  let shown = false;
  const show = on => {
    shown = on;
    panel.querySelectorAll('.tr > .zh').forEach(el => el.remove());
    btn.textContent = on ? '隐藏中文' : '中文翻译';
    if (!on) return 0;
    let missing = 0;
    els.forEach((el, i) => {
      const zh = map[src[i]];
      if (zh == null) missing += src[i].trim() ? 1 : 0;
      else if (zh.trim() !== src[i].trim()) el.insertAdjacentHTML('beforeend', `<span class="zh" lang="zh-CN">${esc(zh)}</span>`);
    });
    return missing;
  };
  try { if (complete() && localStorage.getItem(TASK_TR_KEY) === '1') show(true); } catch (e) {}
  btn.addEventListener('click', async () => {
    if (shown) { show(false); setPref(false); status.textContent = ''; return; }
    if (complete()) { show(true); setPref(true); return; }
    setBusy(btn, true);
    status.textContent = '翻译中…（约 10–40 秒）';
    try {
      merge((await postJSON('/api/translate_task', { path })).map);
      const missing = show(true);
      setPref(true);
      status.textContent = missing ? `⚠ ${missing} 段未能翻译，隐藏后再点一次可重试` : `由 ${displayModelName(LLM_MODEL)} 翻译`;
    } catch (e) {
      status.textContent = '⚠ ' + e.message;
    }
    setBusy(btn, false);
  });
}

function initTranslation(path, cached) {
  const box = document.getElementById('transcript');
  const btn = document.getElementById('trBtn');
  const status = document.getElementById('trStatus');
  if (!btn) return;
  if (cached) TRANSLATIONS[path] = cached;
  const setPref = on => { try { localStorage.setItem(TR_KEY, on ? '1' : ''); } catch (e) { /* private mode */ } };
  let shown = false;
  const show = (zh, on) => {
    shown = on;
    box.querySelectorAll('.bubble .zh').forEach(el => el.remove());
    btn.textContent = on ? '隐藏中文' : '中文翻译';
    if (!on) return 0;
    let missing = 0;
    for (const b of box.querySelectorAll('.bubble[data-i]')) {
      const text = zh[+b.dataset.i], orig = b.textContent.trim();
      if (text == null) missing += orig ? 1 : 0;
      else if (text.trim() !== orig) b.insertAdjacentHTML('beforeend', `<div class="zh" lang="zh-CN">${esc(text)}</div>`);
    }
    return missing;
  };
  try { if (TRANSLATIONS[path] && localStorage.getItem(TR_KEY) === '1') show(TRANSLATIONS[path], true); } catch (e) {}
  btn.addEventListener('click', async () => {
    if (shown) { show(null, false); setPref(false); status.textContent = ''; return; }
    if (TRANSLATIONS[path]) { show(TRANSLATIONS[path], true); setPref(true); return; }
    setBusy(btn, true);
    status.textContent = '翻译中…（约 20–90 秒）';
    try {
      const res = await postJSON('/api/translate_transcript', { path });
      const missing = show(res.translations, true);
      setPref(true);
      // an incomplete one isn't kept here or on the server, so showing it again retries the gaps
      if (missing) status.textContent = `⚠ ${missing} 轮未能翻译，隐藏后再点一次可重试`;
      else { TRANSLATIONS[path] = res.translations; status.textContent = `由 ${displayModelName(LLM_MODEL)} 翻译`; }
    } catch (e) {
      status.textContent = '⚠ ' + e.message;
    }
    setBusy(btn, false);
  });
}

/* ---------- AI chat (per-scenario and per-run) ---------- */
const CHATS = {};  // message history per run/scenario path, kept for the session

function initChat(path) {
  const log = document.getElementById('chatLog');
  const input = document.getElementById('chatText');
  const btn = document.getElementById('chatSend');
  const history = CHATS[path] ||= [];

  // fresh: how many messages at the end this draw added (they slide in; older ones never re-animate)
  const draw = (thinking = false, fresh = 0) => {
    const model = esc(displayModelName(LLM_MODEL));
    log.innerHTML = history.map(m => `
      <div class="chat-msg ${m.role}">
        <div class="who">${m.role === 'user' ? 'You' : model}</div>
        <div class="bubble ${m.role === 'assistant' ? 'markdown-body' : ''}">${m.role === 'assistant' ? renderMarkdown(m.content) : esc(m.content)}</div>
      </div>`).join('')
      + (thinking ? `<div class="chat-msg assistant"><div class="who">${model}</div><div class="bubble muted thinking">thinking…</div></div>` : '');
    if (fresh) [...log.children].slice(-fresh).forEach(el => el.classList.add('msg-in'));  // guarded: slice(-0) would mark them all
    log.style.display = history.length || thinking ? 'block' : 'none';
    renderMermaidIn(log);
    log.scrollTop = log.scrollHeight;
  };
  draw();

  const send = async () => {
    const text = input.value.trim();
    if (!text || btn.disabled) return;
    input.value = '';
    history.push({ role: 'user', content: text });
    setBusy(btn, true);
    draw(true, 2);  // the question and the thinking bubble
    try {
      const res = await postJSON('/api/chat', { path, messages: history });
      history.push({ role: 'assistant', content: res.reply });
    } catch (e) {
      history.push({ role: 'assistant', content: '⚠ ' + e.message });
    }
    setBusy(btn, false);
    draw(false, 1);  // the reply
    input.focus();
  };
  btn.addEventListener('click', send);
  let isComposing = false;
  input.addEventListener('compositionstart', () => { isComposing = true; });
  input.addEventListener('compositionend', () => { isComposing = false; });
  input.addEventListener('keydown', e => {
    // Enter confirms an IME candidate while composing Chinese, Japanese, etc.
    // Some browsers report keyCode 229 instead of setting isComposing.
    if (isComposing || e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter') send();
  });
}

  const pref = themePref();
  const dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const btn = document.getElementById('themeBtn');

  // cross-fade the whole page instead of snapping every token at once
  if (document.startViewTransition && !REDUCED.matches) document.startViewTransition(applyTheme).ready.catch(() => {});

  const eye = e.target.closest('.eyecell');

    const tr = eye.closest('tr'), path = eye.dataset.path;

async function postJSON(url, body, method = 'POST') {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body ?? {}) });
  const res = await r.json().catch(() => ({}));

  const el = document.getElementById('agentYaml');
  if (!el) return;
  el.value = text || '';
  testState.preset = presetId;
  testState.showYaml = false;  // every agent opens with the YAML collapsed
  renderQuickFields();
  parseAgentYamlNow();

// server-side validation of the editor text (the checks talk-bench's AgentConfig makes)
async function parseAgentYamlNow() {
  const el = document.getElementById('agentYaml'), info = document.getElementById('agentInfo');
  if (!el || !info) return;
  const text = el.value;
  const settle = (parsed, cls, html, project = null) => {
    if (document.getElementById('agentYaml')?.value !== text) return;  // edited meanwhile
    testState.parsed = parsed;
    testState.project = project;
    info.className = cls;
    info.innerHTML = html;
    el.closest('.field').classList.toggle('invalid', cls === 'err');
    if (cls === 'err' && !testState.showYaml) { testState.showYaml = true; renderQuickFields(); }  // the error is in the YAML
    updateAgentNotices();
  };
  if (!text.trim()) { settle(null, 'help', ''); return; }
  try {
    const r = await postJSON('/api/test/parse_config', { text });
    const mod = moduleModality(r.agent.module), extra = Object.keys(r.extra_blocks || {});
    settle(r.agent, 'help', `Agent <b>${esc(r.agent.name)}</b> · <span class="mono">${esc(r.agent.module)}</span>`
      + (mod ? ` · ${mod} agent` : '') + (r.agent.mcp ? ' · tools via MCP' : '')
      + (extra.length ? ` · also sets ${esc(extra.join(', '))}` : '')
      + (r.project ? ` · runs in <b>${esc(r.project.name)}</b>` : ''), r.project || null);
  } catch (e) {
    settle(null, 'err', esc(e.message));
  }
}
const parseAgentYaml = debounce(parseAgentYamlNow, 350);

/* The YAML starts collapsed for every agent. For these, the values that change from test to test
   get their own fields (pasteable straight from the clipboard) — Talkdesk its MCP tunnel and
   agent_system_id, ElevenLabs its agent_id, Gemini Live and OpenAI Realtime none. The fields edit
   the YAML text line by line, so its comments and layout survive; "Edit full YAML" opens the rest. */
const QUICK_FIELDS = {
  server_url: { label: 'MCP server', path: 'mcp.server_url', hint: 'https://<your-tunnel>.ngrok-free.dev' },
  agent_system_id: { label: 'Talkdesk agent', path: 'params.agent_system_id', hint: '<agent_system_id of your agent>' },
  agent_id: { label: 'ElevenLabs agent', path: 'params.agent_id', hint: 'agent_…' },
};
const COMPACT_AGENTS = [  // matched by the agent module's prefix
  { kind: 'talkdesk', prefix: 'talkdesk_agent.', fields: ['server_url', 'agent_system_id'] },
  { kind: 'elevenlabs', prefix: 'voice_agent.elevenlabs_sdk.', fields: ['agent_id'] },
  { kind: 'gemini', prefix: 'voice_agent.gemini_live.', fields: [] },
  { kind: 'openai', prefix: 'voice_agent.openai_realtime.', fields: [] },
];
// by the first uncommented module: line — a wrapper's, not the agent it wraps
function compactAgent(text) {
  const m = (text || '').match(/^[ \t]*module:[ \t]*["']?([\w.]+)/m);
  return m && COMPACT_AGENTS.find(c => m[1].startsWith(c.prefix)) || null;
}
// a value presets and samples leave for the user to replace
const isHole = v => /<[^<>]+>/.test(v) || /^(PLACEHOLDER|agent_x+)$/i.test(v);
const indentOf = line => line.match(/^[ \t]*/)[0];

// the first uncommented block-style line of `key` (a YAML key, not a regex): {i, indent, raw, comment}
function yamlKeyLine(lines, key) {
  const re = new RegExp(`^([ \\t]*)${key}[ \\t]*:[ \\t]*("(?:[^"\\\\]|\\\\.)*"|'(?:[^']|'')*'|[^#]*?)([ \\t]+#.*)?$`);
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(re);
    if (m) return { i, indent: m[1], raw: m[2], comment: m[3] || '' };
  }
  return null;
}

function yamlScalar(raw) {
  const t = raw.trim();
  if (t.startsWith('"')) { try { return JSON.parse(t); } catch { return t.slice(1, -1); } }
  if (t.startsWith("'")) return t.slice(1, -1).replace(/''/g, "'");
  return t === '~' || t === 'null' ? '' : t;
}

const yamlValue = (text, key) => { const hit = yamlKeyLine(text.split('\n'), key); return hit ? yamlScalar(hit.raw) : ''; };

// the indentation of the lines under lines[i] (two more spaces when it has none yet)
function childIndent(lines, i) {
  const own = indentOf(lines[i]);
  const next = lines.slice(i + 1).find(l => l.trim() && !l.trim().startsWith('#'));
  return next && indentOf(next).length > own.length ? indentOf(next) : own + '  ';
}

// the YAML text with `key` set to value — added where talk-bench reads it when the text has no such
// line yet. null when the text can't be edited line by line (JSON, flow mappings)
function yamlSetValue(text, key, value) {
  if (/^\s*[{[]/.test(text)) return null;
  const lines = text.split('\n'), q = JSON.stringify(value);  // a JSON string is a valid double-quoted YAML scalar
  const hit = yamlKeyLine(lines, key);
  if (hit) {
    lines[hit.i] = `${hit.indent}${key}: ${q}${hit.comment}`;
    return lines.join('\n');
  }
  const parent = key === 'server_url' ? 'mcp' : 'params';
  const p = lines.findIndex(l => new RegExp(`^[ \\t]*${parent}:[ \\t]*(\\{[ \\t]*\\})?[ \\t]*(#.*)?$`).test(l));
  if (p >= 0) {
    lines[p] = lines[p].replace(/\{[ \t]*\}/, '').replace(/[ \t]+$/, '');
    lines.splice(p + 1, 0, `${childIndent(lines, p)}${key}: ${q}`);
    return lines.join('\n');
  }
  if (lines.some(l => new RegExp(`^[ \\t]*${parent}:`).test(l))) return null;  // flow-style (`params: {a: 1}`): a second block would be a duplicate key
  // no parent block yet: open one next to params (mcp) or after module (params)
  const params = lines.findIndex(l => /^[ \t]*params:/.test(l));
  const mod = lines.findIndex(l => /^[ \t]*module:/.test(l));
  if (mod < 0) return null;
  if (key === 'server_url') {
    const at = params >= 0 ? params : mod + 1, ind = indentOf(lines[params >= 0 ? params : mod]);
    lines.splice(at, 0, `${ind}mcp:`, `${ind}  server_url: ${q}`, `${ind}  identity_transport:`, `${ind}    type: platform_interaction_id`);
  } else {
    const ind = indentOf(lines[mod]);
    lines.splice(mod + 1, 0, `${ind}params:`, `${ind}  ${key}: ${q}`);
  }
  return lines.join('\n');
}

// the YAML text without its mcp block: an empty server_url means no MCP server
function yamlRemoveMcp(text) {
  const lines = text.split('\n');
  const i = lines.findIndex(l => /^[ \t]*mcp:[ \t]*(#.*)?$/.test(l));
  if (i < 0) return lines.some(l => /^[ \t]*mcp:/.test(l)) ? null : text;  // flow-style mcp: {…}
  const own = indentOf(lines[i]).length;
  let j = i + 1;
  while (j < lines.length && (!lines[j].trim() || indentOf(lines[j]).length > own)) j++;
  while (j > i + 1 && !lines[j - 1].trim()) j--;  // blank lines before the next key stay
  lines.splice(i, j - i);
  return lines.join('\n');
}

// what was copied, reduced to the value: the URL in a copied log line ("ngrok URL: https://…") without
// the /mcp path talk-bench appends itself; the id in a copied agent link (a UUID on Talkdesk,
// agent_… on ElevenLabs)
function quickClean(key, s) {
  s = String(s || '').trim();
  if (key === 'server_url') {
    const url = s.match(/https?:\/\/[^\s"'<>]+/);
    return (url ? url[0] : s).replace(/[),.;]+$/, '').replace(/\/+$/, '').replace(/\/mcp$/, '');
  }
  const id = key === 'agent_id' ? s.match(/agent_[0-9a-z]{16,}/i)
    : s.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
  return id ? id[0] : s.replace(/^["']+|["']+$/g, '');
}

// a compact agent shows its fields (values read back from the YAML); the YAML itself stays
// collapsed until "Edit full YAML" (or an error in it) opens it
function renderQuickFields() {
  const el = document.getElementById('agentYaml'), box = document.getElementById('quickFields');
  if (!el || !box) return;
  const c = compactAgent(el.value);
  if (box.dataset.kind !== (c?.kind || '')) {  // rebuilt only when the kind changes, so a field keeps its focus
    box.dataset.kind = c?.kind || '';
    box.innerHTML = (c?.fields || []).map(key => { const f = QUICK_FIELDS[key]; return `
      <div class="field">
        <label for="quick-${key}">${f.label} — <span class="mono">${f.path}</span></label>
        <div class="paste-row"><input id="quick-${key}" data-quick-key="${key}" spellcheck="false" autocomplete="off">
          <button class="navbtn" type="button" data-quick-paste="${key}" title="Paste from the clipboard">Paste</button></div>
      </div>`; }).join('');
  }
  box.hidden = !c?.fields.length;
  document.getElementById('yamlBox').hidden = !testState.showYaml;
  const toggle = document.getElementById('yamlToggle');
  toggle.textContent = testState.showYaml ? 'Hide YAML' : 'Edit full YAML';
  for (const key of c?.fields || []) {
    const input = document.getElementById(`quick-${key}`);
    if (document.activeElement === input) continue;  // don't rewrite what is being typed
    const v = yamlValue(el.value, key);
    input.value = isHole(v) ? '' : v;
    input.placeholder = /<[^<>]+>/.test(v) ? v : QUICK_FIELDS[key].hint;
  }
}

// a field edited: write it into the YAML. Emptying server_url drops the mcp block, but only once the
// field is left (committed) — not while it is being retyped, which would lose the block's other keys
function quickApply(key, value, committed) {
  const el = document.getElementById('agentYaml');
  value = value.trim();
  if (key === 'server_url' && !value && !committed) return;
  const next = key === 'server_url' && !value ? yamlRemoveMcp(el.value) : yamlSetValue(el.value, key, value);
  if (next == null) {
    testState.showYaml = true;
    renderQuickFields();
    setAgentStatus(`⚠ couldn't place ${QUICK_FIELDS[key].path} in this YAML — set it in the editor below`);
    return;
  }
  if (next === el.value) return;
  el.value = next;
  parseAgentYaml();
}

async function quickPaste(key) {
  const input = document.getElementById(`quick-${key}`);
  let text;
  try {
    text = await navigator.clipboard.readText();
  } catch (_) {  // no clipboard API (plain-http origin) or permission denied
    input.focus();
    setAgentStatus('The browser blocked reading the clipboard — press ⌘V / Ctrl+V in the field instead.');
    return;
  }
  const v = quickClean(key, text);
  if (!v) { setAgentStatus('The clipboard is empty.'); return; }
  input.value = v;
  quickApply(key, v, true);
  setAgentStatus(`pasted ${QUICK_FIELDS[key].path} from the clipboard`);
}

// "<like this>" (or PLACEHOLDER) values a preset or sample left for the user to fill in (params and mcp, any depth)
function placeholderPaths(a) {
  const out = [];
  const walk = (v, path) => {
    if (typeof v === 'string') { if (isHole(v)) out.push(path); }
    else if (v && typeof v === 'object') Object.entries(v).forEach(([k, x]) => walk(x, `${path}.${k}`));
  };
  if (a) { walk(a.params, 'params'); walk(a.mcp, 'mcp'); }
  return out;
}

function updateAgentNotices() {
  const box = document.getElementById('agentNotices');
  if (!box) return;
  const a = testState.parsed, p = testProject();
  const help = document.getElementById('checkoutHelp');
  if (help) help.innerHTML = checkoutHelpHTML(p);
  const notes = [];  // warnings, as html
  const holes = placeholderPaths(a);
  if (holes.length) {
    // a collapsed YAML may hold placeholders outside the fields (the Talkdesk STG account_id)
    const fields = compactAgent(document.getElementById('agentYaml')?.value)?.fields || [];
    const inYaml = !testState.showYaml && holes.some(h => !fields.some(k => QUICK_FIELDS[k].path === h));
    notes.push(`Placeholders still to fill in: <code>${holes.map(esc).join('</code>, <code>')}</code>.`
      + (inYaml ? ' Some are only in the full YAML: <button class="navbtn" type="button" data-yaml-open>Edit full YAML</button>' : ''));
  }
  const pkg = a?.module ? a.module.split('.')[0] : '';
  if (pkg && p && !(p.packages || []).includes(pkg)) {
    notes.push(`No local checkout's workspace provides the <b>${esc(pkg)}</b> package, so the test runs in <b>${esc(p.name)}</b> and fails at import unless that package is installed in <span class="mono">${esc(p.id)}/.venv</span>.`);
  }
  box.innerHTML = notes.map(n => `<div class="notice warn">${n}</div>`).join('');
  updateCmdPreview();  // the parsed agent decides the checkout; also refreshes the user-sim help
}

}
