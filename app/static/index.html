<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>talk-bench runs viewer</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --border: #e2e5ea; --text: #1c2330;
    --muted: #6b7480; --accent: #2563eb; --pass: #15803d; --fail: #b91c1c;
    --pass-bg: #ecfdf3; --fail-bg: #fef2f2; --chip-bg: #eef2f7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif; background: var(--bg); color: var(--text); }
  header { background: #101828; color: #fff; padding: 14px 24px; display: flex; align-items: baseline; gap: 14px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; cursor: pointer; }
  header .sub { color: #98a2b3; font-size: 12.5px; }
  main { max-width: 1240px; margin: 0 auto; padding: 20px 24px 60px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .toolbar input, .toolbar select { padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px; background: #fff; color: var(--text); }
  .toolbar input { min-width: 260px; }
  .toolbar .count { color: var(--muted); font-size: 12.5px; margin-left: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid #eef0f3; vertical-align: top; }
  tr.rowlink { cursor: pointer; }
  tr.rowlink:hover { background: #f1f5fd; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
  .muted { color: var(--muted); }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.pass { background: var(--pass-bg); color: var(--pass); }
  .badge.fail { background: var(--fail-bg); color: var(--fail); }
  .badge.na   { background: var(--chip-bg); color: var(--muted); }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0 4px; }
  .chip { background: var(--chip-bg); border-radius: 8px; padding: 8px 14px; min-width: 96px; }
  .chip .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .chip .v { font-size: 17px; font-weight: 650; margin-top: 1px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .crumbs { font-size: 13px; margin-bottom: 12px; color: var(--muted); }
  h2 { font-size: 16px; margin: 4px 0 10px; }
  h3 { font-size: 14px; margin: 18px 0 8px; }
  details > summary { cursor: pointer; color: var(--accent); font-size: 13px; user-select: none; }
  pre { background: #f6f7f9; color: var(--text); border: 1px solid var(--border); padding: 12px; border-radius: 8px; overflow: auto; font-size: 12px; max-height: 480px; }
  .bubble { padding: 9px 13px; border-radius: 12px; margin: 6px 0; white-space: pre-wrap; }
  .turn { display: flex; }
  .turn > div { max-width: 72%; display: flex; flex-direction: column; align-items: flex-start; }
  .turn.user { justify-content: flex-end; }
  .turn.user > div { align-items: flex-end; }
  .turn.user .bubble { background: #dbeafe; border-bottom-right-radius: 4px; }
  .turn.agent .bubble { background: #f1f3f6; border-bottom-left-radius: 4px; }
  .turn .who { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  audio { width: 100%; margin: 4px 0 10px; }
  .audio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px 18px; }
  .tool-call { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  .tool-call.inline { border-style: dashed; background: #fbfcfe; margin: 10px 40px; font-size: 13px; }
  .ts { color: var(--muted); font-size: 11px; font-family: ui-monospace, Menlo, monospace; margin-right: 6px; }
  .scen-nav { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .scen-nav select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 8px; background: #fff; font-size: 12.5px; max-width: 220px; }
  .navbtn { display: inline-block; padding: 5px 11px; border: 1px solid var(--border); border-radius: 8px; background: #fff; font-size: 12.5px; white-space: nowrap; }
  .navbtn:hover { background: #f1f5fd; text-decoration: none; }
  .navbtn.disabled { color: #c3c9d2; pointer-events: none; }
  button.navbtn { cursor: pointer; font-family: inherit; color: var(--text); }
  button.navbtn.active { background: #fef3c7; border-color: #f59e0b; }
  .star { color: #c3c9d2; font-size: 16px; }
  .star.on { color: #f59e0b; }
  .starcell { cursor: pointer; user-select: none; }
  .starcell:hover .star { color: #f59e0b; }
  .subscore { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
  .subscore .ok { color: var(--pass); }
  .subscore .bad { color: var(--fail); }
  .upload-panel { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border: 1px dashed var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; background: #fbfcfe; }
  .upload-panel select { padding: 6px 9px; border: 1px solid var(--border); border-radius: 8px; background: #fff; font-size: 13px; }
  .chat-log { display: none; max-height: 420px; overflow-y: auto; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: #fbfcfe; }
  .chat-msg { margin: 8px 0; }
  .chat-msg .who { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .chat-msg .bubble { white-space: pre-wrap; margin: 0; max-width: none; }
  .chat-msg.user .bubble { background: #dbeafe; }
  .chat-msg.assistant .bubble { background: #f1f3f6; }
  .chat-input { display: flex; gap: 8px; }
  .chat-input input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px; }
  .chat-input button:disabled { color: #c3c9d2; pointer-events: none; }
  .tool-call .name { font-weight: 650; }
  .tool-call .err { color: var(--fail); font-size: 12.5px; }
  .filelist { columns: 2; font-size: 12.5px; }
  .filelist div { break-inside: avoid; padding: 2px 0; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1 onclick="location.hash=''">🎧 talk-bench runs viewer</h1>
  <span class="sub" id="headerSub"></span>
</header>
<main id="main"><div class="empty">Loading…</div></main>

<script>
const $main = document.getElementById('main');
let RUNS = null;
let STARS = new Set();

async function toggleStar(path, rerender) {
  const starred = !STARS.has(path);
  starred ? STARS.add(path) : STARS.delete(path);
  rerender();
  const fd = new FormData();
  fd.append('path', path);
  fd.append('starred', starred);
  try {
    const r = await fetch('/api/star', { method: 'POST', body: fd });
    if (!r.ok) throw new Error(r.status);
  } catch (e) {
    starred ? STARS.delete(path) : STARS.add(path);  // roll back on failure
    rerender();
  }
}
const starIcon = path => `<span class="star ${STARS.has(path) ? 'on' : ''}">${STARS.has(path) ? '★' : '☆'}</span>`;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtScore = v => (v === null || v === undefined) ? '<span class="muted">—</span>' : Number(v).toFixed(v >= 1 || v === 0 ? 2 : 3).replace(/\.?0+$/,'') || '0';
const fmtDur = ms => ms == null ? '—' : (ms/1000 < 90 ? (ms/1000).toFixed(1)+'s' : (ms/60000).toFixed(1)+'min');
const passBadge = p => p === true ? '<span class="badge pass">PASS</span>' : p === false ? '<span class="badge fail">FAIL</span>' : '<span class="badge na">—</span>';

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ' → ' + r.status);
  return r.json();
}

async function loadRuns() {
  if (!RUNS) {
    const d = await getJSON('/api/runs');
    RUNS = d.runs;
    STARS = new Set(d.stars || []);
  }
  return RUNS;
}

/* ---------- run list ---------- */
const listState = { q: '', agent_name: '', starredOnly: false };

// collapse agent variants into families for the filter dropdown
function agentGroup(name) {
  if (!name) return name;
  if (name.startsWith('talkdesk-autopilot')) return 'talkdesk-autopilot*';
  if (name.startsWith('elevenlabs')) return 'elevenlabs*';
  return name;
}

async function renderList() {
  const searchHadFocus = document.activeElement?.id === 'q';
  const scrollY = window.scrollY;
  const runs = await loadRuns();
  document.getElementById('headerSub').textContent = runs.length + ' runs archived';
  const uniq = key => [...new Set(runs.map(r => key === 'agent_name' ? agentGroup(r[key]) : r[key]).filter(Boolean))].sort();
  const opts = (key, label) =>
    `<select data-k="${key}"><option value="">${label}: all</option>` +
    uniq(key).map(v => `<option ${listState[key]===v?'selected':''} value="${esc(v)}">${esc(v)}</option>`).join('') + '</select>';

  const filtered = runs.filter(r =>
    (!listState.starredOnly || STARS.has(r.path)) &&
    (!listState.agent_name || agentGroup(r.agent_name) === listState.agent_name) &&
    (!listState.q || r.run_name.toLowerCase().includes(listState.q) || (r.agent_name||'').toLowerCase().includes(listState.q)));

  $main.innerHTML = `
  <div class="card">
    <div class="toolbar">
      <input id="q" placeholder="Search run name / agent…" value="${esc(listState.q)}">
      ${opts('agent_name','agent')}
      <button class="navbtn ${listState.starredOnly ? 'active' : ''}" id="starFilter" type="button">★ Starred${listState.starredOnly ? ' ✓' : ''}</button>
      <button class="navbtn" id="syncBtn" type="button">⟳ Sync sources</button>
      <span id="upStatus" class="muted" style="font-size:12.5px">${esc(lastUploadStatus)}</span>
      <span class="count">${filtered.length} / ${runs.length} runs — drag run folders or a zip here to import</span>
    </div>
    <table>
      <thead><tr><th></th><th>Time (UTC)</th><th>Run</th><th>Agent</th>
      <th>Scenarios</th><th>Primary</th><th>Eval final</th></tr></thead>
      <tbody>
      ${filtered.map(r => `
        <tr class="rowlink" onclick="location.hash='#/run/${encodeURIComponent(r.path)}'">
          <td class="starcell" data-path="${esc(r.path)}">${starIcon(r.path)}</td>
          <td class="mono muted" style="white-space:nowrap">${esc(r.timestamp || '?')}</td>
          <td class="mono" style="word-break:break-all">${esc(r.run_name)}</td>
          <td>${esc(r.agent_name || '—')}</td>
          <td>${r.has_results
              ? `<span class="${r.scenarios_passed===r.scenarios_total?'badge pass':'badge fail'}">${r.scenarios_passed}/${r.scenarios_total}</span>`
                + (r.scenarios_errored ? ` <span class="muted">(${r.scenarios_errored} err)</span>` : '')
              : `<span class="badge na">no results (${r.scenario_count} dirs)</span>`}</td>
          <td>${fmtScore(r.primary_score)}</td>
          <td>${fmtScore(r.eval_final)}</td>
        </tr>`).join('')}
      </tbody>
    </table>
    ${filtered.length ? '' : '<div class="empty">No runs match the filters.</div>'}
  </div>`;

  const qEl = document.getElementById('q');
  qEl.addEventListener('input', () => { listState.q = qEl.value.toLowerCase(); renderList(); });
  if (searchHadFocus) { qEl.focus(); qEl.setSelectionRange(qEl.value.length, qEl.value.length); }
  window.scrollTo(0, scrollY);
  document.getElementById('starFilter').addEventListener('click', () => {
    listState.starredOnly = !listState.starredOnly;
    renderList();
  });
  const syncBtn = document.getElementById('syncBtn');
  syncBtn.addEventListener('click', async () => {
    syncBtn.disabled = true;
    setUpStatus('syncing from ai-ds-research checkouts…');
    try {
      const r = await fetch('/api/sync_sources', { method: 'POST' });
      const res = await r.json();
      if (!r.ok) throw new Error(res.detail || r.status);
      setUpStatus(res.added.length
        ? `added ${res.added.length} new run${res.added.length === 1 ? '' : 's'}: ${res.added.join(', ')}`
        : `no new runs (${res.skipped_existing} already archived)`);
      if (res.added.length) { RUNS = null; renderList(); }
    } catch (e) {
      setUpStatus('sync error: ' + e.message);
    }
    syncBtn.disabled = false;
  });
  $main.querySelectorAll('.starcell').forEach(td =>
    td.addEventListener('click', ev => {
      ev.stopPropagation();
      toggleStar(td.dataset.path, renderList);
    }));
  $main.querySelectorAll('select[data-k]').forEach(sel =>
    sel.addEventListener('change', () => {
      listState[sel.dataset.k] = sel.value;
      renderList();
    }));

}

/* ---------- run detail ---------- */
async function renderRun(path) {
  const [d] = await Promise.all([
    getJSON('/api/run?path=' + encodeURIComponent(path)),
    loadRuns(),  // ensures STARS is populated on direct page loads
  ]);
  const res = d.results, ev = d.evaluation;
  const chips = [];
  if (res) {
    chips.push(['Primary score', res.primary_score], ['Passed', `${res.scenarios_passed}/${res.scenarios_total}`], ['Errored', res.scenarios_errored]);
  }
  if (ev) {
    chips.push(['Eval final', ev.final], ['Resolution', ev.resolution], ['Experience', ev.experience],
               ['Responsiveness', ev.responsiveness], ['Conv. quality', ev.conversation_quality]);
  }
  $main.innerHTML = `
  <div class="crumbs"><a href="#">All runs</a> / ${esc(path)}</div>
  <div class="card">
    <h2><span class="starcell" id="runStar">${starIcon(path)}</span> ${esc(res?.agent_name || path.split('/').pop())}</h2>
    <div class="muted mono">${esc(path.split('/').pop())}</div>
    <div class="chips">${chips.map(([k,v]) => `<div class="chip"><div class="k">${k}</div><div class="v">${typeof v === 'number' ? fmtScore(v) : esc(v ?? '—')}</div></div>`).join('')}</div>
    ${res ? '' : '<p class="muted">This run has no results.json (likely errored or interrupted) — scenario directories are still browsable below.</p>'}
  </div>
  <div class="card">
    <h3 style="margin-top:0">Scenarios (${d.scenarios.length})</h3>
    <table>
      <thead><tr><th>Scenario</th><th>Result</th><th>Goal score</th><th>End reason</th><th>Turns</th><th>Duration</th></tr></thead>
      <tbody>${d.scenarios.map(s => `
        <tr class="rowlink" onclick="location.hash='#/scenario/${encodeURIComponent(path + '/' + s.id)}'">
          <td class="mono">${esc(s.id)}</td>
          <td>${passBadge(s.passed)}</td>
          <td>${fmtScore(s.goal_score)}${s.tau2_breakdown ? `<div class="subscore">${
            Object.entries(s.tau2_breakdown).map(([k, v]) =>
              `<span class="${v >= 1 ? 'ok' : 'bad'}">${esc(k)} ${fmtScore(v)}</span>`).join(' · ')
          }</div>` : ''}</td>
          <td>${esc(s.end_reason ?? '—')}</td>
          <td>${s.turn_count ?? '—'}</td>
          <td>${fmtDur(s.duration_ms)}</td>
        </tr>`).join('')}</tbody>
    </table>
  </div>
  ${res ? `<div class="card"><details><summary>Raw results.json</summary><pre>${esc(JSON.stringify(res, null, 2))}</pre></details></div>` : ''}
  ${ev ? `<div class="card"><details><summary>Raw talk_bench_evaluation_result.json</summary><pre>${esc(JSON.stringify(ev, null, 2))}</pre></details></div>` : ''}`;

  document.getElementById('runStar').addEventListener('click', () => toggleStar(path, () => renderRun(path)));
}

/* ---------- transcript with tool calls merged chronologically ---------- */
function renderTimeline(conversation, toolLog) {
  if (!conversation && !toolLog?.length) return '<p class="muted">No conversation.json</p>';
  const t0 = (conversation || []).concat(toolLog || []).reduce(
    (m, x) => x.timestamp != null && x.timestamp < m ? x.timestamp : m, Infinity);
  const fmtT = ts => ts == null || t0 === Infinity ? '' : '+' + (ts - t0).toFixed(1) + 's';
  const items = [
    ...(conversation || []).map(t => ({ kind: 'turn', ts: t.timestamp, d: t })),
    ...(toolLog || []).map(c => ({ kind: 'tool', ts: c.timestamp, d: c })),
  ];
  // stable sort; items without a timestamp keep their original relative position at the end
  items.sort((a, b) => (a.ts ?? Infinity) - (b.ts ?? Infinity));
  return items.map(it => {
    if (it.kind === 'turn') {
      const t = it.d;
      return `
      <div class="turn ${t.speaker === 'user' ? 'user' : 'agent'}">
        <div><div class="who">${esc(t.speaker)} · turn ${t.turn_index ?? ''} <span class="ts">${fmtT(t.timestamp)}</span></div>
        <div class="bubble">${esc(t.text)}</div></div>
      </div>`;
    }
    const c = it.d;
    return `
    <div class="tool-call inline">
      <span class="ts">${fmtT(c.timestamp)}</span>
      🔧 <span class="name mono">${esc(c.tool_name)}</span>
      ${c.db_changed ? '<span class="badge pass" style="margin-left:8px">db changed</span>' : ''}
      ${c.result?.error ? `<span class="badge fail" style="margin-left:8px">error</span>` : ''}
      ${c.result?.error ? `<div class="err">${esc(c.result.error.message || JSON.stringify(c.result.error))}</div>` : ''}
      <details><summary>args & result</summary>
        <pre>${esc(JSON.stringify({arguments: c.arguments, result: c.result}, null, 2))}</pre>
      </details>
    </div>`;
  }).join('');
}

/* ---------- per-scenario scores ---------- */
function renderScores(summary, sess) {
  if (!summary && !sess) return '';
  const tc = sess?.task_completion || {};
  const tools = summary?.tool_metrics || {};
  const entries = [
    ['Goal score', summary?.goal_score],
    ...Object.entries(summary?.tau2_reward_breakdown || {}).map(([k, v]) => ['tau2 ' + k, v]),
    ['tau2 goal', summary?.tau2_goal_score],
    ['Native goal', summary?.native_goal_score],
    ['Reward', tc.reward],
    ['Action', tc.action_score],
    ['Communicate', tc.communicate_score],
    ['NL assertions', tc.nl_assertions_score],
    ['DB state', tc.db_state_score],
    ['State integrity', tc.state_integrity_score],
    ['Tool recall', tools.recall],
    ['Tool precision', tools.precision],
    ['Tool calls', tools.total_calls],
  ].filter(([, v]) => v !== null && v !== undefined);
  const flags = [];
  if (tc.prohibited_violated) flags.push('prohibited action violated');
  if (tc.prohibited_communicate_violated) flags.push('prohibited communicate violated');
  if (tc.judge_failed) flags.push('judge failed');
  if (summary?.tool_metrics?.prohibited_violations?.length)
    flags.push('prohibited tool calls: ' + summary.tool_metrics.prohibited_violations.join(', '));
  if (summary?.breach) flags.push('breach: ' + summary.breach);
  return `
  <h3>Scores</h3>
  <div class="chips">${entries.map(([k, v]) =>
    `<div class="chip"><div class="k">${k}</div><div class="v">${typeof v === 'number' ? fmtScore(v) : esc(v)}</div></div>`).join('')}
  </div>
  ${flags.map(f => `<div><span class="badge fail" style="margin-top:6px">${esc(f)}</span></div>`).join('')}
  ${summary ? `<details><summary>Raw scenario result (results.json)</summary><pre>${esc(JSON.stringify(summary, null, 2))}</pre></details>` : ''}
  ${sess ? `<details><summary>Raw session result (talk_bench_evaluation_result.json)</summary><pre>${esc(JSON.stringify(sess, null, 2))}</pre></details>` : ''}`;
}

/* ---------- scenario detail ---------- */
const _runCache = {};
async function getRun(runPath) {
  if (!_runCache[runPath]) _runCache[runPath] = await getJSON('/api/run?path=' + encodeURIComponent(runPath));
  return _runCache[runPath];
}

function scenarioNav(runPath, siblings, idx) {
  const link = i => `#/scenario/${encodeURIComponent(runPath + '/' + siblings[i].id)}`;
  const prev = idx > 0 ? siblings[idx - 1] : null;
  const next = idx >= 0 && idx < siblings.length - 1 ? siblings[idx + 1] : null;
  const mark = s => s.passed === true ? '✓ ' : s.passed === false ? '✗ ' : '';
  return `
  <div class="scen-nav">
    ${prev ? `<a class="navbtn" href="${link(idx - 1)}">← ${esc(prev.id)}</a>` : '<span class="navbtn disabled">←</span>'}
    <select id="scenJump">
      ${siblings.map((s, i) => `<option value="${i}" ${i === idx ? 'selected' : ''}>${mark(s)}${esc(s.id)}</option>`).join('')}
    </select>
    <span class="muted" style="font-size:12px">${idx + 1} / ${siblings.length}</span>
    ${next ? `<a class="navbtn" href="${link(idx + 1)}">${esc(next.id)} →</a>` : '<span class="navbtn disabled">→</span>'}
  </div>`;
}

async function renderScenario(path) {
  const d = await getJSON('/api/scenario?path=' + encodeURIComponent(path));
  const runPath = path.split('/')[0];
  const scenId = path.split('/')[1];
  const run = await getRun(runPath).catch(() => null);
  const siblings = run?.scenarios || [];
  const scenIdx = siblings.findIndex(s => s.id === scenId);
  const sc = d.scenario || {}, meta = d.run_meta || {};
  const persona = sc.user_persona || {};
  const audioNames = Object.entries(d.audio).filter(([,ok]) => ok).map(([n]) => n);

  $main.innerHTML = `
  <div class="crumbs" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <span><a href="#">All runs</a> / <a href="#/run/${encodeURIComponent(runPath)}">${esc(runPath.split('/').pop())}</a> / ${esc(path.split('/').pop())}</span>
    ${siblings.length > 1 ? scenarioNav(runPath, siblings, scenIdx) : ''}
  </div>
  <div class="card">
    <h2>${esc(path.split('/').pop())} <span class="muted" style="font-weight:400">· ${esc(sc.domain || '')}</span>
      ${passBadge(d.scenario_summary?.passed ?? d.session_result?.task_completion?.passed)}</h2>
    <div class="chips">
      <div class="chip"><div class="k">End reason</div><div class="v" style="font-size:14px">${esc(meta.end_reason ?? '—')}</div></div>
      <div class="chip"><div class="k">Duration</div><div class="v" style="font-size:14px">${fmtDur(meta.total_duration_ms)}</div></div>
      <div class="chip"><div class="k">Persona</div><div class="v" style="font-size:14px">${esc([persona.age_group, persona.emotion, persona.patience && persona.patience + ' patience'].filter(Boolean).join(', ') || '—')}</div></div>
    </div>
    ${renderScores(d.scenario_summary, d.session_result)}
    ${sc.goal?.description ? `<h3>Goal</h3><p>${esc(sc.goal.description)}</p>` : ''}
    ${sc.user_scenario ? `<details><summary>Full scenario JSON</summary><pre>${esc(JSON.stringify(sc, null, 2))}</pre></details>`
                       : `<details><summary>Full scenario JSON</summary><pre>${esc(JSON.stringify(sc, null, 2))}</pre></details>`}
  </div>

  ${audioNames.length ? `<div class="card"><h3 style="margin-top:0">Audio</h3><div class="audio-grid">
    ${audioNames.map(n => `<div><div class="muted" style="font-size:12px">${n}.wav</div>
      <audio controls preload="none" src="/data/${encodeURIComponent(path).replace(/%2F/g,'/')}/${n}.wav"></audio></div>`).join('')}
  </div></div>` : ''}

  <div class="card">
    <h3 style="margin-top:0">🤖 Ask AI about this scenario</h3>
    <div class="muted" style="font-size:12.5px;margin-bottom:8px">The model sees this scenario's goal, transcript, tool calls, and judge results. Ask why it failed, what a tool error means, etc.</div>
    <div id="chatLog" class="chat-log"></div>
    <div class="chat-input">
      <input id="chatText" placeholder="e.g. 为什么这个场景失败了？ / Why did this scenario fail?">
      <button class="navbtn" id="chatSend" type="button">Send</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Transcript
      ${d.conversation ? `<span class="muted" style="font-weight:400">(${d.conversation.length} turns · ${d.tool_log?.length || 0} tool calls)</span>` : ''}</h3>
    ${renderTimeline(d.conversation, d.tool_log)}
  </div>

  <div class="card">
    <h3 style="margin-top:0">Files (${d.files.length})
      <label class="navbtn" style="font-weight:400;cursor:pointer;margin-left:10px">⬆ Add / replace file<input type="file" id="fileUp" hidden></label>
      <span id="fileUpStatus" class="muted" style="font-size:12.5px;margin-left:8px"></span></h3>
    <div class="filelist">
      ${d.files.map(f => `<div><a class="mono" target="_blank" href="/data/${encodeURIComponent(path).replace(/%2F/g,'/')}/${esc(f.name)}">${esc(f.name)}</a> <span class="muted">${(f.size/1024).toFixed(0)} KB</span></div>`).join('')}
    </div>
  </div>`;

  initChat(path);

  document.getElementById('fileUp').addEventListener('change', async ev => {
    const f = ev.target.files[0];
    if (!f) return;
    const status = document.getElementById('fileUpStatus');
    const exists = d.files.some(x => x.name === f.name);
    if (exists && !confirm(`"${f.name}" already exists in this scenario. Replace it?`)) {
      ev.target.value = ''; return;
    }
    status.textContent = 'uploading…';
    const fd = new FormData();
    fd.append('file', f);
    fd.append('target_dir', path);
    fd.append('overwrite', exists);
    try {
      const r = await fetch('/api/upload_file', { method: 'POST', body: fd });
      const res = await r.json();
      if (!r.ok) throw new Error(res.detail || r.status);
      status.textContent = (res.replaced ? 'replaced ' : 'added ') + f.name;
      setTimeout(() => renderScenario(path), 800);
    } catch (e) { status.textContent = 'error: ' + e.message; }
  });

  const jump = document.getElementById('scenJump');
  if (jump) jump.addEventListener('change', () =>
    location.hash = '#/scenario/' + encodeURIComponent(runPath + '/' + siblings[+jump.value].id));
  scenKeyNav = e => {
    if (e.target.closest('input, select, textarea, audio')) return;
    if (e.key === 'ArrowLeft' && scenIdx > 0)
      location.hash = '#/scenario/' + encodeURIComponent(runPath + '/' + siblings[scenIdx - 1].id);
    if (e.key === 'ArrowRight' && scenIdx >= 0 && scenIdx < siblings.length - 1)
      location.hash = '#/scenario/' + encodeURIComponent(runPath + '/' + siblings[scenIdx + 1].id);
  };
}

/* ---------- run import via drag & drop (no button; function kept) ---------- */
let lastUploadStatus = '';
const setUpStatus = t => {
  lastUploadStatus = t;
  const el = document.getElementById('upStatus');
  if (el) el.textContent = t;
};

async function postForm(url, fd) {
  const r = await fetch(url, { method: 'POST', body: fd });
  const res = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(res.detail || r.status); e.status = r.status; throw e; }
  return res;
}

// entries: [{rel: path inside the run dir, file}]
async function syncOneRun(runName, entries, progressPrefix) {
  const beginFd = ow => {
    const fd = new FormData();
    fd.append('run_name', runName); fd.append('overwrite', ow);
    return fd;
  };
  let uploadId;
  try {
    uploadId = (await postForm('/api/upload_dir_begin', beginFd(false))).upload_id;
  } catch (e) {
    if (e.status !== 409) throw e;
    if (!confirm(`Run "${runName}" already exists. Replace it?`)) return 'skipped';
    uploadId = (await postForm('/api/upload_dir_begin', beginFd(true))).upload_id;
  }
  try {
    // upload in batches: at most 40 files or ~200 MB per request
    let batch = [], batchBytes = 0, sent = 0;
    const flush = async () => {
      if (!batch.length) return;
      const fd = new FormData();
      fd.append('upload_id', uploadId);
      for (const e of batch) { fd.append('paths', e.rel); fd.append('files', e.file); }
      await postForm('/api/upload_dir_chunk', fd);
      sent += batch.length;
      setUpStatus(`${progressPrefix}"${runName}": ${sent}/${entries.length} files…`);
      batch = []; batchBytes = 0;
    };
    for (const e of entries) {
      if (batch.length >= 40 || batchBytes + e.file.size > 200e6) await flush();
      batch.push(e); batchBytes += e.file.size;
    }
    await flush();
    await postForm('/api/upload_dir_commit', (() => { const fd = new FormData(); fd.append('upload_id', uploadId); return fd; })());
    return 'synced';
  } catch (e) {
    const fd = new FormData(); fd.append('upload_id', uploadId);
    fetch('/api/upload_dir_abort', { method: 'POST', body: fd });
    throw e;
  }
}

// files: [{relpath (starting with the dropped folder name), file}]
// Detects whether the dropped folder is a single run or a folder of runs:
// a run has results.json / talk_bench_evaluation_result.json at its root,
// or scenario dirs (scenario.json / run_meta.json / conversation.json) one level down.
async function importRunFiles(files) {
  const RUN_ROOT_FILES = ['results.json', 'talk_bench_evaluation_result.json'];
  const SCEN_FILES = ['scenario.json', 'run_meta.json', 'conversation.json'];
  const inner = files.map(f => ({ parts: f.relpath.split('/').slice(1), file: f.file }));
  const isSingleRun = inner.some(({ parts }) =>
    (parts.length === 1 && RUN_ROOT_FILES.includes(parts[0])) ||
    (parts.length === 2 && SCEN_FILES.includes(parts[1])));

  let runGroups; // Map<runName, entries>
  if (isSingleRun) {
    const runName = files[0].relpath.split('/')[0];
    runGroups = new Map([[runName, inner.map(({ parts, file }) => ({ rel: parts.join('/'), file }))]]);
  } else {
    runGroups = new Map();
    for (const { parts, file } of inner) {
      if (parts.length < 2) continue; // loose files at the container root (.DS_Store etc.)
      const run = parts[0];
      if (!runGroups.has(run)) runGroups.set(run, []);
      runGroups.get(run).push({ rel: parts.slice(1).join('/'), file });
    }
    if (!runGroups.size) { setUpStatus('no run folders found in the drop'); return; }
  }

  const names = [...runGroups.keys()], done = [], skipped = [];
  for (let i = 0; i < names.length; i++) {
    const prefix = names.length > 1 ? `run ${i + 1}/${names.length} ` : 'syncing ';
    const outcome = await syncOneRun(names[i], runGroups.get(names[i]), prefix);
    (outcome === 'synced' ? done : skipped).push(names[i]);
  }
  setUpStatus(`synced ${done.length} run${done.length === 1 ? '' : 's'}`
    + (skipped.length ? ` · skipped: ${skipped.join(', ')}` : ''));
  if (done.length) { RUNS = null; setTimeout(() => { if (!location.hash.startsWith('#/')) renderList(); }, 1200); }
}

async function importZip(f) {
  const send = async overwrite => {
    const fd = new FormData();
    fd.append('file', f);
    fd.append('overwrite', overwrite);
    return postForm('/api/upload_run', fd);
  };
  setUpStatus(`uploading ${f.name}…`);
  let res = await send(false);
  let imported = res.imported;
  if (res.skipped_existing.length) {
    if (confirm(`These runs already exist:\n\n${res.skipped_existing.join('\n')}\n\nReplace them?`)) {
      setUpStatus('replacing…');
      res = await send(true);
      imported = res.imported;
    } else if (!imported.length) {
      setUpStatus('nothing imported (all runs already exist)');
      return;
    }
  }
  setUpStatus(`imported: ${imported.length ? imported.join(', ') : 'none'}`);
  if (imported.length) { RUNS = null; setTimeout(() => { if (!location.hash.startsWith('#/')) renderList(); }, 1200); }
}

// recursively read a dropped FileSystemEntry into [{relpath, file}]
async function collectEntry(entry) {
  if (entry.isFile) {
    const file = await new Promise((res, rej) => entry.file(res, rej));
    return [{ relpath: entry.fullPath.replace(/^\//, ''), file }];
  }
  if (entry.isDirectory) {
    const reader = entry.createReader();
    const out = [];
    for (;;) {  // readEntries returns results in batches until an empty batch
      const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      if (!batch.length) break;
      for (const child of batch) out.push(...await collectEntry(child));
    }
    return out;
  }
  return [];
}

document.addEventListener('dragover', e => {
  if (!location.hash.startsWith('#/')) e.preventDefault();
});
document.addEventListener('drop', async e => {
  if (location.hash.startsWith('#/')) return;
  e.preventDefault();
  const items = [...e.dataTransfer.items];
  const dirs = [], zips = [];
  for (const item of items) {
    const entry = item.webkitGetAsEntry?.();
    if (!entry) continue;
    if (entry.isDirectory) dirs.push(entry);
    else if (entry.isFile && entry.name.toLowerCase().endsWith('.zip')) zips.push(item.getAsFile());
  }
  if (!dirs.length && !zips.length) { setUpStatus('drop a run folder or a .zip'); return; }
  try {
    for (const z of zips) await importZip(z);
    for (const dir of dirs) {
      setUpStatus(`reading "${dir.name}"…`);
      await importRunFiles(await collectEntry(dir));
    }
  } catch (err) {
    setUpStatus('error: ' + err.message);
  }
});

/* ---------- scenario AI chat ---------- */
const CHATS = {};  // per-scenario message history, kept for the session

function initChat(path) {
  const log = document.getElementById('chatLog');
  const input = document.getElementById('chatText');
  const btn = document.getElementById('chatSend');
  const history = CHATS[path] ||= [];

  const draw = (thinking = false) => {
    log.innerHTML = history.map(m => `
      <div class="chat-msg ${m.role}">
        <div class="who">${m.role === 'user' ? 'you' : 'AI'}</div>
        <div class="bubble">${esc(m.content)}</div>
      </div>`).join('')
      + (thinking ? '<div class="chat-msg assistant"><div class="who">AI</div><div class="bubble muted">thinking…</div></div>' : '');
    log.scrollTop = log.scrollHeight;
    log.style.display = history.length || thinking ? 'block' : 'none';
  };
  draw();

  const send = async () => {
    const text = input.value.trim();
    if (!text || btn.disabled) return;
    input.value = '';
    history.push({ role: 'user', content: text });
    btn.disabled = true;
    draw(true);
    try {
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path, messages: history }),
      });
      const res = await r.json();
      if (!r.ok) throw new Error(res.detail || r.status);
      history.push({ role: 'assistant', content: res.reply });
    } catch (e) {
      history.push({ role: 'assistant', content: '⚠ ' + e.message });
    }
    btn.disabled = false;
    draw();
    input.focus();
  };
  btn.addEventListener('click', send);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
}

/* ---------- router ---------- */
let scenKeyNav = null;
window.addEventListener('keydown', e => { if (scenKeyNav) scenKeyNav(e); });

async function route() {
  const h = decodeURIComponent(location.hash);
  scenKeyNav = null;
  try {
    if (h.startsWith('#/scenario/')) await renderScenario(h.slice('#/scenario/'.length));
    else if (h.startsWith('#/run/')) await renderRun(h.slice('#/run/'.length));
    else await renderList();
    window.scrollTo(0, 0);
  } catch (e) {
    $main.innerHTML = `<div class="card"><b>Error:</b> ${esc(e.message)}</div>`;
  }
}
window.addEventListener('hashchange', route);
route();
</script>
