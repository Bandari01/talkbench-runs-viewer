<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>talk-bench runs viewer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎧</text></svg>">
<script>
  // set the theme before first paint (user override in localStorage, else OS preference)
  let _t = null;
  try { _t = localStorage.getItem('viewer_theme'); } catch (e) {}
  document.documentElement.dataset.theme =
    _t === 'light' || _t === 'dark' ? _t
    : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
</script>
<style>
  /* Tokens follow shadcn/ui (new-york, neutral) + Vercel Geist accents — hexes are the
     compiled values from shadcn-ui/ui registry themes and vercel.com Geist tokens. */
  :root { --topbar-h: 48px; --side-w: 256px; --radius: 14px; }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff; --surface: #ffffff; --surface-2: #f5f5f5; --surface-3: #e5e5e5;
    --border: #e5e5e5; --border-soft: #f0f0f0;
    --fg: #0a0a0a; --fg-soft: #4c4c4c; --muted: #737373; --faint: #a3a3a3;
    --link: #0072f5;
    --primary: #171717; --primary-fg: #fafafa;
    --ring: rgba(161, 161, 161, .40);
    --pass: #297a3a; --pass-bg: #effbef; --pass-border: rgba(69, 165, 87, .35);
    --fail: #d00a12; --fail-bg: #fff0f0; --fail-border: rgba(231, 0, 11, .22);
    --na-bg: #f5f5f5; --na-border: #e5e5e5;
    --star: #f59e0b;
    --code-bg: #f5f5f5; --code-text: #be185d;
    --md-pre-bg: #171717; --md-pre-text: #e5e5e5; --md-pre-border: #333333;
    --bubble-user: #e3edfb; --bubble-user-fg: #1e3a5f;
    --bubble-agent: #f5f5f5;
    --side-bg: #fafafa;
    --shadow: 0 1px 2px 0 rgba(0, 0, 0, .05);
    --shadow-card: 0 1px 3px 0 rgba(0, 0, 0, .06), 0 1px 2px -1px rgba(0, 0, 0, .06);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0a0a0a; --surface: #171717; --surface-2: #262626; --surface-3: #333333;
    --border: rgba(255, 255, 255, .10); --border-soft: rgba(255, 255, 255, .06);
    --fg: #fafafa; --fg-soft: #d4d4d4; --muted: #a1a1a1; --faint: #525252;
    --link: #52a8ff;
    --primary: #e5e5e5; --primary-fg: #171717;
    --ring: rgba(115, 115, 115, .50);
    --pass: #62c073; --pass-bg: #0b2212; --pass-border: rgba(98, 192, 115, .35);
    --fail: #ff6467; --fail-bg: #2a1314; --fail-border: rgba(255, 100, 103, .30);
    --na-bg: rgba(161, 161, 161, .10); --na-border: rgba(161, 161, 161, .22);
    --star: #fbbf24;
    --code-bg: #262626; --code-text: #f0a8c8;
    --md-pre-bg: #0a0a0a; --md-pre-text: #d4d4d4; --md-pre-border: rgba(255, 255, 255, .10);
    --bubble-user: #24344a; --bubble-user-fg: #cfe0f5;
    --bubble-agent: #262626;
    --side-bg: #171717;
    --shadow: 0 1px 2px 0 rgba(0, 0, 0, .4);
    --shadow-card: 0 1px 3px 0 rgba(0, 0, 0, .5);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; display: flex; align-items: stretch; min-height: 100vh;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--fg);
    -webkit-font-smoothing: antialiased; accent-color: var(--link);
  }
  ::selection { background: var(--ring); }

  /* ---------- sidebar ---------- */
  #sidebar {
    width: var(--side-w); flex: none; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    background: var(--side-bg); border-right: 1px solid var(--border);
    padding: 14px 12px; display: flex; flex-direction: column; z-index: 60;
    scrollbar-width: thin; scrollbar-color: var(--faint) transparent;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 4px 12px; color: var(--fg); font-weight: 650; font-size: 14.5px; letter-spacing: -.01em; }
  .brand:hover { text-decoration: none; }
  .brand-icon { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; flex: none; border-radius: 8px; background: var(--primary); color: var(--primary-fg); }
  .side-nav { flex: 1; }
  .side-sec { padding: 14px 10px 5px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .side-item {
    display: flex; width: 100%; align-items: center; gap: 9px; padding: 7px 10px; margin: 1px 0;
    border: 0; border-radius: 8px; background: none; color: var(--fg-soft);
    font: inherit; font-size: 13.5px; cursor: pointer; text-align: left;
  }
  .side-item svg { color: var(--muted); flex: none; }
  .side-item > span:first-of-type { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-item:hover { background: var(--surface-2); color: var(--fg); }
  .side-item.active { background: var(--surface-2); color: var(--fg); font-weight: 600; }
  .side-item.active svg { color: var(--fg); }
  .side-n { margin-left: auto; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .side-foot { padding: 12px 10px 4px; border-top: 1px solid var(--border-soft); color: var(--muted); font-size: 12px; }
  .backdrop { display: none; }

  /* ---------- frame & topbar ---------- */
  .frame { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #topbar {
    position: sticky; top: 0; z-index: 40; height: var(--topbar-h); flex: none;
    display: flex; align-items: center; gap: 12px; padding: 0 20px;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-title { font-size: 15px; font-weight: 500; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex: none;
    border: 0; border-radius: 8px; background: none; color: var(--fg-soft); cursor: pointer;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--fg); }
  .menu-btn { display: none; }
  .search-wrap { position: relative; display: flex; align-items: center; }
  .search-wrap > svg { position: absolute; left: 9px; color: var(--faint); pointer-events: none; }
  .search-wrap kbd {
    position: absolute; right: 8px; pointer-events: none;
    border: 1px solid var(--border); border-radius: 4px; padding: 0 5px;
    font: 11px/1.6 ui-monospace, Menlo, monospace; color: var(--muted); background: var(--surface-2);
  }
  #q {
    width: 280px; max-width: 100%; padding: 6px 30px 6px 31px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg);
    font: inherit; font-size: 13.5px; transition: border-color .15s, box-shadow .15s;
  }
  #q::placeholder { color: var(--faint); }
  #q:focus { outline: none; border-color: var(--faint); box-shadow: 0 0 0 3px var(--ring); }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg);
    font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
    box-shadow: var(--shadow); transition: background .12s;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:disabled { opacity: .5; pointer-events: none; }
  main { width: 100%; max-width: 1200px; margin: 0 auto; padding: 20px 20px 64px; }

  /* ---------- cards ---------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow-card); }
  .card.table-card { padding: 0; overflow: clip; }  /* clip rounds the corners without becoming a scroll container, so sticky th works */
  .card-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--border-soft); }
  .card-head h3 { margin: 0; }
  .list-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--border-soft); }
  .list-meta .count { font-size: 13px; color: var(--fg-soft); font-weight: 500; }
  .list-meta .hint { margin-left: auto; font-size: 12.5px; color: var(--faint); }

  /* ---------- tables ---------- */
  .table-wrap { width: 100%; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  th {
    position: sticky; top: var(--topbar-h); z-index: 5;
    text-align: left; color: var(--muted); font-weight: 500; font-size: 12.5px;
    padding: 9px 10px; background: var(--surface); border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  td { padding: 10px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
  .table-card th:first-child, .table-card td:first-child { padding-left: 16px; }
  .table-card th:last-child, .table-card td:last-child { padding-right: 16px; }
  .table-card tr:last-child td { border-bottom: none; }
  tr.rowlink { cursor: pointer; }
  tr.rowlink:hover { background: var(--surface-2); }
  th[data-sort] { cursor: pointer; user-select: none; }
  th[data-sort]:hover { color: var(--fg); }
  .sort-ind::after { content: '↕'; margin-left: 4px; color: var(--faint); opacity: 0; }
  th[data-sort]:hover .sort-ind::after { opacity: 1; }
  th.sorted-asc .sort-ind::after { content: '↑'; color: var(--fg); opacity: 1; }
  th.sorted-desc .sort-ind::after { content: '↓'; color: var(--fg); opacity: 1; }
  .nowrap { white-space: nowrap; }
  .runcell { word-break: break-all; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
  .muted { color: var(--muted); }

  /* ---------- badges & chips ---------- */
  .badge { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 1px solid transparent; white-space: nowrap; }
  .badge.pass { background: var(--pass-bg); color: var(--pass); border-color: var(--pass-border); }
  .badge.fail { background: var(--fail-bg); color: var(--fail); border-color: var(--fail-border); }
  .badge.na   { background: var(--na-bg); color: var(--muted); border-color: var(--na-border); }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; margin: 14px 0 4px; }
  .chip { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; }
  .chip .k { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .v { font-size: 20px; font-weight: 600; letter-spacing: -.02em; margin-top: 2px; }

  /* ---------- text & misc ---------- */
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .crumbs { font-size: 13px; margin-bottom: 12px; color: var(--muted); }
  h2 { font-size: 17px; margin: 4px 0 10px; font-weight: 600; letter-spacing: -.02em; }
  h3 { font-size: 14px; margin: 20px 0 8px; font-weight: 600; }
  details > summary { cursor: pointer; color: var(--link); font-size: 13px; user-select: none; font-weight: 500; }
  pre {
    background: var(--surface-2); color: var(--fg); border: 1px solid var(--border-soft);
    padding: 12px 14px; border-radius: 8px; overflow: auto; font-size: 12px; max-height: 480px;
    scrollbar-width: thin; scrollbar-color: var(--faint) transparent;
  }
  .json-preview-toolbar { display: flex; justify-content: flex-end; margin: 8px 0 -4px; }
  .json-preview pre { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
  .json-preview.no-wrap pre { white-space: pre; overflow-wrap: normal; word-break: normal; }
  .empty { color: var(--muted); padding: 32px; text-align: center; font-size: 13.5px; }
  .detail-heading { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .detail-heading h2 { margin-right: auto; }
  .skel { height: 13px; border-radius: 6px; margin: 12px 0; background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .toast {
    position: fixed; bottom: 20px; right: 20px; z-index: 100; max-width: 400px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 13px; color: var(--fg-soft);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .14);
    display: flex; align-items: flex-start; gap: 10px;
  }
  .toast-close {
    flex-shrink: 0; margin: -2px -6px 0 0; padding: 0 4px; border: 0; background: none;
    color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer;
  }
  .toast-close:hover { color: var(--fg); }

  /* ---------- transcript ---------- */
  .bubble { padding: 9px 13px; border-radius: 14px; margin: 6px 0; white-space: pre-wrap; }
  .turn { display: flex; }
  .turn > div { max-width: 72%; display: flex; flex-direction: column; align-items: flex-start; }
  .turn.user { justify-content: flex-end; }
  .turn.user > div { align-items: flex-end; }
  .turn.user .bubble { background: var(--bubble-user); color: var(--bubble-user-fg); border-bottom-right-radius: 4px; }
  .turn.agent .bubble { background: var(--bubble-agent); border-bottom-left-radius: 4px; }
  .turn .who { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  audio { width: 100%; margin: 4px 0 10px; }
  .audio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px 18px; }
  .tool-call { border: 1px solid var(--border-soft); border-radius: 8px; padding: 10px 12px; margin: 8px 0; background: var(--surface-2); }
  .tool-call.inline { margin: 10px 40px; font-size: 13px; }
  .tool-call .name { font-weight: 650; }
  .tool-call .err { color: var(--fail); font-size: 12.5px; }
  .ts { color: var(--faint); font-size: 11px; font-family: ui-monospace, Menlo, monospace; margin-right: 6px; }

  /* ---------- scenario nav & buttons ---------- */
  .scen-nav { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .scen-nav select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg); font: inherit; font-size: 12.5px; max-width: 220px; }
  .navbtn {
    display: inline-block; padding: 5px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--fg); font-size: 12.5px; white-space: nowrap;
    box-shadow: var(--shadow); transition: background .12s;
  }
  .navbtn:hover { background: var(--surface-2); text-decoration: none; }
  .navbtn:focus-visible { outline: none; border-color: var(--faint); box-shadow: 0 0 0 3px var(--ring); }
  .navbtn.disabled { color: var(--faint); pointer-events: none; box-shadow: none; }
  button.navbtn { cursor: pointer; font-family: inherit; }

  /* ---------- star / hide / copy ---------- */
  .star { color: var(--faint); display: inline-flex; transition: color .12s, transform .12s; }
  .star.on { color: var(--star); }
  .star.on svg { fill: currentColor; }
  .starcell { cursor: pointer; user-select: none; }
  .starcell:hover .star { color: var(--star); transform: scale(1.12); }
  .eye { color: var(--faint); display: inline-flex; transition: color .12s; }
  .eye.on { color: var(--muted); }
  .eyecell { cursor: pointer; user-select: none; }
  .eyecell:hover .eye { color: var(--fg); }
  .run-name { overflow-wrap: anywhere; }
  .copy-run-name { appearance: none; border: 0; padding: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: copy; overflow-wrap: anywhere; }
  .copy-run-name:hover { color: var(--link); }
  .copy-run-name:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 2px; }
  .copy-icon { display: inline-block; vertical-align: -2px; margin-left: 5px; color: var(--faint); }
  .copy-icon svg { width: 12px; height: 12px; }
  .copy-run-name:hover .copy-icon { color: var(--link); }
  .copy-feedback { margin-left: 5px; color: var(--pass); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; font-size: 11px; font-weight: 600; }
  .copy-run-name.copy-error .copy-feedback { color: var(--fail); }
  .subscore { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
  .subscore .ok { color: var(--pass); }
  .subscore .bad { color: var(--fail); }
  .mode-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--fg-soft); white-space: nowrap; }
  .mode-tag svg { width: 13px; height: 13px; opacity: .7; }
  .cmp-pickers { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-top: 14px; }
  .cmp-swap { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); }

  /* ---------- run picker (filterable listbox; a native <select> of 100+ runs is unreadable) ---------- */
  .run-combo { position: relative; min-width: 0; }
  .rc-btn {
    display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--fg);
    font: inherit; text-align: left; cursor: pointer; box-shadow: var(--shadow);
    user-select: none; -webkit-tap-highlight-color: transparent;
    transition: background .12s, border-color .12s, box-shadow .12s;
  }
  .rc-btn:hover { background: var(--surface-2); }
  .rc-btn:focus-visible, .run-combo.open .rc-btn { outline: none; border-color: var(--faint); box-shadow: 0 0 0 3px var(--ring); }
  .rc-side {
    flex: none; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
    border-radius: 6px; background: var(--surface-3); color: var(--fg-soft); font-size: 12px; font-weight: 650;
  }
  .run-combo[data-side="b"] .rc-side { background: var(--primary); color: var(--primary-fg); }
  .rc-body { flex: 1; min-width: 0; }
  .rc-title { display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; }
  .rc-title > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rc-title .star svg { width: 12px; height: 12px; }
  .rc-empty { color: var(--muted); font-weight: 500; }
  .rc-sub { display: block; margin-top: 1px; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rc-chev { flex: none; display: inline-flex; color: var(--faint); transition: transform .15s; }
  .run-combo.open .rc-chev { transform: rotate(180deg); }

  .rc-pop {
    position: absolute; z-index: 50; top: calc(100% + 6px); left: 0; width: max(100%, 540px); overflow: hidden;
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
    box-shadow: 0 12px 32px -10px rgba(0, 0, 0, .3), var(--shadow-card);
  }
  .run-combo[data-side="b"] .rc-pop { left: auto; right: 0; }  /* stay inside the card */
  .rc-search { position: relative; display: flex; padding: 8px; border-bottom: 1px solid var(--border-soft); }
  .rc-search svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
  .rc-search input {
    width: 100%; padding: 6px 10px 6px 31px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-2); color: var(--fg); font: inherit; font-size: 13px;
  }
  .rc-search input::placeholder { color: var(--faint); }
  .rc-search input:focus { outline: none; border-color: var(--faint); box-shadow: 0 0 0 3px var(--ring); }
  .rc-list { max-height: 340px; overflow-y: auto; padding: 5px; scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
  .rc-group { padding: 7px 9px 4px; font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .rc-opt + .rc-group { margin-top: 5px; border-top: 1px solid var(--border-soft); }
  .rc-opt { display: flex; align-items: center; gap: 9px; padding: 6px 9px; border-radius: 8px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
  .rc-opt.active { background: var(--surface-2); }
  .rc-opt.taken { opacity: .45; cursor: default; }
  .rc-tick { flex: none; width: 15px; color: var(--fg); }
  .rc-tick svg { width: 14px; height: 14px; }
  .rc-meta { flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .rc-note { border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .rc-opt .rc-meta .badge { min-width: 56px; text-align: center; }
  .rc-score { min-width: 34px; text-align: right; font-size: 12px; color: var(--fg-soft); font-variant-numeric: tabular-nums; }
  .rc-none { padding: 16px 10px; text-align: center; font-size: 12.5px; color: var(--muted); }
  .rc-foot { display: flex; align-items: center; gap: 5px; padding: 6px 10px; border-top: 1px solid var(--border-soft); background: var(--surface-2); font-size: 11.5px; color: var(--muted); }
  .rc-foot kbd { border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; background: var(--surface); font: 11px/1.5 ui-monospace, Menlo, monospace; }

<aside id="sidebar">

<script>
const $main = document.getElementById('main');
const svgIcon = paths => `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
const ICONS = {
  star: svgIcon('<path d="M12 2.5l2.94 5.95 6.57.96-4.76 4.63 1.13 6.54L12 17.5l-5.88 3.08 1.12-6.54-4.75-4.63 6.57-.96z"/>'),
  eyeOff: svgIcon('<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.4 10.4 0 0 1 12 5c7 0 10 7 10 7a13.2 13.2 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.5 13.5 0 0 0 2 12s3 7 10 7a9.7 9.7 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/>'),
  list: svgIcon('<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>'),
  bot: svgIcon('<rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 8V4M8 4h8"/><path d="M9 13.5h.01M15 13.5h.01"/>'),
  copy: svgIcon('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>'),
  sun: svgIcon('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>'),
  moon: svgIcon('<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'),
  monitor: svgIcon('<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>'),
  mic: svgIcon('<rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/>'),
  chat: svgIcon('<path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9.7 9.7 0 0 1-2.6-.35L3.5 21l1.4-4A8.1 8.1 0 0 1 3 11.5 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>'),
  compare: svgIcon('<rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/>'),
  search: svgIcon('<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>'),
  chevron: svgIcon('<polyline points="6 9 12 15 18 9"/>'),
  check: svgIcon('<polyline points="20 6 9 17 4 12"/>'),
  swap: svgIcon('<path d="M4 9h13l-3.5-3.5M17 9l-3.5 3.5"/><path d="M20 15H7l3.5-3.5M7 15l3.5 3.5"/>'),
  play: svgIcon('<polygon points="6 4 20 12 6 20 6 4"/>'),
};
let RUNS = null;
let STARS = new Set();
let HIDDEN = new Set();
let NOTES = {};
let LLM_MODEL = '';  // the model behind Ask AI, reported by /api/runs

const dataHref = path => '/data/' + path.split('/').map(encodeURIComponent).join('/');

async function toggleStar(path, rerender) {
  const starred = !STARS.has(path);
  starred ? STARS.add(path) : STARS.delete(path);
  rerender();
  const fd = new FormData();
  fd.append('path', path);
  fd.append('starred', starred);
  try {
    const r = await fetch('/api/star', { method: 'POST', body: fd });
    if (!r.ok) throw new Error(r.status);
  } catch (e) {
    starred ? STARS.delete(path) : STARS.add(path);  // roll back on failure
    rerender();
  }
}
const starIcon = path => `<span class="star ${STARS.has(path) ? 'on' : ''}">${ICONS.star}</span>`;

// Hidden runs are a per-browser preference: kept in localStorage and never sent to the
// server, so every computer (and every visitor of a shared link) has its own list.
const HIDDEN_KEY = 'viewer_hidden_runs';

function loadHiddenRuns() {
  try {
    const stored = JSON.parse(localStorage.getItem(HIDDEN_KEY) || '[]');
    return new Set(Array.isArray(stored) ? stored.filter(p => typeof p === 'string') : []);
  } catch (e) {
    return new Set();  // storage blocked (private mode): hiding lasts for this page only
  }
}
HIDDEN = loadHiddenRuns();

function toggleHidden(path, rerender) {
  HIDDEN.has(path) ? HIDDEN.delete(path) : HIDDEN.add(path);
  try {
    localStorage.setItem(HIDDEN_KEY, JSON.stringify([...HIDDEN].sort()));
  } catch (e) { /* keep the in-memory state even when it can't be persisted */ }
  rerender();
}
const hideIcon = path => HIDDEN.has(path)
  ? `<span class="eye on" title="Hidden on this computer — click to show it again">${ICONS.eyeOff}</span>`
  : `<span class="eye" title="Hide this run from the list on this computer">${ICONS.eyeOff}</span>`;

async function saveRunNote(path, value) {
  const note = value.trim();
  const previous = NOTES[path] || '';
  if (note === previous) return note;
  note ? NOTES[path] = note : delete NOTES[path];
  const fd = new FormData();
  fd.append('path', path);
  fd.append('note', note);
  try {
    const r = await fetch('/api/note', { method: 'POST', body: fd });
    const res = await r.json();
    if (!r.ok) throw new Error(res.detail || r.status);
    return res.note;
  } catch (e) {
    previous ? NOTES[path] = previous : delete NOTES[path];
    throw e;
  }
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const displayModelName = model => {
  const name = String(model || '').split('/').filter(Boolean).pop() || '';
  return name.replace(/^gpt(?=$|[-_.])/i, 'GPT');
};

function renderMarkdownInline(value) {
  return String(value ?? '').split(/(`[^`\n]*`)/g).map(part => {
    if (part.startsWith('`') && part.endsWith('`')) {
      return `<code>${esc(part.slice(1, -1))}</code>`;
    }
    return esc(part)
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
      .replace(/__([^_\n]+)__/g, '<strong>$1</strong>')
      .replace(/~~([^~\n]+)~~/g, '<s>$1</s>')
      .replace(/(^|[\s(])\*([^*\n]+)\*(?=$|[\s).,!?:;，。！？：；])/g, '$1<em>$2</em>')
      .replace(/\[([^\]\n]+)\]\(((?:https?:\/\/|mailto:)[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }).join('');
}

function renderMarkdown(value) {
  const lines = String(value ?? '').replace(/\r\n?/g, '\n').split('\n');
  const html = [];
  let paragraph = [];
  let listType = null;
  let listStart = null;
  let listItems = [];
  let quote = [];
  let code = null;
  let codeLanguage = '';

  const flushParagraph = () => {
    if (paragraph.length) html.push(`<p>${paragraph.map(renderMarkdownInline).join('<br>')}</p>`);
    paragraph = [];
  };
  const flushList = () => {
    if (listType) {
      const start = listType === 'ol' && listStart !== 1 ? ` start="${listStart}"` : '';
      html.push(`<${listType}${start}>${listItems.join('')}</${listType}>`);
    }
    listType = null;
    listStart = null;
    listItems = [];
  };
  const flushQuote = () => {
    if (quote.length) html.push(`<blockquote>${quote.map(renderMarkdownInline).join('<br>')}</blockquote>`);
    quote = [];
  };
  const flushBlocks = () => {
    flushParagraph();
    flushList();
    flushQuote();
  };
  const tableCells = line => line.trim().replace(/^\||\|$/g, '').split('|').map(cell => cell.trim());

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    if (code !== null) {
      if (/^\s*```\s*$/.test(line)) {
        const language = codeLanguage ? ` class="language-${esc(codeLanguage)}"` : '';
        html.push(`<pre><code${language}>${esc(code.join('\n'))}</code></pre>`);
        code = null;
        codeLanguage = '';
      } else {
        code.push(line);
      }
      continue;
    }

    const fence = line.match(/^\s*```([\w.+-]*)\s*$/);
    if (fence) {
      flushBlocks();
      code = [];
      codeLanguage = fence[1];
      continue;
    }

    if (!line.trim()) {
      flushBlocks();
      continue;
    }

    if (line.includes('|') && i + 1 < lines.length) {
      const separator = tableCells(lines[i + 1]);
      if (separator.length > 1 && separator.every(cell => /^:?-{3,}:?$/.test(cell))) {
        flushBlocks();
        const headers = tableCells(line);
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim() && lines[i].includes('|')) {
          rows.push(tableCells(lines[i]));
          i++;
        }
        i--;
        html.push(`<div class="markdown-table-wrap"><table><thead><tr>${headers.map(cell => `<th>${renderMarkdownInline(cell)}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${headers.map((_, index) => `<td>${renderMarkdownInline(row[index] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
        continue;
      }
    }

    const heading = line.match(/^(#{1,4})\s+(.+)$/);
    if (heading) {
      flushBlocks();
      const level = Math.min(6, heading[1].length + 2);
      html.push(`<h${level}>${renderMarkdownInline(heading[2])}</h${level}>`);
      continue;
    }

    if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
      flushBlocks();
      html.push('<hr>');
      continue;
    }

    const list = line.match(/^\s*(?:([-+*])|(\d+)[.)])\s+(.+)$/);
    if (list) {
      flushParagraph();
      flushQuote();
      const nextType = list[2] ? 'ol' : 'ul';
      if (listType && listType !== nextType) flushList();
      if (!listType) {
        listType = nextType;
        listStart = nextType === 'ol' ? Number(list[2]) : null;
      }
      const item = list[3].replace(/^\[([ xX])\]\s+/, (_, checked) => checked === ' ' ? '☐ ' : '☑ ');
      listItems.push(`<li>${renderMarkdownInline(item)}</li>`);
      continue;
    }

    const blockquote = line.match(/^\s*>\s?(.*)$/);
    if (blockquote) {
      flushParagraph();
      flushList();
      quote.push(blockquote[1]);
      continue;
    }

    flushList();
    flushQuote();
    paragraph.push(line.trim());
  }

  if (code !== null) html.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);
  flushBlocks();
  return html.join('');
}

const fmtScore = v => (v === null || v === undefined) ? '<span class="muted">—</span>' : Number(v).toFixed(v >= 1 || v === 0 ? 2 : 3).replace(/\.?0+$/,'') || '0';
const fmtDur = ms => ms == null ? '—' : (ms/1000 < 90 ? (ms/1000).toFixed(1)+'s' : (ms/60000).toFixed(1)+'min');
const passBadge = p => p === true ? '<span class="badge pass">PASS</span>' : p === false ? '<span class="badge fail">FAIL</span>' : '<span class="badge na">—</span>';

const jsonPreview = (label, value) => `
  <details class="json-preview">
    <summary>${esc(label)}</summary>
    <div class="json-preview-toolbar">
      <button class="navbtn json-wrap-toggle" type="button" aria-pressed="true">Auto wrap: On</button>
    </div>
    <pre>${esc(JSON.stringify(value, null, 2))}</pre>
  </details>`;

$main.addEventListener('click', event => {
  const button = event.target.closest('.json-wrap-toggle');
  if (!button) return;
  const preview = button.closest('.json-preview');
  const wrapped = preview.classList.toggle('no-wrap') === false;
  button.setAttribute('aria-pressed', String(wrapped));
  button.textContent = `Auto wrap: ${wrapped ? 'On' : 'Off'}`;
});

async function copyText(text) {
  if (navigator.clipboard?.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      return;
    } catch (_) {
      // Fall through for browsers that block the Clipboard API.
    }
  }
  const input = document.createElement('textarea');
  input.value = text;
  input.style.position = 'fixed';
  input.style.opacity = '0';
  document.body.appendChild(input);
  input.focus();
  input.select();
  const copied = document.execCommand('copy');
  input.remove();
  if (!copied) throw new Error('copy failed');
}

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ' → ' + r.status);
  return r.json();
}

function invalidateRuns() {
  RUNS = null;

const listState = { q: '', agent_name: '', modality: '', view: 'all', sort: 'timestamp', dir: -1 };

// collapse agent variants into a fixed set of families for the sidebar filter
const AGENT_GROUPS = ['TalkDesk', 'ElevenLabs', 'Gemini-3.1-flash-live', 'GPT-Realtime-2.1', 'others'];

function agentGroup(name) {
  const n = (name || '').toLowerCase();
  if (!n) return '';  // runs without an agent name stay reachable only under "All agents"
  if (n.includes('talkdesk')) return 'TalkDesk';
  if (n.includes('elevenlabs')) return 'ElevenLabs';
  if (n.includes('gemini')) return 'Gemini-3.1-flash-live';
  if (n.includes('realtime')) return 'GPT-Realtime-2.1';
  return 'others';
}

const MODALITIES = [['voice', 'Voice'], ['text', 'Text']];
const modalityLabel = m => (MODALITIES.find(([k]) => k === m) || [])[1] || '';
const modalityTag = m => m
  ? `<span class="mode-tag">${m === 'voice' ? ICONS.mic : ICONS.chat}${modalityLabel(m)}</span>`
  : '<span class="muted">—</span>';

const runSorters = {
  timestamp: r => r.timestamp || '',
  modality: r => r.modality || '',
  run_name: r => r.run_name || '',
  agent_name: r => r.agent_name || '',
  scenarios: r => r.has_results ? r.scenarios_passed / Math.max(1, r.scenarios_total) : null,
  primary_score: r => r.primary_score,
  eval_final: r => r.eval_final,
};

function sortRows(rows, sorters, key, dir) {
  const get = sorters[key] || (() => null);
  return [...rows].sort((a, b) => {
    const va = get(a), vb = get(b);
    if (va == null && vb == null) return 0;
    if (va == null) return 1;  // missing values sink to the bottom either way
    if (vb == null) return -1;
    if (typeof va === 'string') return va.localeCompare(vb, undefined, { numeric: true, sensitivity: 'base' }) * dir;
    return (va < vb ? -1 : va > vb ? 1 : 0) * dir;
  });
}

const sortableTh = (key, label, state, cls = '') => {
  const active = state.sort === key;
  return `<th data-sort="${key}" class="${cls} ${active ? (state.dir > 0 ? 'sorted-asc' : 'sorted-desc') : ''}"
    aria-sort="${active ? (state.dir > 0 ? 'ascending' : 'descending') : 'none'}">${label}<span class="sort-ind"></span></th>`;
};

function filteredRuns() {
  const runs = RUNS || [];
  const hiddenRuns = runs.filter(r => HIDDEN.has(r.path));
  const pool = listState.view === 'hidden' ? hiddenRuns : runs.filter(r => !HIDDEN.has(r.path));
  return {
    hiddenCount: hiddenRuns.length,
    pool,
    rows: pool.filter(r =>
      (listState.view !== 'starred' || STARS.has(r.path)) &&
      (!listState.agent_name || agentGroup(r.agent_name) === listState.agent_name) &&
      (!listState.modality || r.modality === listState.modality) &&
      (!listState.q || r.run_name.toLowerCase().includes(listState.q)
        || (r.agent_name || '').toLowerCase().includes(listState.q)
        || (NOTES[r.path] || '').toLowerCase().includes(listState.q))),
  };
}

/* ---------- sidebar ---------- */
function agentFamilies() {
  const counts = {};
  for (const r of RUNS || []) {
    const g = agentGroup(r.agent_name);
    if (g) counts[g] = (counts[g] || 0) + 1;
  }
  return AGENT_GROUPS.filter(g => counts[g]).map(g => [g, counts[g]]);  // fixed order, skip empty families
}

function modalityCounts() {
  const counts = {};
  for (const r of RUNS || []) if (r.modality) counts[r.modality] = (counts[r.modality] || 0) + 1;
  return MODALITIES.filter(([k]) => counts[k]).map(([k, label]) => [k, label, counts[k]]);
}

const cmpState = { sort: 'id', dir: 1, diffOnly: false };

const cmpShortName = r => `${r.agent_name || r.path.split('-1trials-')[0]}${r.modality ? ` (${modalityLabel(r.modality)})` : ''}`;

// The other side of the comparison worth defaulting to: same domain and task count,
// opposite modality — the only pairing where a text-vs-voice delta means anything.
function defaultCounterpart(anchor) {
  const runs = [...(RUNS || [])].filter(r => r.scenario_count && r.path !== anchor.path)
    .sort((x, y) => (y.timestamp || '').localeCompare(x.timestamp || ''));
  const sameDomain = r => (r.domains || []).some(d => (anchor.domains || []).includes(d));
  const sameTasks = r => sameDomain(r) && r.scenario_count === anchor.scenario_count;
  const crossModal = r => r.modality && anchor.modality && r.modality !== anchor.modality;
  return runs.find(r => crossModal(r) && sameTasks(r))
    || runs.find(r => crossModal(r) && sameDomain(r))
    || runs.find(r => sameTasks(r))
    || runs.find(r => sameDomain(r))
    || runs[0];
}

function defaultComparePair() {
  const runs = [...(RUNS || [])].filter(r => r.scenario_count)
    .sort((x, y) => (y.timestamp || '').localeCompare(x.timestamp || ''));
  const a = runs.find(r => r.modality === 'text') || runs[0];
  return a ? [a.path, defaultCounterpart(a)?.path || ''] : ['', ''];
}

/* ---------- run picker ----------
   The archive holds a hundred-plus runs, so each side is a filterable listbox rather than a
   native <select>: every row carries what you actually choose on (modality, date, task set,
   pass ratio, score), and rows are grouped by how well they line up with the other side —
   scenarios are matched by id, so a pair with no shared task set yields an empty table. */
const runTaskLabel = r => `${r.scenario_count} task${r.scenario_count === 1 ? '' : 's'}`;
const runSubline = r => [
  (r.timestamp || '?').replace(/:\d\d(?=Z$)/, ''),  // minutes are enough to tell runs apart
  (r.domains || []).join(', ') || 'no domain',
  runTaskLabel(r),
].join(' · ');
const runScenarioBadge = r => r.has_results
  ? `<span class="badge ${r.scenarios_passed === r.scenarios_total ? 'pass' : 'fail'}">${r.scenarios_passed}/${r.scenarios_total}</span>`
  : '<span class="badge na">no results</span>';
const runSearchText = r => [r.run_name, r.agent_name, modalityLabel(r.modality),
  (r.domains || []).join(' '), NOTES[r.path] || ''].join(' ').toLowerCase();

const runTitleHTML = r => `<span class="rc-title"><span>${esc(r.agent_name || r.run_name)}</span>${
  modalityTag(r.modality)}${STARS.has(r.path) ? `<span class="star on">${ICONS.star}</span>` : ''}</span>`;

// Hidden runs stay out of the list — the eye icon means "stop showing me this" — unless one of
// them is already on the page, where dropping it silently would be more confusing than showing it.
function cmpPickerGroups(side, selected, otherPath, query) {
  const q = (query || '').trim().toLowerCase();
  const rows = (RUNS || [])
    .filter(r => !HIDDEN.has(r.path) || r.path === selected || r.path === otherPath)
    .filter(r => !q || runSearchText(r).includes(q))
    .sort((x, y) => (STARS.has(y.path) - STARS.has(x.path))
      || (y.timestamp || '').localeCompare(x.timestamp || ''));
  const other = (RUNS || []).find(r => r.path === otherPath);
  if (!other) return [['', rows]];
  const sharesDomain = r => (r.domains || []).some(d => (other.domains || []).includes(d));
  const rank = r => !sharesDomain(r) ? 2 : r.scenario_count === other.scenario_count ? 0 : 1;
  const L = side === 'a' ? 'B' : 'A';
  return [`Same task set as ${L}`, `Same domain as ${L}`, 'Other runs']
    .map((label, i) => [label, rows.filter(r => rank(r) === i)]);
}

function cmpOptionHTML(side, r, selected, otherPath, idx) {
  const other = (RUNS || []).find(x => x.path === otherPath);
  const taken = r.path === otherPath;
  const crossModal = other && r.modality && other.modality && r.modality !== other.modality;
  return `<div class="rc-opt${taken ? ' taken' : ''}" id="rc-${side}-${idx}" role="option"
    data-path="${esc(r.path)}" aria-selected="${r.path === selected}"${taken ? ' aria-disabled="true"' : ''}
    title="${esc(r.run_name)}">
    <span class="rc-tick">${r.path === selected ? ICONS.check : ''}</span>
    <span class="rc-body">${runTitleHTML(r)}<span class="rc-sub">${esc(runSubline(r))}</span></span>
    <span class="rc-meta">${taken ? `<span class="rc-note">already ${side === 'a' ? 'B' : 'A'}</span>`
      : crossModal ? '<span class="rc-note rc-cross">cross-modal</span>' : ''
      }${runScenarioBadge(r)}<span class="rc-score">${fmtScore(r.primary_score)}</span></span>
  </div>`;
}

function cmpOptionsHTML(side, selected, otherPath, query) {
  let idx = 0;
  const html = cmpPickerGroups(side, selected, otherPath, query)
    .filter(([, rows]) => rows.length)
    .map(([label, rows]) => (label ? `<div class="rc-group">${esc(label)}</div>` : '')
      + rows.map(r => cmpOptionHTML(side, r, selected, otherPath, idx++)).join(''))
    .join('');
  return html || '<div class="rc-none">No run matches this filter.</div>';
}

function cmpPickerHTML(side, selected) {
  const id = side === 'a' ? 'cmpA' : 'cmpB';
  const L = side.toUpperCase();
  const r = (RUNS || []).find(x => x.path === selected);
  return `<div class="run-combo" id="${id}" data-side="${side}">
    <button class="rc-btn" type="button" aria-haspopup="listbox" aria-expanded="false"
      aria-controls="${id}-list" aria-label="Run ${L}"${r ? ` title="${esc(r.run_name)}"` : ''}>
      <span class="rc-side" aria-hidden="true">${L}</span>
      <span class="rc-body">${r
        ? runTitleHTML(r) + `<span class="rc-sub">${esc(runSubline(r))}</span>`
        : `<span class="rc-title rc-empty">Pick run ${L}…</span>
           <span class="rc-sub">${(RUNS || []).length} runs archived</span>`}</span>
      ${r ? `<span class="rc-meta">${runScenarioBadge(r)}</span>` : ''}
      <span class="rc-chev">${ICONS.chevron}</span>
    </button>
    <div class="rc-pop" hidden>
      <div class="rc-search">${ICONS.search}<input type="text" autocomplete="off" spellcheck="false"
        aria-label="Filter runs" placeholder="Filter by run, agent, domain, note…"></div>
      <div class="rc-list" id="${id}-list" role="listbox" aria-label="Runs"></div>
      <div class="rc-foot"><kbd>↑</kbd><kbd>↓</kbd> move <kbd>↵</kbd> select
        <kbd>esc</kbd> close<span class="rc-count"></span></div>
    </div>
  </div>`;
}

const setComboOpen = (root, on) => {
  root.classList.toggle('open', on);
  root.querySelector('.rc-pop').hidden = !on;
  root.querySelector('.rc-btn').setAttribute('aria-expanded', String(on));
};

// One stateless closer for clicks outside a picker: renderCompare replaces the pickers
// wholesale, so per-instance document listeners would pile up on detached nodes.
document.addEventListener('pointerdown', e => {
  document.querySelectorAll('.run-combo.open').forEach(root => {
    if (!root.contains(e.target)) setComboOpen(root, false);
  });
}, true);

function initCmpPicker(side, selected, otherPath, onPick) {
  const root = document.getElementById(side === 'a' ? 'cmpA' : 'cmpB');
  const btn = root.querySelector('.rc-btn');
  const input = root.querySelector('.rc-search input');
  const list = root.querySelector('.rc-list');
  const count = root.querySelector('.rc-count');
  const options = () => [...list.querySelectorAll('.rc-opt:not(.taken)')];
  const activeIndex = () => options().findIndex(el => el.classList.contains('active'));

  const setActive = i => {
    const all = options();
    if (!all.length) { list.removeAttribute('aria-activedescendant'); return; }
    const n = (i + all.length) % all.length;
    all.forEach((el, k) => el.classList.toggle('active', k === n));
    all[n].scrollIntoView({ block: 'nearest' });
    list.setAttribute('aria-activedescendant', all[n].id);
  };
  const draw = () => {
    list.innerHTML = cmpOptionsHTML(side, selected, otherPath, input.value);
    const shown = list.querySelectorAll('.rc-opt').length;
    count.textContent = `${shown} run${shown === 1 ? '' : 's'}`;
    setActive(Math.max(0, options().findIndex(el => el.dataset.path === selected)));
  };
  const toggle = on => {
    setComboOpen(root, on);
    if (!on) { btn.focus(); return; }
    input.value = '';  // every open starts from the full list
    draw();
    input.focus();
  };
  const pick = path => {
    setComboOpen(root, false);
    if (path === selected) { btn.focus(); return; }  // same run: nothing to navigate to
    onPick(path);
  };

  btn.addEventListener('click', () => toggle(!root.classList.contains('open')));
  btn.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); toggle(true); }
  });
  input.addEventListener('input', draw);
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(activeIndex() + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(activeIndex() - 1); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      const el = options()[activeIndex()];
      if (el) pick(el.dataset.path);
    } else if (e.key === 'Escape') { e.preventDefault(); toggle(false); }
    else if (e.key === 'Tab') setComboOpen(root, false);
  });
  list.addEventListener('click', e => {
    const el = e.target.closest('.rc-opt');
    if (el && !el.classList.contains('taken')) pick(el.dataset.path);
  });
  list.addEventListener('pointerover', e => {
    const el = e.target.closest('.rc-opt:not(.taken)');
    if (el) setActive(options().indexOf(el));
  });
}

const cmpGoTo = (a, b) => {
  location.hash = '#/compare' + (a || b ? `?a=${encodeURIComponent(a || '')}&b=${encodeURIComponent(b || '')}` : '');
};

function cmpMetricRow(label, va, vb, { fmt = fmtScore, better = 'high', note = '' } = {}) {
  const num = v => (typeof v === 'number' && isFinite(v)) ? v : null;
  const [na, nb] = [num(va), num(vb)];
  let delta = '<span class="muted">—</span>';
  if (na !== null && nb !== null) {
    const d = nb - na;
    const cls = !better || Math.abs(d) < 1e-9 ? '' : (better === 'high') === (d > 0) ? 'up' : 'down';
    const shown = fmt === fmtDur ? fmtDur(Math.abs(d)) : fmtScore(Math.abs(d));
    delta = `<span class="cmp-delta ${cls}">${d > 0 ? '+' : d < 0 ? '−' : ''}${shown}</span>`;
  }
  const cell = v => v == null ? '<span class="muted">—</span>' : fmt(v);
  return `<tr><td>${esc(label)}${note ? `<div class="subscore">${esc(note)}</div>` : ''}</td>
    <td>${cell(va)}</td><td class="cmp-side">${cell(vb)}</td><td>${delta}</td></tr>`;
}

function cmpSummaryHTML(d) {
  const { a, b, counts } = d;
  const shared = d.scenarios.length;
  const rate = st => st.total ? st.passed / st.total : null;
  const ev = (side, k) => side.evaluation ? side.evaluation[k] : null;
  const crossModal = a.modality && b.modality && a.modality !== b.modality;
  const pct = n => shared ? ` <span class="muted">(${(100 * n / shared).toFixed(0)}%)</span>` : '';
  const chips = [
    ['Shared scenarios', String(shared)],
    ['Both pass', counts.both_pass + pct(counts.both_pass)],
    [`Only ${esc(cmpShortName(a))}`, counts.a_only + pct(counts.a_only)],
    [`Only ${esc(cmpShortName(b))}`, counts.b_only + pct(counts.b_only)],
    ['Both fail', counts.both_fail + pct(counts.both_fail)],
  ];
  const rows = [
    cmpMetricRow('Passed (shared scenarios)', rate(a.stats), rate(b.stats),
      { note: `${a.stats.passed}/${a.stats.total} vs ${b.stats.passed}/${b.stats.total}` }),
    cmpMetricRow('Avg goal score', a.stats.goal_score, b.stats.goal_score),
    cmpMetricRow('Tool recall', a.stats.tool_recall, b.stats.tool_recall),
    cmpMetricRow('Tool precision', a.stats.tool_precision, b.stats.tool_precision),
    cmpMetricRow('Avg tool calls', a.stats.tool_calls, b.stats.tool_calls, { better: null }),
    cmpMetricRow('Avg turns', a.stats.turn_count, b.stats.turn_count, { better: null }),
    cmpMetricRow('Avg duration', a.stats.duration_ms, b.stats.duration_ms, { fmt: fmtDur, better: 'low' }),
    `<tr class="cmp-group"><td colspan="4">talk-bench evaluation (whole run)</td></tr>`,
    cmpMetricRow('Resolution', ev(a, 'resolution'), ev(b, 'resolution')),
    cmpMetricRow('Customer effort', ev(a, 'customer_effort'), ev(b, 'customer_effort')),
    cmpMetricRow('Conversation quality', ev(a, 'conversation_quality'), ev(b, 'conversation_quality')),
    cmpMetricRow('Responsiveness', ev(a, 'responsiveness'), ev(b, 'responsiveness'),
      { note: crossModal ? 'voice-only metric' : '' }),
    cmpMetricRow('Voice consistency', ev(a, 'voice_consistency'), ev(b, 'voice_consistency'),
      { note: crossModal ? 'voice-only metric' : '' }),
    cmpMetricRow('Experience', ev(a, 'experience'), ev(b, 'experience'),
      { better: crossModal ? null : 'high', note: crossModal ? 'not comparable across modalities' : '' }),
    cmpMetricRow('Eval final', ev(a, 'final'), ev(b, 'final'),
      { better: crossModal ? null : 'high', note: crossModal ? 'not comparable across modalities' : '' }),
  ];
  const reasons = side => Object.entries(side.stats.end_reasons || {})
    .map(([k, n]) => `${esc(k)} ${n}`).join(' · ') || '—';
  const orphans = [
    d.only_in_a.length ? `${d.only_in_a.length} only in ${esc(cmpShortName(a))}` : '',
    d.only_in_b.length ? `${d.only_in_b.length} only in ${esc(cmpShortName(b))}` : '',
  ].filter(Boolean).join(' · ');
  return `
  <div class="card">
    <div class="chips">${chips.map(([k, v]) =>
      `<div class="chip"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}</div>
    ${orphans ? `<p class="muted" style="font-size:12.5px">Scenarios outside the overlap are excluded: ${orphans}.</p>` : ''}
    ${crossModal ? `<div class="cmp-note"><b>跨模态提示：</b>text run 没有 responsiveness / voice consistency
      （记为 0 / null，且不计入它的 experience），voice run 则会被这两项拉低 —— 所以
      <b>Experience 和 Eval final 不能跨模态直接比较</b>。要比 text vs voice，看 Passed / Goal score /
      Resolution / Tool recall 这几行。</div>` : ''}
  </div>
  <div class="card table-card">
    <div class="card-head"><h3>Aggregates over the ${shared} shared scenarios</h3></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Metric</th><th>${esc(cmpShortName(a))}</th><th class="cmp-side">${esc(cmpShortName(b))}</th><th>Δ (B − A)</th></tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table></div>
    <div class="list-meta" style="border-bottom:none;border-top:1px solid var(--border-soft)">
      <span class="count">End reasons</span>
      <span class="hint" style="margin-left:0">${esc(cmpShortName(a))}: ${reasons(a)} &nbsp;|&nbsp; ${esc(cmpShortName(b))}: ${reasons(b)}</span>
    </div>
  </div>`;
}

function updateCmpRows() {
  const head = document.getElementById('cmpHead');
  if (!head || !CUR_CMP) return;
  const { a, b } = CUR_CMP;
  const rows = cmpState.diffOnly
    ? CUR_CMP.scenarios.filter(r => !!r.a.passed !== !!r.b.passed)
    : CUR_CMP.scenarios;
  head.innerHTML = `<tr>${sortableTh('id', 'Scenario', cmpState)}
    ${sortableTh('a_passed', 'Result', cmpState)}${sortableTh('a_goal', 'Goal', cmpState)}<th>End reason</th>${sortableTh('a_turns', 'Turns', cmpState)}${sortableTh('a_dur', 'Duration', cmpState)}
    ${sortableTh('b_passed', 'Result', cmpState, 'cmp-side')}${sortableTh('b_goal', 'Goal', cmpState)}<th>End reason</th>${sortableTh('b_turns', 'Turns', cmpState)}${sortableTh('b_dur', 'Duration', cmpState)}</tr>`;
  const link = (path, id, inner) => `<a href="#/scenario/${encodeURIComponent(path + '/' + id)}">${inner}</a>`;
  document.getElementById('cmpRows').innerHTML = sortRows(rows, cmpSorters, cmpState.sort, cmpState.dir).map(r => `
    <tr>
      <td class="mono">${esc(r.id)}</td>
      <td>${link(a.path, r.id, passBadge(r.a.passed))}</td>
      <td>${fmtScore(r.a.goal_score)}</td><td>${esc(r.a.end_reason ?? '—')}</td>
      <td>${r.a.turn_count ?? '—'}</td><td>${fmtDur(r.a.duration_ms)}</td>
      <td class="cmp-side">${link(b.path, r.id, passBadge(r.b.passed))}</td>
      <td>${fmtScore(r.b.goal_score)}</td><td>${esc(r.b.end_reason ?? '—')}</td>
      <td>${r.b.turn_count ?? '—'}</td><td>${fmtDur(r.b.duration_ms)}</td>
    </tr>`).join('');
  document.getElementById('cmpCount').textContent =
    `${rows.length} / ${CUR_CMP.scenarios.length} scenarios`;
}

async function renderCompare(params) {
  await loadRuns();
  let a = params.get('a') || '';
  let b = params.get('b') || '';
  if (!a && !b) [a, b] = defaultComparePair();
  else if (!a || !b) {
    const anchor = (RUNS || []).find(r => r.path === (a || b));
    const other = anchor ? defaultCounterpart(anchor)?.path || '' : '';
    if (a) b = other; else a = other;
  }
  $main.innerHTML = `
  <div class="crumbs"><a href="#">All runs</a> / Compare</div>
  <div class="card">
    <h2 style="margin-top:0">Compare two runs</h2>
    <p class="muted" style="font-size:12.5px;margin-top:-4px">
      Scenarios are aligned by id, so text and voice runs of the same task set line up row by row.</p>
    <div class="cmp-pickers">
      ${cmpPickerHTML('a', a)}
      <button class="icon-btn cmp-swap" id="cmpSwap" type="button" title="Swap A and B"
        aria-label="Swap A and B">${ICONS.swap}</button>
      ${cmpPickerHTML('b', b)}
    </div>
  </div>
  <div id="cmpBody"></div>`;
  initCmpPicker('a', a, b, path => cmpGoTo(path, b));
  initCmpPicker('b', b, a, path => cmpGoTo(a, path));
  document.getElementById('cmpSwap').addEventListener('click', () => cmpGoTo(b, a));

  const body = document.getElementById('cmpBody');
  if (!a || !b) { body.innerHTML = '<div class="card muted">Pick two runs above.</div>'; return; }
  if (a === b) { body.innerHTML = '<div class="card muted">Pick two <i>different</i> runs.</div>'; return; }
  body.innerHTML = SKELETON;
  let d;
  try {
    d = await getJSON(`/api/compare?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}`);
  } catch (e) {
    body.innerHTML = `<div class="card"><b>Error:</b> ${esc(e.message)}</div>`;
    return;
  }
  CUR_CMP = d;
  cmpState.sort = 'id';
  cmpState.dir = 1;
  setTopTitle(`${cmpShortName(d.a)} vs ${cmpShortName(d.b)}`);
  if (!d.scenarios.length) {
    body.innerHTML = `<div class="card">These two runs share no scenario ids
      (${esc(d.a.domains.join(', ') || '?')} vs ${esc(d.b.domains.join(', ') || '?')}), so there is nothing to align.</div>`;
    return;
  }
  body.innerHTML = cmpSummaryHTML(d) + `
  <div class="card table-card">
    <div class="list-meta">
      <span class="count" id="cmpCount"></span>
      <label class="hint" style="margin-left:auto;display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" id="cmpDiffOnly"${cmpState.diffOnly ? ' checked' : ''}> only where the two disagree</label>
    </div>
    <div class="table-wrap">
      <table id="cmpTable">
        <thead><tr><th></th><th colspan="5">${esc(cmpShortName(d.a))}</th><th colspan="5" class="cmp-side">${esc(cmpShortName(d.b))}</th></tr></thead>
        <thead id="cmpHead"></thead>
        <tbody id="cmpRows"></tbody>
      </table>
    </div>
  </div>`;
  document.getElementById('cmpDiffOnly').addEventListener('change', e => {
    cmpState.diffOnly = e.target.checked;
    updateCmpRows();
  });
  updateCmpRows();
}

/* ---------- transcript with tool calls merged chronologically ---------- */
function renderTimeline(conversation, toolLog) {
  if (!conversation && !toolLog?.length) return '<p class="muted">No conversation.json</p>';
  const t0 = (conversation || []).concat(toolLog || []).reduce(
    (m, x) => x.timestamp != null && x.timestamp < m ? x.timestamp : m, Infinity);
  const fmtT = ts => ts == null || t0 === Infinity ? '' : '+' + (ts - t0).toFixed(1) + 's';
  const items = [
    ...(conversation || []).map(t => ({ kind: 'turn', ts: t.timestamp, d: t })),
    ...(toolLog || []).map(c => ({ kind: 'tool', ts: c.timestamp, d: c })),
  ];
  // stable sort; items without a timestamp keep their original relative position at the end
  items.sort((a, b) => (a.ts ?? Infinity) - (b.ts ?? Infinity));
  return items.map(it => {
    if (it.kind === 'turn') {
      const t = it.d;
      return `
      <div class="turn ${t.speaker === 'user' ? 'user' : 'agent'}">
        <div><div class="who">${esc(t.speaker)} · turn ${t.turn_index ?? ''} <span class="ts">${fmtT(t.timestamp)}</span></div>
        <div class="bubble">${esc(t.text)}</div></div>
      </div>`;
    }
    const c = it.d;
    return `
    <div class="tool-call inline">
      <span class="ts">${fmtT(c.timestamp)}</span>
      🔧 <span class="name mono">${esc(c.tool_name)}</span>
      ${c.db_changed ? '<span class="badge pass" style="margin-left:8px">db changed</span>' : ''}
      ${c.result?.error ? `<span class="badge fail" style="margin-left:8px">error</span>` : ''}
      ${c.result?.error ? `<div class="err">${esc(c.result.error.message || JSON.stringify(c.result.error))}</div>` : ''}
      ${jsonPreview('args & result', {arguments: c.arguments, result: c.result})}
    </div>`;
  }).join('');
}

/* ---------- per-scenario scores ---------- */
/* talk-bench attaches `breach` to every guardrail scenario (one declaring
   prohibited_actions / prohibited_communicate / planted_secret); null means the
   scenario is not a guardrail test. Shape: {breached, label, channels, detail}.
   label: tool | disclosure (breached, channels say which detector fired),
   resisted (held), errored (verdict untrusted; detail.status says why). */
function breachBadge(b) {
  if (!b) return null;
  if (typeof b !== 'object') return {cls: 'fail', text: 'breach: ' + b};
  if (b.breached) {
    const via = b.channels?.length ? ' via ' + b.channels.join(', ') : '';
    return {cls: 'fail', text: `guardrail breached: ${b.label || 'breach'}${via}`};
  }
  if (b.label === 'errored')
    return {cls: 'na', text: 'guardrail not judged' + (b.detail?.status ? ': ' + b.detail.status : '')};
  return {cls: 'pass', text: 'guardrail resisted'};
}

function renderScores(summary, sess) {
  if (!summary && !sess) return '';
  const tc = sess?.task_completion || {};
  const tools = summary?.tool_metrics || {};
  const entries = [
    ['Goal score', summary?.goal_score],
    ...Object.entries(summary?.tau2_reward_breakdown || {}).map(([k, v]) => ['tau2 ' + k, v]),
    ['tau2 goal', summary?.tau2_goal_score],
    ['Native goal', summary?.native_goal_score],
    ['Reward', tc.reward],
    ['Action', tc.action_score],
    ['Communicate', tc.communicate_score],
    ['NL assertions', tc.nl_assertions_score],
    ['DB state', tc.db_state_score],
    ['State integrity', tc.state_integrity_score],
    ['Tool recall', tools.recall],
    ['Tool precision', tools.precision],
    ['Tool calls', tools.total_calls],
  ].filter(([, v]) => v !== null && v !== undefined);
  const flags = [];
  if (tc.prohibited_violated) flags.push('prohibited action violated');
  if (tc.prohibited_communicate_violated) flags.push('prohibited communicate violated');
  if (tc.judge_failed) flags.push('judge failed');
  if (summary?.tool_metrics?.prohibited_violations?.length)
    flags.push('prohibited tool calls: ' + summary.tool_metrics.prohibited_violations.join(', '));
  const breach = breachBadge(summary?.breach);
  return `
  <h3>Scores</h3>
  <div class="chips">${entries.map(([k, v]) =>
    `<div class="chip"><div class="k">${k}</div><div class="v">${typeof v === 'number' ? fmtScore(v) : esc(v)}</div></div>`).join('')}
  </div>
  ${flags.map(f => `<div><span class="badge fail" style="margin-top:6px">${esc(f)}</span></div>`).join('')}
  ${breach ? `<div><span class="badge ${breach.cls}" style="margin-top:6px">${esc(breach.text)}</span></div>` : ''}
  ${summary ? jsonPreview('Raw scenario result (results.json)', summary) : ''}
  ${sess ? jsonPreview('Raw session result (talk_bench_evaluation_result.json)', sess) : ''}`;
}

let upToastTimer;
const setUpStatus = t => {

async function postForm(url, fd) {
  const r = await fetch(url, { method: 'POST', body: fd });
  const res = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(res.detail || r.status); e.status = r.status; throw e; }
  return res;
}

// entries: [{rel: path inside the run dir, file}]
async function syncOneRun(runName, entries, progressPrefix) {
  const beginFd = ow => {
    const fd = new FormData();
    fd.append('run_name', runName); fd.append('overwrite', ow);
    return fd;
  };
  let uploadId;
  try {
    uploadId = (await postForm('/api/upload_dir_begin', beginFd(false))).upload_id;
  } catch (e) {
    if (e.status !== 409) throw e;
    if (!confirm(`Run "${runName}" already exists. Replace it?`)) return 'skipped';
    uploadId = (await postForm('/api/upload_dir_begin', beginFd(true))).upload_id;
  }
  try {
    // upload in batches: at most 40 files or ~200 MB per request
    let batch = [], batchBytes = 0, sent = 0;
    const flush = async () => {
      if (!batch.length) return;
      const fd = new FormData();
      fd.append('upload_id', uploadId);
      for (const e of batch) { fd.append('paths', e.rel); fd.append('files', e.file); }
      await postForm('/api/upload_dir_chunk', fd);
      sent += batch.length;
      setUpStatus(`${progressPrefix}"${runName}": ${sent}/${entries.length} files…`);
      batch = []; batchBytes = 0;
    };
    for (const e of entries) {
      if (batch.length >= 40 || batchBytes + e.file.size > 200e6) await flush();
      batch.push(e); batchBytes += e.file.size;
    }
    await flush();
    await postForm('/api/upload_dir_commit', (() => { const fd = new FormData(); fd.append('upload_id', uploadId); return fd; })());
    return 'synced';
  } catch (e) {
    const fd = new FormData(); fd.append('upload_id', uploadId);
    fetch('/api/upload_dir_abort', { method: 'POST', body: fd });
    throw e;
  }
}

// files: [{relpath (starting with the dropped folder name), file}]
// Detects whether the dropped folder is a single run or a folder of runs:
// a run has results.json / talk_bench_evaluation_result.json at its root,
// or scenario dirs (scenario.json / run_meta.json / conversation.json) one level down.
async function importRunFiles(files) {
  const RUN_ROOT_FILES = ['results.json', 'talk_bench_evaluation_result.json'];
  const SCEN_FILES = ['scenario.json', 'run_meta.json', 'conversation.json'];
  const inner = files.map(f => ({ parts: f.relpath.split('/').slice(1), file: f.file }));
  const isSingleRun = inner.some(({ parts }) =>
    (parts.length === 1 && RUN_ROOT_FILES.includes(parts[0])) ||
    (parts.length === 2 && SCEN_FILES.includes(parts[1])));

  let runGroups; // Map<runName, entries>
  if (isSingleRun) {
    const runName = files[0].relpath.split('/')[0];
    runGroups = new Map([[runName, inner.map(({ parts, file }) => ({ rel: parts.join('/'), file }))]]);
  } else {
    runGroups = new Map();
    for (const { parts, file } of inner) {
      if (parts.length < 2) continue; // loose files at the container root (.DS_Store etc.)
      const run = parts[0];
      if (!runGroups.has(run)) runGroups.set(run, []);
      runGroups.get(run).push({ rel: parts.slice(1).join('/'), file });
    }
    if (!runGroups.size) { setUpStatus('no run folders found in the drop'); return; }
  }

  const names = [...runGroups.keys()], done = [], skipped = [];
  for (let i = 0; i < names.length; i++) {
    const prefix = names.length > 1 ? `run ${i + 1}/${names.length} ` : 'syncing ';
    const outcome = await syncOneRun(names[i], runGroups.get(names[i]), prefix);
    (outcome === 'synced' ? done : skipped).push(names[i]);
  }
  setUpStatus(`synced ${done.length} run${done.length === 1 ? '' : 's'}`
    + (skipped.length ? ` · skipped: ${skipped.join(', ')}` : ''));
  if (done.length) { invalidateRuns(); setTimeout(() => { if (!location.hash.startsWith('#/')) renderList(); }, 1200); }
}

// recursively read a dropped FileSystemEntry into [{relpath, file}]
async function collectEntry(entry) {
  if (entry.isFile) {
    const file = await new Promise((res, rej) => entry.file(res, rej));
    return [{ relpath: entry.fullPath.replace(/^\//, ''), file }];
  }
  if (entry.isDirectory) {
    const reader = entry.createReader();
    const out = [];
    for (;;) {  // readEntries returns results in batches until an empty batch
      const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      if (!batch.length) break;
      for (const child of batch) out.push(...await collectEntry(child));
    }
    return out;
  }
  return [];
}

document.addEventListener('dragover', e => {
  if (!location.hash.startsWith('#/')) e.preventDefault();
});
document.addEventListener('drop', async e => {
  if (location.hash.startsWith('#/')) return;
  e.preventDefault();
  const dirs = [...e.dataTransfer.items].map(item => item.webkitGetAsEntry?.()).filter(entry => entry?.isDirectory);
  if (!dirs.length) { setUpStatus('drop a run folder'); return; }
  try {
    for (const dir of dirs) {
      setUpStatus(`reading "${dir.name}"…`);
      await importRunFiles(await collectEntry(dir));
    }
  } catch (err) {
    setUpStatus('error: ' + err.message);
  }
});

/* ---------- mermaid diagrams (loaded from CDN only when a diagram appears) ---------- */
let _mermaidPromise = null;
function loadMermaid() {
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (!_mermaidPromise) {
    _mermaidPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js';
      s.onload = () => resolve(window.mermaid);
      s.onerror = () => { _mermaidPromise = null; s.remove(); reject(new Error('无法加载 mermaid（离线或 CDN 被拦截）')); };
      document.head.appendChild(s);
    });
  }
  return _mermaidPromise;
}

// Replace ```mermaid code blocks inside root with rendered SVG diagrams.
// On load/parse failure the source block stays visible with a note, never throws.
let _mermaidSeq = 0;
async function renderMermaidIn(root) {
  const blocks = [...root.querySelectorAll('pre > code.language-mermaid')]
    .filter(code => !code.dataset.mermaidDone);
  if (!blocks.length) return;
  blocks.forEach(code => { code.dataset.mermaidDone = '1'; });
  const note = (pre, text) => {
    const el = document.createElement('div');
    el.className = 'muted';
    el.style.cssText = 'font-size:12px;margin:8px 0 -4px';
    el.textContent = '⚠ ' + text;
    pre.before(el);
  };
  let mermaid;
  try {
    mermaid = await loadMermaid();
  } catch (e) {
    blocks.forEach(code => note(code.parentElement, e.message + '，以下为流程图源码'));
    return;
  }
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: 'strict',
    theme: document.documentElement.dataset.theme === 'dark' ? 'dark' : 'neutral',
    fontFamily: 'inherit',
  });
  for (const code of blocks) {
    const pre = code.parentElement;
    if (!pre.isConnected) continue;  // a re-render replaced this DOM while we awaited
    const id = 'mmd' + (++_mermaidSeq);
    try {
      const { svg } = await mermaid.render(id, code.textContent);
      const wrap = document.createElement('div');
      wrap.className = 'mermaid-diagram';
      wrap.innerHTML = svg;
      pre.replaceWith(wrap);
    } catch (err) {
      document.getElementById('d' + id)?.remove();  // mermaid may leave its temp node behind
      note(pre, '流程图渲染失败（mermaid 语法错误），以下为源码');
    }
  }
}

const REPORTS = {};  // markdown per run/scenario path, kept for the session

function initReport(path, endpoint = '/api/scenario_report', eta = '生成中…（约 10–60 秒）') {
  const btn = document.getElementById('reportBtn');
  const body = document.getElementById('reportBody');
  const status = document.getElementById('reportStatus');
  if (!btn) return;

    body.hidden = false;
    body.innerHTML = renderMarkdown(md);
    renderMermaidIn(body);
    btn.textContent = '重新生成';
  };
  if (REPORTS[path]) show(REPORTS[path]);
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    status.textContent = eta;
    try {
      const r = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path }),
      });
      const res = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(res.detail || r.status);
      REPORTS[path] = res.report;
      status.textContent = `由 ${displayModelName(LLM_MODEL)} 生成`;
      show(res.report);
    } catch (e) {
      status.textContent = '⚠ ' + e.message;
    }
    btn.disabled = false;
  });
}

/* ---------- AI chat (per-scenario and per-run) ---------- */
const CHATS = {};  // message history per run/scenario path, kept for the session

function initChat(path) {
  const log = document.getElementById('chatLog');
  const input = document.getElementById('chatText');
  const btn = document.getElementById('chatSend');
  const history = CHATS[path] ||= [];

  const draw = (thinking = false) => {
    const model = esc(displayModelName(LLM_MODEL));
    log.innerHTML = history.map(m => `
      <div class="chat-msg ${m.role}">
        <div class="who">${m.role === 'user' ? 'You' : model}</div>
        <div class="bubble ${m.role === 'assistant' ? 'markdown-body' : ''}">${m.role === 'assistant' ? renderMarkdown(m.content) : esc(m.content)}</div>
      </div>`).join('')
      + (thinking ? `<div class="chat-msg assistant"><div class="who">${model}</div><div class="bubble muted">thinking…</div></div>` : '');
    log.scrollTop = log.scrollHeight;
    log.style.display = history.length || thinking ? 'block' : 'none';
    renderMermaidIn(log);
  };
  draw();

  const send = async () => {
    const text = input.value.trim();
    if (!text || btn.disabled) return;
    input.value = '';
    history.push({ role: 'user', content: text });
    btn.disabled = true;
    draw(true);
    try {
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path, messages: history }),
      });
      const res = await r.json();
      if (!r.ok) throw new Error(res.detail || r.status);
      history.push({ role: 'assistant', content: res.reply });
    } catch (e) {
      history.push({ role: 'assistant', content: '⚠ ' + e.message });
    }
    btn.disabled = false;
    draw();
    input.focus();
  };
  btn.addEventListener('click', send);
  let isComposing = false;
  input.addEventListener('compositionstart', () => { isComposing = true; });
  input.addEventListener('compositionend', () => { isComposing = false; });
  input.addEventListener('keydown', e => {
    // Enter confirms an IME candidate while composing Chinese, Japanese, etc.
    // Some browsers report keyCode 229 instead of setting isComposing.
    if (isComposing || e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter') send();
  });
}

  const pref = themePref();
  const dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';

}

  const order = ['system', 'light', 'dark'];
  const next = order[(order.indexOf(themePref()) + 1) % order.length];
  try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* private mode: theme lasts for this page */ }
  applyTheme();
});

  if (star) { toggleStar(star.dataset.path, refreshRunMarks); return; }
  const eye = e.target.closest('.eyecell');
  if (eye) { toggleHidden(eye.dataset.path, refreshRunMarks); return; }
  const copyBtn = e.target.closest('.copy-run-name');
  if (copyBtn) { handleCopyClick(copyBtn); return; }
  const th = e.target.closest('th[data-sort]');
  if (th) {
    const table = th.closest('table')?.id;
    const [state, redraw] = table === 'scenTable' ? [scenState, updateScenRows]
      : table === 'cmpTable' ? [cmpState, updateCmpRows]
      : [listState, updateRunRows];
    const key = th.dataset.sort;
    if (state.sort === key) state.dir = -state.dir;
    else { state.sort = key; state.dir = key === 'timestamp' ? -1 : 1; }
    redraw();
    return;
  }
  if (e.target.closest('a, button, select, textarea, input, audio, summary, .note-cell')) return;
  const row = e.target.closest('tr.rowlink');
  if (row?.dataset.href) location.hash = row.dataset.href;
});

$main.addEventListener('keydown', e => {
  const input = e.target.closest('.run-note-input');
  if (!input) return;
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); input.blur(); }
  if (e.key === 'Escape') {
    input.value = NOTES[input.dataset.path] || '';
    input.blur();
  }
});
$main.addEventListener('focusout', async e => {
  const input = e.target.closest('.run-note-input');
  if (!input) return;
  const path = input.dataset.path;
  if (input.value.trim() === (NOTES[path] || '')) return;
  input.classList.remove('save-error');
  input.classList.add('saving');
  input.disabled = true;  // typing during a slow save would be overwritten by the response
  try {
    input.value = await saveRunNote(path, input.value);
    input.title = 'Ctrl/⌘ + Enter or click elsewhere to save';
  } catch (err) {
    input.value = NOTES[path] || '';
    input.classList.add('save-error');
    input.title = 'Save failed: ' + err.message;
  } finally {
    input.disabled = false;
    input.classList.remove('saving');
  }
});

const apiDetail = res => typeof res.detail === 'string' ? res.detail : JSON.stringify(res.detail);

async function postJSON(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body ?? {}) });
  const res = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(apiDetail(res) || String(r.status));
  return res;
}

const currentProject = () => testState.options?.project || null;

/* agent.yaml editor: the text talk-bench gets, validated by the server as it is typed */
function fillAgentYaml(text, presetId = null) {
  const el = document.getElementById('agentYaml');
  if (!el) return;
  el.value = text || '';
  testState.preset = presetId;
  parseAgentYamlNow();
}

// server-side validation of the editor text (the checks talk-bench's AgentConfig makes)
async function parseAgentYamlNow() {
  const el = document.getElementById('agentYaml'), info = document.getElementById('agentInfo');
  if (!el || !info) return;
  const text = el.value;
  const settle = (parsed, cls, html, project = null) => {
    if (document.getElementById('agentYaml')?.value !== text) return;  // edited meanwhile
    testState.parsed = parsed;
    testState.project = project;
    info.className = cls;
    info.innerHTML = html;
    el.closest('.field').classList.toggle('invalid', cls === 'err');
    updateAgentNotices();
  };
  if (!text.trim()) { settle(null, 'help', 'Pick a preset, import a file, or paste an agent YAML here.'); return; }
  try {
    const r = await postJSON('/api/test/parse_config', { text });
    const mod = moduleModality(r.agent.module), extra = Object.keys(r.extra_blocks || {});
    settle(r.agent, 'help', `Agent <b>${esc(r.agent.name)}</b> · <span class="mono">${esc(r.agent.module)}</span>`
      + (mod ? ` · ${mod} agent` : '') + (r.agent.mcp ? ' · tools via MCP' : '')
      + (extra.length ? ` · also sets ${esc(extra.join(', '))}` : '')
      + (r.project ? ` · runs in <b>${esc(r.project.name)}</b>` : ''), r.project || null);
  } catch (e) {
    settle(null, 'err', esc(e.message));
  }
}
const parseAgentYaml = debounce(parseAgentYamlNow, 350);

// "<like this>" values a preset left for the user to fill in (params and mcp, any depth)
function placeholderPaths(a) {
  const out = [];
  const walk = (v, path) => {
    if (typeof v === 'string') { if (/<[^<>]+>/.test(v)) out.push(path); }
    else if (v && typeof v === 'object') Object.entries(v).forEach(([k, x]) => walk(x, `${path}.${k}`));
  };
  if (a) { walk(a.params, 'params'); walk(a.mcp, 'mcp'); }
  return out;
}

function updateAgentNotices() {
  const box = document.getElementById('agentNotices');
  if (!box) return;
  const a = testState.parsed, p = testProject(), dflt = currentProject();
  const help = document.getElementById('checkoutHelp');
  if (help) help.innerHTML = checkoutHelpHTML(p);
  const notes = [];  // [extra class, html]
  const holes = placeholderPaths(a);
  if (holes.length) {
    notes.push(['warn', `Placeholders still to fill in: <code>${holes.map(esc).join('</code>, <code>')}</code> — a left-over placeholder is sent as-is and overrides the matching value from <code>.env</code>.`]);
  }
  const pkg = a?.module ? a.module.split('.')[0] : '';
  if (pkg && p && !(p.packages || []).includes(pkg)) {
    notes.push(['warn', `No local checkout's workspace provides the <b>${esc(pkg)}</b> package, so the test runs in <b>${esc(p.name)}</b> and fails at import unless that package is installed in <span class="mono">${esc(p.id)}/.venv</span>.`]);
  } else if (pkg && p && dflt && p.id !== dflt.id) {
    notes.push(['', `<b>${esc(pkg)}</b> is provided by the <b>${esc(p.name)}</b> workspace, so this test runs in <span class="mono">${esc(p.id)}</span> and that checkout's <code>talkbench.yaml</code> applies.`]);
  }
  if (a?.mcp?.server_url) {
    notes.push(['warn', `This agent reaches its tools through an MCP server at <code>${esc(a.mcp.server_url)}</code>. Start it before the test — for Talkdesk, from <code>talk-bench-talkdesk/</code>: <code>uv run talkdesk-mcp-server --source &lt;source&gt; --domain &lt;domain&gt; --ngrok</code> — with the <b>same source and domain</b> as this run, and make sure the platform can reach that URL.`]);
  }
  box.innerHTML = notes.map(([cls, n]) => `<div class="notice${cls ? ' ' + cls : ''}">${n}</div>`).join('');
}
