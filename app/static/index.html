<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>talk-bench runs viewer</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --border: #e2e5ea; --text: #1c2330;
    --muted: #6b7480; --accent: #2563eb; --pass: #15803d; --fail: #b91c1c;
    --pass-bg: #ecfdf3; --fail-bg: #fef2f2; --chip-bg: #eef2f7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif; background: var(--bg); color: var(--text); }
  header { background: #101828; color: #fff; padding: 14px 24px; display: flex; align-items: baseline; gap: 14px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; cursor: pointer; }
  header .sub { color: #98a2b3; font-size: 12.5px; }
  main { max-width: 1240px; margin: 0 auto; padding: 20px 24px 60px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .toolbar input, .toolbar select { padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px; background: #fff; color: var(--text); }
  .toolbar input { min-width: 260px; }
  .toolbar .count { color: var(--muted); font-size: 12.5px; margin-left: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid #eef0f3; vertical-align: top; }
  tr.rowlink { cursor: pointer; }
  tr.rowlink:hover { background: #f1f5fd; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
  .muted { color: var(--muted); }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.pass { background: var(--pass-bg); color: var(--pass); }
  .badge.fail { background: var(--fail-bg); color: var(--fail); }
  .badge.na   { background: var(--chip-bg); color: var(--muted); }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0 4px; }
  .chip { background: var(--chip-bg); border-radius: 8px; padding: 8px 14px; min-width: 96px; }
  .chip .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .chip .v { font-size: 17px; font-weight: 650; margin-top: 1px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .crumbs { font-size: 13px; margin-bottom: 12px; color: var(--muted); }
  h2 { font-size: 16px; margin: 4px 0 10px; }
  h3 { font-size: 14px; margin: 18px 0 8px; }
  details > summary { cursor: pointer; color: var(--accent); font-size: 13px; user-select: none; }
  pre { background: #f6f7f9; color: var(--text); border: 1px solid var(--border); padding: 12px; border-radius: 8px; overflow: auto; font-size: 12px; max-height: 480px; }
  .json-preview-toolbar { display: flex; justify-content: flex-end; margin: 8px 0 -4px; }
  .json-preview pre { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
  .json-preview.no-wrap pre { white-space: pre; overflow-wrap: normal; word-break: normal; }
  .bubble { padding: 9px 13px; border-radius: 12px; margin: 6px 0; white-space: pre-wrap; }
  .turn { display: flex; }
  .turn > div { max-width: 72%; display: flex; flex-direction: column; align-items: flex-start; }
  .turn.user { justify-content: flex-end; }
  .turn.user > div { align-items: flex-end; }
  .turn.user .bubble { background: #dbeafe; border-bottom-right-radius: 4px; }
  .turn.agent .bubble { background: #f1f3f6; border-bottom-left-radius: 4px; }
  .turn .who { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  audio { width: 100%; margin: 4px 0 10px; }
  .audio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px 18px; }
  .tool-call { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  .tool-call.inline { border-style: dashed; background: #fbfcfe; margin: 10px 40px; font-size: 13px; }
  .ts { color: var(--muted); font-size: 11px; font-family: ui-monospace, Menlo, monospace; margin-right: 6px; }
  .scen-nav { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .scen-nav select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 8px; background: #fff; font-size: 12.5px; max-width: 220px; }
  .navbtn { display: inline-block; padding: 5px 11px; border: 1px solid var(--border); border-radius: 8px; background: #fff; font-size: 12.5px; white-space: nowrap; }
  .navbtn:hover { background: #f1f5fd; text-decoration: none; }
  .navbtn.disabled { color: #c3c9d2; pointer-events: none; }
  button.navbtn { cursor: pointer; font-family: inherit; color: var(--text); }
  button.navbtn.active { background: #fef3c7; border-color: #f59e0b; }
  .star { color: #c3c9d2; font-size: 16px; }
  .star.on { color: #f59e0b; }
  .starcell { cursor: pointer; user-select: none; }
  .starcell:hover .star { color: #f59e0b; }
  .note-cell { min-width: 120px; width: 14%; }
  .run-note-input, .run-note-detail textarea { width: 100%; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--text); font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; }
  .run-note-input { display: block; min-width: 100px; min-height: 44px; padding: 5px 7px; resize: vertical; }
  .run-note-input:hover { border-color: var(--border); background: #fff; }
  .run-note-input:focus, .run-note-detail textarea:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 2px #dbeafe; }
  .run-note-input.saving { color: var(--muted); }
  .run-note-input.save-error { border-color: var(--fail); background: var(--fail-bg); }
  .run-note-text { display: block; white-space: pre-wrap; overflow-wrap: anywhere; color: #475467; }
  .run-note-text.empty { color: #a0a7b1; padding: 0; text-align: left; }
  .run-note-detail { margin-top: 12px; max-width: 720px; }
  .run-note-detail label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .run-note-detail textarea { display: block; min-height: 64px; resize: vertical; padding: 8px 10px; border-color: var(--border); }
  .note-actions { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
  .copy-run-name { appearance: none; border: 0; padding: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: copy; overflow-wrap: anywhere; }
  .copy-run-name:hover { color: var(--accent); }
  .copy-run-name:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  .copy-icon { margin-left: 5px; color: var(--muted); font-size: 11px; }
  .copy-feedback { margin-left: 5px; color: var(--pass); font-family: -apple-system, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif; font-size: 11px; font-weight: 600; }
  .copy-run-name.copy-error .copy-feedback { color: var(--fail); }
  .subscore { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
  .subscore .ok { color: var(--pass); }
  .subscore .bad { color: var(--fail); }
  .upload-panel { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border: 1px dashed var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; background: #fbfcfe; }
  .upload-panel select { padding: 6px 9px; border: 1px solid var(--border); border-radius: 8px; background: #fff; font-size: 13px; }
  .chat-log { display: none; max-height: 560px; overflow-y: auto; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 10px; padding: 14px; background: #f8fafc; }
  .chat-msg { margin: 14px 0; }
  .chat-msg:first-child { margin-top: 2px; }
  .chat-msg:last-child { margin-bottom: 2px; }
  .chat-msg .who { font-size: 11px; font-weight: 650; color: var(--muted); margin: 0 4px 4px; letter-spacing: .02em; }
  .chat-msg .bubble { margin: 0; overflow-wrap: anywhere; }
  .chat-msg.user .who { text-align: right; }
  .chat-msg.user .bubble { width: fit-content; max-width: 82%; margin-left: auto; padding: 9px 13px; white-space: pre-wrap; background: #dbeafe; border: 1px solid #bfdbfe; }
  .chat-msg.assistant .bubble { padding: 13px 16px; background: #fff; border: 1px solid #e2e8f0; border-left: 3px solid #60a5fa; border-radius: 4px 10px 10px 4px; box-shadow: 0 1px 2px rgba(16, 24, 40, .04); }
  .markdown-body { line-height: 1.65; white-space: normal; }
  .markdown-body > :first-child { margin-top: 0; }
  .markdown-body > :last-child { margin-bottom: 0; }
  .markdown-body p { margin: 8px 0; }
  .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 { margin: 16px 0 6px; color: #172033; line-height: 1.35; }
  .markdown-body h3 { font-size: 15px; }
  .markdown-body h4 { font-size: 14px; }
  .markdown-body h5, .markdown-body h6 { font-size: 13.5px; }
  .markdown-body ul, .markdown-body ol { margin: 7px 0; padding-left: 24px; }
  .markdown-body li { margin: 4px 0; padding-left: 2px; }
  .markdown-body li::marker { color: #64748b; font-weight: 650; }
  .markdown-body strong { color: #172033; font-weight: 700; }
  .markdown-body code { padding: 2px 5px; border-radius: 5px; background: #eef2f7; color: #9f1239; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
  .markdown-body pre { margin: 10px 0; padding: 11px 13px; max-height: 360px; border-color: #263244; background: #172033; color: #e5edf7; white-space: pre; }
  .markdown-body pre code { padding: 0; background: transparent; color: inherit; font-size: 12px; }
  .markdown-body blockquote { margin: 10px 0; padding: 8px 12px; border-left: 3px solid #94a3b8; background: #f8fafc; color: #526071; }
  .markdown-body hr { border: 0; border-top: 1px solid #e2e8f0; margin: 14px 0; }
  .markdown-body a { overflow-wrap: anywhere; }
  .markdown-table-wrap { max-width: 100%; margin: 10px 0; overflow-x: auto; }
  .markdown-body table { width: auto; min-width: 55%; font-size: 12.5px; }
  .markdown-body th { padding: 6px 9px; background: #f1f5f9; text-transform: none; letter-spacing: 0; }
  .markdown-body td { padding: 6px 9px; border: 1px solid #e2e8f0; }
  .chat-input { display: flex; gap: 8px; }
  .chat-input input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px; }
  .chat-input button:disabled { color: #c3c9d2; pointer-events: none; }
  .tool-call .name { font-weight: 650; }
  .tool-call .err { color: var(--fail); font-size: 12.5px; }
  .filelist { columns: 2; font-size: 12.5px; }
  .filelist div { break-inside: avoid; padding: 2px 0; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .detail-heading { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .detail-heading h2 { margin-right: auto; }
  .share-badge { display: inline-block; border: 1px solid #475467; border-radius: 999px; padding: 2px 8px; color: #d0d5dd; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1 onclick="location.hash=''">🎧 talk-bench runs viewer</h1>
  <span class="sub" id="headerSub"></span>
</header>
<main id="main"><div class="empty">Loading…</div></main>

<script>
const $main = document.getElementById('main');
let RUNS = null;
let STARS = new Set();
let NOTES = {};
let CONFIG = {
  read_only: false,
  chat_enabled: true,
  sync_enabled: true,
  llm_model: sessionStorage.getItem('viewer_llm_model') || '',
};
let configLoaded = false;

async function loadConfig() {
  if (!configLoaded) {
    CONFIG = { ...CONFIG, ...await getJSON('/api/config') };
    if (CONFIG.llm_model) sessionStorage.setItem('viewer_llm_model', CONFIG.llm_model);
    configLoaded = true;
  }
  return CONFIG;
}

const dataHref = path => '/data/' + path.split('/').map(encodeURIComponent).join('/');

async function toggleStar(path, rerender) {
  if (CONFIG.read_only) return;
  const starred = !STARS.has(path);
  starred ? STARS.add(path) : STARS.delete(path);
  rerender();
  const fd = new FormData();
  fd.append('path', path);
  fd.append('starred', starred);
  try {
    const r = await fetch('/api/star', { method: 'POST', body: fd });
    if (!r.ok) throw new Error(r.status);
  } catch (e) {
    starred ? STARS.delete(path) : STARS.add(path);  // roll back on failure
    rerender();
  }
}
const starIcon = path => `<span class="star ${STARS.has(path) ? 'on' : ''}">${STARS.has(path) ? '★' : '☆'}</span>`;

async function saveRunNote(path, value) {
  if (CONFIG.read_only) return NOTES[path] || '';
  const note = value.trim();
  const previous = NOTES[path] || '';
  if (note === previous) return note;
  note ? NOTES[path] = note : delete NOTES[path];
  const fd = new FormData();
  fd.append('path', path);
  fd.append('note', note);
  try {
    const r = await fetch('/api/note', { method: 'POST', body: fd });
    const res = await r.json();
    if (!r.ok) throw new Error(res.detail || r.status);
    return res.note;
  } catch (e) {
    previous ? NOTES[path] = previous : delete NOTES[path];
    throw e;
  }
}

const noteText = path => NOTES[path]
  ? `<span class="run-note-text">${esc(NOTES[path])}</span>`
  : '<span class="run-note-text empty">—</span>';

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const displayModelName = model => {
  const name = String(model || '').split('/').filter(Boolean).pop() || '';
  return name.replace(/^gpt(?=$|[-_.])/i, 'GPT');
};

function renderMarkdownInline(value) {
  return String(value ?? '').split(/(`[^`\n]*`)/g).map(part => {
    if (part.startsWith('`') && part.endsWith('`')) {
      return `<code>${esc(part.slice(1, -1))}</code>`;
    }
    return esc(part)
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
      .replace(/__([^_\n]+)__/g, '<strong>$1</strong>')
      .replace(/~~([^~\n]+)~~/g, '<s>$1</s>')
      .replace(/(^|[\s(])\*([^*\n]+)\*(?=$|[\s).,!?:;，。！？：；])/g, '$1<em>$2</em>')
      .replace(/\[([^\]\n]+)\]\(((?:https?:\/\/|mailto:)[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }).join('');
}

function renderMarkdown(value) {
  const lines = String(value ?? '').replace(/\r\n?/g, '\n').split('\n');
  const html = [];
  let paragraph = [];
  let listType = null;
  let listStart = null;
  let listItems = [];
  let quote = [];
  let code = null;
  let codeLanguage = '';

  const flushParagraph = () => {
    if (paragraph.length) html.push(`<p>${paragraph.map(renderMarkdownInline).join('<br>')}</p>`);
    paragraph = [];
  };
  const flushList = () => {
    if (listType) {
      const start = listType === 'ol' && listStart !== 1 ? ` start="${listStart}"` : '';
      html.push(`<${listType}${start}>${listItems.join('')}</${listType}>`);
    }
    listType = null;
    listStart = null;
    listItems = [];
  };
  const flushQuote = () => {
    if (quote.length) html.push(`<blockquote>${quote.map(renderMarkdownInline).join('<br>')}</blockquote>`);
    quote = [];
  };
  const flushBlocks = () => {
    flushParagraph();
    flushList();
    flushQuote();
  };
  const tableCells = line => line.trim().replace(/^\||\|$/g, '').split('|').map(cell => cell.trim());

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    if (code !== null) {
      if (/^\s*```\s*$/.test(line)) {
        const language = codeLanguage ? ` class="language-${esc(codeLanguage)}"` : '';
        html.push(`<pre><code${language}>${esc(code.join('\n'))}</code></pre>`);
        code = null;
        codeLanguage = '';
      } else {
        code.push(line);
      }
      continue;
    }

    const fence = line.match(/^\s*```([\w.+-]*)\s*$/);
    if (fence) {
      flushBlocks();
      code = [];
      codeLanguage = fence[1];
      continue;
    }

    if (!line.trim()) {
      flushBlocks();
      continue;
    }

    if (line.includes('|') && i + 1 < lines.length) {
      const separator = tableCells(lines[i + 1]);
      if (separator.length > 1 && separator.every(cell => /^:?-{3,}:?$/.test(cell))) {
        flushBlocks();
        const headers = tableCells(line);
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim() && lines[i].includes('|')) {
          rows.push(tableCells(lines[i]));
          i++;
        }
        i--;
        html.push(`<div class="markdown-table-wrap"><table><thead><tr>${headers.map(cell => `<th>${renderMarkdownInline(cell)}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${headers.map((_, index) => `<td>${renderMarkdownInline(row[index] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
        continue;
      }
    }

    const heading = line.match(/^(#{1,4})\s+(.+)$/);
    if (heading) {
      flushBlocks();
      const level = Math.min(6, heading[1].length + 2);
      html.push(`<h${level}>${renderMarkdownInline(heading[2])}</h${level}>`);
      continue;
    }

    if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
      flushBlocks();
      html.push('<hr>');
      continue;
    }

    const list = line.match(/^\s*(?:([-+*])|(\d+)[.)])\s+(.+)$/);
    if (list) {
      flushParagraph();
      flushQuote();
      const nextType = list[2] ? 'ol' : 'ul';
      if (listType && listType !== nextType) flushList();
      if (!listType) {
        listType = nextType;
        listStart = nextType === 'ol' ? Number(list[2]) : null;
      }
      const item = list[3].replace(/^\[([ xX])\]\s+/, (_, checked) => checked === ' ' ? '☐ ' : '☑ ');
      listItems.push(`<li>${renderMarkdownInline(item)}</li>`);
      continue;
    }

    const blockquote = line.match(/^\s*>\s?(.*)$/);
    if (blockquote) {
      flushParagraph();
      flushList();
      quote.push(blockquote[1]);
      continue;
    }

    flushList();
    flushQuote();
    paragraph.push(line.trim());
  }

  if (code !== null) html.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);
  flushBlocks();
  return html.join('');
}

const fmtScore = v => (v === null || v === undefined) ? '<span class="muted">—</span>' : Number(v).toFixed(v >= 1 || v === 0 ? 2 : 3).replace(/\.?0+$/,'') || '0';
const fmtDur = ms => ms == null ? '—' : (ms/1000 < 90 ? (ms/1000).toFixed(1)+'s' : (ms/60000).toFixed(1)+'min');
const passBadge = p => p === true ? '<span class="badge pass">PASS</span>' : p === false ? '<span class="badge fail">FAIL</span>' : '<span class="badge na">—</span>';

const jsonPreview = (label, value) => `
  <details class="json-preview">
    <summary>${esc(label)}</summary>
    <div class="json-preview-toolbar">
      <button class="navbtn json-wrap-toggle" type="button" aria-pressed="true">Auto wrap: On</button>
    </div>
    <pre>${esc(JSON.stringify(value, null, 2))}</pre>
  </details>`;

$main.addEventListener('click', event => {
  const button = event.target.closest('.json-wrap-toggle');
  if (!button) return;
  const preview = button.closest('.json-preview');
  const wrapped = preview.classList.toggle('no-wrap') === false;
  button.setAttribute('aria-pressed', String(wrapped));
  button.textContent = `Auto wrap: ${wrapped ? 'On' : 'Off'}`;
});

async function copyText(text) {
  if (navigator.clipboard?.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      return;
    } catch (_) {
      // Fall through for browsers that block the Clipboard API.
    }
  }
  const input = document.createElement('textarea');
  input.value = text;
  input.style.position = 'fixed';
  input.style.opacity = '0';
  document.body.appendChild(input);
  input.focus();
  input.select();
  const copied = document.execCommand('copy');
  input.remove();
  if (!copied) throw new Error('copy failed');
}

function initRunNameCopy() {
  $main.querySelectorAll('.copy-run-name').forEach(button => {
    button.addEventListener('click', async ev => {
      ev.stopPropagation();
      const feedback = button.querySelector('.copy-feedback');
      clearTimeout(button._copyTimer);
      button.classList.remove('copy-error');
      try {
        await copyText(button.dataset.runName);
        feedback.textContent = 'Copied';
      } catch (_) {
        button.classList.add('copy-error');
        feedback.textContent = 'Copy failed';
      }
      button._copyTimer = setTimeout(() => {
        feedback.textContent = '';
        button.classList.remove('copy-error');
      }, 1600);
    });
  });
}

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ' → ' + r.status);
  return r.json();
}

async function loadRuns() {
  if (!RUNS) {
    const d = await getJSON('/api/runs');
    RUNS = d.runs;
    STARS = new Set(d.stars || []);
    NOTES = d.notes || {};
  }
  return RUNS;
}

/* ---------- run list ---------- */
const listState = { q: '', agent_name: '', starredOnly: false };

// collapse agent variants into families for the filter dropdown
function agentGroup(name) {
  if (!name) return name;
  if (name.startsWith('talkdesk-autopilot')) return 'talkdesk-autopilot*';
  if (name.startsWith('elevenlabs')) return 'elevenlabs*';
  return name;
}

async function renderList() {
  const searchHadFocus = document.activeElement?.id === 'q';
  const scrollY = window.scrollY;
  const runs = await loadRuns();
  document.getElementById('headerSub').innerHTML = runs.length + ' runs archived'

/* ---------- transcript with tool calls merged chronologically ---------- */
function renderTimeline(conversation, toolLog) {
  if (!conversation && !toolLog?.length) return '<p class="muted">No conversation.json</p>';
  const t0 = (conversation || []).concat(toolLog || []).reduce(
    (m, x) => x.timestamp != null && x.timestamp < m ? x.timestamp : m, Infinity);
  const fmtT = ts => ts == null || t0 === Infinity ? '' : '+' + (ts - t0).toFixed(1) + 's';
  const items = [
    ...(conversation || []).map(t => ({ kind: 'turn', ts: t.timestamp, d: t })),
    ...(toolLog || []).map(c => ({ kind: 'tool', ts: c.timestamp, d: c })),
  ];
  // stable sort; items without a timestamp keep their original relative position at the end
  items.sort((a, b) => (a.ts ?? Infinity) - (b.ts ?? Infinity));
  return items.map(it => {
    if (it.kind === 'turn') {
      const t = it.d;
      return `
      <div class="turn ${t.speaker === 'user' ? 'user' : 'agent'}">
        <div><div class="who">${esc(t.speaker)} · turn ${t.turn_index ?? ''} <span class="ts">${fmtT(t.timestamp)}</span></div>
        <div class="bubble">${esc(t.text)}</div></div>
      </div>`;
    }
    const c = it.d;
    return `
    <div class="tool-call inline">
      <span class="ts">${fmtT(c.timestamp)}</span>
      🔧 <span class="name mono">${esc(c.tool_name)}</span>
      ${c.db_changed ? '<span class="badge pass" style="margin-left:8px">db changed</span>' : ''}
      ${c.result?.error ? `<span class="badge fail" style="margin-left:8px">error</span>` : ''}
      ${c.result?.error ? `<div class="err">${esc(c.result.error.message || JSON.stringify(c.result.error))}</div>` : ''}
      ${jsonPreview('args & result', {arguments: c.arguments, result: c.result})}
    </div>`;
  }).join('');
}

/* ---------- per-scenario scores ---------- */
function renderScores(summary, sess) {
  if (!summary && !sess) return '';
  const tc = sess?.task_completion || {};
  const tools = summary?.tool_metrics || {};
  const entries = [
    ['Goal score', summary?.goal_score],
    ...Object.entries(summary?.tau2_reward_breakdown || {}).map(([k, v]) => ['tau2 ' + k, v]),
    ['tau2 goal', summary?.tau2_goal_score],
    ['Native goal', summary?.native_goal_score],
    ['Reward', tc.reward],
    ['Action', tc.action_score],
    ['Communicate', tc.communicate_score],
    ['NL assertions', tc.nl_assertions_score],
    ['DB state', tc.db_state_score],
    ['State integrity', tc.state_integrity_score],
    ['Tool recall', tools.recall],
    ['Tool precision', tools.precision],
    ['Tool calls', tools.total_calls],
  ].filter(([, v]) => v !== null && v !== undefined);
  const flags = [];
  if (tc.prohibited_violated) flags.push('prohibited action violated');
  if (tc.prohibited_communicate_violated) flags.push('prohibited communicate violated');
  if (tc.judge_failed) flags.push('judge failed');
  if (summary?.tool_metrics?.prohibited_violations?.length)
    flags.push('prohibited tool calls: ' + summary.tool_metrics.prohibited_violations.join(', '));
  if (summary?.breach) flags.push('breach: ' + summary.breach);
  return `
  <h3>Scores</h3>
  <div class="chips">${entries.map(([k, v]) =>
    `<div class="chip"><div class="k">${k}</div><div class="v">${typeof v === 'number' ? fmtScore(v) : esc(v)}</div></div>`).join('')}
  </div>
  ${flags.map(f => `<div><span class="badge fail" style="margin-top:6px">${esc(f)}</span></div>`).join('')}
  ${summary ? jsonPreview('Raw scenario result (results.json)', summary) : ''}
  ${sess ? jsonPreview('Raw session result (talk_bench_evaluation_result.json)', sess) : ''}`;
}

/* ---------- run import via drag & drop (no button; function kept) ---------- */
let lastUploadStatus = '';
const setUpStatus = t => {
  lastUploadStatus = t;
  const el = document.getElementById('upStatus');
  if (el) el.textContent = t;
};

async function postForm(url, fd) {
  const r = await fetch(url, { method: 'POST', body: fd });
  const res = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(res.detail || r.status); e.status = r.status; throw e; }
  return res;
}

// entries: [{rel: path inside the run dir, file}]
async function syncOneRun(runName, entries, progressPrefix) {
  const beginFd = ow => {
    const fd = new FormData();
    fd.append('run_name', runName); fd.append('overwrite', ow);
    return fd;
  };
  let uploadId;
  try {
    uploadId = (await postForm('/api/upload_dir_begin', beginFd(false))).upload_id;
  } catch (e) {
    if (e.status !== 409) throw e;
    if (!confirm(`Run "${runName}" already exists. Replace it?`)) return 'skipped';
    uploadId = (await postForm('/api/upload_dir_begin', beginFd(true))).upload_id;
  }
  try {
    // upload in batches: at most 40 files or ~200 MB per request
    let batch = [], batchBytes = 0, sent = 0;
    const flush = async () => {
      if (!batch.length) return;
      const fd = new FormData();
      fd.append('upload_id', uploadId);
      for (const e of batch) { fd.append('paths', e.rel); fd.append('files', e.file); }
      await postForm('/api/upload_dir_chunk', fd);
      sent += batch.length;
      setUpStatus(`${progressPrefix}"${runName}": ${sent}/${entries.length} files…`);
      batch = []; batchBytes = 0;
    };
    for (const e of entries) {
      if (batch.length >= 40 || batchBytes + e.file.size > 200e6) await flush();
      batch.push(e); batchBytes += e.file.size;
    }
    await flush();
    await postForm('/api/upload_dir_commit', (() => { const fd = new FormData(); fd.append('upload_id', uploadId); return fd; })());
    return 'synced';
  } catch (e) {
    const fd = new FormData(); fd.append('upload_id', uploadId);
    fetch('/api/upload_dir_abort', { method: 'POST', body: fd });
    throw e;
  }
}

// files: [{relpath (starting with the dropped folder name), file}]
// Detects whether the dropped folder is a single run or a folder of runs:
// a run has results.json / talk_bench_evaluation_result.json at its root,
// or scenario dirs (scenario.json / run_meta.json / conversation.json) one level down.
async function importRunFiles(files) {
  const RUN_ROOT_FILES = ['results.json', 'talk_bench_evaluation_result.json'];
  const SCEN_FILES = ['scenario.json', 'run_meta.json', 'conversation.json'];
  const inner = files.map(f => ({ parts: f.relpath.split('/').slice(1), file: f.file }));
  const isSingleRun = inner.some(({ parts }) =>
    (parts.length === 1 && RUN_ROOT_FILES.includes(parts[0])) ||
    (parts.length === 2 && SCEN_FILES.includes(parts[1])));

  let runGroups; // Map<runName, entries>
  if (isSingleRun) {
    const runName = files[0].relpath.split('/')[0];
    runGroups = new Map([[runName, inner.map(({ parts, file }) => ({ rel: parts.join('/'), file }))]]);
  } else {
    runGroups = new Map();
    for (const { parts, file } of inner) {
      if (parts.length < 2) continue; // loose files at the container root (.DS_Store etc.)
      const run = parts[0];
      if (!runGroups.has(run)) runGroups.set(run, []);
      runGroups.get(run).push({ rel: parts.slice(1).join('/'), file });
    }
    if (!runGroups.size) { setUpStatus('no run folders found in the drop'); return; }
  }

  const names = [...runGroups.keys()], done = [], skipped = [];
  for (let i = 0; i < names.length; i++) {
    const prefix = names.length > 1 ? `run ${i + 1}/${names.length} ` : 'syncing ';
    const outcome = await syncOneRun(names[i], runGroups.get(names[i]), prefix);
    (outcome === 'synced' ? done : skipped).push(names[i]);
  }
  setUpStatus(`synced ${done.length} run${done.length === 1 ? '' : 's'}`
    + (skipped.length ? ` · skipped: ${skipped.join(', ')}` : ''));
  if (done.length) { RUNS = null; setTimeout(() => { if (!location.hash.startsWith('#/')) renderList(); }, 1200); }
}

async function importZip(f) {
  const send = async overwrite => {
    const fd = new FormData();
    fd.append('file', f);
    fd.append('overwrite', overwrite);
    return postForm('/api/upload_run', fd);
  };
  setUpStatus(`uploading ${f.name}…`);
  let res = await send(false);
  let imported = res.imported;
  if (res.skipped_existing.length) {
    if (confirm(`These runs already exist:\n\n${res.skipped_existing.join('\n')}\n\nReplace them?`)) {
      setUpStatus('replacing…');
      res = await send(true);
      imported = res.imported;
    } else if (!imported.length) {
      setUpStatus('nothing imported (all runs already exist)');
      return;
    }
  }
  setUpStatus(`imported: ${imported.length ? imported.join(', ') : 'none'}`);
  if (imported.length) { RUNS = null; setTimeout(() => { if (!location.hash.startsWith('#/')) renderList(); }, 1200); }
}

// recursively read a dropped FileSystemEntry into [{relpath, file}]
async function collectEntry(entry) {
  if (entry.isFile) {
    const file = await new Promise((res, rej) => entry.file(res, rej));
    return [{ relpath: entry.fullPath.replace(/^\//, ''), file }];
  }
  if (entry.isDirectory) {
    const reader = entry.createReader();
    const out = [];
    for (;;) {  // readEntries returns results in batches until an empty batch
      const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      if (!batch.length) break;
      for (const child of batch) out.push(...await collectEntry(child));
    }
    return out;
  }
  return [];
}

document.addEventListener('dragover', e => {
  if (!CONFIG.read_only && !location.hash.startsWith('#/')) e.preventDefault();
});
document.addEventListener('drop', async e => {
  if (CONFIG.read_only || location.hash.startsWith('#/')) return;
  e.preventDefault();
  const items = [...e.dataTransfer.items];
  const dirs = [], zips = [];
  for (const item of items) {
    const entry = item.webkitGetAsEntry?.();
    if (!entry) continue;
    if (entry.isDirectory) dirs.push(entry);
    else if (entry.isFile && entry.name.toLowerCase().endsWith('.zip')) zips.push(item.getAsFile());
  }
  if (!dirs.length && !zips.length) { setUpStatus('drop a run folder or a .zip'); return; }
  try {
    for (const z of zips) await importZip(z);
    for (const dir of dirs) {
      setUpStatus(`reading "${dir.name}"…`);
      await importRunFiles(await collectEntry(dir));
    }
  } catch (err) {
    setUpStatus('error: ' + err.message);
  }
});

/* ---------- scenario AI chat ---------- */
const CHATS = {};  // per-scenario message history, kept for the session
const CHAT_TAB_PROMPTS = [
  '为什么这个场景失败了？',
  '应该如何改进，才能避免这个问题再次发生？',
];
const CHAT_TAB_PROMPT_INDEX = {};  // remember usage while navigating between scenarios

function initChat(path) {
  const log = document.getElementById('chatLog');
  const input = document.getElementById('chatText');
  const btn = document.getElementById('chatSend');
  const history = CHATS[path] ||= [];
  let tabPromptIndex = CHAT_TAB_PROMPT_INDEX[path] || 0;

  const updatePlaceholder = () => {
    input.placeholder = tabPromptIndex < CHAT_TAB_PROMPTS.length
      ? `${CHAT_TAB_PROMPTS[tabPromptIndex]}（按 Tab 填充）`
      : '继续追问…';
  };
  updatePlaceholder();

  const draw = (thinking = false) => {
    const configuredModel = esc(displayModelName(CONFIG.llm_model));
    log.innerHTML = history.map(m => `
      <div class="chat-msg ${m.role}">
        <div class="who">${m.role === 'user' ? 'You' : esc(displayModelName(m.model || CONFIG.llm_model))}</div>
        <div class="bubble ${m.role === 'assistant' ? 'markdown-body' : ''}">${m.role === 'assistant' ? renderMarkdown(m.content) : esc(m.content)}</div>
      </div>`).join('')
      + (thinking ? `<div class="chat-msg assistant"><div class="who">${configuredModel}</div><div class="bubble muted">thinking…</div></div>` : '');
    log.scrollTop = log.scrollHeight;
    log.style.display = history.length || thinking ? 'block' : 'none';
  };
  draw();

  const send = async () => {
    const text = input.value.trim();
    if (!text || btn.disabled) return;
    input.value = '';
    history.push({ role: 'user', content: text });
    btn.disabled = true;
    draw(true);
    try {
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path, messages: history }),
      });
      const res = await r.json();
      if (!r.ok) throw new Error(res.detail || r.status);
      if (res.model) {
        CONFIG.llm_model = res.model;
        sessionStorage.setItem('viewer_llm_model', res.model);
      }
      history.push({ role: 'assistant', content: res.reply, model: res.model });
    } catch (e) {
      history.push({ role: 'assistant', content: '⚠ ' + e.message });
    }
    btn.disabled = false;
    draw();
    input.focus();
  };
  btn.addEventListener('click', send);
  let isComposing = false;
  input.addEventListener('compositionstart', () => { isComposing = true; });
  input.addEventListener('compositionend', () => { isComposing = false; });
  input.addEventListener('keydown', e => {
    // Enter confirms an IME candidate while composing Chinese, Japanese, etc.
    // Some browsers report keyCode 229 instead of setting isComposing.
    if (isComposing || e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Tab' && !input.value.trim() && tabPromptIndex < CHAT_TAB_PROMPTS.length) {
      e.preventDefault();
      input.value = CHAT_TAB_PROMPTS[tabPromptIndex++];
      CHAT_TAB_PROMPT_INDEX[path] = tabPromptIndex;
      updatePlaceholder();
      return;
    }
    if (e.key === 'Enter') send();
  });
}

/* ---------- router ---------- */
let scenKeyNav = null;
window.addEventListener('keydown', e => { if (scenKeyNav) scenKeyNav(e); });

async function route() {
  const h = decodeURIComponent(location.hash);
  scenKeyNav = null;
  try {
    await loadConfig();
    if (h.startsWith('#/scenario/')) await renderScenario(h.slice('#/scenario/'.length));
    else if (h.startsWith('#/run/')) await renderRun(h.slice('#/run/'.length));
    else await renderList();
    window.scrollTo(0, 0);
  } catch (e) {
    $main.innerHTML = `<div class="card"><b>Error:</b> ${esc(e.message)}</div>`;
  }
}
window.addEventListener('hashchange', route);
route();
</script>
