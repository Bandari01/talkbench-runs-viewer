<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>talk-bench runs viewer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎧</text></svg>">
<script>
  // set the theme before first paint (user override in localStorage, else OS preference)
  let _t = null;
  try { _t = localStorage.getItem('viewer_theme'); } catch (e) {}
  document.documentElement.dataset.theme =
    _t === 'light' || _t === 'dark' ? _t
    : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
</script>
<style>
  /* Tokens follow shadcn/ui (new-york, neutral) + Vercel Geist accents — hexes are the
     compiled values from shadcn-ui/ui registry themes and vercel.com Geist tokens. */
  :root {
    --topbar-h: 48px; --side-w: 256px; --radius: 14px;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --ease-out: cubic-bezier(.16, 1, .3, 1); --dur-1: .12s; --dur-2: .2s; --dur-3: .28s;  /* the one easing curve and the three durations of all motion */
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #fafafa; --surface: #ffffff; --surface-2: #f5f5f5; --surface-3: #e5e5e5;
    --border: #e5e5e5; --border-soft: #f0f0f0;
    --fg: #0a0a0a; --fg-soft: #4c4c4c; --muted: #737373; --faint: #a3a3a3;
    --link: #0072f5;
    --primary: #171717; --primary-fg: #fafafa;
    --ring: rgba(161, 161, 161, .40);
    --pass: #297a3a; --pass-bg: #effbef; --pass-border: rgba(69, 165, 87, .35);
    --fail: #d00a12; --fail-bg: #fff0f0; --fail-border: rgba(231, 0, 11, .22);
    --na-bg: #f5f5f5; --na-border: #e5e5e5;
    --star: #f59e0b;
    --code-bg: #f5f5f5; --code-text: #be185d;
    --md-pre-bg: #171717; --md-pre-text: #e5e5e5; --md-pre-border: #333333;
    --bubble-user: #e3edfb; --bubble-user-fg: #1e3a5f;
    --bubble-agent: #f5f5f5;
    --side-bg: #fafafa;
    --shadow: 0 1px 2px 0 rgba(0, 0, 0, .05);
    --shadow-card: 0 1px 3px 0 rgba(0, 0, 0, .06), 0 1px 2px -1px rgba(0, 0, 0, .06);
    --shadow-pop: 0 0 0 1px rgba(0, 0, 0, .03), 0 4px 8px -4px rgba(0, 0, 0, .06), 0 16px 32px -12px rgba(0, 0, 0, .18);
    --selection: rgba(0, 114, 245, .16);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0a0a0a; --surface: #171717; --surface-2: #262626; --surface-3: #333333;
    --border: rgba(255, 255, 255, .10); --border-soft: rgba(255, 255, 255, .06);
    --fg: #fafafa; --fg-soft: #d4d4d4; --muted: #a1a1a1; --faint: #525252;
    --link: #52a8ff;
    --primary: #e5e5e5; --primary-fg: #171717;
    --ring: rgba(115, 115, 115, .50);
    --pass: #62c073; --pass-bg: #0b2212; --pass-border: rgba(98, 192, 115, .35);
    --fail: #ff6467; --fail-bg: #2a1314; --fail-border: rgba(255, 100, 103, .30);
    --na-bg: rgba(161, 161, 161, .10); --na-border: rgba(161, 161, 161, .22);
    --star: #fbbf24;
    --code-bg: #262626; --code-text: #f0a8c8;
    --md-pre-bg: #0a0a0a; --md-pre-text: #d4d4d4; --md-pre-border: rgba(255, 255, 255, .10);
    --bubble-user: #24344a; --bubble-user-fg: #cfe0f5;
    --bubble-agent: #262626;
    --side-bg: #171717;
    --shadow: 0 1px 2px 0 rgba(0, 0, 0, .4);
    --shadow-card: 0 1px 3px 0 rgba(0, 0, 0, .5);
    --shadow-pop: 0 0 0 1px rgba(255, 255, 255, .06), 0 16px 40px -12px rgba(0, 0, 0, .75);
    --selection: rgba(82, 168, 255, .32);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  #sidebar, pre, .rc-list, .chat-log, .scen-list, .table-wrap, .markdown-table-wrap { scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
  body {
    margin: 0; display: flex; min-height: 100vh;
    font: 14px/1.5 var(--sans);
    background: var(--bg); color: var(--fg);
    -webkit-font-smoothing: antialiased; accent-color: var(--link);
  }
  ::selection { background: var(--selection); }
  .log-pane::selection, .markdown-body pre ::selection { background: rgba(82, 168, 255, .35); }  /* both panes are dark in either theme */

  /* ---------- sidebar ---------- */
  #sidebar {
    width: var(--side-w); flex: none; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    background: var(--side-bg); border-right: 1px solid var(--border);
    padding: 14px 12px; display: flex; flex-direction: column; z-index: 60;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 4px 12px; color: var(--fg); font-weight: 650; font-size: 14.5px; letter-spacing: -.01em; }
  .brand:hover { text-decoration: none; }
  .brand-icon { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; flex: none; border-radius: 8px; background: var(--primary); color: var(--primary-fg); }
  .side-nav { flex: 1; }
  .side-sec { padding: 14px 10px 5px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .side-item {
    display: flex; width: 100%; align-items: center; gap: 9px; padding: 7px 10px; margin: 1px 0;
    border: 0; border-radius: 8px; background: none; color: var(--fg-soft);
    font: inherit; font-size: 13.5px; cursor: pointer; text-align: left;
    transition: background-color var(--dur-1), color var(--dur-1);
  }
  .side-item svg { color: var(--muted); flex: none; transition: color var(--dur-1); }
  .side-item > span:first-of-type { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-item:hover { background: var(--surface-2); color: var(--fg); }
  .side-item.active { background: var(--surface-2); color: var(--fg); font-weight: 500; }
  .side-item.active svg { color: var(--fg); }
  .side-n { margin-left: auto; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .side-foot { padding: 12px 10px 4px; border-top: 1px solid var(--border-soft); color: var(--muted); font-size: 12px; }
  .backdrop { display: none; }

  /* ---------- frame & topbar ---------- */
  .frame { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #topbar {
    position: sticky; top: 0; z-index: 40; height: var(--topbar-h); flex: none;
    display: flex; align-items: center; gap: 12px; padding: 0 20px;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-title { font-size: 15px; font-weight: 500; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex: none;
    border: 0; border-radius: 8px; background: none; color: var(--fg-soft); cursor: pointer;
    transition: background-color var(--dur-1), color var(--dur-1), scale var(--dur-1) var(--ease-out);
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--fg); }
  .menu-btn { display: none; }
  .search-wrap { position: relative; display: flex; align-items: center; }
  .search-wrap > svg { position: absolute; left: 9px; color: var(--faint); pointer-events: none; }
  .search-wrap kbd {
    position: absolute; right: 8px; pointer-events: none;
    border: 1px solid var(--border); border-radius: 4px; padding: 0 5px;
    font: 11px/1.6 var(--mono); color: var(--muted); background: var(--surface-2);
  }
  #q {
    width: 280px; max-width: 100%; padding: 6px 30px 6px 31px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg);
    font: inherit; font-size: 13.5px; transition: border-color var(--dur-1), box-shadow var(--dur-1);
  }
  #q::placeholder { color: var(--faint); }
  #q:focus { outline: none; border-color: var(--faint); box-shadow: 0 0 0 3px var(--ring); }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg);
    font: inherit; font-size: 13px; font-weight: 500; line-height: 18px; cursor: pointer; white-space: nowrap;
    box-shadow: var(--shadow);
    transition: background-color var(--dur-1), opacity var(--dur-1), box-shadow var(--dur-1), scale var(--dur-1) var(--ease-out);
  }
  .btn:hover { background: var(--surface-2); }
  .btn:disabled { opacity: .5; pointer-events: none; }
  main { width: 100%; max-width: 1200px; margin: 0 auto; padding: 20px 20px 64px; }

  /* ---------- cards ---------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-card); }
  .card > :first-child { margin-top: 0; }
  .card > :last-child { margin-bottom: 0; }
  .card.table-card { padding: 0; overflow: clip; }  /* clip rounds the corners without becoming a scroll container, so sticky th works */
  .card-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--border-soft); }
  .card-head h3 { margin: 0; }
  .list-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--border-soft); }
  .list-meta .count { font-size: 13px; color: var(--fg-soft); font-weight: 500; }
  .list-meta .hint { margin-left: auto; font-size: 12.5px; color: var(--faint); }
  body.drop-hint #main .table-card { box-shadow: 0 0 0 2px var(--link), var(--shadow-card); }  /* run folders are being dragged over the list */
  body.drop-hint #listHint { color: var(--link); }

  /* ---------- tables ---------- */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  th {
    position: sticky; top: var(--topbar-h); z-index: 5;
    text-align: left; color: var(--muted); font-weight: 500; font-size: 12.5px;
    padding: 9px 10px; background: var(--surface); white-space: nowrap;
    box-shadow: inset 0 -1px 0 var(--border);  /* a collapsed border stays on the grid; the shadow travels with a stuck header */
  }
  td { padding: 10px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
  .table-card th:first-child, .table-card td:first-child { padding-left: 16px; }
  .table-card th:last-child, .table-card td:last-child { padding-right: 16px; }
  .table-card tr:last-child td { border-bottom: none; }
  tr.rowlink { cursor: pointer; }
  .table-card tbody tr:hover { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
  .table-card tbody tr.rowlink:hover { background: var(--surface-2); }
  th[data-sort] { cursor: pointer; user-select: none; }
  th[data-sort]:hover { color: var(--fg); }
  .sort-ind::after { content: '↕'; margin-left: 4px; color: var(--faint); opacity: 0; }
  th[data-sort]:hover .sort-ind::after { opacity: 1; }
  th.sorted-asc .sort-ind::after { content: '↑'; color: var(--fg); opacity: 1; }
  th.sorted-desc .sort-ind::after { content: '↓'; color: var(--fg); opacity: 1; }
  .nowrap { white-space: nowrap; }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .muted { color: var(--muted); }

  /* ---------- badges & chips ---------- */
  .badge { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 1px solid transparent; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .badge.pass { background: var(--pass-bg); color: var(--pass); border-color: var(--pass-border); }
  .badge.fail { background: var(--fail-bg); color: var(--fail); border-color: var(--fail-border); }
  .badge.na   { background: var(--na-bg); color: var(--muted); border-color: var(--na-border); }
  h2 .badge { line-height: 18px; }  /* the scenario PASS / FAIL pill: h2's 1.3 would shrink it below the 18px of every other badge */
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; margin: 14px 0 4px; }
  .chip { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; }
  .chip .k { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .v { font-size: 20px; font-weight: 600; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }

  /* ---------- text & misc ---------- */
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:has(> .badge):hover { text-decoration: none; }  /* PASS / FAIL badges that link to a scenario */
  .crumbs { font-size: 13px; margin-bottom: 12px; color: var(--muted); }
  h2 { font-size: 20px; line-height: 1.3; margin: 2px 0 10px; font-weight: 600; letter-spacing: -.025em; overflow-wrap: anywhere; }
  h3 { font-size: 14px; margin: 20px 0 8px; font-weight: 600; }
  details > summary { cursor: pointer; color: var(--link); font-size: 13px; user-select: none; font-weight: 500; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before {
    content: ''; display: inline-block; width: 5px; height: 5px; margin: 0 8px 2px 2px;
    border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); transition: transform var(--dur-1) var(--ease-out);
  }
  details[open] > summary::before { transform: rotate(45deg); }
  pre {
    background: var(--surface-2); color: var(--fg); border: 1px solid var(--border-soft);
    padding: 12px 14px; border-radius: 8px; overflow: auto; font-size: 12px; max-height: 480px;
  }
  .json-preview-toolbar { display: flex; justify-content: flex-end; margin: 8px 0 -4px; }
  .json-preview pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  .json-preview.no-wrap pre { white-space: pre; }
  .empty { color: var(--muted); padding: 32px; text-align: center; font-size: 13.5px; }
  .detail-heading { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .detail-heading h2 { margin-right: auto; }
  .skel { height: 13px; border-radius: 6px; margin: 12px 0; background: var(--surface-3); animation: pulse 1.6s ease-in-out infinite; }  /* opacity pulse: compositor-only */
  .toast {
    position: fixed; bottom: 20px; right: 20px; z-index: 100; max-width: 400px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 13px; color: var(--fg-soft);
    box-shadow: var(--shadow-pop);
    display: flex; align-items: flex-start; gap: 10px;
    animation: toast-in var(--dur-2) var(--ease-out);
  }
  .toast-close {
    flex-shrink: 0; margin: -2px -6px 0 0; padding: 0 4px; border: 0; border-radius: 6px; background: none;
    color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer;
  }
  .toast-close:hover { color: var(--fg); }

  /* ---------- transcript ---------- */
  .bubble { padding: 9px 13px; border-radius: 14px; margin: 6px 0; white-space: pre-wrap; }
  .turn { display: flex; }
  .turn > div { max-width: 72%; display: flex; flex-direction: column; align-items: flex-start; }
  .turn.user { justify-content: flex-end; }
  .turn.user > div { align-items: flex-end; }
  .turn.user .bubble { background: var(--bubble-user); color: var(--bubble-user-fg); border-bottom-right-radius: 4px; }
  .turn.agent .bubble { background: var(--bubble-agent); border-bottom-left-radius: 4px; }
  .turn .who { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  audio { width: 100%; margin: 4px 0 10px; }
  .audio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px 18px; }
  .tool-call { border: 1px solid var(--border-soft); border-radius: 8px; padding: 10px 12px; margin: 10px 40px; font-size: 13px; background: var(--surface-2); }
  .tool-call .name { font-weight: 650; }
  .tool-call .err { color: var(--fail); font-size: 12.5px; }
  .ts { color: var(--faint); font-size: 11px; font-family: var(--mono); margin-right: 6px; }
  button.ts { background: none; border: 0; padding: 0; line-height: inherit; cursor: pointer; }
  button.ts:hover { color: var(--link); text-decoration: underline; }
  .turn .bubble { transition: box-shadow var(--dur-2) var(--ease-out); }  /* the audio-sync ring glides from turn to turn */
  .turn.playing .bubble { box-shadow: 0 0 0 2px var(--link); }

  /* ---------- scenario nav & buttons ---------- */
  .scen-nav { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .scen-nav select, #impSample { padding: 5px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg); font: inherit; font-size: 12.5px; max-width: 220px; }
  .navbtn {
    display: inline-block; padding: 5px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--fg); font-size: 12.5px; line-height: 18px; white-space: nowrap;
    box-shadow: var(--shadow);
    transition: background-color var(--dur-1), box-shadow var(--dur-1), scale var(--dur-1) var(--ease-out);
  }
  .navbtn:hover { background: var(--surface-2); text-decoration: none; }
  .navbtn:focus-visible { outline: none; border-color: var(--faint); box-shadow: 0 0 0 3px var(--ring); }
  .navbtn.disabled, .navbtn:disabled { color: var(--faint); pointer-events: none; box-shadow: none; }
  button.navbtn { cursor: pointer; font-family: inherit; }
  .more-chev { display: inline-flex; padding: 4px 10px; border: none; border-radius: 8px; background: none; color: var(--faint); cursor: pointer; }
  .more-chev:hover { background: var(--surface-2); color: var(--fg); }
  .more-chev:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }
  .more-chev svg { width: 18px; height: 18px; transition: transform var(--dur-2) var(--ease-out); }
  .more-chev.open svg { transform: rotate(180deg); }

  /* ---------- star / hide / copy ---------- */
  .star { color: var(--faint); display: inline-flex; transition: color var(--dur-1), transform var(--dur-1) var(--ease-out); }
  .star.on { color: var(--star); }
  .star.on svg { fill: currentColor; }
  .starcell { cursor: pointer; user-select: none; }
  .starcell:hover .star { color: var(--star); transform: scale(1.12); }
  .eye { color: var(--faint); display: inline-flex; transition: color var(--dur-1); }
  .eye.on { color: var(--muted); }
  .eyecell { cursor: pointer; user-select: none; }
  .eyecell:hover .eye { color: var(--fg); }
  .run-name { overflow-wrap: anywhere; }
  .run-suffix { color: var(--muted); }  /* -<N>trials-<timestamp>-run-<id>: repeats the Time column */
  .ratio { display: block; width: 56px; height: 3px; margin-top: 7px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
  .ratio::after { content: ''; display: block; height: 100%; background: var(--pass); transform-origin: left; transform: scaleX(var(--r)); }
  .copy-run-name { appearance: none; border: 0; padding: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: copy; overflow-wrap: anywhere; }
  .copy-run-name:hover { color: var(--link); }
  .copy-run-name:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 2px; }
  .copy-icon { display: inline-block; vertical-align: -2px; margin-left: 5px; color: var(--faint); }
  .copy-icon svg { width: 12px; height: 12px; }
  .copy-run-name:hover .copy-icon { color: var(--link); }
  .copy-feedback { margin-left: 5px; color: var(--pass); font-family: var(--sans); font-size: 11px; font-weight: 600; }
  .copy-run-name.copy-error .copy-feedback { color: var(--fail); }
  .subscore { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
  .subscore .ok { color: var(--pass); }
  .subscore .bad { color: var(--fail); }
  .mode-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--fg-soft); white-space: nowrap; }
  .mode-tag svg { width: 13px; height: 13px; opacity: .7; }
  .cmp-pickers { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-top: 14px; }
  .cmp-swap { border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); }

  /* ---------- run picker (filterable listbox; a native <select> of 100+ runs is unreadable) ---------- */
  .run-combo { position: relative; min-width: 0; }
  .rc-btn {
    display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--fg);
    font: inherit; text-align: left; cursor: pointer; box-shadow: var(--shadow);
    user-select: none; -webkit-tap-highlight-color: transparent;
    transition: background-color var(--dur-1), border-color var(--dur-1), box-shadow var(--dur-1);
  }
  .rc-btn:hover { background: var(--surface-2); }
  .rc-btn:focus-visible, .run-combo.open .rc-btn { outline: none; border-color: var(--faint); box-shadow: 0 0 0 3px var(--ring); }
  .rc-side {
    flex: none; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
    border-radius: 6px; background: var(--surface-3); color: var(--fg-soft); font-size: 12px; font-weight: 650;
  }
  .run-combo[data-side="b"] .rc-side { background: var(--primary); color: var(--primary-fg); }
  .rc-body { flex: 1; min-width: 0; }
  .rc-title { display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; }
  .rc-title > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rc-title .star svg { width: 12px; height: 12px; }
  .rc-empty { color: var(--muted); font-weight: 500; }
  .rc-sub { display: block; margin-top: 1px; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rc-chev { flex: none; display: inline-flex; color: var(--faint); transition: transform var(--dur-2) var(--ease-out); }
  .run-combo.open .rc-chev { transform: rotate(180deg); }

  .rc-pop {
    position: absolute; z-index: 50; top: calc(100% + 6px); left: 0; width: max(100%, 540px); overflow: hidden;
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
    box-shadow: var(--shadow-pop);
  }
  .run-combo[data-side="b"] .rc-pop { left: auto; right: 0; }  /* stay inside the card */
  /* an entrance animation makes the picker card a stacking context that would trap the popover under #cmpBody:
     lift the card above the entering #cmpBody cards and sticky th (5), below the topbar (40) */
  #main > .card:has(.run-combo.open) { position: relative; z-index: 6; }
  .rc-search { position: relative; display: flex; padding: 8px; border-bottom: 1px solid var(--border-soft); }
  .rc-search svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
  .rc-search input {
    width: 100%; padding: 6px 10px 6px 31px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-2); color: var(--fg); font: inherit; font-size: 13px;
  }
  .rc-search input::placeholder { color: var(--faint); }
  .rc-search input:focus { outline: none; border-color: var(--faint); box-shadow: 0 0 0 3px var(--ring); }
  .rc-list { max-height: 340px; overflow-y: auto; padding: 5px; }
  .rc-group { padding: 7px 9px 4px; font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .rc-opt + .rc-group { margin-top: 5px; border-top: 1px solid var(--border-soft); }
  .rc-opt { display: flex; align-items: center; gap: 9px; padding: 6px 9px; border-radius: 8px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
  .rc-opt.active { background: var(--surface-2); }
  .rc-opt.taken { opacity: .45; cursor: default; }
  .rc-tick { flex: none; width: 15px; color: var(--fg); }
  .rc-tick svg { width: 14px; height: 14px; }
  .rc-meta { flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .rc-note { border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .rc-opt .rc-meta .badge { min-width: 56px; text-align: center; }
  .rc-score { min-width: 34px; text-align: right; font-size: 12px; color: var(--fg-soft); font-variant-numeric: tabular-nums; }
  .rc-none { padding: 16px 10px; text-align: center; font-size: 12.5px; color: var(--muted); }
  .rc-foot { display: flex; align-items: center; gap: 5px; padding: 6px 10px; border-top: 1px solid var(--border-soft); background: var(--surface-2); font-size: 11.5px; color: var(--muted); }
  .rc-foot kbd { border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; background: var(--surface); font: 11px/1.5 var(--mono); }
  .rc-count { margin-left: auto; font-variant-numeric: tabular-nums; }
  .cmp-side { border-left: 2px solid var(--border); }
  .cmp-agg { overflow-x: auto; }  /* nowrap run-name headers can outgrow the card, which clips: scroll instead */
  .cmp-agg th { position: static; }  /* sticky inside a scroll container would float mid-table */
  #cmpHead th { top: calc(var(--topbar-h) + 36px); }  /* stack under the stuck A/B group row (36.75px: 9+9 padding + 12.5px x 1.5) */
  tr.cmp-group td { font-size: 12px; color: var(--muted); font-weight: 500; background: var(--surface); }
  .cmp-delta.up { color: var(--pass); }
  .cmp-delta.down { color: var(--fail); }
  .cmp-note { font-size: 12.5px; color: var(--fg-soft); background: var(--surface); border: 1px solid var(--border);
              border-radius: 10px; padding: 10px 13px; margin-top: 12px; }
  @media (max-width: 720px) {
    .cmp-pickers { grid-template-columns: 1fr; }
    .cmp-swap { justify-self: center; transform: rotate(90deg); }
    .rc-pop { width: 100%; }
  }
  /* phone widths: the run name matters more than the score, which the table repeats anyway */
  @media (max-width: 480px) {
    .rc-opt .rc-score, .rc-opt .rc-note.rc-cross { display: none; }
    .rc-opt .rc-meta .badge { min-width: 0; }
  }

  /* ---------- notes ---------- */
  .note-cell { min-width: 120px; width: 14%; }
  .run-note-input, .run-note-detail textarea { width: 100%; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--fg); font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; }
  .run-note-input { display: block; min-width: 100px; min-height: 44px; padding: 5px 7px; resize: vertical; }
  .run-note-input::placeholder, .run-note-detail textarea::placeholder { color: var(--faint); }
  .run-note-input:hover { border-color: var(--border); background: var(--surface); }
  .run-note-input:focus, .run-note-detail textarea:focus { outline: none; border-color: var(--faint); background: var(--surface); box-shadow: 0 0 0 3px var(--ring); }
  .run-note-input.saving { color: var(--muted); }
  .run-note-input.save-error { border-color: var(--fail); background: var(--fail-bg); }
  .run-note-detail { margin-top: 12px; max-width: 720px; }
  .run-note-detail label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 12px; font-weight: 500; }
  .run-note-detail textarea { display: block; min-height: 64px; resize: vertical; padding: 8px 10px; border-color: var(--border); }
  .note-actions { display: flex; align-items: center; gap: 8px; margin-top: 7px; }


  /* ---------- chat ---------- */
  .chat-log { display: none; max-height: 560px; overflow-y: auto; margin-bottom: 10px; border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 14px; background: var(--surface-2); animation: fade-in var(--dur-2) var(--ease-out); }
  .chat-msg { margin: 14px 0; }
  .chat-msg:first-child { margin-top: 2px; }
  .chat-msg:last-child { margin-bottom: 2px; }
  .chat-msg .who { font-size: 11px; font-weight: 650; color: var(--muted); margin: 0 4px 4px; letter-spacing: .02em; }
  .chat-msg .bubble { margin: 0; overflow-wrap: anywhere; }
  .chat-msg.user .who { text-align: right; }
  .chat-msg.user .bubble { width: fit-content; max-width: 82%; margin-left: auto; background: var(--bubble-user); color: var(--bubble-user-fg); }
  .chat-msg.assistant .bubble { padding: 13px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
  .chat-input { display: flex; gap: 8px; }
  .chat-input input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: 13.5px; background: var(--surface); color: var(--fg); transition: border-color var(--dur-1), box-shadow var(--dur-1); }
  .chat-input input::placeholder { color: var(--faint); }
  .chat-input input:focus { outline: none; border-color: var(--faint); box-shadow: 0 0 0 3px var(--ring); }

  /* ---------- AI scenario report ---------- */
  .report-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .report-head h3 { margin: 0; }
  .report-head .navbtn { margin-left: auto; }
  .report-body { margin-top: 12px; padding: 13px 16px; background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: 10px; transition: opacity var(--dur-2) var(--ease-out); }
  .mermaid-diagram { margin: 10px 0; padding: 12px; overflow-x: auto; background: var(--surface); border: 1px solid var(--border-soft); border-radius: 10px; text-align: center; }
  .mermaid-diagram svg { max-width: 100%; height: auto; }

  /* ---------- markdown ---------- */
  .markdown-body { line-height: 1.65; white-space: normal; }
  .markdown-body > :first-child { margin-top: 0; }
  .markdown-body > :last-child { margin-bottom: 0; }
  .markdown-body p { margin: 8px 0; }
  .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 { margin: 16px 0 6px; color: var(--fg); line-height: 1.35; }
  .markdown-body h3 { font-size: 15px; }
  .markdown-body h4 { font-size: 14px; }
  .markdown-body h5, .markdown-body h6 { font-size: 13.5px; }
  .markdown-body ul, .markdown-body ol { margin: 7px 0; padding-left: 24px; }
  .markdown-body li { margin: 4px 0; padding-left: 2px; }
  .markdown-body li::marker { color: var(--muted); font-weight: 650; }
  .markdown-body strong { color: var(--fg); font-weight: 700; }
  .markdown-body code { padding: 2px 5px; border-radius: 5px; background: var(--code-bg); color: var(--code-text); font: 12px/1.5 var(--mono); }
  .markdown-body pre { margin: 10px 0; padding: 11px 13px; max-height: 360px; border-color: var(--md-pre-border); background: var(--md-pre-bg); color: var(--md-pre-text); white-space: pre; }
  .markdown-body pre code { padding: 0; background: transparent; color: inherit; }
  .markdown-body blockquote { margin: 10px 0; padding: 8px 12px; border-left: 3px solid var(--faint); background: var(--surface-2); color: var(--fg-soft); }
  .markdown-body hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }
  .markdown-body a { overflow-wrap: anywhere; }
  .markdown-table-wrap { max-width: 100%; margin: 10px 0; overflow-x: auto; }
  .markdown-body table { width: auto; min-width: 55%; font-size: 12.5px; }
  .markdown-body th { position: static; padding: 6px 9px; background: var(--surface-2); box-shadow: none; border-bottom: 1px solid var(--border); }
  .markdown-body td { padding: 6px 9px; border: 1px solid var(--border-soft); }

  .filelist { columns: 2; font-size: 12.5px; }
  .filelist div { break-inside: avoid; padding: 2px 0; }

  /* ---------- run test ---------- */
  .seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); flex-wrap: wrap; }
  .seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; font: inherit; font-size: 12.5px; color: var(--muted); cursor: pointer; white-space: nowrap; transition: background-color var(--dur-2), color var(--dur-2), box-shadow var(--dur-2); }
  .seg button:hover { color: var(--fg); }
  .seg button.active { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: var(--shadow); }
  .preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .preset { text-align: left; border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; background: var(--surface); cursor: pointer; font: inherit; color: var(--fg); box-shadow: var(--shadow); transition: background-color var(--dur-1), border-color var(--dur-1), box-shadow var(--dur-1); }
  .preset:hover { background: var(--surface-2); }
  .preset.active { border-color: var(--fg); }
  .preset .p-name { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13.5px; }
  .preset .p-name svg { color: var(--muted); flex: none; }
  .preset .p-mod { color: var(--faint); font-size: 11px; font-family: var(--mono); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 16px; margin-top: 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field.wide { grid-column: 1 / -1; }
  .field label { font-size: 12px; font-weight: 500; color: var(--muted); }
  .field input:not([type=checkbox]), .field select, .field textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg); font: inherit; font-size: 13px; transition: border-color var(--dur-1), box-shadow var(--dur-1); }
  .field textarea { font-family: var(--mono); font-size: 12px; min-height: 120px; resize: vertical; white-space: pre; overflow: auto; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--faint); box-shadow: 0 0 0 3px var(--ring); }
  .field input::placeholder, .field textarea::placeholder { color: var(--faint); }
  .field .help { font-size: 11.5px; color: var(--faint); line-height: 1.4; }
  .field.invalid textarea { border-color: var(--fail); }
  .paste-row { display: flex; gap: 6px; }
  .field .paste-row input { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12.5px; }
  .yaml-foot { display: flex; align-items: baseline; gap: 10px; }
  .yaml-foot .navbtn { margin-left: auto; flex: none; }
  .btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
  .btn.primary:hover { background: var(--primary); opacity: .88; }
  .actions-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .actions-row .navbtn { padding-block: 6px; }  /* 32px, the height of the .btn beside it */
  .notice { font-size: 12.5px; padding: 9px 12px; margin-top: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); color: var(--fg-soft); }
  .notice.warn { border-color: rgba(245, 158, 11, .5); background: rgba(245, 158, 11, .09); }
  .notice code, .cmdline { font-family: var(--mono); }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--faint); vertical-align: middle; }
  .status-dot.running { background: var(--link); animation: pulse 1.2s ease-in-out infinite; }
  .status-dot.done { background: var(--pass); }
  .status-dot.error { background: var(--fail); }
  .log-pane { margin: 0; max-height: 520px; border: 1px solid var(--md-pre-border); border-radius: 10px; background: var(--md-pre-bg); color: var(--md-pre-text); white-space: pre-wrap; overflow-wrap: anywhere; }
  .cmdline { font-size: 12px; color: var(--fg-soft); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; overflow-wrap: anywhere; user-select: all; }
  tr.tr-selected td { background: var(--surface-2); }
  tr.tr-selected td:first-child { box-shadow: inset 2px 0 0 var(--fg); }
  .job-actions { display: flex; gap: 4px; flex-wrap: wrap; }
  .job-actions .navbtn { padding: 3px 9px; font-size: 12px; }  /* keeps its shadow, so .navbtn:focus-visible still shows */
  .job-actions :is([data-job-del], [data-sched-del]):hover { color: var(--fail); border-color: var(--fail-border); background: var(--fail-bg); }
  #jobsTable, #schedTable { min-width: 760px; }
  .jobs-wrap { overflow-x: auto; }
  .jobs-wrap th { position: static; }  /* sticky inside a scroll container would float mid-table */
  #logConfig { max-height: 320px; margin-top: 8px; }
  .scen-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .scen-head input { max-width: 260px; }
  .scen-list { max-height: 280px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .scen-row { display: flex; align-items: baseline; gap: 9px; padding: 5px 10px; border-bottom: 1px solid var(--border-soft); font-size: 12.5px; cursor: pointer; }
  .scen-row:last-child { border-bottom: none; }
  .scen-row:hover { background: var(--surface-2); }
  .scen-row input { margin: 0; position: relative; top: 1px; flex: none; }
  .scen-row .scen-id { flex: none; }
  .scen-row .scen-sum { flex: 1; min-width: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scen-row .scen-tag { flex: none; font-size: 11px; color: var(--faint); }
  .scen-empty { padding: 14px; text-align: center; color: var(--muted); font-size: 12.5px; }
  #agentInfo.err { color: var(--fail); font-size: 12px; }
  .sched-form { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border-soft); }
  .sched-days { display: flex; flex-wrap: wrap; gap: 6px 16px; padding-top: 4px; }
  .field .sched-days label { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 400; color: var(--fg); cursor: pointer; }

  /* ---------- motion: opacity / transform only, one easing curve (--ease-out) ---------- */
  @keyframes view-in      { from { opacity: 0; transform: translateY(6px); } }
  @keyframes view-in-next { from { opacity: 0; transform: translateX(8px); } }
  @keyframes view-in-prev { from { opacity: 0; transform: translateX(-8px); } }
  @keyframes fade-in      { from { opacity: 0; } }
  @keyframes pop-in       { from { opacity: 0; transform: translateY(-4px); } }
  @keyframes toast-in     { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  @keyframes toast-out    { to { opacity: 0; transform: translateY(4px) scale(.98); } }
  @keyframes pulse        { 50% { opacity: .4; } }  /* the running dot, the skeleton and "thinking…" */
  @keyframes spin         { to { transform: rotate(360deg); } }
  @keyframes grow-x       { from { transform: scaleX(0); } }
  @keyframes star-pop     { 40% { transform: scale(1.35); } }
  @keyframes saved-flash  { from { border-color: var(--pass-border); background-color: var(--pass-bg); } }  /* colour only: one field, once, on a user save */

  /* route changes (route / setView): the old page dims while the next one loads, the skeleton only shows after 180 ms,
     and each route plays one entrance; in-place updates and polling never add .view-enter */
  .skel-wrap { animation: fade-in var(--dur-2) var(--ease-out) backwards; }
  #cmpBody > .skel-wrap { animation-delay: .15s; }  /* invisible for 150 ms: a fast /api/compare never shows it */
  #main.stale { opacity: .55; pointer-events: none; transition: opacity var(--dur-2) var(--ease-out) .1s; }  /* dims only if loading takes >100 ms */
  #main.view-enter > * { animation: view-in var(--dur-3) var(--ease-out) backwards; }
  #main.view-enter > :nth-child(2) { animation-delay: 30ms; }
  #main.view-enter > :nth-child(3) { animation-delay: 60ms; }
  #main.view-enter > :nth-child(4) { animation-delay: 90ms; }
  #main.view-enter > :nth-child(n+5) { animation-delay: 120ms; }
  #main.view-enter[data-dir="next"] > * { animation-name: view-in-next; }
  #main.view-enter[data-dir="prev"] > * { animation-name: view-in-prev; }
  #main.view-enter[data-dir="soft"] > * { animation-name: fade-in; animation-duration: var(--dur-2); animation-delay: 0s; }
  #main.view-enter > .crumbs { animation-name: fade-in; }  /* after the data-dir rules (same specificity): the scenario ←/→ buttons must not slide under the cursor */
  #cmpBody > .card { animation: view-in var(--dur-3) var(--ease-out) backwards; }  /* compare results land after the shell; only renderCompare writes #cmpBody */
  /* staggerRows: a fresh run list / scenario table fades in row by row (first 20 rows, once per route or sidebar filter).
     Opacity only: with border-collapse a translated row tears from its borders. Never used on the polled tables */
  tbody.rows-enter > tr:nth-child(-n+20) { animation: fade-in var(--dur-3) var(--ease-out) var(--d, 0ms) backwards; }
  tbody.rows-enter > tr:nth-child(-n+20) .ratio::after { animation: grow-x .5s var(--ease-out) calc(var(--d, 0ms) + 100ms) backwards; }

  /* the Run test page polls every 2 s and rebuilds #jobRows, #schedRows and #logMeta: nothing in them transitions,
     and the running dot keeps a shared phase (jobStatusHTML) instead of restarting */
  #jobRows .navbtn, #schedRows .navbtn { transition: none; }
  /* show-once: plays only on hidden -> shown. Keep the keyframe view-in: #logCard and #schedCard are direct children of #main */
  #logCard:not([hidden]), #schedCard:not([hidden]), .sched-form:not([hidden]) { animation: view-in var(--dur-3) var(--ease-out) backwards; }

  .toast.leaving { animation: toast-out .16s var(--ease-out) forwards; pointer-events: none; }

  /* panel reveals: each plays only on hidden -> shown; closing stays instant. Re-renders that keep the
     same hidden value (renderQuickFields on every keystroke, updateSchedPreview) never replay them */
  .rc-pop:not([hidden]) { animation: pop-in var(--dur-1) var(--ease-out); }  /* translate only: a scale would skew the list's scrollIntoView */
  :is(#yamlBox, #quickFields, #schedForm .field):not([hidden]) { animation: fade-in var(--dur-2) var(--ease-out); }
  details[open] > summary ~ * { animation: fade-in var(--dur-2) var(--ease-out); }

  /* AI chat and reports: only what a draw added slides in; a first report shows placeholder lines, a regenerate dims the old one */
  .chat-msg.msg-in { animation: view-in var(--dur-2) var(--ease-out) backwards; }
  .chat-msg .bubble.thinking { animation: pulse 1.4s ease-in-out infinite; }
  .report-body:not([hidden]) { animation: view-in var(--dur-3) var(--ease-out); }
  .report-body.refreshing { opacity: .45; }

  /* action feedback */
  .star.pop svg { animation: star-pop .32s var(--ease-out); }  /* on the svg: .starcell:hover .star owns the span's transform */
  tr.row-leave { opacity: 0; transition: opacity .16s var(--ease-out); pointer-events: none; }  /* a hidden / unhidden run fades out of the list */
  .just-saved { animation: saved-flash .9s var(--ease-out); }
  .copy-feedback:not(:empty) { animation: fade-in var(--dur-1) var(--ease-out); }

  /* busy (setBusy): disabled plus a spinner while an async action runs; the label never changes */
  .btn[aria-busy="true"] { opacity: .8; }
  .navbtn[aria-busy="true"] { color: var(--muted); }
  :is(.btn, .navbtn)[aria-busy="true"]::before {
    content: ''; display: inline-block; flex: none; box-sizing: border-box; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px;
    border: 1.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite;
  }
  .btn[aria-busy="true"]::before { width: 12px; height: 12px; margin: 0 1.5px; }  /* the 15px slot of the icon it replaces */
  .btn[aria-busy="true"] > svg { display: none; }
  #syncBtn[aria-busy="true"]::before { content: none; }
  #syncBtn[aria-busy="true"] > svg { display: block; animation: spin .9s linear infinite; }  /* its refresh icon spins instead */

  /* press feedback, and the one focus ring inputs, .navbtn, .rc-btn and .more-chev already use */

  :is(.btn, .icon-btn, .side-item, .seg button, .preset, .toast-close):focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }

  }
  @media (max-width: 900px) {
    #sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); visibility: hidden;
      transition: transform var(--dur-3) var(--ease-out), visibility 0s linear var(--dur-3); }  /* hidden once slid out: not tabbable off-canvas */
    body.nav-open #sidebar { transform: none; visibility: visible; transition: transform var(--dur-3) var(--ease-out); box-shadow: 0 0 48px rgba(0, 0, 0, .35); }
    .backdrop { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(0, 0, 0, .4); opacity: 0; pointer-events: none; transition: opacity var(--dur-2) var(--ease-out); }

  /* keep LAST: under reduced motion every animation and transition ends at once */

</style>

<script>
const $main = document.getElementById('main');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)');  // live: an OS change applies without a reload
const smoothScroll = () => REDUCED.matches ? 'auto' : 'smooth';
// disabled plus a spinner while an async action runs (labels never change)
const setBusy = (btn, on) => { btn.disabled = on; on ? btn.setAttribute('aria-busy', 'true') : btn.removeAttribute('aria-busy'); };
const svgIcon = paths => `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
const ICONS = {

  bot: svgIcon('<rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 8V4M8 4h8"/><path d="M9 13.5h.01M15 13.5h.01"/>'),
  copy: svgIcon('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>'),
  sun: svgIcon('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>'),
  moon: svgIcon('<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'),
  monitor: svgIcon('<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>'),
  mic: svgIcon('<rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/>'),
  chat: svgIcon('<path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9.7 9.7 0 0 1-2.6-.35L3.5 21l1.4-4A8.1 8.1 0 0 1 3 11.5 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>'),
  compare: svgIcon('<rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/>'),
  search: svgIcon('<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>'),
  chevron: svgIcon('<polyline points="6 9 12 15 18 9"/>'),
  check: svgIcon('<polyline points="20 6 9 17 4 12"/>'),
  swap: svgIcon('<path d="M4 9h13l-3.5-3.5M17 9l-3.5 3.5"/><path d="M20 15H7l3.5-3.5M7 15l3.5 3.5"/>'),
  play: svgIcon('<polygon points="6 4 20 12 6 20 6 4"/>'),
  clock: svgIcon('<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>'),
};
let RUNS = null;
let STARS = new Set();
let NOTES = {};
let LLM_MODEL = '';  // the model behind Ask AI, reported by /api/runs

const dataHref = path => '/data/' + path.split('/').map(encodeURIComponent).join('/');
const scenHref = (runPath, id) => '#/scenario/' + encodeURIComponent(runPath + '/' + id);

async function toggleStar(path, rerender) {
  const starred = !STARS.has(path);
  starred ? STARS.add(path) : STARS.delete(path);
  rerender();
  try {
    await postForm('/api/star', formData({ path, starred }));
  } catch (e) {
    starred ? STARS.delete(path) : STARS.add(path);  // roll back on failure
    rerender();
  }
}
const starIcon = path => `<span class="star ${STARS.has(path) ? 'on' : ''}">${ICONS.star}</span>`;

// Hidden runs are a per-browser preference: kept in localStorage and never sent to the
// server, so every computer has its own list.
const HIDDEN_KEY = 'viewer_hidden_runs';

function loadHiddenRuns() {
  try {
    const stored = JSON.parse(localStorage.getItem(HIDDEN_KEY) || '[]');
    return new Set(Array.isArray(stored) ? stored.filter(p => typeof p === 'string') : []);
  } catch (e) {
    return new Set();  // storage blocked (private mode): hiding lasts for this page only
  }
}
const HIDDEN = loadHiddenRuns();

function toggleHidden(path, rerender) {
  HIDDEN.has(path) ? HIDDEN.delete(path) : HIDDEN.add(path);
  try {
    localStorage.setItem(HIDDEN_KEY, JSON.stringify([...HIDDEN].sort()));
  } catch (e) { /* keep the in-memory state even when it can't be persisted */ }
  rerender();
}
const hideIcon = path => HIDDEN.has(path)
  ? `<span class="eye on" title="Hidden on this computer — click to show it again">${ICONS.eyeOff}</span>`
  : `<span class="eye" title="Hide this run from the list on this computer">${ICONS.eyeOff}</span>`;

// a one-shot green flash on a note field that just saved
const flashSaved = el => {
  el.classList.add('just-saved');
  el.addEventListener('animationend', () => el.classList.remove('just-saved'), { once: true });
};

async function saveRunNote(path, value) {
  const note = value.trim();
  const previous = NOTES[path] || '';
  if (note === previous) return note;
  note ? NOTES[path] = note : delete NOTES[path];
  try {
    return (await postForm('/api/note', formData({ path, note }))).note;
  } catch (e) {
    previous ? NOTES[path] = previous : delete NOTES[path];
    throw e;
  }
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const displayModelName = model => {
  const name = String(model || '').split('/').filter(Boolean).pop() || '';
  return name.replace(/^gpt(?=$|[-_.])/i, 'GPT');
};

function renderMarkdownInline(value) {
  return String(value ?? '').split(/(`[^`\n]*`)/g).map(part => {
    if (part.startsWith('`') && part.endsWith('`')) {
      return `<code>${esc(part.slice(1, -1))}</code>`;
    }
    return esc(part)
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
      .replace(/__([^_\n]+)__/g, '<strong>$1</strong>')
      .replace(/~~([^~\n]+)~~/g, '<s>$1</s>')
      .replace(/(^|[\s(])\*([^*\n]+)\*(?=$|[\s).,!?:;，。！？：；])/g, '$1<em>$2</em>')
      .replace(/\[([^\]\n]+)\]\(((?:https?:\/\/|mailto:)[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }).join('');
}

function renderMarkdown(value) {
  const lines = String(value ?? '').replace(/\r\n?/g, '\n').split('\n');
  const html = [];
  let paragraph = [];
  let listType = null;
  let listStart = null;
  let listItems = [];
  let quote = [];
  let code = null;
  let codeLanguage = '';

  const flushParagraph = () => {
    if (paragraph.length) html.push(`<p>${paragraph.map(renderMarkdownInline).join('<br>')}</p>`);
    paragraph = [];
  };
  const flushList = () => {
    if (listType) {
      const start = listType === 'ol' && listStart !== 1 ? ` start="${listStart}"` : '';
      html.push(`<${listType}${start}>${listItems.join('')}</${listType}>`);
    }
    listType = null;
    listStart = null;
    listItems = [];
  };
  const flushQuote = () => {
    if (quote.length) html.push(`<blockquote>${quote.map(renderMarkdownInline).join('<br>')}</blockquote>`);
    quote = [];
  };
  const flushBlocks = () => {
    flushParagraph();
    flushList();
    flushQuote();
  };
  const tableCells = line => line.trim().replace(/^\||\|$/g, '').split('|').map(cell => cell.trim());

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    if (code !== null) {
      if (/^\s*```\s*$/.test(line)) {
        const language = codeLanguage ? ` class="language-${esc(codeLanguage)}"` : '';
        html.push(`<pre><code${language}>${esc(code.join('\n'))}</code></pre>`);
        code = null;
        codeLanguage = '';
      } else {
        code.push(line);
      }
      continue;
    }

    const fence = line.match(/^\s*```([\w.+-]*)\s*$/);
    if (fence) {
      flushBlocks();
      code = [];
      codeLanguage = fence[1];
      continue;
    }

    if (!line.trim()) {
      flushBlocks();
      continue;
    }

    if (line.includes('|') && i + 1 < lines.length) {
      const separator = tableCells(lines[i + 1]);
      if (separator.length > 1 && separator.every(cell => /^:?-{3,}:?$/.test(cell))) {
        flushBlocks();
        const headers = tableCells(line);
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim() && lines[i].includes('|')) {
          rows.push(tableCells(lines[i]));
          i++;
        }
        i--;
        html.push(`<div class="markdown-table-wrap"><table><thead><tr>${headers.map(cell => `<th>${renderMarkdownInline(cell)}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${headers.map((_, index) => `<td>${renderMarkdownInline(row[index] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
        continue;
      }
    }

    const heading = line.match(/^(#{1,4})\s+(.+)$/);
    if (heading) {
      flushBlocks();
      const level = Math.min(6, heading[1].length + 2);
      html.push(`<h${level}>${renderMarkdownInline(heading[2])}</h${level}>`);
      continue;
    }

    if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
      flushBlocks();
      html.push('<hr>');
      continue;
    }

    const list = line.match(/^\s*(?:([-+*])|(\d+)[.)])\s+(.+)$/);
    if (list) {
      flushParagraph();
      flushQuote();
      const nextType = list[2] ? 'ol' : 'ul';
      if (listType && listType !== nextType) flushList();
      if (!listType) {
        listType = nextType;
        listStart = nextType === 'ol' ? Number(list[2]) : null;
      }
      const item = list[3].replace(/^\[([ xX])\]\s+/, (_, checked) => checked === ' ' ? '☐ ' : '☑ ');
      listItems.push(`<li>${renderMarkdownInline(item)}</li>`);
      continue;
    }

    const blockquote = line.match(/^\s*>\s?(.*)$/);
    if (blockquote) {
      flushParagraph();
      flushList();
      quote.push(blockquote[1]);
      continue;
    }

    flushList();
    flushQuote();
    paragraph.push(line.trim());
  }

  if (code !== null) html.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);
  flushBlocks();
  return html.join('');
}

const fmtScore = v => (v === null || v === undefined) ? '<span class="muted">—</span>' : Number(v).toFixed(v >= 1 || v === 0 ? 2 : 3).replace(/\.?0+$/,'') || '0';
const fmtDur = ms => ms == null ? '—' : (ms/1000 < 90 ? (ms/1000).toFixed(1)+'s' : (ms/60000).toFixed(1)+'min');
const passBadge = p => p === true ? '<span class="badge pass">PASS</span>' : p === false ? '<span class="badge fail">FAIL</span>' : '<span class="badge na">—</span>';

const jsonPreview = (label, value) => `
  <details class="json-preview">
    <summary>${esc(label)}</summary>
    <div class="json-preview-toolbar">
      <button class="navbtn json-wrap-toggle" type="button" aria-pressed="true">Auto wrap: On</button>
    </div>
    <pre>${esc(JSON.stringify(value, null, 2))}</pre>
  </details>`;

$main.addEventListener('click', event => {
  const button = event.target.closest('.json-wrap-toggle');
  if (!button) return;
  const preview = button.closest('.json-preview');
  const wrapped = preview.classList.toggle('no-wrap') === false;
  button.setAttribute('aria-pressed', String(wrapped));
  button.textContent = `Auto wrap: ${wrapped ? 'On' : 'Off'}`;
});

async function copyText(text) {
  if (navigator.clipboard?.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      return;
    } catch (_) {
      // Fall through for browsers that block the Clipboard API.
    }
  }
  const input = document.createElement('textarea');
  input.value = text;
  input.style.position = 'fixed';
  input.style.opacity = '0';
  document.body.appendChild(input);
  input.focus();
  input.select();
  const copied = document.execCommand('copy');
  input.remove();
  if (!copied) throw new Error('copy failed');
}

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ' → ' + r.status);
  return r.json();
}

function invalidateRuns() {
  RUNS = null;
  Object.keys(_runCache).forEach(k => delete _runCache[k]);  // re-imported runs may differ
}

async function loadRuns() {
  if (!RUNS) {
    const d = await getJSON('/api/runs');
    RUNS = d.runs;
    STARS = new Set(d.stars || []);
    NOTES = d.notes || {};
    LLM_MODEL = d.llm_model || '';
  }
  return RUNS;
}

/* ---------- run list ---------- */
const listState = { q: '', agent_name: '', modality: '', view: 'all', sort: 'timestamp', dir: -1 };

// collapse agent variants into a fixed set of families for the sidebar filter
const AGENT_GROUPS = ['TalkDesk', 'ElevenLabs', 'Gemini-3.1-flash-live', 'GPT-Realtime-2.1', 'others'];

function agentGroup(name) {
  const n = (name || '').toLowerCase();
  if (!n) return '';  // runs without an agent name stay reachable only under "All agents"
  if (n.includes('talkdesk')) return 'TalkDesk';
  if (n.includes('elevenlabs')) return 'ElevenLabs';
  if (n.includes('gemini')) return 'Gemini-3.1-flash-live';
  if (n.includes('realtime')) return 'GPT-Realtime-2.1';
  return 'others';
}

const MODALITIES = [['voice', 'Voice'], ['text', 'Text']];
const modalityLabel = m => (MODALITIES.find(([k]) => k === m) || [])[1] || '';
const modalityTag = m => m
  ? `<span class="mode-tag">${m === 'voice' ? ICONS.mic : ICONS.chat}${modalityLabel(m)}</span>`
  : '<span class="muted">—</span>';
// runs whose caller was tau2-bench's native user simulator (user_simulator.json in the run dir)
const userSimTag = engine => engine === 'tau2'
  ? '<span class="mode-tag" style="margin-left:6px" title="Caller simulated by tau2-bench’s native user simulator">τ² user</span>'
  : '';

const runSorters = {
  timestamp: r => r.timestamp || '',
  modality: r => r.modality || '',
  run_name: r => r.run_name || '',
  agent_name: r => r.agent_name || '',
  scenarios: r => r.has_results ? r.scenarios_passed / Math.max(1, r.scenarios_total) : null,
  primary_score: r => r.primary_score,
  eval_final: r => r.eval_final,
};

function sortRows(rows, sorters, key, dir) {
  const get = sorters[key] || (() => null);
  return [...rows].sort((a, b) => {
    const va = get(a), vb = get(b);
    if (va == null && vb == null) return 0;
    if (va == null) return 1;  // missing values sink to the bottom either way
    if (vb == null) return -1;
    if (typeof va === 'string') return va.localeCompare(vb, undefined, { numeric: true, sensitivity: 'base' }) * dir;
    return (va < vb ? -1 : va > vb ? 1 : 0) * dir;
  });
}

const sortableTh = (key, label, state, cls = '') => {
  const active = state.sort === key;
  return `<th data-sort="${key}" class="${cls} ${active ? (state.dir > 0 ? 'sorted-asc' : 'sorted-desc') : ''}"
    aria-sort="${active ? (state.dir > 0 ? 'ascending' : 'descending') : 'none'}">${label}<span class="sort-ind"></span></th>`;
};

function filteredRuns() {
  const runs = RUNS || [];
  const hiddenRuns = runs.filter(r => HIDDEN.has(r.path));
  const pool = listState.view === 'hidden' ? hiddenRuns : runs.filter(r => !HIDDEN.has(r.path));
  return {
    hiddenCount: hiddenRuns.length,
    pool,
    rows: pool.filter(r =>
      (listState.view !== 'starred' || STARS.has(r.path)) &&
      (!listState.agent_name || agentGroup(r.agent_name) === listState.agent_name) &&
      (!listState.modality || r.modality === listState.modality) &&
      (!listState.q || r.run_name.toLowerCase().includes(listState.q)
        || (r.agent_name || '').toLowerCase().includes(listState.q)
        || (NOTES[r.path] || '').toLowerCase().includes(listState.q))),
  };
}

const copyNameBtn = name => `<button class="copy-run-name" type="button" data-run-name="${esc(name)}"
  title="Copy run name" aria-label="Copy run name ${esc(name)}"><span>${esc(name)}</span><span class="copy-icon" aria-hidden="true">${ICONS.copy}</span><span class="copy-feedback" aria-live="polite"></span></button>`;

// the part from -<N>trials- on (timestamp + run id) only tells runs of one config apart: muted
const runNameHTML = name => {
  const m = String(name ?? '').match(/^(.+?)(-\d+trials-.*)$/);
  return m ? `${esc(m[1])}<span class="run-suffix">${esc(m[2])}</span>` : esc(name);
};
// a 56px bar under the Scenarios badge, so 69/70 and 0/70 no longer look alike
const ratioBar = (passed, total) => total
  ? `<span class="ratio" style="--r:${Math.min(1, Math.max(0, (Number(passed) || 0) / total)).toFixed(3)}" aria-hidden="true"></span>`
  : '';

function runRowHTML(r) {
  return `
  <tr class="rowlink" data-href="#/run/${encodeURIComponent(r.path)}">
    <td class="starcell" data-path="${esc(r.path)}">${starIcon(r.path)}</td>

// One-shot fade of a fresh table's first 20 rows (step > 0: staggered by step ms). Only route() (run list,
// scenario table) and the sidebar filters call it, never the polled jobs / schedules tables; the update*Rows
// re-renders strip it, so search, sort and star toggles never replay it.
function staggerRows(tbody, step = 16) {
  if (!tbody) return;
  [...tbody.rows].slice(0, 20).forEach((tr, i) => tr.style.setProperty('--d', i * step + 'ms'));
  tbody.classList.add('rows-enter');
  clearTimeout(tbody._enterT);
  tbody._enterT = setTimeout(() => tbody.classList.remove('rows-enter'), 20 * step + 700);  // after the last row's ratio bar has grown
}

// Refreshes only the table + counters; the shell (and the topbar search box) stay put,
// so typing in the search never rebuilds the input it is typing into.
function updateRunRows() {
  const head = document.getElementById('runHead');
  if (!head) return;  // not on the list view
  const tbody = document.getElementById('runRows');
  tbody.classList.remove('rows-enter');
  const { rows, pool, hiddenCount } = filteredRuns();
  const sorted = sortRows(rows, runSorters, listState.sort, listState.dir);
  head.innerHTML = `<tr><th></th><th></th>${sortableTh('timestamp', 'Time (UTC)', listState)}${sortableTh('run_name', 'Run', listState)}${sortableTh('agent_name', 'Agent', listState)}${sortableTh('modality', 'Mode', listState)}${sortableTh('scenarios', 'Scenarios', listState)}${sortableTh('primary_score', 'Primary', listState)}${sortableTh('eval_final', 'Eval final', listState)}<th>Note</th></tr>`;
  tbody.innerHTML = sorted.map(runRowHTML).join('');
  document.getElementById('listCount').textContent =
    `${sorted.length} / ${pool.length} ${listState.view === 'hidden' ? 'hidden runs' : 'runs'}`
    + (listState.view !== 'hidden' && hiddenCount ? ` · ${hiddenCount} hidden on this computer` : '');
  const empty = document.getElementById('listEmpty');
  empty.hidden = !!sorted.length;
  empty.textContent = listState.view === 'hidden'
    ? 'No hidden runs — use the eye icon on a row to hide one.'
    : 'No runs match the filters.';
  updateSideNav();
}

function modalityCounts() {

/* ---------- compare two runs, aligned by scenario id ---------- */
const cmpState = { sort: 'id', dir: 1, diffOnly: false };
const cmpSorters = {
  id: r => r.id,
  a_passed: r => r.a.passed === true ? 2 : r.a.passed === false ? 1 : null,
  a_goal: r => r.a.goal_score,
  a_turns: r => r.a.turn_count,
  a_dur: r => r.a.duration_ms,
  b_passed: r => r.b.passed === true ? 2 : r.b.passed === false ? 1 : null,
  b_goal: r => r.b.goal_score,
  b_turns: r => r.b.turn_count,
  b_dur: r => r.b.duration_ms,
};
let CUR_CMP = null;  // the /api/compare payload while the compare page is on screen

const cmpShortName = r => `${r.agent_name || r.path.split('-1trials-')[0]}${r.modality ? ` (${modalityLabel(r.modality)})` : ''}`;

// The other side of the comparison worth defaulting to: same domain and task count,
// opposite modality — the only pairing where a text-vs-voice delta means anything.
function defaultCounterpart(anchor) {
  const runs = (RUNS || []).filter(r => r.scenario_count && r.path !== anchor.path);  // RUNS is newest-first
  const sameDomain = r => (r.domains || []).some(d => (anchor.domains || []).includes(d));
  const sameTasks = r => sameDomain(r) && r.scenario_count === anchor.scenario_count;
  const crossModal = r => r.modality && anchor.modality && r.modality !== anchor.modality;
  return runs.find(r => crossModal(r) && sameTasks(r))
    || runs.find(r => crossModal(r) && sameDomain(r))
    || runs.find(r => sameTasks(r))
    || runs.find(r => sameDomain(r))
    || runs[0];
}

function defaultComparePair() {
  const runs = (RUNS || []).filter(r => r.scenario_count);
  const a = runs.find(r => r.modality === 'text') || runs[0];
  return a ? [a.path, defaultCounterpart(a)?.path || ''] : ['', ''];
}

/* ---------- run picker ----------
   The archive holds a hundred-plus runs, so each side is a filterable listbox rather than a
   native <select>: every row carries what you actually choose on (modality, date, task set,
   pass ratio, score), and rows are grouped by how well they line up with the other side —
   scenarios are matched by id, so a pair with no shared task set yields an empty table. */
const runTaskLabel = r => `${r.scenario_count} task${r.scenario_count === 1 ? '' : 's'}`;
const runSubline = r => [
  (r.timestamp || '?').replace(/:\d\d(?=Z$)/, ''),  // minutes are enough to tell runs apart
  (r.domains || []).join(', ') || 'no domain',
  runTaskLabel(r),
].join(' · ');
const runScenarioBadge = r => r.has_results
  ? `<span class="badge ${r.scenarios_passed === r.scenarios_total ? 'pass' : 'fail'}">${r.scenarios_passed}/${r.scenarios_total}</span>`
  : '<span class="badge na">no results</span>';
const runSearchText = r => [r.run_name, r.agent_name, modalityLabel(r.modality),
  r.user_simulator === 'tau2' ? 'tau2 user simulator' : '',
  (r.domains || []).join(' '), NOTES[r.path] || ''].join(' ').toLowerCase();

const runTitleHTML = r => `<span class="rc-title"><span>${esc(r.agent_name || r.run_name)}</span>${
  modalityTag(r.modality)}${userSimTag(r.user_simulator)}${STARS.has(r.path) ? `<span class="star on">${ICONS.star}</span>` : ''}</span>`;

// Hidden runs stay out of the list — the eye icon means "stop showing me this" — unless one of
// them is already on the page, where dropping it silently would be more confusing than showing it.
function cmpPickerGroups(side, selected, otherPath, query) {
  const q = (query || '').trim().toLowerCase();
  const rows = (RUNS || [])
    .filter(r => !HIDDEN.has(r.path) || r.path === selected || r.path === otherPath)
    .filter(r => !q || runSearchText(r).includes(q))
    .sort((x, y) => STARS.has(y.path) - STARS.has(x.path));  // stable, so newest-first within each group
  const other = (RUNS || []).find(r => r.path === otherPath);
  if (!other) return [['', rows]];
  const sharesDomain = r => (r.domains || []).some(d => (other.domains || []).includes(d));
  const rank = r => !sharesDomain(r) ? 2 : r.scenario_count === other.scenario_count ? 0 : 1;
  const L = side === 'a' ? 'B' : 'A';
  return [`Same task set as ${L}`, `Same domain as ${L}`, 'Other runs']
    .map((label, i) => [label, rows.filter(r => rank(r) === i)]);
}

function cmpOptionHTML(side, r, selected, otherPath, idx) {
  const other = (RUNS || []).find(x => x.path === otherPath);
  const taken = r.path === otherPath;
  const crossModal = other && r.modality && other.modality && r.modality !== other.modality;
  return `<div class="rc-opt${taken ? ' taken' : ''}" id="rc-${side}-${idx}" role="option"
    data-path="${esc(r.path)}" aria-selected="${r.path === selected}"${taken ? ' aria-disabled="true"' : ''}
    title="${esc(r.run_name)}">
    <span class="rc-tick">${r.path === selected ? ICONS.check : ''}</span>
    <span class="rc-body">${runTitleHTML(r)}<span class="rc-sub">${esc(runSubline(r))}</span></span>
    <span class="rc-meta">${taken ? `<span class="rc-note">already ${side === 'a' ? 'B' : 'A'}</span>`
      : crossModal ? '<span class="rc-note rc-cross">cross-modal</span>' : ''
      }${runScenarioBadge(r)}<span class="rc-score">${fmtScore(r.primary_score)}</span></span>
  </div>`;
}

function cmpOptionsHTML(side, selected, otherPath, query) {
  let idx = 0;
  const html = cmpPickerGroups(side, selected, otherPath, query)
    .filter(([, rows]) => rows.length)
    .map(([label, rows]) => (label ? `<div class="rc-group">${esc(label)}</div>` : '')
      + rows.map(r => cmpOptionHTML(side, r, selected, otherPath, idx++)).join(''))
    .join('');
  return html || '<div class="rc-none">No run matches this filter.</div>';
}

function cmpPickerHTML(side, selected) {
  const id = side === 'a' ? 'cmpA' : 'cmpB';

      <span class="rc-side" aria-hidden="true">${L}</span>

        ? runTitleHTML(r) + `<span class="rc-sub">${esc(runSubline(r))}</span>`

           <span class="rc-sub">${(RUNS || []).length} runs archived</span>`}</span>

      <span class="rc-chev">${ICONS.chevron}</span>
    </button>
    <div class="rc-pop" hidden>
      <div class="rc-search">${ICONS.search}<input type="text" autocomplete="off" spellcheck="false"
        aria-label="Filter runs" placeholder="Filter by run, agent, domain, note…"></div>
      <div class="rc-list" id="${id}-list" role="listbox" aria-label="Runs"></div>
      <div class="rc-foot"><kbd>↑</kbd><kbd>↓</kbd> move <kbd>↵</kbd> select
        <kbd>esc</kbd> close<span class="rc-count"></span></div>
    </div>
  </div>`;
}

const setComboOpen = (root, on) => {
  root.classList.toggle('open', on);
  root.querySelector('.rc-pop').hidden = !on;
  root.querySelector('.rc-btn').setAttribute('aria-expanded', String(on));
};

// One stateless closer for clicks outside a picker: renderCompare replaces the pickers
// wholesale, so per-instance document listeners would pile up on detached nodes.
document.addEventListener('pointerdown', e => {
  document.querySelectorAll('.run-combo.open').forEach(root => {
    if (!root.contains(e.target)) setComboOpen(root, false);
  });
}, true);

function initCmpPicker(side, selected, otherPath, onPick) {
  const root = document.getElementById(side === 'a' ? 'cmpA' : 'cmpB');
  const btn = root.querySelector('.rc-btn');
  const input = root.querySelector('.rc-search input');
  const list = root.querySelector('.rc-list');
  const count = root.querySelector('.rc-count');
  const options = () => [...list.querySelectorAll('.rc-opt:not(.taken)')];
  const activeIndex = () => options().findIndex(el => el.classList.contains('active'));

  const setActive = i => {
    const all = options();
    if (!all.length) { list.removeAttribute('aria-activedescendant'); return; }
    const n = (i + all.length) % all.length;
    all.forEach((el, k) => el.classList.toggle('active', k === n));
    all[n].scrollIntoView({ block: 'nearest' });
    list.setAttribute('aria-activedescendant', all[n].id);
  };
  const draw = () => {
    list.innerHTML = cmpOptionsHTML(side, selected, otherPath, input.value);
    const shown = list.querySelectorAll('.rc-opt').length;
    count.textContent = `${shown} run${shown === 1 ? '' : 's'}`;
    setActive(Math.max(0, options().findIndex(el => el.dataset.path === selected)));
  };
  const toggle = on => {
    setComboOpen(root, on);
    if (!on) { btn.focus(); return; }
    input.value = '';  // every open starts from the full list
    draw();
    input.focus();
  };
  const pick = path => {
    setComboOpen(root, false);
    if (path === selected) { btn.focus(); return; }  // same run: nothing to navigate to
    onPick(path);
  };

  btn.addEventListener('click', () => toggle(!root.classList.contains('open')));
  btn.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); toggle(true); }
  });
  input.addEventListener('input', draw);
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(activeIndex() + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(activeIndex() - 1); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      const el = options()[activeIndex()];
      if (el) pick(el.dataset.path);
    } else if (e.key === 'Escape') { e.preventDefault(); toggle(false); }
    else if (e.key === 'Tab') setComboOpen(root, false);
  });
  list.addEventListener('click', e => {
    const el = e.target.closest('.rc-opt');
    if (el && !el.classList.contains('taken')) pick(el.dataset.path);
  });
  list.addEventListener('pointerover', e => {
    const el = e.target.closest('.rc-opt:not(.taken)');
    if (el) setActive(options().indexOf(el));
  });
}

const cmpGoTo = (a, b) => {
  location.hash = '#/compare' + (a || b ? `?a=${encodeURIComponent(a || '')}&b=${encodeURIComponent(b || '')}` : '');
};

function cmpMetricRow(label, va, vb, { fmt = fmtScore, better = 'high', note = '' } = {}) {
  const num = v => (typeof v === 'number' && isFinite(v)) ? v : null;
  const [na, nb] = [num(va), num(vb)];
  let delta = '<span class="muted">—</span>';
  if (na !== null && nb !== null) {
    const d = nb - na;
    const cls = !better || Math.abs(d) < 1e-9 ? '' : (better === 'high') === (d > 0) ? 'up' : 'down';
    const shown = fmt(Math.abs(d));
    delta = `<span class="cmp-delta ${cls}">${d > 0 ? '+' : d < 0 ? '−' : ''}${shown}</span>`;
  }
  const cell = v => v == null ? '<span class="muted">—</span>' : fmt(v);
  return `<tr><td>${esc(label)}${note ? `<div class="subscore">${esc(note)}</div>` : ''}</td>
    <td>${cell(va)}</td><td class="cmp-side">${cell(vb)}</td><td>${delta}</td></tr>`;
}

function cmpSummaryHTML(d) {
  const { a, b, counts } = d;

  const rate = st => st.total ? st.passed / st.total : null;
  const ev = (side, k) => side.evaluation ? side.evaluation[k] : null;
  const crossModal = a.modality && b.modality && a.modality !== b.modality;
  const pct = n => shared ? ` <span class="muted">(${(100 * n / shared).toFixed(0)}%)</span>` : '';
  const chips = [
    ['Shared scenarios', String(shared)],
    ['Both pass', counts.both_pass + pct(counts.both_pass)],
    [`Only ${esc(cmpShortName(a))}`, counts.a_only + pct(counts.a_only)],
    [`Only ${esc(cmpShortName(b))}`, counts.b_only + pct(counts.b_only)],
    ['Both fail', counts.both_fail + pct(counts.both_fail)],
  ];
  const voiceOnly = { note: crossModal ? 'voice-only metric' : '' };
  const notComparable = { better: crossModal ? null : 'high', note: crossModal ? 'not comparable across modalities' : '' };
  const rows = [
    cmpMetricRow('Passed (shared scenarios)', rate(a.stats), rate(b.stats),
      { note: `${a.stats.passed}/${a.stats.total} vs ${b.stats.passed}/${b.stats.total}` }),
    cmpMetricRow('Avg goal score', a.stats.goal_score, b.stats.goal_score),
    cmpMetricRow('Tool recall', a.stats.tool_recall, b.stats.tool_recall),
    cmpMetricRow('Tool precision', a.stats.tool_precision, b.stats.tool_precision),
    cmpMetricRow('Avg tool calls', a.stats.tool_calls, b.stats.tool_calls, { better: null }),
    cmpMetricRow('Avg turns', a.stats.turn_count, b.stats.turn_count, { better: null }),
    cmpMetricRow('Avg duration', a.stats.duration_ms, b.stats.duration_ms, { fmt: fmtDur, better: 'low' }),
    `<tr class="cmp-group"><td colspan="4">talk-bench evaluation (whole run)</td></tr>`,
    cmpMetricRow('Resolution', ev(a, 'resolution'), ev(b, 'resolution')),
    cmpMetricRow('Customer effort', ev(a, 'customer_effort'), ev(b, 'customer_effort')),
    cmpMetricRow('Conversation quality', ev(a, 'conversation_quality'), ev(b, 'conversation_quality')),
    cmpMetricRow('Responsiveness', ev(a, 'responsiveness'), ev(b, 'responsiveness'), voiceOnly),
    cmpMetricRow('Voice consistency', ev(a, 'voice_consistency'), ev(b, 'voice_consistency'), voiceOnly),
    cmpMetricRow('Experience', ev(a, 'experience'), ev(b, 'experience'), notComparable),

  const reasons = side => Object.entries(side.stats.end_reasons || {})

    d.only_in_b.length ? `${d.only_in_b.length} only in ${esc(cmpShortName(b))}` : '',

  return `
  <div class="card">

    ${orphans ? `<p class="muted" style="font-size:12.5px">Scenarios outside the overlap are excluded: ${orphans}.</p>` : ''}
    ${crossModal ? `<div class="cmp-note"><b>跨模态提示：</b>text run 没有 responsiveness / voice consistency
      （记为 0 / null，且不计入它的 experience），voice run 则会被这两项拉低 —— 所以
      <b>Experience 和 Eval final 不能跨模态直接比较</b>。要比 text vs voice，看 Passed / Goal score /
      Resolution / Tool recall 这几行。</div>` : ''}
