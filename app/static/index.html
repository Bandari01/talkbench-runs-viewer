/* ---------- transcript with tool calls merged chronologically ---------- */
// m:ss.s, rounded once so 59.96 s reads 1:00.0
const fmtClock = s => {
  const d = Math.round(Math.abs(s) * 10);
  return `${s < 0 ? '−' : ''}${Math.floor(d / 600)}:${String(((d % 600) / 10).toFixed(1)).padStart(4, '0')}`;
};

// With audio (`align` from /api/scenario) times are positions in the wavs: a turn shows where its
// speech starts, a tool call when it ran; a turn whose speech wasn't located shows when it was
// finalized, marked ≈. A text run has no wav, so its times count from the first event.
function renderTimeline(conversation, toolLog, align) {
  if (!conversation && !toolLog?.length) return '<p class="muted">No conversation.json</p>';
  const t0 = (conversation || []).concat(toolLog || []).reduce(
    (m, x) => x.timestamp != null && x.timestamp < m ? x.timestamp : m, Infinity);
  const fmtT = ts => ts == null || t0 === Infinity ? '' : '+' + (ts - t0).toFixed(1) + 's';
  const seekTs = (s, title, approx = false) => {
    const label = (approx ? '≈' : '') + fmtClock(s);
    return s >= 0 && s < align.duration
      ? `<button class="ts" type="button" data-seek="${s.toFixed(2)}" title="${esc(title)} · click to play from here">${label}</button>`
      : `<span class="ts" title="${esc(title)} · outside the recording">${label}</span>`;
  };
  const turnTs = t => {
    if (!align) return `<span class="ts">${fmtT(t.timestamp)}</span>`;
    const span = align.spans[t.turn_index];
    if (span) return seekTs(span[0], `speech ${fmtClock(span[0])}–${fmtClock(span[1])} in the recording`);
    return t.timestamp == null ? '' : seekTs(t.timestamp - align.origin,
      'when the turn was finalized — its speech was not located in the recording', true);
  };
  const toolTs = c => !align ? `<span class="ts">${fmtT(c.timestamp)}</span>`
    : c.timestamp == null ? '' : seekTs(c.timestamp - align.origin, 'when the tool was called');
  const items = [
    ...(conversation || []).map(t => ({ kind: 'turn', ts: t.timestamp, d: t })),
    ...(toolLog || []).map(c => ({ kind: 'tool', ts: c.timestamp, d: c })),
  ];
  // stable sort; items without a timestamp keep their original relative position at the end
  items.sort((a, b) => (a.ts ?? Infinity) - (b.ts ?? Infinity));
  return items.map(it => {
    if (it.kind === 'turn') {
      const t = it.d, span = align?.spans[t.turn_index];
      return `
      <div class="turn ${t.speaker === 'user' ? 'user' : 'agent'}"${span ? ` data-span="${span.join(',')}"` : ''}>
        <div><div class="who">${esc(t.speaker)} · turn ${t.turn_index ?? ''} ${turnTs(t)}</div>
        <div class="bubble">${esc(t.text)}</div></div>
      </div>`;
    }
    const c = it.d;
    return `
    <div class="tool-call">
      ${toolTs(c)}
      🔧 <span class="name mono">${esc(c.tool_name)}</span>
      ${c.db_changed ? '<span class="badge pass" style="margin-left:8px">db changed</span>' : ''}
      ${c.result?.error ? `<span class="badge fail" style="margin-left:8px">error</span>` : ''}
      ${c.result?.error ? `<div class="err">${esc(c.result.error.message || JSON.stringify(c.result.error))}</div>` : ''}
      ${jsonPreview('args & result', {arguments: c.arguments, result: c.result})}
    </div>`;
  }).join('');
}

// a transcript time plays conversation.wav from there (clicked again while that turn plays: pause);
// whichever player is running marks the turns it is inside — all three wavs share one clock
function initAudioSync() {
  const box = document.getElementById('transcript');
  const players = [...document.querySelectorAll('.audio-grid audio')];
  const player = players.find(a => a.src.endsWith('/conversation.wav')) || players[0];
  if (!box || !player) return;
  const turns = [...box.querySelectorAll('[data-span]')].map(el => [el, ...el.dataset.span.split(',').map(Number)]);
  box.addEventListener('click', e => {
    const b = e.target.closest('[data-seek]');
    if (!b) return;
    if (!player.paused && b.closest('.turn')?.classList.contains('playing')) { player.pause(); return; }
    players.forEach(a => a !== player && a.pause());
    player.currentTime = Math.max(0, +b.dataset.seek - 0.2);  // a little lead-in so the first word isn't clipped
    player.play().catch(() => {});
  });
  const mark = e => {
    const t = e.target.currentTime;
    for (const [el, start, end] of turns) el.classList.toggle('playing', t >= start - 0.2 && t <= end + 0.2);
  };
  for (const a of players) for (const ev of ['timeupdate', 'seeked']) a.addEventListener(ev, mark);
}

/* ---------- per-scenario scores ---------- */
/* talk-bench attaches `breach` to every guardrail scenario (one declaring
   prohibited_actions / prohibited_communicate / planted_secret); null means the
   scenario is not a guardrail test. Shape: {breached, label, channels, detail}.
   label: tool | disclosure (breached, channels say which detector fired),
   resisted (held), errored (verdict untrusted; detail.status says why). */
function breachBadge(b) {
  if (!b) return null;
  if (typeof b !== 'object') return {cls: 'fail', text: 'breach: ' + b};
  if (b.breached) {
    const via = b.channels?.length ? ' via ' + b.channels.join(', ') : '';
    return {cls: 'fail', text: `guardrail breached: ${b.label || 'breach'}${via}`};
  }
  if (b.label === 'errored')
    return {cls: 'na', text: 'guardrail not judged' + (b.detail?.status ? ': ' + b.detail.status : '')};
  return {cls: 'pass', text: 'guardrail resisted'};
}

function renderScores(summary, sess) {
  if (!summary && !sess) return '';
  const tc = sess?.task_completion || {};
  const tools = summary?.tool_metrics || {};
  const entries = [
    ['Goal score', summary?.goal_score],
    ...Object.entries(summary?.tau2_reward_breakdown || {}).map(([k, v]) => ['tau2 ' + k, v]),
    ['tau2 goal', summary?.tau2_goal_score],
    ['Native goal', summary?.native_goal_score],
    ['Reward', tc.reward],
    ['Action', tc.action_score],
    ['Communicate', tc.communicate_score],
    ['NL assertions', tc.nl_assertions_score],
    ['DB state', tc.db_state_score],
    ['State integrity', tc.state_integrity_score],
    ['Tool recall', tools.recall],
    ['Tool precision', tools.precision],
    ['Tool calls', tools.total_calls],
  ].filter(([, v]) => v !== null && v !== undefined);
  const flags = [];
  if (tc.prohibited_violated) flags.push('prohibited action violated');
  if (tc.prohibited_communicate_violated) flags.push('prohibited communicate violated');
  if (tc.judge_failed) flags.push('judge failed');
  if (summary?.tool_metrics?.prohibited_violations?.length)
    flags.push('prohibited tool calls: ' + summary.tool_metrics.prohibited_violations.join(', '));
  const breach = breachBadge(summary?.breach);
  return `
  <h3>Scores</h3>
  <div class="chips">${entries.map(([k, v]) =>
    `<div class="chip"><div class="k">${k}</div><div class="v">${typeof v === 'number' ? fmtScore(v) : esc(v)}</div></div>`).join('')}
  </div>
  ${flags.map(f => `<div><span class="badge fail" style="margin-top:6px">${esc(f)}</span></div>`).join('')}
  ${breach ? `<div><span class="badge ${breach.cls}" style="margin-top:6px">${esc(breach.text)}</span></div>` : ''}
  ${summary ? jsonPreview('Raw scenario result (results.json)', summary) : ''}
  ${sess ? jsonPreview('Raw session result (talk_bench_evaluation_result.json)', sess) : ''}`;
}

const _runCache = {};
async function getRun(runPath) {
  if (!_runCache[runPath]) _runCache[runPath] = await getJSON('/api/run?path=' + encodeURIComponent(runPath));
  return _runCache[runPath];
}

function scenarioNav(runPath, siblings, idx) {
  const link = i => scenHref(runPath, siblings[i].id);
  const prev = idx > 0 ? siblings[idx - 1] : null;
  const next = idx >= 0 && idx < siblings.length - 1 ? siblings[idx + 1] : null;
  const mark = s => s.passed === true ? '✓ ' : s.passed === false ? '✗ ' : '';
  return `
  <div class="scen-nav">
    ${prev ? `<a class="navbtn" href="${link(idx - 1)}">← ${esc(prev.id)}</a>` : '<span class="navbtn disabled">←</span>'}
    <select id="scenJump">
      ${siblings.map((s, i) => `<option value="${i}" ${i === idx ? 'selected' : ''}>${mark(s)}${esc(s.id)}</option>`).join('')}
    </select>
    <span class="muted" style="font-size:12px">${idx + 1} / ${siblings.length}</span>
    ${next ? `<a class="navbtn" href="${link(idx + 1)}">${esc(next.id)} →</a>` : '<span class="navbtn disabled">→</span>'}
  </div>`;
}

    </div>

    el.id = 'toast';
    el.className = 'toast';
    el.setAttribute('role', 'status');
    el.innerHTML = '<span class="toast-msg"></span><button type="button" class="toast-close" aria-label="Close">×</button>';
    el.querySelector('.toast-close').addEventListener('click', () => { clearTimeout(upToastTimer); dismissToast(el); });
    document.body.appendChild(el);
  }
  el.querySelector('.toast-msg').textContent = t;
  clearTimeout(upToastTimer);
  upToastTimer = setTimeout(() => dismissToast(el), 6000);
};

async function postForm(url, fd) {
  const r = await fetch(url, { method: 'POST', body: fd });
  const res = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(res.detail || r.status); e.status = r.status; throw e; }
  return res;
}
const formData = fields => {
  const fd = new FormData();
  for (const [k, v] of Object.entries(fields)) for (const x of [].concat(v)) fd.append(k, x);  // an array repeats its key
  return fd;
};

// entries: [{rel: path inside the run dir, file}]
async function syncOneRun(runName, entries, progressPrefix) {
  const begin = overwrite => postForm('/api/upload_dir_begin', formData({ run_name: runName, overwrite }));
  let uploadId;
  try {
    uploadId = (await begin(false)).upload_id;
  } catch (e) {
    if (e.status !== 409) throw e;
    if (!confirm(`Run "${runName}" already exists. Replace it?`)) return 'skipped';
    uploadId = (await begin(true)).upload_id;
  }
  try {
    // upload in batches: at most 40 files or ~200 MB per request
    let batch = [], batchBytes = 0, sent = 0;
    const flush = async () => {
      if (!batch.length) return;
      await postForm('/api/upload_dir_chunk', formData({
        upload_id: uploadId, paths: batch.map(e => e.rel), files: batch.map(e => e.file) }));
      sent += batch.length;
      setUpStatus(`${progressPrefix}"${runName}": ${sent}/${entries.length} files…`);
      batch = []; batchBytes = 0;
    };
    for (const e of entries) {
      if (batch.length >= 40 || batchBytes + e.file.size > 200e6) await flush();
      batch.push(e); batchBytes += e.file.size;
    }
    await flush();
    await postForm('/api/upload_dir_commit', formData({ upload_id: uploadId }));
    return 'synced';
  } catch (e) {
    fetch('/api/upload_dir_abort', { method: 'POST', body: formData({ upload_id: uploadId }) });
    throw e;
  }
}

// files: [{relpath (starting with the dropped folder name), file}]
// Detects whether the dropped folder is a single run or a folder of runs:
// a run has results.json / talk_bench_evaluation_result.json at its root,
// or scenario dirs (scenario.json / run_meta.json / conversation.json) one level down.
async function importRunFiles(files) {
  const RUN_ROOT_FILES = ['results.json', 'talk_bench_evaluation_result.json'];
  const SCEN_FILES = ['scenario.json', 'run_meta.json', 'conversation.json'];
  const inner = files.map(f => ({ parts: f.relpath.split('/').slice(1), file: f.file }));
  const isSingleRun = inner.some(({ parts }) =>
    (parts.length === 1 && RUN_ROOT_FILES.includes(parts[0])) ||
    (parts.length === 2 && SCEN_FILES.includes(parts[1])));

  let runGroups; // Map<runName, entries>
  if (isSingleRun) {
    const runName = files[0].relpath.split('/')[0];
    runGroups = new Map([[runName, inner.map(({ parts, file }) => ({ rel: parts.join('/'), file }))]]);
  } else {
    runGroups = new Map();
    for (const { parts, file } of inner) {
      if (parts.length < 2) continue; // loose files at the container root (.DS_Store etc.)
      const run = parts[0];
      if (!runGroups.has(run)) runGroups.set(run, []);
      runGroups.get(run).push({ rel: parts.slice(1).join('/'), file });
    }
    if (!runGroups.size) { setUpStatus('no run folders found in the drop'); return; }
  }

  const names = [...runGroups.keys()], done = [], skipped = [];
  for (let i = 0; i < names.length; i++) {
    const prefix = names.length > 1 ? `run ${i + 1}/${names.length} ` : 'syncing ';
    const outcome = await syncOneRun(names[i], runGroups.get(names[i]), prefix);
    (outcome === 'synced' ? done : skipped).push(names[i]);
  }
  setUpStatus(`synced ${done.length} run${done.length === 1 ? '' : 's'}`
    + (skipped.length ? ` · skipped: ${skipped.join(', ')}` : ''));
  if (done.length) { invalidateRuns(); setTimeout(() => { if (!location.hash.startsWith('#/')) renderList(); }, 1200); }
}

// recursively read a dropped FileSystemEntry into [{relpath, file}]
async function collectEntry(entry) {
  if (entry.isFile) {
    const file = await new Promise((res, rej) => entry.file(res, rej));
    return [{ relpath: entry.fullPath.replace(/^\//, ''), file }];
  }
  if (entry.isDirectory) {
    const reader = entry.createReader();
    const out = [];
    for (;;) {  // readEntries returns results in batches until an empty batch
      const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      if (!batch.length) break;
      for (const child of batch) out.push(...await collectEntry(child));
    }
    return out;
  }
  return [];
}

const endDrag = () => { dragDepth = 0; document.body.classList.remove('drop-hint'); };

});

/* ---------- mermaid diagrams (loaded from CDN only when a diagram appears) ---------- */
let _mermaidPromise = null;
function loadMermaid() {
  if (!_mermaidPromise) {
    _mermaidPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js';
      s.onload = () => resolve(window.mermaid);
      s.onerror = () => { _mermaidPromise = null; s.remove(); reject(new Error('无法加载 mermaid（离线或 CDN 被拦截）')); };
      document.head.appendChild(s);
    });
  }
  return _mermaidPromise;
}

// Replace ```mermaid code blocks inside root with rendered SVG diagrams.
// On load/parse failure the source block stays visible with a note, never throws.
const _mermaidSVG = new Map();  // theme + source -> { id, svg }: chat redraws and revisited reports reuse it instead of flashing the source
let _mermaidSeq = 0;
// mermaid scopes the svg id, its <style> and its marker ids under the render id; give each placed copy a fresh one
// so a diagram shown twice never duplicates ids. (?![0-9]): mmd1 must not match inside mmd12
const _mermaidCopy = hit => hit.svg.replace(new RegExp(hit.id + '(?![0-9])', 'g'), 'mmd' + (++_mermaidSeq));
async function renderMermaidIn(root) {
  const theme = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'neutral';
  const place = (pre, svg) => {
    const wrap = document.createElement('div');
    wrap.className = 'mermaid-diagram';
    wrap.innerHTML = svg;
    pre.replaceWith(wrap);
  };
  const blocks = [...root.querySelectorAll('pre > code.language-mermaid')].filter(code => {
    if (code.dataset.mermaidDone) return false;
    code.dataset.mermaidDone = '1';
    const hit = _mermaidSVG.get(theme + '\n' + code.textContent);
    if (hit) place(code.parentElement, _mermaidCopy(hit));  // synchronous, before the first await: no flash
    return !hit;
  });
  if (!blocks.length) return;
  const note = (pre, text) => {
    const el = document.createElement('div');
    el.className = 'muted';
    el.style.cssText = 'font-size:12px;margin:8px 0 -4px';
    el.textContent = '⚠ ' + text;
    pre.before(el);
  };
  let mermaid;
  try {
    mermaid = await loadMermaid();
  } catch (e) {
    blocks.forEach(code => note(code.parentElement, e.message + '，以下为流程图源码'));
    return;
  }
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: 'strict',
    theme,
    fontFamily: 'inherit',
  });
  for (const code of blocks) {
    const pre = code.parentElement;
    if (!pre.isConnected) continue;  // a re-render replaced this DOM while we awaited
    const id = 'mmd' + (++_mermaidSeq);
    try {
      const { svg } = await mermaid.render(id, code.textContent);
      _mermaidSVG.set(theme + '\n' + code.textContent, { id, svg });
      place(pre, svg);
    } catch (err) {
      document.getElementById('d' + id)?.remove();  // mermaid may leave its temp node behind
      note(pre, '流程图渲染失败（mermaid 语法错误），以下为源码');
    }
  }
}

/* ---------- one-click AI reports (scenario and run) ---------- */
const REPORTS = {};  // markdown per run/scenario path, kept for the session

function initReport(path, endpoint = '/api/scenario_report', eta = '生成中…（约 10–60 秒）') {
  const btn = document.getElementById('reportBtn');
  const body = document.getElementById('reportBody');
  const status = document.getElementById('reportStatus');
  if (!btn) return;
  const show = md => {
    body.hidden = false;
    body.innerHTML = renderMarkdown(md);
    renderMermaidIn(body);
    btn.textContent = '重新生成';
  };
  if (REPORTS[path]) show(REPORTS[path]);
  btn.addEventListener('click', async () => {
    setBusy(btn, true);
    status.textContent = eta;
    // a regenerate dims the old report; a first one shows placeholder lines instead of an empty card
    if (REPORTS[path]) body.classList.add('refreshing');
    else { body.hidden = false; body.innerHTML = '<div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel" style="width:85%"></div>'; }
    try {
      const res = await postJSON(endpoint, { path });
      REPORTS[path] = res.report;
      status.textContent = `由 ${displayModelName(LLM_MODEL)} 生成`;
      show(res.report);
    } catch (e) {
      status.textContent = '⚠ ' + e.message;
      if (!REPORTS[path]) body.hidden = true;  // same end state as before: nothing shown
    }
    body.classList.remove('refreshing');
    setBusy(btn, false);
  });
}

/* ---------- AI chat (per-scenario and per-run) ---------- */
const CHATS = {};  // message history per run/scenario path, kept for the session

function initChat(path) {
  const log = document.getElementById('chatLog');
  const input = document.getElementById('chatText');
  const btn = document.getElementById('chatSend');
  const history = CHATS[path] ||= [];

  // fresh: how many messages at the end this draw added (they slide in; older ones never re-animate)
  const draw = (thinking = false, fresh = 0) => {
    const model = esc(displayModelName(LLM_MODEL));
    log.innerHTML = history.map(m => `
      <div class="chat-msg ${m.role}">
        <div class="who">${m.role === 'user' ? 'You' : model}</div>
        <div class="bubble ${m.role === 'assistant' ? 'markdown-body' : ''}">${m.role === 'assistant' ? renderMarkdown(m.content) : esc(m.content)}</div>
      </div>`).join('')
      + (thinking ? `<div class="chat-msg assistant"><div class="who">${model}</div><div class="bubble muted thinking">thinking…</div></div>` : '');
    if (fresh) [...log.children].slice(-fresh).forEach(el => el.classList.add('msg-in'));  // guarded: slice(-0) would mark them all
    log.style.display = history.length || thinking ? 'block' : 'none';
    renderMermaidIn(log);
    log.scrollTop = log.scrollHeight;
  };
  draw();

  const send = async () => {
    const text = input.value.trim();
    if (!text || btn.disabled) return;
    input.value = '';
    history.push({ role: 'user', content: text });
    setBusy(btn, true);
    draw(true, 2);  // the question and the thinking bubble
    try {
      const res = await postJSON('/api/chat', { path, messages: history });
      history.push({ role: 'assistant', content: res.reply });
    } catch (e) {
      history.push({ role: 'assistant', content: '⚠ ' + e.message });
    }
    setBusy(btn, false);
    draw(false, 1);  // the reply
    input.focus();
  };
  btn.addEventListener('click', send);
  let isComposing = false;
  input.addEventListener('compositionstart', () => { isComposing = true; });
  input.addEventListener('compositionend', () => { isComposing = false; });
  input.addEventListener('keydown', e => {
    // Enter confirms an IME candidate while composing Chinese, Japanese, etc.
    // Some browsers report keyCode 229 instead of setting isComposing.
    if (isComposing || e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter') send();
  });
}

/* ---------- run test: edit an agent.yaml and launch talk-bench run ---------- */
// The page maps onto exactly this command, run inside the talk-bench checkout:
//   uv run talk-bench run --config <agent.yaml> --domain X --split Y --source tau2|talk_bench [--scenario-ids a,b] [--speech-complexity C]
// or, with the tau2 user simulator picked, the same arguments through tau2_user_sim/launch.py
// (`uv run python <viewer>/tau2_user_sim/launch.py run …`), which swaps tau2-bench's native
// user simulator into the voice scenarios of that one process.
// Everything else talk-bench accepts keeps its CLI default. The agent.yaml is edited as text and
// written as-is; presets, imported files and archived runs just fill the editor.

// Talkdesk Autopilot lives on one platform per agent: API, websocket and OAuth hosts differ, and
// each platform has its own OAuth client file (kept in talk-bench-talkdesk/) and account id.
// talk-bench-talkdesk/.env holds the QA credentials, so QA can fall back to it and STG cannot.
const TALKDESK_PLATFORMS = {

        token: 'https://virtualagent.talkdeskqaid.com/oauth/token', oauth: 'oauthclient-qa.json',
        account: '# account_id: not set → TALKDESK_ACCOUNT_ID from talk-bench-talkdesk/.env (the QA account)' },
  stg: { label: 'STG', api: 'https://api.talkdeskstg.com', ws: 'wss://ai-agent-platform.meza.talkdeskstg.com',
         token: 'https://virtualagent.talkdeskstgid.com/oauth/token', oauth: 'oauthclient-stg.json',

};

async function postJSON(url, body, method = 'POST') {

// server-side validation of the editor text (the checks talk-bench's AgentConfig makes)
async function parseAgentYamlNow() {
  const el = document.getElementById('agentYaml'), info = document.getElementById('agentInfo');
  if (!el || !info) return;
  const text = el.value;
  const settle = (parsed, cls, html, project = null) => {

    testState.parsed = parsed;

    if (cls === 'err' && !testState.showYaml) { testState.showYaml = true; renderQuickFields(); }  // the error is in the YAML
    updateAgentNotices();
  };
  if (!text.trim()) { settle(null, 'help', ''); return; }
  try {
    const r = await postJSON('/api/test/parse_config', { text });
    const mod = moduleModality(r.agent.module), extra = Object.keys(r.extra_blocks || {});
    settle(r.agent, 'help', `Agent <b>${esc(r.agent.name)}</b> · <span class="mono">${esc(r.agent.module)}</span>`
      + (mod ? ` · ${mod} agent` : '') + (r.agent.mcp ? ' · tools via MCP' : '')
      + (extra.length ? ` · also sets ${esc(extra.join(', '))}` : '')
      + (r.project ? ` · runs in <b>${esc(r.project.name)}</b>` : ''), r.project || null);
  } catch (e) {
    settle(null, 'err', esc(e.message));
  }
}
const parseAgentYaml = debounce(parseAgentYamlNow, 350);

/* Agents whose YAML stays collapsed: only the values that change from test to test get their own
   fields (pasteable straight from the clipboard) — Talkdesk its MCP tunnel and agent_system_id,
   ElevenLabs its agent_id, Gemini Live none. The fields edit the YAML text line by line, so its
   comments and layout survive; "Edit full YAML" opens the rest. */
const QUICK_FIELDS = {
  server_url: { label: 'MCP server', path: 'mcp.server_url', hint: 'https://<your-tunnel>.ngrok-free.dev' },
  agent_system_id: { label: 'Talkdesk agent', path: 'params.agent_system_id', hint: '<agent_system_id of your agent>' },
  agent_id: { label: 'ElevenLabs agent', path: 'params.agent_id', hint: 'agent_…' },
};
const COMPACT_AGENTS = [  // matched by the agent module's prefix
  { kind: 'talkdesk', prefix: 'talkdesk_agent.', fields: ['server_url', 'agent_system_id'] },
  { kind: 'elevenlabs', prefix: 'voice_agent.elevenlabs_sdk.', fields: ['agent_id'] },
  { kind: 'gemini', prefix: 'voice_agent.gemini_live.', fields: [] },
];
// by the first uncommented module: line — a wrapper's, not the agent it wraps
function compactAgent(text) {
  const m = (text || '').match(/^[ \t]*module:[ \t]*["']?([\w.]+)/m);
  return m && COMPACT_AGENTS.find(c => m[1].startsWith(c.prefix)) || null;
}
// a value presets and samples leave for the user to replace
const isHole = v => /<[^<>]+>/.test(v) || /^(PLACEHOLDER|agent_x+)$/i.test(v);
const indentOf = line => line.match(/^[ \t]*/)[0];

// the first uncommented block-style line of `key` (a YAML key, not a regex): {i, indent, raw, comment}
function yamlKeyLine(lines, key) {
  const re = new RegExp(`^([ \\t]*)${key}[ \\t]*:[ \\t]*("(?:[^"\\\\]|\\\\.)*"|'(?:[^']|'')*'|[^#]*?)([ \\t]+#.*)?$`);
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(re);
    if (m) return { i, indent: m[1], raw: m[2], comment: m[3] || '' };
  }
  return null;
}

function yamlScalar(raw) {
  const t = raw.trim();
  if (t.startsWith('"')) { try { return JSON.parse(t); } catch { return t.slice(1, -1); } }
  if (t.startsWith("'")) return t.slice(1, -1).replace(/''/g, "'");
  return t === '~' || t === 'null' ? '' : t;
}

const yamlValue = (text, key) => { const hit = yamlKeyLine(text.split('\n'), key); return hit ? yamlScalar(hit.raw) : ''; };

// the indentation of the lines under lines[i] (two more spaces when it has none yet)
function childIndent(lines, i) {
  const own = indentOf(lines[i]);
  const next = lines.slice(i + 1).find(l => l.trim() && !l.trim().startsWith('#'));
  return next && indentOf(next).length > own.length ? indentOf(next) : own + '  ';
}

// the YAML text with `key` set to value — added where talk-bench reads it when the text has no such
// line yet. null when the text can't be edited line by line (JSON, flow mappings)
function yamlSetValue(text, key, value) {
  if (/^\s*[{[]/.test(text)) return null;
  const lines = text.split('\n'), q = JSON.stringify(value);  // a JSON string is a valid double-quoted YAML scalar
  const hit = yamlKeyLine(lines, key);
  if (hit) {
    lines[hit.i] = `${hit.indent}${key}: ${q}${hit.comment}`;
    return lines.join('\n');
  }
  const parent = key === 'server_url' ? 'mcp' : 'params';
  const p = lines.findIndex(l => new RegExp(`^[ \\t]*${parent}:[ \\t]*(\\{[ \\t]*\\})?[ \\t]*(#.*)?$`).test(l));
  if (p >= 0) {
    lines[p] = lines[p].replace(/\{[ \t]*\}/, '').replace(/[ \t]+$/, '');
    lines.splice(p + 1, 0, `${childIndent(lines, p)}${key}: ${q}`);
    return lines.join('\n');
  }
  if (lines.some(l => new RegExp(`^[ \\t]*${parent}:`).test(l))) return null;  // flow-style (`params: {a: 1}`): a second block would be a duplicate key
  // no parent block yet: open one next to params (mcp) or after module (params)
  const params = lines.findIndex(l => /^[ \t]*params:/.test(l));
  const mod = lines.findIndex(l => /^[ \t]*module:/.test(l));
  if (mod < 0) return null;
  if (key === 'server_url') {
    const at = params >= 0 ? params : mod + 1, ind = indentOf(lines[params >= 0 ? params : mod]);
    lines.splice(at, 0, `${ind}mcp:`, `${ind}  server_url: ${q}`, `${ind}  identity_transport:`, `${ind}    type: platform_interaction_id`);
  } else {
    const ind = indentOf(lines[mod]);
    lines.splice(mod + 1, 0, `${ind}params:`, `${ind}  ${key}: ${q}`);
  }
  return lines.join('\n');
}

// the YAML text without its mcp block: an empty server_url means no MCP server
function yamlRemoveMcp(text) {
  const lines = text.split('\n');
  const i = lines.findIndex(l => /^[ \t]*mcp:[ \t]*(#.*)?$/.test(l));
  if (i < 0) return lines.some(l => /^[ \t]*mcp:/.test(l)) ? null : text;  // flow-style mcp: {…}
  const own = indentOf(lines[i]).length;
  let j = i + 1;
  while (j < lines.length && (!lines[j].trim() || indentOf(lines[j]).length > own)) j++;
  while (j > i + 1 && !lines[j - 1].trim()) j--;  // blank lines before the next key stay
  lines.splice(i, j - i);
  return lines.join('\n');
}

// what was copied, reduced to the value: the URL in a copied log line ("ngrok URL: https://…") without
// the /mcp path talk-bench appends itself; the id in a copied agent link (a UUID on Talkdesk,
// agent_… on ElevenLabs)
function quickClean(key, s) {
  s = String(s || '').trim();
  if (key === 'server_url') {
    const url = s.match(/https?:\/\/[^\s"'<>]+/);
    return (url ? url[0] : s).replace(/[),.;]+$/, '').replace(/\/+$/, '').replace(/\/mcp$/, '');
  }
  const id = key === 'agent_id' ? s.match(/agent_[0-9a-z]{16,}/i)
    : s.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
  return id ? id[0] : s.replace(/^["']+|["']+$/g, '');
}

// a compact agent shows its fields (values read back from the YAML) and a collapsed YAML; any
// other agent just the YAML
function renderQuickFields() {
  const el = document.getElementById('agentYaml'), box = document.getElementById('quickFields');
  if (!el || !box) return;
  const c = compactAgent(el.value);
  if (box.dataset.kind !== (c?.kind || '')) {  // rebuilt only when the kind changes, so a field keeps its focus
    box.dataset.kind = c?.kind || '';
    box.innerHTML = (c?.fields || []).map(key => { const f = QUICK_FIELDS[key]; return `
      <div class="field">
        <label for="quick-${key}">${f.label} — <span class="mono">${f.path}</span></label>
        <div class="paste-row"><input id="quick-${key}" data-quick-key="${key}" spellcheck="false" autocomplete="off">
          <button class="navbtn" type="button" data-quick-paste="${key}" title="Paste from the clipboard">Paste</button></div>
      </div>`; }).join('');
  }
  box.hidden = !c?.fields.length;
  document.getElementById('yamlBox').hidden = !!c && !testState.showYaml;
  const toggle = document.getElementById('yamlToggle');
  toggle.hidden = !c;
  toggle.textContent = testState.showYaml ? 'Hide YAML' : 'Edit full YAML';
  for (const key of c?.fields || []) {
    const input = document.getElementById(`quick-${key}`);
    if (document.activeElement === input) continue;  // don't rewrite what is being typed
    const v = yamlValue(el.value, key);
    input.value = isHole(v) ? '' : v;
    input.placeholder = /<[^<>]+>/.test(v) ? v : QUICK_FIELDS[key].hint;
  }
}

// a field edited: write it into the YAML. Emptying server_url drops the mcp block, but only once the
// field is left (committed) — not while it is being retyped, which would lose the block's other keys
function quickApply(key, value, committed) {
  const el = document.getElementById('agentYaml');
  value = value.trim();
  if (key === 'server_url' && !value && !committed) return;
  const next = key === 'server_url' && !value ? yamlRemoveMcp(el.value) : yamlSetValue(el.value, key, value);
  if (next == null) {
    testState.showYaml = true;
    renderQuickFields();
    setAgentStatus(`⚠ couldn't place ${QUICK_FIELDS[key].path} in this YAML — set it in the editor below`);
    return;
  }
  if (next === el.value) return;
  el.value = next;
  parseAgentYaml();
}

async function quickPaste(key) {
  const input = document.getElementById(`quick-${key}`);
  let text;
  try {
    text = await navigator.clipboard.readText();
  } catch (_) {  // no clipboard API (plain-http origin) or permission denied
    input.focus();
    setAgentStatus('The browser blocked reading the clipboard — press ⌘V / Ctrl+V in the field instead.');
    return;
  }
  const v = quickClean(key, text);
  if (!v) { setAgentStatus('The clipboard is empty.'); return; }
  input.value = v;
  quickApply(key, v, true);
  setAgentStatus(`pasted ${QUICK_FIELDS[key].path} from the clipboard`);
}

// "<like this>" (or PLACEHOLDER) values a preset or sample left for the user to fill in (params and mcp, any depth)
function placeholderPaths(a) {
  const out = [];
  const walk = (v, path) => {
    if (typeof v === 'string') { if (isHole(v)) out.push(path); }
    else if (v && typeof v === 'object') Object.entries(v).forEach(([k, x]) => walk(x, `${path}.${k}`));
  };
  if (a) { walk(a.params, 'params'); walk(a.mcp, 'mcp'); }
  return out;
}

function updateAgentNotices() {
  const box = document.getElementById('agentNotices');
  if (!box) return;
  const a = testState.parsed, p = testProject();
  const help = document.getElementById('checkoutHelp');
  if (help) help.innerHTML = checkoutHelpHTML(p);
  const notes = [];  // warnings, as html
  const holes = placeholderPaths(a);
  if (holes.length) {
    // a collapsed YAML may hold placeholders outside the fields (the Talkdesk STG account_id)
    const c = compactAgent(document.getElementById('agentYaml')?.value);
    const inYaml = c && !testState.showYaml && holes.some(h => !c.fields.some(k => QUICK_FIELDS[k].path === h));
    notes.push(`Placeholders still to fill in: <code>${holes.map(esc).join('</code>, <code>')}</code>.`
      + (inYaml ? ' Some are only in the full YAML: <button class="navbtn" type="button" data-yaml-open>Edit full YAML</button>' : ''));
  }
  const pkg = a?.module ? a.module.split('.')[0] : '';
  if (pkg && p && !(p.packages || []).includes(pkg)) {
    notes.push(`No local checkout's workspace provides the <b>${esc(pkg)}</b> package, so the test runs in <b>${esc(p.name)}</b> and fails at import unless that package is installed in <span class="mono">${esc(p.id)}/.venv</span>.`);
  }
  box.innerHTML = notes.map(n => `<div class="notice warn">${n}</div>`).join('');
  updateCmdPreview();  // the parsed agent decides the checkout; also refreshes the user-sim help
}

/* scenario picker: what the split resolves to, with a checkbox each */
async function loadScenarioCatalog(preselect) {
  const v = id => document.getElementById(id)?.value.trim() ?? '';
  const source = v('sSource'), domain = v('sDomain'), split = v('sSplit') || 'base';
  const key = [source, domain, split].join('|');
  if (key === testState.catalogKey && !preselect) return;
  testState.catalogKey = key;
  const list = document.getElementById('scenList');
  if (!currentProject() || !domain) { testState.catalog = []; renderScenarioList(); return; }
  try {
    const d = await getJSON(`/api/test/scenarios?source=${encodeURIComponent(source)}&domain=${encodeURIComponent(domain)}&split=${encodeURIComponent(split)}`);
    if (testState.catalogKey !== key) return;  // settings changed meanwhile
    testState.catalog = d.scenarios;
  } catch (e) {
    if (testState.catalogKey !== key) return;
    testState.catalog = [];
    if (list) list.innerHTML = `<div class="scen-empty">⚠ ${esc(e.message)}</div>`;
    return;
  }
  const ids = new Set(testState.catalog.map(s => s.id));
  const wanted = preselect ? new Set(preselect) : testState.picked;
  testState.picked = new Set([...wanted].filter(id => ids.has(id)));  // drop ids the new split lacks
  renderScenarioList();
}

function shownScenarios() {
  const q = (document.getElementById('scenFilter')?.value || '').trim().toLowerCase();
  return testState.catalog.filter(s => !q || s.id.toLowerCase().includes(q) || (s.summary || '').toLowerCase().includes(q)
    || (s.tags || []).some(tag => String(tag).toLowerCase().includes(q)));
}

function renderScenarioList() {
  const list = document.getElementById('scenList');
  if (!list) return;
  const shown = shownScenarios();
  list.innerHTML = shown.length ? shown.map(s => `
    <label class="scen-row"><input type="checkbox" value="${esc(s.id)}"${testState.picked.has(s.id) ? ' checked' : ''}>
      <span class="mono scen-id">${esc(s.id)}</span><span class="scen-sum" title="${esc(s.summary || '')}">${esc(s.summary || '')}</span>
      ${s.difficulty ? `<span class="scen-tag">${esc(s.difficulty)}</span>` : ''}</label>`).join('')
    : `<div class="scen-empty">${testState.catalog.length ? 'No scenario matches the filter.' : 'No scenarios found for this split — check the split name.'}</div>`;
  const n = testState.picked.size, total = testState.catalog.length;
  document.getElementById('scenCount').textContent = total
    ? `${n} of ${total} ticked${n ? '' : ' — the whole split runs'}${shown.length !== total ? ` · ${shown.length} shown` : ''}`
    : '';
  updateCmdPreview();
}

function applySettings(s) {
  const set = (id, v) => { const el = document.getElementById(id); if (el && v != null) el.value = v; };
  if (s.source) set('sSource', s.source);
  if (s.user_simulator) set('sUserSim', s.user_simulator);
  if (s.speech_complexity !== undefined) set('sComplexity', s.speech_complexity || '');
  refreshDomainOptions(s.domain, s.split);
  if (s.scenario_ids) loadScenarioCatalog(s.scenario_ids);
}

function refreshDomainOptions(keepDomain, keepSplit) {
  const p = currentProject();
  const source = document.getElementById('sSource').value;
  const domains = p?.domains?.[source] || {};
  const sel = document.getElementById('sDomain');
  const prev = keepDomain || sel.value;
  const names = Object.keys(domains);
  sel.innerHTML = names.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('') + '<option value="all">all domains</option>';
  sel.value = names.includes(prev) ? prev : prev === 'all' ? 'all' : names.includes('airline') ? 'airline' : names[0] || 'all';
  refreshSplitOptions(keepSplit);
}

/* the split names the domain's splits.json (tau2: split_tasks.json) defines, in file order;
   "all domains" lists the union over the source's domains, since talk-bench applies the split
   to every domain that defines it */
function splitsFor(source, domain) {
  const bySource = currentProject()?.domains?.[source] || {};
  if (domain !== 'all') return bySource[domain] || [];
  const acc = new Map();
  for (const list of Object.values(bySource)) for (const s of list) {
    const cur = acc.get(s.split) || { split: s.split, count: 0, domains: 0 };
    cur.count += s.count || 0;
    cur.domains += 1;
    acc.set(s.split, cur);
  }
  return [...acc.values()].sort((a, b) => (b.split === 'base') - (a.split === 'base') || b.domains - a.domains || a.split.localeCompare(b.split));
}

function refreshSplitOptions(keepSplit) {
  const domain = document.getElementById('sDomain').value;
  const splits = splitsFor(document.getElementById('sSource').value, domain);
  const sel = document.getElementById('sSplit');
  const prev = keepSplit || sel.value;
  sel.innerHTML = splits.map(s => `<option value="${esc(s.split)}">${esc(s.split)}${s.count != null
    ? ` — ${s.count} scenario${s.count === 1 ? '' : 's'}${domain === 'all' ? ` in ${s.domains} domain${s.domains === 1 ? '' : 's'}` : ''}` : ''}</option>`).join('');
  if (splits.length) sel.value = splits.some(s => s.split === prev) ? prev : splits.some(s => s.split === 'base') ? 'base' : splits[0].split;
  document.getElementById('sSplitHelp').textContent = !splits.length ? 'This domain defines no splits.'
    : keepSplit && !splits.some(s => s.split === keepSplit) ? `Split “${keepSplit}” is not defined for ${domain} — ${sel.value} selected instead.`
    : '';
  updateCmdPreview();
  loadScenarioCatalog();
}

async function prefillFromRun(runPath) {
  const d = await getRun(runPath);
  const rc = d.results?.run_context || {};
  const archived = testState.options.archived || [];
  const idx = archived.findIndex(a => a.run_paths.includes(runPath));
  if (idx < 0) { setAgentStatus(`run ${runPath} recorded no usable agent config`); return; }
  fillAgentYaml(archived[idx].yaml);
  applySettings({
    source: (d.scenarios || []).some(s => /-tau2-/.test(s.id)) ? 'tau2' : 'talk_bench',
    domain: rc.domain, split: rc.split,
    user_simulator: d.user_simulator?.engine === 'tau2' ? 'tau2' : 'talk_bench',
  });
  // tick exactly the scenarios that run covered when it was a subset of the split
  await loadScenarioCatalog((d.scenarios || []).map(s => s.id));
  if (testState.picked.size === testState.catalog.length) { testState.picked = new Set(); renderScenarioList(); }
  testState.tab = 'archived';
  renderAgentSource();
  document.getElementById('archSel').value = String(idx);
  setAgentStatus(`loaded the agent of ${runPath}`);
}

  const d = await getJSON(`/api/test/jobs/${encodeURIComponent(id)}?offset=0`);

  applySettings({ source: j.source, domain: j.domain, split: j.split, scenario_ids: jobScenarioIds(j), user_simulator: j.user_simulator || 'talk_bench', speech_complexity: j.speech_complexity || '' });

/* jobs table + log */
function jobStatusHTML(j) {
  const running = jobRunning(j);
  const cls = running ? 'running' : j.status === 'done' || j.status === 'error' ? j.status : '';
  const label = j.status === 'cancelling' ? 'stopping…'
    : j.status === 'done' ? (j.score && j.score.passed === j.score.total ? 'all passed' : 'done')
    : j.status;
  // a running dot is recreated on every poll: start it at the shared phase so its pulse never restarts
  const phase = running ? ` style="animation-delay:-${Math.round(performance.now() % 1200)}ms"` : '';
  return `<span class="status-dot ${cls}"${phase}></span>${esc(label)}`;
}

function jobResultHTML(j) {
  return j.score
    ? `<span class="badge ${j.score.passed === j.score.total ? 'pass' : 'fail'}">${j.score.passed}/${j.score.total} · ${j.score.pct.toFixed(0)}%</span>`
    : j.error ? `<span class="badge fail" title="${esc(j.error)}">${esc(j.status === 'interrupted' ? 'interrupted' : 'error')}</span>`
    : jobRunning(j) ? '<span class="muted">…</span>' : '<span class="muted">—</span>';
}

function jobRowHTML(j) {
  const running = jobRunning(j), ids = jobScenarioIds(j);

    !running && j.run_dir && j.status !== 'done' ? `<button class="navbtn" type="button" data-job-resume="${j.id}" title="talk-bench run --resume: redo unfinished scenarios">Resume</button>` : '',
    `<button class="navbtn" type="button" data-job-again="${j.id}" title="Load this agent.yaml and these settings into the editor">Run again…</button>`,

const JOBS_COLLAPSED = 3;  // newest tests listed before "Show all"

function renderJobRows() {
  const rows = document.getElementById('jobRows');
  if (!rows) return;
  // collapsed: the newest few, plus any older one that is still running or whose log is open
  const collapsed = testState.jobs.filter((j, i) => i < JOBS_COLLAPSED || jobRunning(j) || j.id === testState.selected);
  const hidden = testState.jobs.length - collapsed.length;
  rows.innerHTML = (testState.showAllJobs ? testState.jobs : collapsed).map(jobRowHTML).join('');
  document.getElementById('jobsMoreWrap').hidden = !hidden;
  const more = document.getElementById('jobsMore');
  more.classList.toggle('open', testState.showAllJobs);
  more.title = testState.showAllJobs ? 'Show fewer' : `Show all ${testState.jobs.length} tests`;
  more.setAttribute('aria-label', more.title);
  more.setAttribute('aria-expanded', testState.showAllJobs);
  const running = testState.jobs.filter(jobRunning).length;
  document.getElementById('jobsHint').textContent = running ? `${running} running` : '';
  document.getElementById('jobsEmpty').hidden = !!testState.jobs.length;
}

async function refreshJobs(force) {
  const d = await getJSON('/api/test/jobs');
  const json = JSON.stringify(d.jobs);
  const anyRunning = d.jobs.some(jobRunning);
  if (!force && json === testState.jobsJSON && !anyRunning) return;  // elapsed time ticks while running
  // a job that just copied its run into the archive changes the run list and sidebar counts
  const synced = j => j.run_path ? `${j.id}:${j.synced_at}` : '';
  const before = new Set(testState.jobs.map(synced).filter(Boolean));
  const newlySynced = d.jobs.some(j => synced(j) && !before.has(synced(j)));
  // a test a schedule just started moves that schedule's next / last run
  const fromSchedule = d.jobs.some(j => j.schedule_id && !testState.jobs.some(o => o.id === j.id));
  testState.jobsJSON = json;
  testState.jobs = d.jobs;
  renderJobRows();
  renderSchedRows();  // last-run results follow the jobs
  if (fromSchedule) refreshSchedules().catch(() => {});
  if (newlySynced) {
    invalidateRuns();
    loadRuns().then(renderSideNav).catch(() => {});
  }
}

async function pollJobLog() {
  const id = testState.selected, offset = testState.logOffset;
  if (!id) return;
  const d = await getJSON(`/api/test/jobs/${encodeURIComponent(id)}?offset=${offset}`);
  if (testState.selected !== id || testState.logOffset !== offset) return;  // another poll already read this chunk
  if (d.next_offset < testState.logOffset) testState.logText = '';  // log file was reset
  if (d.log) testState.logText += d.log;
  testState.logOffset = d.next_offset;
  renderLogCard(d);
  if (d.more) await pollJobLog();
}

function renderLogCard(d) {
  const card = document.getElementById('logCard');
  if (!card) return;
  const j = d.job;
  const setText = (id, t) => { const el = document.getElementById(id); if (el.textContent !== t) el.textContent = t; };  // unchanged text keeps the user's selection
  card.hidden = false;
  document.getElementById('logTitle').textContent = `${j.agent_name} · ${j.domain}/${j.split}`;
  document.getElementById('logMeta').innerHTML = `${jobStatusHTML(j)} · ${fmtElapsed(j.started, j.finished)}`
    + (j.exit_code != null ? ` · exit ${j.exit_code}` : '')
    + (j.progress?.total ? ` · ${j.progress.done}/${j.progress.total} scenarios` : '')
    + (j.error ? ` · <span style="color:var(--fail)">${esc(j.error)}</span>` : '');
  setText('logCmd', j.cmd?.length ? `cd ${shellQuote(j.cwd || '.')} && ${j.cmd.map(shellQuote).join(' ')}` : '');
  document.getElementById('logRun').innerHTML = j.run_dir
    ? `Run directory <span class="mono">${esc(j.run_dir)}</span>`
      + (j.run_path ? ` · <a href="#/run/${encodeURIComponent(j.run_path)}">open in the viewer</a>${j.synced_at ? ` <span class="muted">(copied ${fmtElapsed(j.synced_at)} ago)</span>` : ''}` : ' · not copied into the archive yet')
    : 'talk-bench has not created the run directory yet.';
  if (d.config_yaml != null) setText('logConfig', d.config_yaml);
  const pane = document.getElementById('logPane');
  setText('logPane', testState.logText || '(no output yet)');
  if (document.getElementById('logFollow').checked) pane.scrollTop = pane.scrollHeight;
}

function selectJob(id, scroll = true) {
  testState.selected = id;
  testState.logOffset = 0;
  testState.logText = '';
  renderJobRows();
  const card = document.getElementById('logCard');
  card.hidden = false;
  document.getElementById('logPane').textContent = 'loading…';

function startTestPolling() {
  clearInterval(testPollTimer);
  let tick = 0;
  testPollTimer = setInterval(async () => {
    if (!document.getElementById('jobRows')) { clearInterval(testPollTimer); testPollTimer = null; return; }
    try {
      await refreshJobs();
      if (testState.selected) await pollJobLog();
      if (++tick % 10 === 0) await refreshSchedules();  // next-run times, waiting state
    } catch (_) { /* transient — the next tick retries */ }
  }, 2000);
}

// what Start test sends — and what a schedule saves; null while the editor is empty
function testPayload() {
  const text = document.getElementById('agentYaml').value;
  if (!text.trim()) return null;
  const v = id => document.getElementById(id).value.trim();
  return { config_text: text, source: v('sSource'), domain: v('sDomain'), split: v('sSplit') || 'base', scenario_ids: pickedScenarioIds(), user_simulator: v('sUserSim'),
    speech_complexity: v('sSource') === 'tau2' ? v('sComplexity') || null : null };
}

async function startTest() {
  const status = document.getElementById('startStatus');
  const payload = testPayload();
  if (!payload) { status.textContent = 'The agent.yaml editor is empty.'; return; }
  const btn = document.getElementById('startTestBtn');
  setBusy(btn, true);
  status.textContent = 'starting…';
  try {
    const res = await postJSON('/api/test/jobs', payload);
    status.textContent = `started ${res.job.agent_name} on ${res.job.domain}/${res.job.split}${res.job.user_simulator === 'tau2' ? ' with the τ² user simulator' : ''}`;
    await refreshJobs(true);
    selectJob(res.job.id);
  } catch (e) {
    status.textContent = '⚠ ' + e.message;
  }
  setBusy(btn, false);
}

/* scheduled tests: the editor's test plus a cron expression in the server's local time;
   the viewer starts it when due (see "scheduled tests" in app/main.py) */
const SCHED_DAYS = [[1, 'Mon'], [2, 'Tue'], [3, 'Wed'], [4, 'Thu'], [5, 'Fri'], [6, 'Sat'], [0, 'Sun']];
const SCHED_HOURS = [1, 2, 3, 4, 6, 8, 12];  // divisors of 24: the cadence carries across midnight
const pad2 = n => String(n).padStart(2, '0');

// the form's repeat modes as cron, and back; anything else is a custom cron
function cronFromForm() {
  const v = id => document.getElementById(id).value;
  const [h, m] = (v('schTime') || '02:00').split(':').map(Number);
  const mode = v('schRepeat');
  if (mode === 'daily') return `${m} ${h} * * *`;
  if (mode === 'weekdays') return `${m} ${h} * * 1-5`;
  if (mode === 'weekly') {
    const days = [...document.querySelectorAll('#schDays input:checked')].map(i => i.value);
    return days.length ? `${m} ${h} * * ${days.join(',')}` : '';
  }
  if (mode === 'hours') { const n = Number(v('schEvery')); return `${m} ${n === 1 ? '*' : `${h % n}-23/${n}`} * * *`; }
  return v('schCron').trim().split(/\s+/).join(' ');
}

function cronMode(cron) {
  const f = String(cron || '').trim().split(/\s+/);
  if (f.length === 5) f[4] = f[4].toLowerCase().replace(/sun|mon|tue|wed|thu|fri|sat/g, d => 'sunmontuewedthufrisat'.indexOf(d) / 3);
  const c = f.join(' ');
  let x;
  if ((x = c.match(/^(\d{1,2}) (\d{1,2}) \* \* \*$/))) return { mode: 'daily', h: +x[2], m: +x[1] };
  if ((x = c.match(/^(\d{1,2}) (\d{1,2}) \* \* 1-5$/))) return { mode: 'weekdays', h: +x[2], m: +x[1] };
  if ((x = c.match(/^(\d{1,2}) (\d{1,2}) \* \* ([0-7](?:,[0-7])*)$/))) return { mode: 'weekly', h: +x[2], m: +x[1], days: x[3].split(',').map(d => +d % 7) };
  if ((x = c.match(/^(\d{1,2}) \* \* \* \*$/))) return { mode: 'hours', every: 1, h: 0, m: +x[1] };
  if ((x = c.match(/^(\d{1,2}) (\d{1,2})-23\/(\d{1,2}) \* \* \*$/)) && SCHED_HOURS.includes(+x[3]) && +x[2] < +x[3]) return { mode: 'hours', every: +x[3], h: +x[2], m: +x[1] };
  return { mode: 'cron', cron: c };
}

function describeCron(cron) {
  const p = cronMode(cron), at = `${pad2(p.h)}:${pad2(p.m)}`;
  if (p.mode === 'daily') return `Every day at ${at}`;
  if (p.mode === 'weekdays') return `Weekdays at ${at}`;
  if (p.mode === 'weekly') return `${SCHED_DAYS.filter(([d]) => p.days.includes(d)).map(([, n]) => n).join(', ')} at ${at}`;
  if (p.mode === 'hours') return p.every === 1 ? `Every hour at :${pad2(p.m)}` : `Every ${p.every} h from ${at}`;
  return 'Custom cron';
}

function schedFormHTML() {
  return `
  <div class="sched-form" id="schedForm" hidden>
    <h3 style="margin:0" id="schTitle">Schedule this test</h3>
    <p class="muted" style="font-size:12px;margin:6px 0 0">Saves the agent.yaml and scenario settings above. The viewer starts the test at these times while it is running; a run it missed (viewer stopped, Mac asleep) starts once when it is back.</p>

      <div class="field"><label for="schName">Name</label><input id="schName" maxlength="120" placeholder="agent · domain/split" autocomplete="off"></div>

async function updateSchedPreview() {
  const el = document.getElementById('schPreview');
  if (!el) return;
  const mode = document.getElementById('schRepeat').value;
  document.getElementById('schEveryField').hidden = mode !== 'hours';
  document.getElementById('schTimeField').hidden = mode === 'cron';
  document.getElementById('schCronField').hidden = mode !== 'cron';
  document.getElementById('schDaysField').hidden = mode !== 'weekly';
  document.getElementById('schTimeLabel').textContent = mode === 'hours' ? 'Starting at' : 'At';
  const cron = cronFromForm();
  testState.schedPreviewKey = cron;
  if (!cron) {
    el.textContent = mode === 'weekly' ? 'Tick at least one day.' : 'Type a cron expression, e.g. 0 2 * * 1-5 (02:00 on weekdays).';
    return;
  }
  const r = await fetch(`/api/test/schedules/preview?cron=${encodeURIComponent(cron)}`);
  const d = await r.json().catch(() => ({}));
  if (testState.schedPreviewKey !== cron) return;  // changed meanwhile
  el.textContent = r.ok ? `cron ${d.cron} · next ${d.next.join(' · ')} · server time ${d.tz}` : '⚠ ' + (apiDetail(d) || r.status);
}
const updateSchedPreviewSoon = debounce(() => updateSchedPreview().catch(() => {}), 250);

function openSchedForm(s = null) {
  testState.editingSchedule = s?.id || null;
  const set = (id, v) => { document.getElementById(id).value = v; };
  document.getElementById('schTitle').textContent = s ? `Edit schedule “${s.name}”` : 'Schedule this test';
  document.getElementById('schSave').innerHTML = `${ICONS.clock}${s ? 'Update schedule' : 'Save schedule'}`;
  set('schName', s?.name || '');
  const p = cronMode(s?.cron || '0 2 * * *');
  set('schRepeat', p.mode);
  if (p.mode !== 'cron') set('schTime', `${pad2(p.h)}:${pad2(p.m)}`);
  if (p.mode === 'hours') set('schEvery', String(p.every));
  if (p.mode === 'weekly') document.querySelectorAll('#schDays input').forEach(i => { i.checked = p.days.includes(+i.value); });
  set('schCron', s?.cron || '');
  document.getElementById('schStatus').textContent = '';
  document.getElementById('schedForm').hidden = false;
  updateSchedPreview().catch(() => {});
  renderSchedRows();
}

function closeSchedForm() {
  testState.editingSchedule = null;
  document.getElementById('schedForm').hidden = true;
  renderSchedRows();
}

async function saveSchedule() {
  const status = document.getElementById('schStatus');
  const test = testPayload();
  if (!test) { status.textContent = 'The agent.yaml editor is empty.'; return; }
  const id = testState.editingSchedule;
  const editing = testState.schedules.find(s => s.id === id);
  const body = { name: document.getElementById('schName').value.trim(), cron: cronFromForm(), enabled: editing ? editing.enabled : true, test };
  const btn = document.getElementById('schSave');
  setBusy(btn, true);
  status.textContent = 'saving…';
  try {
    const r = id ? await postJSON(`/api/test/schedules/${encodeURIComponent(id)}`, body, 'PUT')
      : await postJSON('/api/test/schedules', body);
    closeSchedForm();
    document.getElementById('startStatus').textContent = `${id ? 'updated' : 'scheduled'} “${r.schedule.name}”`
      + (r.schedule.next_run_local ? ` — next run ${r.schedule.next_run_local}` : ' (paused)');
    await refreshSchedules();
    document.getElementById('schedCard').scrollIntoView({ behavior: smoothScroll(), block: 'nearest' });
  } catch (e) {
    status.textContent = '⚠ ' + e.message;
  }
  setBusy(btn, false);
}

async function editSchedule(id) {
  const s = (await getJSON(`/api/test/schedules/${encodeURIComponent(id)}`)).schedule, t = s.test;
  fillAgentYaml(t.config_text);
  applySettings(t);
  openSchedForm(s);
  setAgentStatus(`loaded the schedule “${s.name}” — change anything, then Update schedule`);
  document.getElementById('agentCard').scrollIntoView({ behavior: smoothScroll(), block: 'start' });
}

function schedLastRunHTML(s) {
  const l = s.last_run;
  if (!l) return '<span class="muted">—</span>';
  const j = l.status === 'started' ? testState.jobs.find(x => x.id === l.job_id) : null;
  const res = l.status === 'skipped' ? `<span class="badge na" title="${esc(l.detail || '')}">skipped</span>`
    : l.status === 'error' ? `<span class="badge fail" title="${esc(l.detail || '')}">not started</span>`
    : !j ? '<span class="muted">started</span>'
    : jobRunning(j) ? jobStatusHTML(j) : jobResultHTML(j);
  return `${res}<div class="subscore">${esc(l.at_local || '')}</div>`;
}

function schedRowHTML(s) {
  const t = s.test || {}, ids = (t.scenario_ids || []).length, lastJob = s.last_run?.job_id;
  const actions = [
    `<button class="navbtn" type="button" data-sched-run="${s.id}" title="Start this test now; the schedule is unchanged">Run now</button>`,
    `<button class="navbtn" type="button" data-sched-edit="${s.id}" title="Load into the editor above to change it">Edit…</button>`,
    `<button class="navbtn" type="button" data-sched-toggle="${s.id}" data-enabled="${s.enabled ? 1 : 0}">${s.enabled ? 'Pause' : 'Resume'}</button>`,
    lastJob && testState.jobs.some(j => j.id === lastJob) ? `<button class="navbtn" type="button" data-sched-log="${lastJob}" title="Log of the test it started last">Log</button>` : '',
    `<button class="navbtn" type="button" data-sched-del="${s.id}" title="Delete the schedule (tests it started are kept)" aria-label="Delete">×</button>`,
  ].filter(Boolean).join('');
  return `
  <tr class="${testState.editingSchedule === s.id ? 'tr-selected' : ''}">
    <td><span class="status-dot${s.enabled ? ' done' : ''}"></span><b>${esc(s.name)}</b>${s.enabled ? '' : '<div class="subscore">paused</div>'}</td>
    <td>${esc(s.agent_name)}<div class="subscore">${esc(shortModule(s.module))}</div></td>
    <td class="nowrap">${esc(t.domain)} / ${esc(t.split)}<div class="subscore">${esc(t.source)}${ids ? ` · ${ids} scenario id${ids === 1 ? '' : 's'}` : ''}${t.user_simulator === 'tau2' ? ' · τ² user' : ''}</div></td>
    <td class="nowrap">${esc(describeCron(s.cron))}<div class="subscore mono">${esc(s.cron)}</div></td>
    <td class="nowrap">${s.enabled ? esc(s.next_run_local || '—') : '<span class="muted">—</span>'}${s.waiting ? `<div class="subscore" title="${esc(s.waiting)}">waiting for a free slot</div>` : ''}</td>
    <td class="nowrap">${schedLastRunHTML(s)}</td>
    <td><div class="job-actions">${actions}</div></td>
  </tr>`;
}

function renderSchedRows() {
  const card = document.getElementById('schedCard');
  if (!card) return;
  card.hidden = !testState.schedules.length;
  const rows = [...testState.schedules].sort((a, b) => !a.enabled - !b.enabled || (a.next_run || Infinity) - (b.next_run || Infinity));
  document.getElementById('schedRows').innerHTML = rows.map(schedRowHTML).join('');
  document.getElementById('schedHint').textContent = testState.schedTz ? `times are the server's local time, ${testState.schedTz}` : '';
}

async function refreshSchedules() {
  const d = await getJSON('/api/test/schedules');
  testState.schedules = d.schedules;
  testState.schedTz = d.tz;
  renderSchedRows();
}

    <div class="actions-row">

  const agentCard = document.getElementById('agentCard');
  agentCard.addEventListener('click', e => {

      applySettings({ source: a.source, domain: a.domain, split: a.split });

    }
  });
  document.getElementById('agentYaml').addEventListener('input', () => {
    testState.showYaml = true;  // typed into the YAML: keep it open even if the agent just became a compact one
    renderQuickFields();
    parseAgentYaml();
  });

  const settings = document.getElementById('sSource').closest('.card');
  settings.addEventListener('change', e => {
    if (e.target.id === 'sSource') refreshDomainOptions();
    else if (e.target.id === 'sDomain') refreshSplitOptions();
    else if (e.target.id === 'sSplit') { updateCmdPreview(); loadScenarioCatalog(); }
    else if (e.target.id === 'sUserSim' || e.target.id === 'sComplexity') updateCmdPreview();
    else if (e.target.matches('#scenList input[type=checkbox]')) {
      e.target.checked ? testState.picked.add(e.target.value) : testState.picked.delete(e.target.value);
      renderScenarioList();
    }
  });
  settings.addEventListener('input', e => {
    if (e.target.id === 'scenFilter') renderScenarioList();
  });
  document.getElementById('scenAll').addEventListener('click', () => { shownScenarios().forEach(s => testState.picked.add(s.id)); renderScenarioList(); });
  document.getElementById('scenNone').addEventListener('click', () => { testState.picked = new Set(); renderScenarioList(); });
  document.getElementById('startTestBtn').addEventListener('click', startTest);

  document.getElementById('schedToggle').addEventListener('click', () => document.getElementById('schedForm').hidden ? openSchedForm() : closeSchedForm());
  const schedForm = document.getElementById('schedForm');
  schedForm.addEventListener('change', e => {
    // switching to a custom cron starts from what the form showed so far
    if (e.target.id === 'schRepeat' && e.target.value === 'cron' && !document.getElementById('schCron').value.trim()) {
      document.getElementById('schCron').value = testState.schedPreviewKey;
    }
    updateSchedPreview().catch(() => {});
  });
  schedForm.addEventListener('input', e => { if (e.target.id === 'schCron' || e.target.id === 'schTime') updateSchedPreviewSoon(); });
  document.getElementById('schSave').addEventListener('click', saveSchedule);
  document.getElementById('schCancel').addEventListener('click', () => closeSchedForm());
  document.getElementById('schedTable').addEventListener('click', async e => {
    const b = e.target.closest('button');
    if (!b) return;
    const ds = b.dataset;
    try {
      if (ds.schedLog) { selectJob(ds.schedLog); return; }
      if (ds.schedEdit) { await editSchedule(ds.schedEdit); return; }
      if (ds.schedRun) {
        b.disabled = true;
        const r = await postJSON(`/api/test/schedules/${encodeURIComponent(ds.schedRun)}/run`);
        await refreshJobs(true);
        selectJob(r.job.id);
      } else if (ds.schedToggle) {
        await postJSON(`/api/test/schedules/${encodeURIComponent(ds.schedToggle)}/enabled`, { enabled: ds.enabled !== '1' });
      } else if (ds.schedDel) {
        if (!confirm('Delete this schedule? The tests it already started stay in the list.')) return;
        await postJSON(`/api/test/schedules/${encodeURIComponent(ds.schedDel)}`, null, 'DELETE');
        if (testState.editingSchedule === ds.schedDel) closeSchedForm();
      }
      await refreshSchedules();
    } catch (err) {
      b.disabled = false;
      setUpStatus('⚠ ' + err.message);
    }
  });

  document.getElementById('jobsMore').addEventListener('click', () => { testState.showAllJobs = !testState.showAllJobs; renderJobRows(); });
  document.getElementById('jobsTable').addEventListener('click', async e => {
    const b = e.target.closest('button');
    if (!b) return;
    const ds = b.dataset;
    try {
      if (ds.jobLog) { selectJob(ds.jobLog); return; }
      if (ds.jobCancel) {
        if (!confirm('Stop this test? talk-bench has no graceful stop — its process group is killed. The run can be resumed afterwards.')) return;
        await postJSON(`/api/test/jobs/${encodeURIComponent(ds.jobCancel)}/cancel`);
      } else if (ds.jobSync) {
        b.disabled = true;
        await postJSON(`/api/test/jobs/${encodeURIComponent(ds.jobSync)}/sync`);
      } else if (ds.jobResume) {
        const r = await postJSON(`/api/test/jobs/${encodeURIComponent(ds.jobResume)}/resume`);
        await refreshJobs(true);
        selectJob(r.job.id);
        return;
      } else if (ds.jobAgain) {
        await loadJobIntoEditor(ds.jobAgain);
        return;
      } else if (ds.jobDel) {
        if (!confirm('Remove this test from the list? The run directory and the archived run are kept.')) return;
        await postJSON(`/api/test/jobs/${encodeURIComponent(ds.jobDel)}`, null, 'DELETE');
        if (testState.selected === ds.jobDel) { testState.selected = null; document.getElementById('logCard').hidden = true; }
      }
      await refreshJobs(true);
    } catch (err) {
      b.disabled = false;
      setUpStatus('⚠ ' + err.message);
    }
  });

  await refreshJobs(true).catch(e => setUpStatus('⚠ ' + e.message));
  if (seq !== routeSeq) return;
  await refreshSchedules().catch(e => setUpStatus('⚠ ' + e.message));
  if (seq !== routeSeq) return;  // left the page meanwhile: never start polling for it
  startTestPolling();

  const from = params.get('from');
  if (from) await prefillFromRun(from).catch(e => setAgentStatus('⚠ ' + e.message));
  if (seq !== routeSeq) return;
  const jobId = params.get('job');
  if (jobId && testState.jobs.some(j => j.id === jobId)) selectJob(jobId, false);
}

/* ---------- router ---------- */
let scenKeyNav = null;
window.addEventListener('keydown', e => { if (scenKeyNav) scenKeyNav(e); });

const SKELETON = `<div class="skel-wrap">
  <div class="card"><div class="skel" style="width:38%"></div><div class="skel" style="width:62%"></div><div class="skel" style="width:55%"></div></div>
  <div class="card"><div class="skel" style="width:30%"></div><div class="skel"></div><div class="skel"></div><div class="skel" style="width:80%"></div></div></div>`;

const setTopTitle = t => {
  document.getElementById('topTitle').textContent = t;
  document.title = (t === 'Runs' ? '' : t + ' · ') + 'talk-bench runs viewer';
};

// routeSeq counts route() calls. Every async render captures it before its awaits and stops after
// each one if it changed, so a slow page never overwrites the page the user moved on to.
let routeSeq = 0, enterPending = false, enterTimer = 0, lastHash = '';

// Every render's first write into #main goes through here: it ends the dimmed "stale" page and, once per
// route(), scrolls to the top and plays the entrance. In-place updates and polling never call it.
function setView(html) {
  $main.innerHTML = html;
  $main.classList.remove('stale');
  if (!enterPending) return;
  enterPending = false;
  window.scrollTo(0, 0);
  $main.classList.add('view-enter');
  clearTimeout(enterTimer);
  enterTimer = setTimeout(() => $main.classList.remove('view-enter'), 600);
}

// 'next' / 'prev' when stepping through one run's scenarios, 'soft' when re-picking a compare pair
function routeDirection(from, to) {
  if (from.startsWith('#/compare') && to.startsWith('#/compare')) return 'soft';
  const scen = h => h.startsWith('#/scenario/') ? h.slice('#/scenario/'.length).split('/') : null;
  const a = scen(from), b = scen(to);
  if (!a || !b || a[0] !== b[0]) return '';
  const ids = (_runCache[a[0]]?.scenarios || []).map(s => s.id);
  const d = ids.indexOf(b[1]) - ids.indexOf(a[1]);
  return d > 0 ? 'next' : d < 0 ? 'prev' : '';
}

async function route() {
  const h = decodeURIComponent(location.hash);
  const raw = location.hash, params = new URLSearchParams(raw.slice(raw.indexOf('?') + 1 || raw.length));
  const seq = ++routeSeq;
  scenKeyNav = null;
  CUR_RUN = null;
  CUR_CMP = null;
  clearInterval(testPollTimer);
  testPollTimer = null;
  closeNav();
  // Keep the old page up, dimmed and unclickable, while the next one loads; only a slow load gets the
  // skeleton. Do what replacing it used to do at once: stop its audio and drop its focus.
  $main.querySelectorAll('audio').forEach(a => a.pause());
  if ($main.contains(document.activeElement)) document.activeElement.blur();
  $main.classList.remove('view-enter');
  $main.dataset.dir = routeDirection(lastHash, h);
  lastHash = h;
  enterPending = true;
  let skelTimer = 0;
  if (!$main.firstElementChild) $main.innerHTML = SKELETON;  // first load: nothing to keep
  else {
    $main.classList.add('stale');
    skelTimer = setTimeout(() => {
      if (seq !== routeSeq || !enterPending) return;  // superseded, or the new view is already up
      $main.innerHTML = SKELETON;
      $main.classList.remove('stale');
    }, 180);
  }
  try {
    // Sidebar data is best-effort here: a failing /api/runs must not block scenario
    // deep links (renderList still surfaces the error because it awaits loadRuns itself).
    await loadRuns().catch(() => {});
    if (seq !== routeSeq) return;  // navigated again while the run index loaded
    renderSideNav();
    const onList = !h.startsWith('#/');
    document.getElementById('searchWrap').hidden = !onList;
    document.getElementById('syncBtn').hidden = !onList;
    if (h.startsWith('#/compare')) {
      setTopTitle('Compare');
      await renderCompare(params);
    } else if (h.startsWith('#/test')) {
      setTopTitle('Run test');
      await renderTest(params);
    } else if (h.startsWith('#/scenario/')) {
      const p = h.slice('#/scenario/'.length);
      setTopTitle(p.split('/').pop());
      await renderScenario(p);
    } else if (h.startsWith('#/run/')) {
      const p = h.slice('#/run/'.length);
      setTopTitle(p);
      await renderRun(p);
    } else {
      setTopTitle('Runs');
      await renderList();
    }
    if (seq === routeSeq) {
      window.scrollTo(0, 0);
      // same task as the render, before the first paint: the rows never flash in and then hide
      staggerRows(document.getElementById('runRows') || document.getElementById('scenRows'));
    }
  } catch (e) {
    if (seq === routeSeq) setView(`<div class="card"><b>Error:</b> ${esc(e.message)}</div>`);
  } finally {
    clearTimeout(skelTimer);
  }
}
window.addEventListener('hashchange', route);
route();
</script>
