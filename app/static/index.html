      </div>
      <button class="btn" id="syncBtn" hidden type="button" aria-label="Sync sources" title="Copy new runs from the ai-ds-research checkouts into the archive, then delete the checkout copies of finished runs (runs that can still be resumed stay)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg><span class="btn-label">Sync sources</span></button>
      <button class="icon-btn" id="themeBtn" aria-label="Theme" type="button"></button>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
</div>

<script>
const $main = document.getElementById('main');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)');  // live: an OS change applies without a reload
const smoothScroll = () => REDUCED.matches ? 'auto' : 'smooth';
// disabled plus a spinner while an async action runs (labels never change)
const setBusy = (btn, on) => { btn.disabled = on; on ? btn.setAttribute('aria-busy', 'true') : btn.removeAttribute('aria-busy'); };
const svgIcon = paths => `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
const ICONS = {
  star: svgIcon('<path d="M12 2.5l2.94 5.95 6.57.96-4.76 4.63 1.13 6.54L12 17.5l-5.88 3.08 1.12-6.54-4.75-4.63 6.57-.96z"/>'),
  eyeOff: svgIcon('<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.4 10.4 0 0 1 12 5c7 0 10 7 10 7a13.2 13.2 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.5 13.5 0 0 0 2 12s3 7 10 7a9.7 9.7 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/>'),
  list: svgIcon('<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>'),
  bot: svgIcon('<rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 8V4M8 4h8"/><path d="M9 13.5h.01M15 13.5h.01"/>'),
  copy: svgIcon('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>'),
  sun: svgIcon('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>'),
  moon: svgIcon('<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'),
  monitor: svgIcon('<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>'),
  mic: svgIcon('<rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/>'),
  chat: svgIcon('<path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9.7 9.7 0 0 1-2.6-.35L3.5 21l1.4-4A8.1 8.1 0 0 1 3 11.5 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>'),
  compare: svgIcon('<rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/>'),
  search: svgIcon('<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>'),
  chevron: svgIcon('<polyline points="6 9 12 15 18 9"/>'),
  check: svgIcon('<polyline points="20 6 9 17 4 12"/>'),
  swap: svgIcon('<path d="M4 9h13l-3.5-3.5M17 9l-3.5 3.5"/><path d="M20 15H7l3.5-3.5M7 15l3.5 3.5"/>'),
  play: svgIcon('<polygon points="6 4 20 12 6 20 6 4"/>'),
  clock: svgIcon('<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>'),
  resume: svgIcon('<polyline points="21 4 21 10 15 10"/><path d="M19.4 15a8 8 0 1 1-1.9-8.3L21 10"/>'),
  sparkle: svgIcon('<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15v4M17 17h4"/>'),
  wrench: svgIcon('<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>'),
  lock: svgIcon('<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),
  gear: svgIcon('<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>'),
  server: svgIcon('<rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/>'),
  trash: svgIcon('<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>'),
};
let RUNS = null;
let STARS = new Set();
let NOTES = {};
let LLM_MODEL = '';  // the model behind Ask AI, reported by /api/runs

const dataHref = path => '/data/' + path.split('/').map(encodeURIComponent).join('/');
const scenHref = (runPath, id) => '#/scenario/' + encodeURIComponent(runPath + '/' + id);

async function toggleStar(path, rerender) {
  const starred = !STARS.has(path);
  starred ? STARS.add(path) : STARS.delete(path);
  rerender();
  try {
    await postForm('/api/star', formData({ path, starred }));
  } catch (e) {
    starred ? STARS.delete(path) : STARS.add(path);  // roll back on failure
    rerender();
  }
}
const starIcon = path => {
  const on = STARS.has(path);
  return `<button type="button" class="star row-act${on ? ' on' : ''}" aria-pressed="${on}" aria-label="Star this run" title="${on ? 'Starred — click to unstar' : 'Star this run'}">${ICONS.star}</button>`;
};

// Hidden runs are a per-browser preference: kept in localStorage and never sent to the
// server, so every computer has its own list.
const HIDDEN_KEY = 'viewer_hidden_runs';

function loadHiddenRuns() {
  try {
    const stored = JSON.parse(localStorage.getItem(HIDDEN_KEY) || '[]');
    return new Set(Array.isArray(stored) ? stored.filter(p => typeof p === 'string') : []);
  } catch (e) {
    return new Set();  // storage blocked (private mode): hiding lasts for this page only
  }
}
const HIDDEN = loadHiddenRuns();

function saveHidden() {
  try {
    localStorage.setItem(HIDDEN_KEY, JSON.stringify([...HIDDEN].sort()));
  } catch (e) { /* keep the in-memory state even when it can't be persisted */ }
}

function toggleHidden(path, rerender) {
  HIDDEN.has(path) ? HIDDEN.delete(path) : HIDDEN.add(path);
  saveHidden();
  rerender();
}
const hideIcon = path => HIDDEN.has(path)
  ? `<button type="button" class="eye row-act on" aria-label="Show this run again" title="Hidden on this computer — click to show it again">${ICONS.eyeOff}</button>`
  : `<button type="button" class="eye row-act" aria-label="Hide this run" title="Hide this run from the list on this computer">${ICONS.eyeOff}</button>`;

// Deleting a run removes only its files in the archive; a copy still in a checkout is kept and Sync skips the run from then on. Callers ask first (confirm before any busy state).
const DELETE_NOTE = "Only the files in the viewer's archive are deleted, together with stars and notes. For runs started "
  + 'from Run test, and runs Sync moved out of a checkout, that is the only copy. Nothing in an ai-ds-research checkout '
  + 'is touched: a copy still there (a run that can be resumed) stays, and Sync will not bring it back. '
  + 'This cannot be undone from the viewer.';
const confirmDeleteRun = path => confirm(`Delete run "${path}"?\n\n${DELETE_NOTE}`);
const confirmDeleteRuns = paths => paths.length === 1 ? confirmDeleteRun(paths[0]) : confirm(`Delete ${paths.length} runs?\n\n`
  + paths.slice(0, 8).join('\n') + (paths.length > 8 ? `\n…and ${paths.length - 8} more` : '') + `\n\n${DELETE_NOTE}`);

async function deleteRun(path) {
  const r = await fetch('/api/run?path=' + encodeURIComponent(path), { method: 'DELETE' });
  const res = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(apiDetail(res) || String(r.status));
  if (RUNS) RUNS = RUNS.filter(x => x.path !== path);
  STARS.delete(path);
  delete NOTES[path];
  delete _runCache[path];
  for (const store of [REPORTS, CHATS]) {
    for (const k of Object.keys(store)) if (k === path || k.startsWith(path + '/')) delete store[k];
  }
  if (HIDDEN.delete(path)) saveHidden();
  setUpStatus(`Deleted ${path}`);
}

// a one-shot green flash on a note field that just saved
const flashSaved = el => {
  el.classList.add('just-saved');
  el.addEventListener('animationend', () => el.classList.remove('just-saved'), { once: true });
};

async function saveRunNote(path, value) {
  const note = value.trim();
  const previous = NOTES[path] || '';
  if (note === previous) return note;
  note ? NOTES[path] = note : delete NOTES[path];
  try {
    return (await postForm('/api/note', formData({ path, note }))).note;
  } catch (e) {
    previous ? NOTES[path] = previous : delete NOTES[path];
    throw e;
  }
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// run and job times are kept in UTC and shown as Beijing time (UTC+8, no DST)
const fmtBJ = (ms, len = 19) => new Date(ms + 8 * 3600e3).toISOString().replace('T', ' ').slice(0, len);
// a run-name stamp ("2026-08-19 06:15:43Z") -> "2026-08-19 14:15:43"
const bjStamp = (s, len = 19) => {
  const ms = s ? Date.parse(String(s).replace(' ', 'T')) : NaN;
  return Number.isNaN(ms) ? (s || '') : fmtBJ(ms, len);
};
const displayModelName = model => {
  const name = String(model || '').split('/').filter(Boolean).pop() || '';
  return name.replace(/^gpt(?=$|[-_.])/i, 'GPT');
};

function renderMarkdownInline(value) {
  return String(value ?? '').split(/(`[^`\n]*`)/g).map(part => {
    if (part.startsWith('`') && part.endsWith('`')) {
      return `<code>${esc(part.slice(1, -1))}</code>`;
    }
    return esc(part)
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
      .replace(/__([^_\n]+)__/g, '<strong>$1</strong>')
      .replace(/~~([^~\n]+)~~/g, '<s>$1</s>')
      .replace(/(^|[\s(])\*([^*\n]+)\*(?=$|[\s).,!?:;，。！？：；])/g, '$1<em>$2</em>')
      .replace(/\[([^\]\n]+)\]\(((?:https?:\/\/|mailto:)[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }).join('');
}

function renderMarkdown(value) {
  const lines = String(value ?? '').replace(/\r\n?/g, '\n').split('\n');
  const html = [];
  let paragraph = [];
  let listType = null;
  let listStart = null;
  let listItems = [];
  let quote = [];
  let code = null;
  let codeLanguage = '';

  const flushParagraph = () => {
    if (paragraph.length) html.push(`<p>${paragraph.map(renderMarkdownInline).join('<br>')}</p>`);
    paragraph = [];
  };
  const flushList = () => {
    if (listType) {
      const start = listType === 'ol' && listStart !== 1 ? ` start="${listStart}"` : '';
      html.push(`<${listType}${start}>${listItems.join('')}</${listType}>`);
    }
    listType = null;
    listStart = null;
    listItems = [];
  };
  const flushQuote = () => {
    if (quote.length) html.push(`<blockquote>${quote.map(renderMarkdownInline).join('<br>')}</blockquote>`);
    quote = [];
  };
  const flushBlocks = () => {
    flushParagraph();
    flushList();
    flushQuote();
  };
  const tableCells = line => line.trim().replace(/^\||\|$/g, '').split('|').map(cell => cell.trim());

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    if (code !== null) {
      if (/^\s*```\s*$/.test(line)) {
        const language = codeLanguage ? ` class="language-${esc(codeLanguage)}"` : '';
        html.push(`<pre><code${language}>${esc(code.join('\n'))}</code></pre>`);
        code = null;
        codeLanguage = '';
      } else {
        code.push(line);
      }
      continue;
    }

    const fence = line.match(/^\s*```([\w.+-]*)\s*$/);
    if (fence) {
      flushBlocks();
      code = [];
      codeLanguage = fence[1];
      continue;
    }

    if (!line.trim()) {
      flushBlocks();
      continue;
    }

    if (line.includes('|') && i + 1 < lines.length) {
      const separator = tableCells(lines[i + 1]);
      if (separator.length > 1 && separator.every(cell => /^:?-{3,}:?$/.test(cell))) {
        flushBlocks();
        const headers = tableCells(line);
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim() && lines[i].includes('|')) {
          rows.push(tableCells(lines[i]));
          i++;
        }
        i--;
        html.push(`<div class="markdown-table-wrap"><table><thead><tr>${headers.map(cell => `<th>${renderMarkdownInline(cell)}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${headers.map((_, index) => `<td>${renderMarkdownInline(row[index] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
        continue;
      }
    }

    const heading = line.match(/^(#{1,4})\s+(.+)$/);
    if (heading) {
      flushBlocks();
      const level = Math.min(6, heading[1].length + 2);
      html.push(`<h${level}>${renderMarkdownInline(heading[2])}</h${level}>`);
      continue;
    }

    if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
      flushBlocks();
      html.push('<hr>');
      continue;
    }

    const list = line.match(/^\s*(?:([-+*])|(\d+)[.)])\s+(.+)$/);
    if (list) {
      flushParagraph();
      flushQuote();
      const nextType = list[2] ? 'ol' : 'ul';
      if (listType && listType !== nextType) flushList();
      if (!listType) {
        listType = nextType;
        listStart = nextType === 'ol' ? Number(list[2]) : null;
      }
      const item = list[3].replace(/^\[([ xX])\]\s+/, (_, checked) => checked === ' ' ? '☐ ' : '☑ ');
      listItems.push(`<li>${renderMarkdownInline(item)}</li>`);
      continue;
    }

    const blockquote = line.match(/^\s*>\s?(.*)$/);
    if (blockquote) {
      flushParagraph();
      flushList();
      quote.push(blockquote[1]);
      continue;
    }

    flushList();
    flushQuote();
    paragraph.push(line.trim());
  }

  if (code !== null) html.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);
  flushBlocks();
  return html.join('');
}

const fmtScore = v => (v === null || v === undefined) ? '<span class="muted">—</span>' : Number(v).toFixed(v >= 1 || v === 0 ? 2 : 3).replace(/\.?0+$/,'') || '0';
const fmtDur = ms => ms == null ? '—' : (ms/1000 < 90 ? (ms/1000).toFixed(1)+'s' : (ms/60000).toFixed(1)+'min');
// a stat chip; r (0–1) adds a meter under the value — neutral while partial, --pass when full
const chipMeter = r => typeof r === 'number' && r >= 0 && r <= 1
  ? `<span class="meter${r >= 1 ? ' full' : ''}" style="--r:${r.toFixed(3)}" aria-hidden="true"></span>` : '';
const chipHTML = (k, v, r = null) => `<div class="chip"><div class="k">${k}</div><div class="v">${v}</div>${chipMeter(r)}</div>`;
const passBadge = p => p === true ? '<span class="badge pass">PASS</span>' : p === false ? '<span class="badge fail">FAIL</span>' : '<span class="badge na">—</span>';

const jsonPreview = (label, value) => `
  <details class="json-preview">
    <summary>${esc(label)}</summary>
    <div class="json-preview-toolbar">
      <button class="navbtn json-wrap-toggle" type="button" aria-pressed="true">Auto wrap: On</button>
    </div>
    <pre>${esc(JSON.stringify(value, null, 2))}</pre>
  </details>`;

$main.addEventListener('click', event => {
  const button = event.target.closest('.json-wrap-toggle');
  if (!button) return;
  const preview = button.closest('.json-preview');
  const wrapped = preview.classList.toggle('no-wrap') === false;
  button.setAttribute('aria-pressed', String(wrapped));
  button.textContent = `Auto wrap: ${wrapped ? 'On' : 'Off'}`;
});

async function copyText(text) {
  if (navigator.clipboard?.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      return;
    } catch (_) {
      // Fall through for browsers that block the Clipboard API.
    }
  }
  const input = document.createElement('textarea');
  input.value = text;
  input.style.position = 'fixed';
  input.style.opacity = '0';
  document.body.appendChild(input);
  input.focus();
  input.select();
  const copied = document.execCommand('copy');
  input.remove();
  if (!copied) throw new Error('copy failed');
}

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ' → ' + r.status);
  return r.json();
}

function invalidateRuns() {
  RUNS = null;
  Object.keys(_runCache).forEach(k => delete _runCache[k]);  // re-imported runs may differ
}

async function loadRuns() {
  if (!RUNS) {
    const d = await getJSON('/api/runs');
    RUNS = d.runs;
    STARS = new Set(d.stars || []);
    NOTES = d.notes || {};
    LLM_MODEL = d.llm_model || '';
  }
  return RUNS;
}

/* ---------- run list ---------- */
const listState = { q: '', agent_name: '', modality: '', view: 'all', sort: 'timestamp', dir: -1 };

// collapse agent variants into a fixed set of families for the sidebar filter
const AGENT_GROUPS = ['TalkDesk', 'ElevenLabs', 'Gemini-3.1-flash-live', 'GPT-Realtime-2.1', 'others'];

function agentGroup(name) {
  const n = (name || '').toLowerCase();
  if (!n) return '';  // runs without an agent name stay reachable only under "All agents"
  if (n.includes('talkdesk')) return 'TalkDesk';
  if (n.includes('elevenlabs')) return 'ElevenLabs';
  if (n.includes('gemini')) return 'Gemini-3.1-flash-live';
  if (n.includes('realtime')) return 'GPT-Realtime-2.1';
  return 'others';
}

const MODALITIES = [['voice', 'Voice'], ['text', 'Text']];
const modalityLabel = m => (MODALITIES.find(([k]) => k === m) || [])[1] || '';
const modalityTag = m => m
  ? `<span class="mode-tag">${m === 'voice' ? ICONS.mic : ICONS.chat}${modalityLabel(m)}</span>`
  : '<span class="muted">—</span>';
// runs whose caller was tau2-bench's native user simulator (user_simulator.json in the run dir)
const userSimTag = engine => engine === 'tau2'
  ? '<span class="mode-tag" style="margin-left:6px" title="Caller simulated by tau2-bench’s native user simulator">τ² user</span>'
  : '';

const runSorters = {
  timestamp: r => r.timestamp || '',
  modality: r => r.modality || '',
  run_name: r => r.run_name || '',
  agent_name: r => r.agent_name || '',
  scenarios: r => r.has_results ? r.scenarios_passed / Math.max(1, r.scenarios_total) : null,
  primary_score: r => r.primary_score,
  eval_final: r => r.eval_final,
};

function sortRows(rows, sorters, key, dir) {
  const get = sorters[key] || (() => null);
  return [...rows].sort((a, b) => {
    const va = get(a), vb = get(b);
    if (va == null && vb == null) return 0;
    if (va == null) return 1;  // missing values sink to the bottom either way
    if (vb == null) return -1;
    if (typeof va === 'string') return va.localeCompare(vb, undefined, { numeric: true, sensitivity: 'base' }) * dir;
    return (va < vb ? -1 : va > vb ? 1 : 0) * dir;
  });
}

const sortableTh = (key, label, state, cls = '') => {
  const active = state.sort === key;
  return `<th data-sort="${key}" class="${cls} ${active ? (state.dir > 0 ? 'sorted-asc' : 'sorted-desc') : ''}"
    aria-sort="${active ? (state.dir > 0 ? 'ascending' : 'descending') : 'none'}"><button type="button" class="th-sort">${label}<span class="sort-ind" aria-hidden="true"></span></button></th>`;
};

function filteredRuns() {
  const runs = RUNS || [];
  const hiddenRuns = runs.filter(r => HIDDEN.has(r.path));
  const pool = listState.view === 'hidden' ? hiddenRuns : runs.filter(r => !HIDDEN.has(r.path));
  return {
    hiddenCount: hiddenRuns.length,
    pool,
    rows: pool.filter(r =>
      (listState.view !== 'starred' || STARS.has(r.path)) &&
      (!listState.agent_name || agentGroup(r.agent_name) === listState.agent_name) &&
      (!listState.modality || r.modality === listState.modality) &&
      (!listState.q || r.run_name.toLowerCase().includes(listState.q)
        || (r.agent_name || '').toLowerCase().includes(listState.q)
        || (NOTES[r.path] || '').toLowerCase().includes(listState.q))),
  };
}

const copyNameBtn = name => `<button class="copy-run-name" type="button" data-run-name="${esc(name)}"
  title="Copy run name" aria-label="Copy run name ${esc(name)}"><span>${esc(name)}</span><span class="copy-icon" aria-hidden="true">${ICONS.copy}</span><span class="copy-feedback" aria-live="polite"></span></button>`;

// the config name is the row's link (keyboard, ⌘-click); the part from <N>trials- on (timestamp + run id) only
// tells runs of one config apart: one muted line, cut with an ellipsis, the whole name in its tooltip
const runNameHTML = (name, href) => {
  const m = String(name ?? '').match(/^(.+?)-(\d+trials-.*)$/);
  return `<a class="row-link run-link" href="${href}">${esc(m ? m[1] : name)}</a>`
    + (m ? `<span class="run-suffix" title="${esc(name)}">${esc(m[2])}</span>` : '');
};
// a 56px bar under the Scenarios badge, so 69/70 and 0/70 no longer look alike
const ratioBar = (passed, total) => total
  ? `<span class="ratio" style="--r:${Math.min(1, Math.max(0, (Number(passed) || 0) / total)).toFixed(3)}" aria-hidden="true"></span>`
  : '';

function runRowHTML(r) {
  return `
  <tr class="rowlink${SELECTED.has(r.path) ? ' selected' : ''}" data-href="#/run/${encodeURIComponent(r.path)}">
    <td class="selcell"><input type="checkbox" class="row-sel" data-path="${esc(r.path)}"${SELECTED.has(r.path) ? ' checked' : ''} aria-label="Select ${esc(r.run_name)}"></td>
    <td class="starcell" data-path="${esc(r.path)}">${starIcon(r.path)}</td>
    <td class="eyecell" data-path="${esc(r.path)}">${hideIcon(r.path)}</td>
    <td class="delcell" data-path="${esc(r.path)}"><button type="button" class="trash row-act" aria-label="Delete this run" title="Delete this run">${ICONS.trash}</button></td>
    <td class="mono muted">${esc(bjStamp(r.timestamp) || '?')}</td>
    <td class="run-cell">${runNameHTML(r.run_name, `#/run/${encodeURIComponent(r.path)}`)}</td>
    <td>${esc(r.agent_name || '—')}</td>
    <td>${modalityTag(r.modality)}${userSimTag(r.user_simulator)}</td>
    <td>${r.has_results
        ? runScenarioBadge(r) + (r.scenarios_errored ? ` <span class="muted">(${r.scenarios_errored} err)</span>` : '')
          + ratioBar(r.scenarios_passed, r.scenarios_total)
        : `<span class="badge na">no results (${r.scenario_count} dirs)</span>`}</td>
    <td>${fmtScore(r.primary_score)}</td>
    <td>${fmtScore(r.eval_final)}</td>
    <td class="note-cell"><textarea class="run-note-input" data-path="${esc(r.path)}" rows="${NOTES[r.path] ? 2 : 1}" wrap="soft" maxlength="2000" placeholder="Add a note…" title="Ctrl/⌘ + Enter or click elsewhere to save">${esc(NOTES[r.path] || '')}</textarea></td>
  </tr>`;
}

async function renderList() {
  const seq = routeSeq;
  await loadRuns();
  if (seq !== routeSeq) return;  // navigated away while the index (re)loaded (sync and import call this too)
  renderSideNav();
  SELECTED.clear();
  selAnchor = null;
  setView(`
  <div class="card table-card">
    <div class="list-meta"><span class="count" id="listCount"></span><span class="hint" id="listHint">drag run folders anywhere to import</span></div>
    <div class="table-wrap wide">
      <table id="runTable">
        <thead id="runHead"></thead>
        <tbody id="runRows"></tbody>
      </table>
    </div>
    <div class="bulk-bar" id="bulkBar" hidden>
      <span class="bulk-n" id="bulkN"></span>
      <button class="navbtn" type="button" id="bulkHide"></button>
      <button class="navbtn danger" type="button" id="bulkDelete">Delete</button>
      <button class="navbtn" type="button" id="bulkClear" title="Clear the selection (Esc)">Clear</button>
    </div>
    <div class="empty" id="listEmpty" hidden></div>
  </div>`);
  document.getElementById('bulkHide').addEventListener('click', bulkHide);
  document.getElementById('bulkDelete').addEventListener('click', bulkDelete);
  document.getElementById('bulkClear').addEventListener('click', () => { SELECTED.clear(); updateSelectionUI(); });
  updateRunRows();
}

/* ---------- selecting runs: the run list's checkboxes and the bar of actions on them ---------- */
// Only rows the list shows stay selected (updateRunRows drops the rest), so an action never reaches
// a run that is filtered out. Shift-click selects the range from the last box clicked.
const SELECTED = new Set();
let selAnchor = null;  // path of the last row box clicked
let shownPaths = [];   // the run list's rows, in display order
const runRowOf = path => document.querySelector(`#runRows .row-sel[data-path="${CSS.escape(path)}"]`)?.closest('tr');
const selectedShown = () => shownPaths.filter(p => SELECTED.has(p));

// rows a click takes out of the list fade first; then() re-renders without them
function fadeOutRows(rows, then) {
  if (REDUCED.matches || !rows.length) { then(); return; }
  rows.forEach(tr => tr.classList.add('row-leave'));
  setTimeout(then, 160);
}

function updateSelectionUI() {
  document.querySelectorAll('#runRows .row-sel').forEach(box => {
    box.checked = SELECTED.has(box.dataset.path);
    box.closest('tr').classList.toggle('selected', box.checked);
  });
  const n = SELECTED.size, all = document.getElementById('selAll');
  if (all) {
    all.checked = n > 0 && n === shownPaths.length;
    all.indeterminate = n > 0 && n < shownPaths.length;
  }
  const bar = document.getElementById('bulkBar');
  if (!bar) return;
  bar.hidden = !n;
  document.getElementById('bulkN').textContent = `${n} run${n === 1 ? '' : 's'} selected`;
  const hide = document.getElementById('bulkHide'), showing = listState.view === 'hidden';
  hide.textContent = showing ? 'Show again' : 'Hide';
  hide.title = showing ? 'Put the selected runs back in the list' : 'Hide the selected runs from the list on this computer';
}

function selectRows(box, shift) {
  if (box.id === 'selAll') {
    for (const p of shownPaths) box.checked ? SELECTED.add(p) : SELECTED.delete(p);
    selAnchor = null;
  } else {
    const path = box.dataset.path, from = shift && selAnchor ? shownPaths.indexOf(selAnchor) : -1, to = shownPaths.indexOf(path);
    const range = from >= 0 ? shownPaths.slice(Math.min(from, to), Math.max(from, to) + 1) : [path];
    for (const p of range) box.checked ? SELECTED.add(p) : SELECTED.delete(p);
    selAnchor = path;
  }
  updateSelectionUI();
}

function bulkHide() {
  const paths = selectedShown(), showing = listState.view === 'hidden';
  for (const p of paths) showing ? HIDDEN.delete(p) : HIDDEN.add(p);
  saveHidden();
  fadeOutRows(paths.map(runRowOf).filter(Boolean), refreshRunMarks);
  setUpStatus(`${showing ? 'Showing' : 'Hid'} ${paths.length} run${paths.length === 1 ? '' : 's'}${showing ? ' again' : ' on this computer'}`);
}

async function bulkDelete(e) {
  const paths = selectedShown(), button = e.currentTarget;
  if (!paths.length || !confirmDeleteRuns(paths)) return;
  const bar = document.getElementById('bulkBar');
  bar.querySelectorAll('button').forEach(b => { b.disabled = true; });
  setBusy(button, true);
  paths.forEach(p => runRowOf(p)?.classList.add('row-busy'));
  const deleted = [], failed = [];
  for (const [i, p] of paths.entries()) {
    setUpStatus(`Deleting ${i + 1} / ${paths.length}…`);
    try {
      await deleteRun(p);
      deleted.push(p);
    } catch (err) {
      runRowOf(p)?.classList.remove('row-busy');
      failed.push(`${p}: ${err.message}`);
    }
  }
  bar.querySelectorAll('button').forEach(b => { b.disabled = false; });
  setBusy(button, false);
  fadeOutRows(deleted.map(runRowOf).filter(Boolean), refreshRunMarks);
  setUpStatus(`Deleted ${deleted.length} run${deleted.length === 1 ? '' : 's'}`
    + (failed.length ? ` · ⚠ ${failed.length} not deleted — ${failed[0]}` : ''));
}

// One-shot fade of a fresh table's first 20 rows (step > 0: staggered by step ms). Only route() (run list,
// scenario table) and the sidebar filters call it, never the polled jobs / schedules tables; the update*Rows
// re-renders strip it, so search, sort and star toggles never replay it.
function staggerRows(tbody, step = 16) {
  if (!tbody) return;
  [...tbody.rows].slice(0, 20).forEach((tr, i) => tr.style.setProperty('--d', i * step + 'ms'));
  tbody.classList.add('rows-enter');
  clearTimeout(tbody._enterT);
  tbody._enterT = setTimeout(() => tbody.classList.remove('rows-enter'), 20 * step + 700);  // after the last row's ratio bar has grown
}

// Refreshes only the table + counters; the shell (and the topbar search box) stay put,
// so typing in the search never rebuilds the input it is typing into.
function updateRunRows() {
  const head = document.getElementById('runHead');
  if (!head) return;  // not on the list view
  const tbody = document.getElementById('runRows');
  tbody.classList.remove('rows-enter');
  const { rows, pool, hiddenCount } = filteredRuns();
  const sorted = sortRows(rows, runSorters, listState.sort, listState.dir);
  shownPaths = sorted.map(r => r.path);
  const shown = new Set(shownPaths);
  for (const p of SELECTED) if (!shown.has(p)) SELECTED.delete(p);
  if (!shown.has(selAnchor)) selAnchor = null;
  head.innerHTML = `<tr><th class="selcell"><input type="checkbox" id="selAll" aria-label="Select every run shown" title="Select every run shown"></th><th class="col-star"><span class="sr-only">Star</span></th><th class="col-hide"><span class="sr-only">Hide</span></th><th class="col-del"><span class="sr-only">Delete</span></th>${sortableTh('timestamp', 'Time (Beijing)', listState)}${sortableTh('run_name', 'Run', listState)}${sortableTh('agent_name', 'Agent', listState)}${sortableTh('modality', 'Mode', listState)}${sortableTh('scenarios', 'Scenarios', listState)}${sortableTh('primary_score', 'Primary', listState)}${sortableTh('eval_final', 'Eval final', listState)}<th>Note</th></tr>`;
  tbody.innerHTML = sorted.map(runRowHTML).join('');
  document.getElementById('listCount').textContent =
    `${sorted.length} / ${pool.length} ${listState.view === 'hidden' ? 'hidden runs' : 'runs'}`
    + (listState.view !== 'hidden' && hiddenCount ? ` · ${hiddenCount} hidden on this computer` : '');
  const empty = document.getElementById('listEmpty');
  empty.hidden = !!sorted.length;
  empty.textContent = listState.view === 'hidden'
    ? 'No hidden runs — use the eye icon on a row to hide one.'
    : 'No runs match the filters.';
  updateSelectionUI();
  updateSideNav();
}

/* ---------- sidebar ---------- */
function agentFamilies() {
  const counts = {};
  for (const r of RUNS || []) {
    const g = agentGroup(r.agent_name);
    if (g) counts[g] = (counts[g] || 0) + 1;
  }
  return AGENT_GROUPS.filter(g => counts[g]).map(g => [g, counts[g]]);  // fixed order, skip empty families
}

function modalityCounts() {
  const counts = {};
  for (const r of RUNS || []) if (r.modality) counts[r.modality] = (counts[r.modality] || 0) + 1;
  return MODALITIES.filter(([k]) => counts[k]).map(([k, label]) => [k, label, counts[k]]);
}

function renderSideNav() {
  const nav = document.getElementById('sideNav');
  if (!nav || !RUNS) return;

function updateSideNav() {

      el.dataset.href !== undefined ? location.hash.startsWith(el.dataset.href)

/* ---------- run detail ---------- */
const scenState = { sort: 'id', dir: 1, result: 'all' };
const scenSorters = {
  id: s => s.id,
  passed: s => s.passed === true ? 2 : s.passed === false ? 1 : null,
  goal_score: s => s.goal_score,
  end_reason: s => s.end_reason,
  turn_count: s => s.turn_count,
  duration_ms: s => s.duration_ms,
};
let CUR_RUN = null;  // { path, scenarios } while a run page is on screen

/* talk_bench_evaluation's reward factors, in the order score_scenario multiplies them;
   state integrity is a factor only when the run enforced it (otherwise report-only) */
const REWARD_FACTORS = [['ACTION', 'action_score'], ['COMMUNICATE', 'communicate_score'],
                        ['NL_ASSERTION', 'nl_assertions_score'], ['DB', 'db_state_score']];

/* How many criteria sit behind each factor, from scenario.json — the same counts
   score_scenario divides by: agent-owned expected_actions, communicate_info,
   nl_assertions, and expected_state assertions (fields, for the legacy dict form). */
function dbCriteriaCount(es) {
  if (!es || typeof es !== 'object') return 0;
  if ('schema_version' in es || 'assertions' in es) return Array.isArray(es.assertions) ? es.assertions.length : null;
  let n = 0;
  for (const entities of Object.values(es))
    for (const fields of Object.values(entities || {})) n += Object.keys(fields || {}).length;
  return n;
}
function criteriaTotals(sc) {
  const ev = sc?.evaluation;
  if (!ev) return null;
  return {
    ACTION: (ev.expected_actions || []).filter(a => !a.requestor || a.requestor === 'assistant').length,
    COMMUNICATE: (ev.communicate_info || []).length,
    NL_ASSERTION: (ev.nl_assertions || []).length,
    DB: dbCriteriaCount(ev.expected_state),
  };
}

/* {factor: score} or, once totals are known, {factor: [passed, total]}. Passed comes from
   the judge checks (communicate / NL) or score × total (action / DB, both met/total); a
   count that does not reproduce the stored score keeps the plain score instead. */
function rewardBreakdown(sess, enforceIntegrity, totals) {
  const tc = sess?.task_completion || {};
  const checks = { COMMUNICATE: tc.communicate_checks, NL_ASSERTION: tc.nl_assertion_checks };
  const out = {};
  for (const [k, f] of REWARD_FACTORS) {
    const score = tc[f];
    if (typeof score !== 'number') continue;
    const total = totals?.[k];
    if (!Number.isInteger(total)) { out[k] = score; continue; }
    const passed = checks[k] ? checks[k].filter(c => c.met).length : Math.round(score * total);
    const expected = total ? passed / total : 1;
    out[k] = Math.abs(expected - score) < 0.001 ? [passed, total] : score;
  }
  if (enforceIntegrity && typeof tc.state_integrity_score === 'number')
    out.INTEGRITY = totals ? [tc.state_integrity_score >= 1 ? 1 : 0, 1] : tc.state_integrity_score;
  return Object.keys(out).length ? out : null;
}
const fmtFactor = v => Array.isArray(v) ? `${v[0]}/${v[1]}` : fmtScore(v);
const factorOk = v => Array.isArray(v) ? v[0] >= v[1] : v >= 1;

function scenRowHTML(runPath) {
  return s => `
  <tr class="rowlink" data-href="${scenHref(runPath, s.id)}">
    <td class="mono nowrap"><a class="row-link" href="${scenHref(runPath, s.id)}">${esc(s.id)}</a></td>
    <td>${passBadge(s.passed)}</td>
    <td>${fmtScore(s.goal_score)}${s.breakdown ? `<div class="subscore">${
      Object.entries(s.breakdown).map(([k, v]) =>
        `<span class="${factorOk(v) ? 'ok' : 'bad'}">${esc(k)} ${fmtFactor(v)}</span>`).join(' · ')
    }</div>` : ''}</td>
    <td>${esc(s.end_reason ?? '—')}</td>
    <td>${s.turn_count ?? '—'}</td>
    <td>${fmtDur(s.duration_ms)}</td>
  </tr>`;
}

function updateScenRows() {
  const head = document.getElementById('scenHead');
  if (!head || !CUR_RUN) return;
  head.innerHTML = `<tr>${sortableTh('id', 'Scenario', scenState)}${sortableTh('passed', 'Result', scenState)}${sortableTh('goal_score', 'Goal score', scenState)}${sortableTh('end_reason', 'End reason', scenState)}${sortableTh('turn_count', 'Turns', scenState)}${sortableTh('duration_ms', 'Duration', scenState)}</tr>`;
  const tbody = document.getElementById('scenRows');
  tbody.classList.remove('rows-enter');
  const test = (SCEN_RESULTS.find(([k]) => k === scenState.result) || SCEN_RESULTS[0])[2];
  const seg = document.getElementById('scenResult');
  if (seg) seg.innerHTML = SCEN_RESULTS.map(([k, label, t]) => {
    const on = k === scenState.result;
    return `<button type="button" data-result="${k}" class="${on ? 'active' : ''}" aria-pressed="${on}">${label} <span class="seg-n">${CUR_RUN.scenarios.filter(t).length}</span></button>`;
  }).join('');
  const rows = CUR_RUN.scenarios.filter(test);
  tbody.innerHTML = rows.length
    ? sortRows(rows, scenSorters, scenState.sort, scenState.dir).map(scenRowHTML(CUR_RUN.path)).join('')
    : `<tr><td colspan="6" class="empty">No ${scenState.result === 'pass' ? 'passed' : 'failed'} scenarios in this run.</td></tr>`;
}
// the scenario table's result filter: [key, label, test]
const SCEN_RESULTS = [['all', 'All', () => true], ['pass', 'Passed', s => s.passed === true], ['fail', 'Failed', s => s.passed === false]];

/* The run payload carries no scenario.json, so the passed/total counts arrive after the
   first paint: fetch each evaluated scenario's scenario.json, then redraw the rows once. */
async function fillCriteriaCounts(path, seq, sessById, enforceIntegrity) {
  const todo = CUR_RUN.scenarios.filter(s => !s.tau2_breakdown && sessById.has(s.id));
  if (!todo.length) return;
  const totals = await Promise.all(todo.map(s =>
    fetch(dataHref(`${path}/${s.id}/scenario.json`)).then(r => r.ok ? r.json() : null).then(criteriaTotals, () => null)));
  if (seq !== routeSeq || CUR_RUN?.path !== path) return;
  todo.forEach((s, i) => { if (totals[i]) s.breakdown = rewardBreakdown(sessById.get(s.id), enforceIntegrity, totals[i]); });
  updateScenRows();
}

async function renderRun(path) {
  const seq = routeSeq;
  const [d] = await Promise.all([
    getRun(path),
    loadRuns(),  // ensures STARS is populated on direct page loads
  ]);
  if (seq !== routeSeq) return;
  const res = d.results, ev = d.evaluation;
  const chips = [];
  if (res) {
    chips.push(['Primary score', res.primary_score, res.primary_score],
               ['Passed', `${res.scenarios_passed}/${res.scenarios_total}`, res.scenarios_total ? res.scenarios_passed / res.scenarios_total : null],
               ['Errored', res.scenarios_errored]);
  }
  if (d.user_simulator?.engine === 'tau2') chips.push(['User simulator', `τ² native · ${d.user_simulator.llm || '?'}`]);
  if (ev) {
    chips.push(...[['Eval final', ev.final], ['Resolution', ev.resolution], ['Experience', ev.experience],
               ['Responsiveness', ev.responsiveness], ['Conv. quality', ev.conversation_quality]].map(([k, v]) => [k, v, v]));
  }
  // runs with no tau2 breakdown (non-tau2 domains) show talk_bench_evaluation's factors instead
  const sessById = new Map((ev?.session_results || []).map(r => [r.session_id, r]));
  const enforceIntegrity = ev?.config_snapshot?.state_integrity_mode === 'enforce';
  CUR_RUN = { path, scenarios: d.scenarios.map(s => ({
    ...s, breakdown: s.tau2_breakdown || rewardBreakdown(sessById.get(s.id), enforceIntegrity),
  })) };
  scenState.sort = 'id';
  scenState.dir = 1;
  scenState.result = 'all';
  setView(`
  <div class="crumbs"><a href="#">All runs</a> / ${esc(path)}</div>
  <div class="card">
    <div class="detail-heading">
      <h2><span class="starcell" id="runStar" data-path="${esc(path)}">${starIcon(path)}</span> ${esc(res?.agent_name || path)}</h2>
      ${res?.run_context?.agent_config ? `<a class="navbtn" href="#/test?from=${encodeURIComponent(path)}" title="Open the Run test page with this run's agent config and task set filled in">Re-run this agent…</a>` : ''}
      <a class="navbtn" href="#/compare?a=${encodeURIComponent(path)}">Compare with…</a>
      <button class="navbtn danger" id="deleteRunBtn" type="button" title="Delete this run from the archive">Delete run</button>
    </div>
    <div class="muted mono">${copyNameBtn(path)}</div>
    <div class="run-note-detail">
      <div class="note-head"><label for="runNote">Note</label><span class="muted" id="runNoteStatus" aria-live="polite"></span></div>
      <div class="note-row">
        <textarea id="runNote" wrap="soft" maxlength="2000" placeholder="Add a note about this run…" title="Ctrl/⌘ + Enter saves">${esc(NOTES[path] || '')}</textarea>
        <button class="navbtn" id="saveRunNoteBtn" type="button">Save note</button>
      </div>
    </div>
    <div class="chips">${chips.map(([k, v, r]) => chipHTML(k, typeof v === 'number' ? fmtScore(v) : esc(v ?? '—'), r)).join('')}</div>
    ${res ? '' : '<p class="muted">This run has no results.json (likely errored or interrupted) — scenario directories are still browsable below.</p>'}
  </div>
  ${aiCardsHTML('AI Run 报告', '一键让 AI 生成整个 run 的详细报告：总体结果、按根因分组的失败原因分布（含图）、高频问题详解（引用具体场景）和改进建议。', 'run')}
  <div class="card table-card">
    <div class="card-head"><h3>Scenarios (${d.scenarios.length})</h3><div class="seg" id="scenResult" role="group" aria-label="Show scenarios"></div></div>
    <div class="table-wrap">
      <table id="scenTable">
        <thead id="scenHead"></thead>
        <tbody id="scenRows"></tbody>
      </table>
    </div>
  </div>
  ${res || ev ? `<div class="card">${res ? jsonPreview('Raw results.json', res) : ''}${ev ? jsonPreview('Raw talk_bench_evaluation_result.json', ev) : ''}</div>` : ''}`);

  updateScenRows();
  document.getElementById('scenResult').addEventListener('click', e => {
    const b = e.target.closest('button[data-result]');
    if (!b || b.dataset.result === scenState.result) return;
    scenState.result = b.dataset.result;
    updateScenRows();
  });
  fillCriteriaCounts(path, seq, sessById, enforceIntegrity);
  addResumeLink(path, seq);
  initReport(path, '/api/run_report', '生成中…（大 run 可能需要 1–3 分钟）');
  initChat(path);
  document.getElementById('deleteRunBtn').addEventListener('click', async e => {
    const button = e.currentTarget;
    if (!confirmDeleteRun(path)) return;
    setBusy(button, true);
    try {
      await deleteRun(path);
      if (seq === routeSeq) location.hash = '#';
    } catch (err) {
      setBusy(button, false);
      setUpStatus('⚠ ' + err.message);
    }
  });
  document.getElementById('runNote').addEventListener('keydown', e => {  // like the run list's note fields
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); document.getElementById('saveRunNoteBtn').click(); }
  });
  document.getElementById('saveRunNoteBtn').addEventListener('click', async () => {
    const input = document.getElementById('runNote');
    const status = document.getElementById('runNoteStatus');
    const button = document.getElementById('saveRunNoteBtn');
    setBusy(button, true);
    status.textContent = 'Saving…';
    try {
      input.value = await saveRunNote(path, input.value);
      status.textContent = 'Saved';
      flashSaved(input);
    } catch (e) {
      status.textContent = 'Save failed: ' + e.message;
    } finally {
      setBusy(button, false);
    }
  });
}


// a run a checkout or the archive holds with scenarios left to run or score: offer --resume on the Run test page
async function addResumeLink(path, seq) {
  let r;
  try { r = (await getJSON('/api/test/resumable?name=' + encodeURIComponent(path))).run; } catch (_) { return; }
  const del = document.getElementById('deleteRunBtn');  // Delete stays the last button
  if (seq !== routeSeq || !r || !del) return;
  if (r.running_job) {
    del.insertAdjacentHTML('beforebegin', `<a class="navbtn" href="#/test?job=${encodeURIComponent(r.running_job)}" title="A test started from the Run test page is writing this run">Running — view log</a>`);
  } else if (r.started && (r.redo || r.rescore) && !r.scripted) {
    del.insertAdjacentHTML('beforebegin', `<a class="navbtn" href="#/test?resume=${encodeURIComponent(path)}" title="talk-bench run --resume: ${esc(resumeCounts(r))}">Resume…</a>`);
  }
}


/* ---------- compare two runs, aligned by scenario id ---------- */
const cmpState = { sort: 'id', dir: 1, diffOnly: false };
const cmpSorters = {
  id: r => r.id,
  a_passed: r => r.a.passed === true ? 2 : r.a.passed === false ? 1 : null,
  a_goal: r => r.a.goal_score,
  a_turns: r => r.a.turn_count,
  a_dur: r => r.a.duration_ms,
  b_passed: r => r.b.passed === true ? 2 : r.b.passed === false ? 1 : null,
  b_goal: r => r.b.goal_score,
  b_turns: r => r.b.turn_count,
  b_dur: r => r.b.duration_ms,
};
let CUR_CMP = null;  // the /api/compare payload while the compare page is on screen

// the A / B mark of the run pickers, for headers and labels that name a side
const sideTag = side => `<span class="side-tag${side === 'b' ? ' b' : ''}">${side.toUpperCase()}</span>`;
const cmpShortName = r => `${r.agent_name || r.path.split('-1trials-')[0]}${r.modality ? ` (${modalityLabel(r.modality)})` : ''}`;

// The other side of the comparison worth defaulting to: same domain and task count,
// opposite modality — the only pairing where a text-vs-voice delta means anything.
function defaultCounterpart(anchor) {
  const runs = (RUNS || []).filter(r => r.scenario_count && r.path !== anchor.path);  // RUNS is newest-first
  const sameDomain = r => (r.domains || []).some(d => (anchor.domains || []).includes(d));
  const sameTasks = r => sameDomain(r) && r.scenario_count === anchor.scenario_count;
  const crossModal = r => r.modality && anchor.modality && r.modality !== anchor.modality;
  return runs.find(r => crossModal(r) && sameTasks(r))
    || runs.find(r => crossModal(r) && sameDomain(r))
    || runs.find(r => sameTasks(r))
    || runs.find(r => sameDomain(r))
    || runs[0];
}

function defaultComparePair() {
  const runs = (RUNS || []).filter(r => r.scenario_count);
  const a = runs.find(r => r.modality === 'text') || runs[0];
  return a ? [a.path, defaultCounterpart(a)?.path || ''] : ['', ''];
}

/* ---------- run picker ----------
   The archive holds a hundred-plus runs, so each side is a filterable listbox rather than a
   native <select>: every row carries what you actually choose on (modality, date, task set,
   pass ratio, score), and rows are grouped by how well they line up with the other side —
   scenarios are matched by id, so a pair with no shared task set yields an empty table. */
const runTaskLabel = r => `${r.scenario_count} task${r.scenario_count === 1 ? '' : 's'}`;
const runSubline = r => [
  bjStamp(r.timestamp, 16) || '?',  // minutes are enough to tell runs apart
  (r.domains || []).join(', ') || 'no domain',
  runTaskLabel(r),
].join(' · ');
const runScenarioBadge = r => r.has_results
  ? `<span class="badge ${r.scenarios_passed === r.scenarios_total ? 'pass' : 'fail'}">${r.scenarios_passed}/${r.scenarios_total}</span>`
  : '<span class="badge na">no results</span>';
const runSearchText = r => [r.run_name, r.agent_name, modalityLabel(r.modality),
  r.user_simulator === 'tau2' ? 'tau2 user simulator' : '',
  (r.domains || []).join(' '), NOTES[r.path] || ''].join(' ').toLowerCase();

const runTitleHTML = r => `<span class="rc-title"><span>${esc(r.agent_name || r.run_name)}</span>${
  modalityTag(r.modality)}${userSimTag(r.user_simulator)}${STARS.has(r.path) ? `<span class="star on">${ICONS.star}</span>` : ''}</span>`;

// Hidden runs stay out of the list — the eye icon means "stop showing me this" — unless one of
// them is already on the page, where dropping it silently would be more confusing than showing it.
function cmpPickerGroups(side, selected, otherPath, query) {
  const q = (query || '').trim().toLowerCase();
  const rows = (RUNS || [])
    .filter(r => !HIDDEN.has(r.path) || r.path === selected || r.path === otherPath)
    .filter(r => !q || runSearchText(r).includes(q))
    .sort((x, y) => STARS.has(y.path) - STARS.has(x.path));  // stable, so newest-first within each group
  const other = (RUNS || []).find(r => r.path === otherPath);
  if (!other) return [['', rows]];
  const sharesDomain = r => (r.domains || []).some(d => (other.domains || []).includes(d));
  const rank = r => !sharesDomain(r) ? 2 : r.scenario_count === other.scenario_count ? 0 : 1;
  const L = side === 'a' ? 'B' : 'A';
  return [`Same task set as ${L}`, `Same domain as ${L}`, 'Other runs']
    .map((label, i) => [label, rows.filter(r => rank(r) === i)]);
}

function cmpOptionHTML(side, r, selected, otherPath, idx) {
  const other = (RUNS || []).find(x => x.path === otherPath);
  const taken = r.path === otherPath;
  const crossModal = other && r.modality && other.modality && r.modality !== other.modality;
  return `<div class="rc-opt${taken ? ' taken' : ''}" id="rc-${side}-${idx}" role="option"
    data-path="${esc(r.path)}" aria-selected="${r.path === selected}"${taken ? ' aria-disabled="true"' : ''}
    title="${esc(r.run_name)}">
    <span class="rc-tick">${r.path === selected ? ICONS.check : ''}</span>
    <span class="rc-body">${runTitleHTML(r)}<span class="rc-sub">${esc(runSubline(r))}</span></span>
    <span class="rc-meta">${taken ? `<span class="rc-note">already ${side === 'a' ? 'B' : 'A'}</span>`
      : crossModal ? '<span class="rc-note rc-cross">cross-modal</span>' : ''
      }${runScenarioBadge(r)}<span class="rc-score">${fmtScore(r.primary_score)}</span></span>
  </div>`;
}

function cmpOptionsHTML(side, selected, otherPath, query) {
  let idx = 0;
  const html = cmpPickerGroups(side, selected, otherPath, query)
    .filter(([, rows]) => rows.length)
    .map(([label, rows]) => (label ? `<div class="rc-group">${esc(label)}</div>` : '')
      + rows.map(r => cmpOptionHTML(side, r, selected, otherPath, idx++)).join(''))
    .join('');
  return html || '<div class="rc-none">No run matches this filter.</div>';
}

function cmpPickerHTML(side, selected) {
  const id = side === 'a' ? 'cmpA' : 'cmpB';

           <span class="rc-sub">${(RUNS || []).length} runs archived</span>`}</span>

}

const setComboOpen = (root, on) => {

function initCmpPicker(side, selected, otherPath, onPick) {
  const root = document.getElementById(side === 'a' ? 'cmpA' : 'cmpB');
  const btn = root.querySelector('.rc-btn');
  const input = root.querySelector('.rc-search input');
  const list = root.querySelector('.rc-list');
  const count = root.querySelector('.rc-count');
  const options = () => [...list.querySelectorAll('.rc-opt:not(.taken)')];
  const activeIndex = () => options().findIndex(el => el.classList.contains('active'));

  const setActive = i => {
    const all = options();
    if (!all.length) { list.removeAttribute('aria-activedescendant'); return; }
    const n = (i + all.length) % all.length;
    all.forEach((el, k) => el.classList.toggle('active', k === n));
    all[n].scrollIntoView({ block: 'nearest' });
    list.setAttribute('aria-activedescendant', all[n].id);
  };
  const draw = () => {
    list.innerHTML = cmpOptionsHTML(side, selected, otherPath, input.value);
    const shown = list.querySelectorAll('.rc-opt').length;
    count.textContent = `${shown} run${shown === 1 ? '' : 's'}`;
    setActive(Math.max(0, options().findIndex(el => el.dataset.path === selected)));
  };
  const toggle = on => {
    setComboOpen(root, on);
    if (!on) { btn.focus(); return; }
    input.value = '';  // every open starts from the full list
    draw();
    input.focus();
  };
  const pick = path => {
    setComboOpen(root, false);
    if (path === selected) { btn.focus(); return; }  // same run: nothing to navigate to
    onPick(path);
  };

  btn.addEventListener('click', () => toggle(!root.classList.contains('open')));
  btn.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); toggle(true); }
  });
  input.addEventListener('input', draw);
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(activeIndex() + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(activeIndex() - 1); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      const el = options()[activeIndex()];
      if (el) pick(el.dataset.path);
    } else if (e.key === 'Escape') { e.preventDefault(); toggle(false); }
    else if (e.key === 'Tab') setComboOpen(root, false);
  });
  list.addEventListener('click', e => {
    const el = e.target.closest('.rc-opt');
    if (el && !el.classList.contains('taken')) pick(el.dataset.path);
  });
  list.addEventListener('pointerover', e => {
    const el = e.target.closest('.rc-opt:not(.taken)');
    if (el) setActive(options().indexOf(el));
  });
}

const cmpGoTo = (a, b) => {
  location.hash = '#/compare' + (a || b ? `?a=${encodeURIComponent(a || '')}&b=${encodeURIComponent(b || '')}` : '');

function cmpMetricRow(label, va, vb, { fmt = fmtScore, better = 'high', note = '' } = {}) {
  const num = v => (typeof v === 'number' && isFinite(v)) ? v : null;
  const [na, nb] = [num(va), num(vb)];
  let delta = '<span class="muted">—</span>';
  if (na !== null && nb !== null) {
    const d = nb - na;
    const cls = !better || Math.abs(d) < 1e-9 ? '' : (better === 'high') === (d > 0) ? 'up' : 'down';
    const shown = fmt(Math.abs(d));
    delta = `<span class="cmp-delta ${cls}">${d > 0 ? '+' : d < 0 ? '−' : ''}${shown}</span>`;
  }
  const cell = v => v == null ? '<span class="muted">—</span>' : fmt(v);
  return `<tr><td>${esc(label)}${note ? `<div class="subscore">${esc(note)}</div>` : ''}</td>
    <td>${cell(va)}</td><td class="cmp-side">${cell(vb)}</td><td>${delta}</td></tr>`;
}

/* ---------- transcript with tool calls merged chronologically ---------- */
// m:ss.s, rounded once so 59.96 s reads 1:00.0
const fmtClock = s => {
  const d = Math.round(Math.abs(s) * 10);
  return `${s < 0 ? '−' : ''}${Math.floor(d / 600)}:${String(((d % 600) / 10).toFixed(1)).padStart(4, '0')}`;
};

// With audio (`align` from /api/scenario) times are positions in the wavs: a turn shows where its
// speech starts, a tool call when it ran; a turn whose speech wasn't located shows when it was
// finalized (logged, for records.json), marked ≈. A text run has no wav, so its times count from
// the first event. `transcript` (from records.json, Talkdesk Autopilot runs) keeps each message
// apart, in the platform's order, with the agent's internal hand-offs as notes; without it
// conversation.json's turns and tool_log.json's calls are merged by time.
function renderTimeline(d, align) {
  let n = 0;
  const items = d.transcript ? d.transcript.map(x => x.kind === 'turn' ? { ...x, i: n++ } : x) : [
    ...(d.conversation || []).map((t, i) => ({ kind: 'turn', speaker: t.speaker, text: t.text, timestamp: t.timestamp,
      label: `turn ${t.turn_index ?? ''}`, span: align?.spans[t.turn_index], i })),
    ...(d.tool_log || []).map((c, i) => ({ ...c, kind: 'tool', log_index: i })),
  // stable sort; items without a timestamp keep their original relative position at the end
  ].sort((a, b) => (a.timestamp ?? Infinity) - (b.timestamp ?? Infinity));
  if (!items.length) return '<p class="muted">No conversation.json</p>';
  const t0 = items.reduce((m, x) => x.timestamp != null && x.timestamp < m ? x.timestamp : m, Infinity);
  const fmtT = ts => ts == null || t0 === Infinity ? '' : '+' + (ts - t0).toFixed(1) + 's';
  const seekTs = (s, title, approx = false) => {
    const label = (approx ? '≈' : '') + fmtClock(s);
    return s >= 0 && s < align.duration
      ? `<button class="ts" type="button" data-seek="${s.toFixed(2)}" title="${esc(title)} · click to play from here">${label}</button>`
      : `<span class="ts" title="${esc(title)} · outside the recording">${label}</span>`;
  };
  const atTs = (x, title) => !align ? `<span class="ts">${fmtT(x.timestamp)}</span>`
    : x.timestamp == null ? '' : seekTs(x.timestamp - align.origin, title);
  const turnTs = t => {
    if (!align) return `<span class="ts">${fmtT(t.timestamp)}</span>`;
    if (t.span) return seekTs(t.span[0], `speech ${fmtClock(t.span[0])}–${fmtClock(t.span[1])} in the recording`);
    return t.timestamp == null ? '' : seekTs(t.timestamp - align.origin, (d.transcript
      ? 'when Talkdesk logged the message' : 'when the turn was finalized') + ' — its speech was not located in the recording', true);
  };
  const exitBadge = x => x.exit ? ` <span class="badge fail" title="${esc(x.exit.message)}">exit: ${esc(x.exit.type)}</span>` : '';
  let lastNote = null;
  return items.map(it => {
    if (it.kind === 'turn') {
      // an agent message sent for a reason other than a plain reply (duplicate_tool_call, block, …):
      // the hand-off just before it usually says why
      const why = it.action && it.action !== 'send_to_user'
        ? `<span class="badge na"${lastNote?.action === it.action ? ` title="${esc(lastNote.text)}"` : ''}>${esc(it.action)}</span>` : '';
      const who = [esc(it.speaker) + (it.by ? ` (${esc(it.by)})` : ''), [it.label, turnTs(it)].filter(Boolean).join(' ')]
        .filter(Boolean).join(' · ');
      return `
      <div class="turn ${it.speaker === 'user' ? 'user' : 'agent'}"${it.span ? ` data-span="${it.span.join(',')}"` : ''}>
        <div><div class="who">${who} ${why}${exitBadge(it)}</div>
        <div class="bubble" data-i="${it.i}">${esc(it.text)}</div></div>
      </div>`;
    }
    if (it.kind === 'note') {
      lastNote = it;
      return `
    <div class="hop">
      <div>${atTs(it, 'when Talkdesk logged the message')}<span class="hop-route">${esc(it.src)} → ${esc(it.dst)}</span>${it.action ? ` · <span class="mono">${esc(it.action)}</span>` : ''}${exitBadge(it)}</div>
      ${it.text ? `<div class="hop-text">${esc(it.text)}</div>` : ''}
    </div>`;
    }
    const error = it.result?.error ? it.result.error.message || JSON.stringify(it.result.error)
      : it.success === false ? (typeof it.result === 'string' ? it.result : JSON.stringify(it.result)) : '';
    return `
    <div class="tool-call"${it.log_index != null ? ` data-log="${it.log_index}"` : ''}>
      ${atTs(it, 'when the tool was called')}
      <span class="tool-icon">${ICONS.wrench}</span><span class="name mono">${esc(it.tool_name)}</span>
      ${it.by || it.duration_ms != null ? `<span class="muted">· ${[esc(it.by || ''), it.duration_ms != null ? fmtDur(it.duration_ms) : ''].filter(Boolean).join(' · ')}</span>` : ''}
      ${it.db_changed ? '<span class="badge pass" style="margin-left:8px">db changed</span>' : ''}
      ${error ? `<span class="badge fail" style="margin-left:8px">error</span>` : ''}
      ${it.only_in_tool_log ? '<span class="badge na" style="margin-left:8px" title="talk-bench\'s tool server ran this call, but records.json does not list it; placed by time">not in records.json</span>' : ''}
      ${error ? `<div class="err">${esc(error)}</div>` : ''}
      ${jsonPreview('args & result', {arguments: it.arguments, result: it.result})}
    </div>`;
  }).join('');
}

// a transcript time plays conversation.wav from there (clicked again while that turn plays: pause);
// whichever player is running marks the turns it is inside — all three wavs share one clock
function initAudioSync() {
  const box = document.getElementById('transcript');
  const players = [...document.querySelectorAll('.audio-grid audio')];
  const player = players.find(a => a.src.endsWith('/conversation.wav')) || players[0];
  if (!box || !player) return;
  box.addEventListener('click', e => {
    const b = e.target.closest('[data-seek]');
    if (!b) return;
    if (!player.paused && b.closest('[data-span]')?.classList.contains('playing')) { player.pause(); return; }
    players.forEach(a => a !== player && a.pause());
    player.currentTime = Math.max(0, +b.dataset.seek - 0.2);  // a little lead-in so the first word isn't clipped
    player.play().catch(() => {});
  });
  // looked up on every tick: the comparison view's rows arrive after this runs
  const mark = e => {
    const t = e.target.currentTime;
    for (const el of box.querySelectorAll('[data-span]')) {
      const [start, end] = el.dataset.span.split(',').map(Number);
      el.classList.toggle('playing', t >= start - 0.2 && t <= end + 0.2);
    }
  };
  for (const a of players) for (const ev of ['timeupdate', 'seeked']) a.addEventListener(ev, mark);
}
