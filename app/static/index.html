    <td class="mono" style="overflow-wrap:anywhere">${s.url ? esc(s.url) : s.ngrok ? `<span class="muted">${s.job_id ? 'waiting for ngrok…' : 'ngrok (see its terminal)'}</span>` : '<span class="muted">local only</span>'}</td>
    <td class="nowrap mcp-up" data-started="${s.started || ''}">${fmtElapsed(s.started)}</td>
    <td><div class="job-actions">${s.job_id ? `<button class="navbtn" type="button" data-mcp-log="${s.job_id}">Log</button>` : ''}<button class="navbtn" type="button" data-mcp-stop="${s.pgid}"${lock}>Stop</button></div></td></tr>`).join('');
  document.getElementById('mcpEmpty').hidden = !!d.servers.length;
  const jobs = d.jobs.filter(j => j.kind === 'provision');
  document.getElementById('pjRows').innerHTML = jobs.map(j => `<tr class="${provState.selected === j.id ? 'tr-selected' : ''}">
    <td class="nowrap">${jobStatusHTML(j)}</td>
    <td><b>${esc(j.result?.agent_name || j.agent_name)}</b><div class="subscore">${esc(j.file ? j.file.slice(18) : 'edited config')}</div></td>
    <td>${platformBadge(j.platform)}</td>
    <td class="nowrap">${esc(fmtWhen(j.started))}</td>
    <td class="mono" style="overflow-wrap:anywhere">${esc(j.result?.agent_system_id || (j.status === 'running' ? '…' : '—'))}</td>
    <td><div class="job-actions"><button class="navbtn" type="button" data-pj-open="${j.id}">Open</button>${
      j.status !== 'running' ? `<button class="navbtn" type="button" data-pj-del="${j.id}"${lock} aria-label="Remove from the history">×</button>` : ''}</div></td></tr>`).join('');
  document.getElementById('pjEmpty').hidden = !!jobs.length;
  if (provState.selected) renderProvJob();
}

async function loadProvConfig(file, seq = routeSeq) {
  const ta = document.getElementById('provYaml');
  if (!file) {
    provState.cfgFile = ''; provState.cfgVersion = null;
    ta.value = provState.cfgText = 'agent_name: \napi_base_url: "https://api.talkdeskqa.com"\nmcp_name_prefix: ""\nmcp_description: ""\ntemplate_name: ""\n# account_id / oauth_path / token_url / mcp_url: unset → TALKDESK_* in .env\n';
  } else {
    const r = await getJSON(`/api/settings/file?project=${TD_PROJECT}&file=${encodeURIComponent(file)}`);
    if (seq !== routeSeq) return;
    provState.cfgFile = file; provState.cfgVersion = r.version;
    ta.value = provState.cfgText = r.text;
  }
  document.getElementById('provCfg').value = file;
  document.getElementById('provPreviewOut').innerHTML = '';
  await checkProvConfig();
}

async function checkProvConfig() {
  const seq = ++provState.checkSeq, out = document.getElementById('provResolved');
  try {
    const r = await postJSON('/api/talkdesk/check', { text: document.getElementById('provYaml').value });
    if (seq !== provState.checkSeq || !out.isConnected) return;
    const rows = [['agent_name', r.agent_name, 'yaml', true], ['api_base_url', r.api_base_url, 'yaml', true],
      ...r.resolved.map(x => [x.key, x.value, x.source, x.ok, x.note])];
    out.innerHTML = `<table class="res-table" style="margin-top:12px"><tbody>${rows.map(([k, v, src, ok, note]) => `<tr>
      <td>${esc(k)}</td><td><span class="mono">${esc(v ?? '—')}</span>${k === 'api_base_url' ? ' ' + platformBadge(r.platform) : ''}${
        src && src !== 'yaml' ? `<div class="subscore">from ${esc(src)}</div>` : ''}</td>
      <td class="${ok ? 'ok' : 'bad'}">${ok ? ICONS.check : esc(note || 'missing')}</td></tr>`).join('')}</tbody></table>${
      r.warnings.length ? `<div class="set-err">${esc(r.warnings.join('\n'))}</div>` : ''}`;
  } catch (e) {
    if (seq === provState.checkSeq && out.isConnected) out.innerHTML = `<div class="set-err">${esc(e.message)}</div>`;
  }
}

function selectProvJob(id) {
  provState.selected = id;
  provState.logs = Object.fromEntries(Object.entries(provState.logs).filter(([, l]) => l.el !== 'pjLog'));
  provState.logs[id] = { el: 'pjLog', offset: 0, text: '' };
  renderProvRows();
  renderProvJob();
  document.getElementById('pjCard').scrollIntoView({ behavior: smoothScroll(), block: 'start' });
  followLog(id).catch(() => {});
}

function renderProvJob() {
  const card = document.getElementById('pjCard'), j = provState.data.jobs.find(x => x.id === provState.selected);
  if (!card || !j) return;
  const id = j.result?.agent_system_id;
  const agents = provState.data.agent_samples;
  // samples/provision/<x>.yaml provisions what samples/<x>.yaml runs, by the checkout's naming
  const pick = agents.find(a => j.file && a.file === 'samples/' + j.file.split('/').pop())
    || agents.find(a => a.name === (j.result?.agent_name || j.agent_name)) || agents[0];
  const keep = id && card.dataset.job === j.id && card.dataset.state === j.status;  // keep the user's picks while polling
  card.hidden = false;
  if (!keep || !document.getElementById('pjLog')) {
    card.dataset.job = j.id;
    card.dataset.state = j.status;
    card.innerHTML = `<h3 class="step-h"><span class="step-n">3</span>${id ? 'Point an agent config at it' : 'Provisioning'}</h3>
      <div class="muted" style="font-size:12.5px;margin:6px 0 10px" id="pjMeta"></div>
      <div class="cmdline">${esc(j.cmd.map(shellQuote).join(' '))}</div>
      <pre class="log-pane" id="pjLog" style="margin-top:10px"></pre>
      ${id ? `<div class="pj-id">agent_system_id <code>${esc(id)}</code><button class="navbtn" type="button" data-copy="${esc(id)}">Copy</button>${
        j.result.mcp_server_id ? `<span class="muted">MCP server record ${esc(j.result.mcp_server_id)}</span>` : ''}</div>
      <div class="form-grid"><div class="field wide"><label for="pjAgent">Agent config (talk-bench-talkdesk/samples) to run tests against it</label>
        <select id="pjAgent">${agents.map(a => `<option value="${esc(a.file)}"${a === pick ? ' selected' : ''}>${esc(a.file.slice(8))} — ${esc(a.name || '')}</option>`).join('')}</select></div></div>
      <label class="check" style="margin-top:10px"><input type="checkbox" id="pjMcp"${j.mcp_url ? ' checked' : ' disabled'}> also set agent.mcp.server_url to <span class="mono">${esc(j.mcp_url || '(no MCP URL)')}</span></label>
      <div class="actions-row"><button class="btn primary" type="button" id="pjApply"${provState.data.local ? '' : ' disabled'}>Write it into the config</button><span id="pjApplyOut" style="font-size:12.5px"></span></div>` : ''}`;
    const log = provState.logs[j.id];
    if (log) document.getElementById('pjLog').textContent = log.text;
  }
  document.getElementById('pjMeta').innerHTML = `${jobStatusHTML(j)} · ${esc(j.result?.agent_name || j.agent_name)} ${platformBadge(j.platform)} · ${esc(j.api_base_url)} · ${fmtElapsed(j.started, j.finished)}${
    j.error ? ` · <span style="color:var(--fail)">${esc(j.error)}</span>` : ''}`;
}

async function followLog(id) {
  const log = provState.logs[id];
  if (!log) return;
  const d = await getJSON(`/api/talkdesk/jobs/${id}?offset=${log.offset}`);
  if (provState.logs[id] !== log) return;
  if (d.next_offset < log.offset) log.text = '';
  log.text += d.log;
  log.offset = d.next_offset;
  const el = document.getElementById(log.el);
  if (el && d.log) {
    const atEnd = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
    el.textContent = log.text;
    if (atEnd) el.scrollTop = el.scrollHeight;
  }
}

document.addEventListener('click', async e => {
  if (!e.target.closest('#provPage')) return;
  const t = e.target.closest('button');
  if (!t) return;
  const status = msg => { document.getElementById('provStatus').textContent = msg; };
  if (t.id === 'mcpStart') {
    setBusy(t, true);
    try {
      const r = await postJSON('/api/talkdesk/mcp', { source: document.getElementById('mcpSource').value, domain: document.getElementById('mcpDomain').value,
        port: Number(document.getElementById('mcpPort').value), ngrok: document.getElementById('mcpNgrok').checked });
      mcpSay('starting… (uv run takes a few seconds)');
      provState.data.jobs.unshift(r.job);
      openMcpLog(r.job);
      await refreshProvision();
    } catch (err) { mcpSay('⚠ ' + err.message); }
    finally { setBusy(t, false); }
  } else if (t.dataset.mcpStop) {
    const s = provState.data.servers.find(x => String(x.pgid) === t.dataset.mcpStop);
    if (!confirm(`Stop the MCP server serving ${s?.source} · ${s?.domain} on port ${s?.port}?${s?.job_id ? '' : '\n\nIt was started outside the viewer (in a terminal).'}\nTests and agents using it lose their tools.`)) return;
    setBusy(t, true);
    try { await postJSON('/api/talkdesk/mcp/stop', { pgid: Number(t.dataset.mcpStop) }); mcpSay('stopping…'); }
    catch (err) { mcpSay('⚠ ' + err.message); setBusy(t, false); }
  } else if (t.dataset.mcpLog) {
    openMcpLog(provState.data.jobs.find(j => j.id === t.dataset.mcpLog));
  } else if (t.id === 'mcpLogClose') {
    document.getElementById('mcpLogWrap').hidden = true;
    for (const [id, l] of Object.entries(provState.logs)) if (l.el === 'mcpLog') delete provState.logs[id];
  } else if (t.id === 'mcpCheck') {
    const out = document.getElementById('mcpCheckOut');
    setBusy(t, true);
    out.textContent = '';
    try {
      const r = await postJSON('/api/talkdesk/mcp/check', { url: provState.data.mcp_url });
      out.innerHTML = r.ok ? `<span style="color:var(--pass)">serves ${esc(r.source && r.domain ? r.source + ' · ' + r.domain : r.name || 'something')}</span>`
        : `<span style="color:var(--fail)">not reachable: ${esc(r.error)}</span>`;
    } catch (err) { out.innerHTML = `<span style="color:var(--fail)">${esc(err.message)}</span>`; }
    finally { setBusy(t, false); }
  } else if (t.id === 'provPreview') {
    const out = document.getElementById('provPreviewOut');
    setBusy(t, true);
    status('talkdesk-agent generate…');
    try {
      const r = await postJSON('/api/talkdesk/generate', { text: document.getElementById('provYaml').value });
      status('');
      out.innerHTML = `<details open style="margin-top:14px"><summary style="cursor:pointer;font-size:13px">Template provision would deploy · ${r.agents} agent${r.agents === 1 ? '' : 's'}, ${r.tools} tool${r.tools === 1 ? '' : 's'} · IDs are PLACEHOLDER until provisioning</summary>
        <pre class="log-pane" style="margin-top:8px">${esc(r.json)}</pre></details>`;
    } catch (err) { status('⚠ ' + err.message); out.innerHTML = ''; }
    finally { setBusy(t, false); }
  } else if (t.id === 'provRun') {
    const text = document.getElementById('provYaml').value;
    let chk;
    try { chk = await postJSON('/api/talkdesk/check', { text }); } catch (err) { status('⚠ ' + err.message); return; }
    const missing = chk.resolved.filter(x => !x.ok).map(x => x.key);
    if (missing.length) { status(`⚠ fix ${missing.join(', ')} first`); return; }
    const template = chk.resolved.find(x => x.key === 'template_name').value;
    if (!confirm(`Provision "${chk.agent_name}" on ${chk.platform || chk.api_base_url}?\n\nThis creates an MCP server record and a new agent system in the Talkdesk account ${chk.resolved.find(x => x.key === 'account_id').value} (${chk.api_base_url}). Like the CLI, it also writes the patched template back to libs/talkdesk_agent/templates/${template}.`)) return;
    setBusy(t, true);
    try {
      const r = await postJSON('/api/talkdesk/provision', { text, file: provDirty() ? null : provState.cfgFile || null });
      provState.data.jobs.unshift(r.job);
      status('');
      selectProvJob(r.job.id);
    } catch (err) { status('⚠ ' + err.message); }
    finally { setBusy(t, false); }
  } else if (t.id === 'provSave' || t.id === 'provSaveAs') {
    const text = document.getElementById('provYaml').value;
    let file = provState.cfgFile, version = provState.cfgVersion;
    if (t.id === 'provSaveAs' || !file) {
      const name = prompt('File name in samples/provision/', file ? file.slice(18).replace(/\.ya?ml$/, '') + '_copy.yaml' : 'my_agent_qa.yaml');
      if (!name) return;
      file = 'samples/provision/' + (/\.ya?ml$/.test(name) ? name : name + '.yaml');
      version = null;
    }
    setBusy(t, true);
    try {
      const r = await postJSON('/api/settings/file', { project: TD_PROJECT, file, version, text });
      provState.cfgFile = file; provState.cfgVersion = r.version; provState.cfgText = text;
      const d = await getJSON('/api/talkdesk');
      provState.data = d;
      document.getElementById('provCfg').innerHTML = `<option value="">New config…</option>${d.configs.map(c =>
        `<option value="${esc(c.file)}">${esc(c.file.slice(18))} — ${esc(c.agent_name || '?')}${c.platform ? ' · ' + esc(c.platform) : ''}</option>`).join('')}`;
      document.getElementById('provCfg').value = file;
      status(`saved ${file}${r.saved_warnings?.length ? ' — ' + r.saved_warnings.join('; ') : ''}`);
    } catch (err) { status('⚠ ' + err.message); }
    finally { setBusy(t, false); }
  } else if (t.dataset.pjOpen) {
    selectProvJob(t.dataset.pjOpen);
  } else if (t.dataset.pjDel) {
    try {
      await postJSON(`/api/talkdesk/jobs/${t.dataset.pjDel}`, null, 'DELETE');
      if (provState.selected === t.dataset.pjDel) { provState.selected = null; document.getElementById('pjCard').hidden = true; }
      await refreshProvision();
    } catch (err) { status('⚠ ' + err.message); }
  } else if (t.dataset.copy) {
    await copyText(t.dataset.copy).catch(() => {});
    t.textContent = 'Copied';
    setTimeout(() => { t.textContent = 'Copy'; }, 1200);
  } else if (t.id === 'pjApply') {
    const j = provState.data.jobs.find(x => x.id === provState.selected), file = document.getElementById('pjAgent').value;
    const out = document.getElementById('pjApplyOut');
    setBusy(t, true);
    try {
      await postJSON('/api/talkdesk/apply', { file, agent_system_id: j.result.agent_system_id, mcp_url: document.getElementById('pjMcp').checked ? j.mcp_url : null });
      out.innerHTML = `<span style="color:var(--pass)">written into ${esc(file)}</span> · <a href="#/test?sample=${encodeURIComponent(TD_PROJECT + '/' + file.slice(8))}">Run test with it</a> · <a href="${settingsHash(TD_PROJECT, file)}">open the file</a>`;
    } catch (err) { out.innerHTML = `<span style="color:var(--fail)">${esc(err.message)}</span>`; }
    finally { setBusy(t, false); }
  }
});

let mcpSayTimer = 0;
const mcpSay = msg => {
  const el = document.getElementById('mcpStatus');
  if (el) el.textContent = msg;
  clearTimeout(mcpSayTimer);
  if (!msg.startsWith('⚠')) mcpSayTimer = setTimeout(() => { if (el) el.textContent = ''; }, 10000);
};

function openMcpLog(job) {
  if (!job) return;
  for (const [id, l] of Object.entries(provState.logs)) if (l.el === 'mcpLog') delete provState.logs[id];
  provState.logs[job.id] = { el: 'mcpLog', offset: 0, text: '' };
  document.getElementById('mcpLogWrap').hidden = false;
  document.getElementById('mcpLogTitle').textContent = `talkdesk-mcp-server · ${job.source} · ${job.domain}`;
  document.getElementById('mcpLog').textContent = '';
  followLog(job.id).catch(() => {});
}

let provCheckTimer = 0;
document.addEventListener('input', e => {
  if (e.target.id !== 'provYaml') return;
  clearTimeout(provCheckTimer);
  provCheckTimer = setTimeout(checkProvConfig, 400);
});
document.addEventListener('change', e => {
  if (!e.target.closest('#provPage')) return;
  if (e.target.id === 'mcpSource') fillMcpDomains();
  else if (e.target.id === 'provCfg') {
    if (provDirty() && !confirm('Discard the edits to this config?')) { e.target.value = provState.cfgFile; return; }
    loadProvConfig(e.target.value).catch(err => { document.getElementById('provStatus').textContent = '⚠ ' + err.message; });
  }
});

/* ---------- router ---------- */
let scenKeyNav = null;
window.addEventListener('keydown', e => { if (scenKeyNav) scenKeyNav(e); });

const SKELETON = `<div class="skel-wrap">
  <div class="card"><div class="skel" style="width:38%"></div><div class="skel" style="width:62%"></div><div class="skel" style="width:55%"></div></div>
  <div class="card"><div class="skel" style="width:30%"></div><div class="skel"></div><div class="skel"></div><div class="skel" style="width:80%"></div></div></div>`;

const setTopTitle = t => {
  document.getElementById('topTitle').textContent = t;
  document.title = (t === 'Runs' ? '' : t + ' · ') + 'talk-bench runs viewer';
};

// routeSeq counts route() calls. Every async render captures it before its awaits and stops after
// each one if it changed, so a slow page never overwrites the page the user moved on to.
let routeSeq = 0, enterPending = false, enterTimer = 0, lastHash = '';

// Every render's first write into #main goes through here: it ends the dimmed "stale" page and, once per
// route(), scrolls to the top and plays the entrance. In-place updates and polling never call it.
let viewShown = false;  // the first page of a load leaves focus alone: Tab starts at the skip link
function setView(html) {
  $main.innerHTML = html;
  $main.classList.remove('stale');
  // the control that navigated went away with the old page: keyboard / screen-reader focus starts on the new one
  if (viewShown && document.activeElement === document.body) $main.focus({ preventScroll: true });
  viewShown = true;
  if (!enterPending) return;
  enterPending = false;
  window.scrollTo(0, 0);
  $main.classList.add('view-enter');
  clearTimeout(enterTimer);
  enterTimer = setTimeout(() => $main.classList.remove('view-enter'), 600);
}

// 'next' / 'prev' when stepping through one run's scenarios, 'soft' when re-picking a compare pair
function routeDirection(from, to) {
  if (from.startsWith('#/compare') && to.startsWith('#/compare')) return 'soft';
  const scen = h => h.startsWith('#/scenario/') ? h.slice('#/scenario/'.length).split('/') : null;
  const a = scen(from), b = scen(to);
  if (!a || !b || a[0] !== b[0]) return '';
  const ids = (_runCache[a[0]]?.scenarios || []).map(s => s.id);
  const d = ids.indexOf(b[1]) - ids.indexOf(a[1]);
  return d > 0 ? 'next' : d < 0 ? 'prev' : '';
}

async function route() {
  const h = decodeURIComponent(location.hash);
  const raw = location.hash, params = new URLSearchParams(raw.slice(raw.indexOf('?') + 1 || raw.length));
  const seq = ++routeSeq;
  scenKeyNav = null;
  CUR_RUN = null;
  CUR_CMP = null;
  clearInterval(testPollTimer);
  testPollTimer = null;
  closeNav();
  // Keep the old page up, dimmed and unclickable, while the next one loads; only a slow load gets the
  // skeleton. Do what replacing it used to do at once: stop its audio and drop its focus.
  $main.querySelectorAll('audio').forEach(a => a.pause());
  if ($main.contains(document.activeElement)) document.activeElement.blur();
  $main.classList.remove('view-enter');
  $main.dataset.dir = routeDirection(lastHash, h);
  lastHash = h;
  enterPending = true;
  let skelTimer = 0;
  if (!$main.firstElementChild) $main.innerHTML = SKELETON;  // first load: nothing to keep
  else {
    $main.classList.add('stale');
    skelTimer = setTimeout(() => {
      if (seq !== routeSeq || !enterPending) return;  // superseded, or the new view is already up
      $main.innerHTML = SKELETON;
      $main.classList.remove('stale');
    }, 180);
  }
  try {
    // Sidebar data is best-effort here: a failing /api/runs must not block scenario
    // deep links (renderList still surfaces the error because it awaits loadRuns itself).
    await loadRuns().catch(() => {});
    if (seq !== routeSeq) return;  // navigated again while the run index loaded
    renderSideNav();
    const onList = !h.startsWith('#/');
    document.getElementById('searchWrap').hidden = !onList;
    document.getElementById('syncBtn').hidden = !onList;
    if (h.startsWith('#/compare')) {
      setTopTitle('Compare');
      await renderCompare(params);
    } else if (h.startsWith('#/test')) {
      setTopTitle('Run test');
      await renderTest(params);
    } else if (h.startsWith('#/settings')) {
      setTopTitle('Settings');
      await renderSettings(params);
    } else if (h.startsWith('#/provision')) {
      setTopTitle('Provision');
      await renderProvision(params);
    } else if (h.startsWith('#/scenario/')) {
      const p = h.slice('#/scenario/'.length);
      setTopTitle(p.split('/').pop());
      await renderScenario(p);
    } else if (h.startsWith('#/run/')) {
      const p = h.slice('#/run/'.length);
      setTopTitle(p);
      await renderRun(p);
    } else {
      setTopTitle('Runs');
      await renderList();
    }
    if (seq === routeSeq) {
      window.scrollTo(0, 0);
      // same task as the render, before the first paint: the rows never flash in and then hide
      staggerRows(document.getElementById('runRows') || document.getElementById('scenRows'));
    }
  } catch (e) {
    if (seq === routeSeq) setView(`<div class="card"><b>Error:</b> ${esc(e.message)}</div>`);
  } finally {
    clearTimeout(skelTimer);
  }
}
window.addEventListener('hashchange', route);
route();
</script>
