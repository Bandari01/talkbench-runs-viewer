/* scenario picker: what the split resolves to, with a checkbox each */
async function loadScenarioCatalog(preselect) {
  const v = id => document.getElementById(id)?.value.trim() ?? '';
  const source = v('sSource'), domain = v('sDomain'), split = v('sSplit') || 'base';
  const key = [source, domain, split].join('|');
  if (key === testState.catalogKey && !preselect) return;
  testState.catalogKey = key;
  const list = document.getElementById('scenList');
  if (!currentProject() || !domain) { testState.catalog = []; renderScenarioList(); return; }
  try {
    const d = await getJSON(`/api/test/scenarios?source=${encodeURIComponent(source)}&domain=${encodeURIComponent(domain)}&split=${encodeURIComponent(split)}`);
    if (testState.catalogKey !== key) return;  // settings changed meanwhile
    testState.catalog = d.scenarios;
  } catch (e) {
    if (testState.catalogKey !== key) return;
    testState.catalog = [];
    if (list) list.innerHTML = `<div class="scen-empty">⚠ ${esc(e.message)}</div>`;
    return;
  }
  const ids = new Set(testState.catalog.map(s => s.id));
  const wanted = preselect ? new Set(preselect) : testState.picked;
  testState.picked = new Set([...wanted].filter(id => ids.has(id)));  // drop ids the new split lacks
  renderScenarioList();
}

function shownScenarios() {
  const q = (document.getElementById('scenFilter')?.value || '').trim().toLowerCase();
  return testState.catalog.filter(s => !q || s.id.toLowerCase().includes(q) || (s.summary || '').toLowerCase().includes(q)
    || (s.tags || []).some(tag => String(tag).toLowerCase().includes(q)));
}

function renderScenarioList() {
  const list = document.getElementById('scenList');
  if (!list) return;
  const shown = shownScenarios();
  list.innerHTML = shown.length ? shown.map(s => `
    <label class="scen-row"><input type="checkbox" value="${esc(s.id)}"${testState.picked.has(s.id) ? ' checked' : ''}>
      <span class="mono scen-id">${esc(s.id)}</span><span class="scen-sum" title="${esc(s.summary || '')}">${esc(s.summary || '')}</span>
      ${s.difficulty ? `<span class="scen-tag">${esc(s.difficulty)}</span>` : ''}</label>`).join('')
    : `<div class="scen-empty">${testState.catalog.length ? 'No scenario matches the filter.' : 'No scenarios found for this split — check the split name.'}</div>`;
  const n = testState.picked.size, total = testState.catalog.length;
  document.getElementById('scenCount').textContent = total
    ? `${n} of ${total} ticked${n ? '' : ' — the whole split runs'}${shown.length !== total ? ` · ${shown.length} shown` : ''}`
    : '';
  updateCmdPreview();
}

function applySettings(s) {
  const set = (id, v) => { const el = document.getElementById(id); if (el && v != null) el.value = v; };
  if (s.source) set('sSource', s.source);
  if (s.user_simulator) set('sUserSim', s.user_simulator);
  if (s.speech_complexity !== undefined) set('sComplexity', s.speech_complexity || '');
  refreshDomainOptions(s.domain, s.split);
  if (s.scenario_ids) loadScenarioCatalog(s.scenario_ids);
}

function refreshDomainOptions(keepDomain, keepSplit) {
  const p = currentProject();
  const source = document.getElementById('sSource').value;
  const domains = p?.domains?.[source] || {};
  const sel = document.getElementById('sDomain');
  const prev = keepDomain || sel.value;
  const names = Object.keys(domains);
  sel.innerHTML = names.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('') + '<option value="all">all domains</option>';
  sel.value = names.includes(prev) ? prev : prev === 'all' ? 'all' : names.includes('airline') ? 'airline' : names[0] || 'all';
  refreshSplitOptions(keepSplit);
}

/* the split names the domain's splits.json (tau2: split_tasks.json) defines, in file order;
   "all domains" lists the union over the source's domains, since talk-bench applies the split
   to every domain that defines it */
function splitsFor(source, domain) {
  const bySource = currentProject()?.domains?.[source] || {};
  if (domain !== 'all') return bySource[domain] || [];
  const acc = new Map();
  for (const list of Object.values(bySource)) for (const s of list) {
    const cur = acc.get(s.split) || { split: s.split, count: 0, domains: 0 };
    cur.count += s.count || 0;
    cur.domains += 1;
    acc.set(s.split, cur);
  }
  return [...acc.values()].sort((a, b) => (b.split === 'base') - (a.split === 'base') || b.domains - a.domains || a.split.localeCompare(b.split));
}

function refreshSplitOptions(keepSplit) {
  const domain = document.getElementById('sDomain').value;
  const splits = splitsFor(document.getElementById('sSource').value, domain);
  const sel = document.getElementById('sSplit');
  const prev = keepSplit || sel.value;
  sel.innerHTML = splits.map(s => `<option value="${esc(s.split)}">${esc(s.split)}${s.count != null
    ? ` — ${s.count} scenario${s.count === 1 ? '' : 's'}${domain === 'all' ? ` in ${s.domains} domain${s.domains === 1 ? '' : 's'}` : ''}` : ''}</option>`).join('');
  if (splits.length) sel.value = splits.some(s => s.split === prev) ? prev : splits.some(s => s.split === 'base') ? 'base' : splits[0].split;
  document.getElementById('sSplitHelp').textContent = !splits.length ? 'This domain defines no splits.'
    : keepSplit && !splits.some(s => s.split === keepSplit) ? `Split “${keepSplit}” is not defined for ${domain} — ${sel.value} selected instead.`
    : '';
  updateCmdPreview();
  loadScenarioCatalog();
}

// tau2's SpeechComplexity presets (v1.0.1); the server checks the same list
const SPEECH_COMPLEXITIES = ['control', 'regular', 'control_audio', 'control_accents', 'control_behavior',
  'control_audio_accents', 'control_audio_behavior', 'control_accents_behavior'];

function updateUserSimHelp() {
  const sel = document.getElementById('sUserSim'), help = document.getElementById('sUserSimHelp');
  if (!sel || !help) return;
  help.innerHTML = sel.value === 'tau2' && moduleModality(testState.parsed?.module) === 'text'
    ? '<span style="color:var(--fail)">Voice agents only — a text run on tau2 tasks already uses tau2’s own simulator.</span>'
    : '';
}

function updateCmdPreview() {
  const el = document.getElementById('cmdPreview');
  if (!el) return;
  const p = testProject();
  const v = id => document.getElementById(id).value.trim();
  const ids = pickedScenarioIds();
  const tau2Sim = v('sUserSim') === 'tau2';
  const tau2Source = v('sSource') === 'tau2';
  document.getElementById('sComplexityField').hidden = !tau2Source;
  const complexity = tau2Source ? v('sComplexity') : '';
  updateUserSimHelp();
  el.textContent = `cd ${shellQuote(p?.id || '<checkout>')} && ${(tau2Sim ? p?.tau2_launcher : p?.launcher) || 'uv run talk-bench'} run --config agent.yaml`
    + ` --domain ${shellQuote(v('sDomain') || 'all')} --split ${shellQuote(v('sSplit') || 'base')} --source ${v('sSource')}`
    + (ids.length ? ` --scenario-ids ${ids.slice(0, 4).join(',')}${ids.length > 4 ? `,… (${ids.length} ids)` : ''}` : '')
    + (complexity ? ` --speech-complexity ${complexity}` : '')
    + ` --output-dir ${shellQuote(testState.options?.data_dir || '<data dir>')}`;
}

/* where the YAML comes from */

      <select id="archSel"><option value="">pick a run's agent…</option>${list.map((a, i) =>
        `<option value="${i}">${esc(a.agent.name)} · ${esc(shortModule(a.agent.module))}${agentKeyParam(a.agent) ? ` · ${esc(agentKeyParam(a.agent))}` : ''} · ${esc(a.domain || '?')}/${esc(a.split || '?')} · ${esc(bjStamp(a.timestamp, 10))} · ${a.run_paths.length} run${a.run_paths.length === 1 ? '' : 's'}</option>`).join('')}</select>
    </div></div>`;

}

function applyPreset(id) {
  const p = AGENT_PRESETS.find(x => x.id === id);
  if (!p) return;
  fillAgentYaml(p.yaml, id);
  renderAgentSource();
  setAgentStatus(`preset “${p.label}” loaded`);
}

async function prefillFromRun(runPath) {
  const d = await getRun(runPath);
  const rc = d.results?.run_context || {};
  const archived = testState.options.archived || [];
  const idx = archived.findIndex(a => a.run_paths.includes(runPath));
  if (idx < 0) { setAgentStatus(`run ${runPath} recorded no usable agent config`); return; }
  fillAgentYaml(archived[idx].yaml);
  applySettings({
    source: (d.scenarios || []).some(s => /-tau2-/.test(s.id)) ? 'tau2' : 'talk_bench',
    domain: rc.domain, split: rc.split,
    user_simulator: d.user_simulator?.engine === 'tau2' ? 'tau2' : 'talk_bench',
  });
  // tick exactly the scenarios that run covered when it was a subset of the split
  await loadScenarioCatalog((d.scenarios || []).map(s => s.id));
  if (testState.picked.size === testState.catalog.length) { testState.picked = new Set(); renderScenarioList(); }
  testState.tab = 'archived';
  renderAgentSource();
  document.getElementById('archSel').value = String(idx);
  setAgentStatus(`loaded the agent of ${runPath}`);
}

async function loadJobIntoEditor(id) {
  const d = await getJSON(`/api/test/jobs/${encodeURIComponent(id)}?offset=0`);
  const j = d.job;
  fillAgentYaml(d.config_yaml || '');
  applySettings({ source: j.source, domain: j.domain, split: j.split, scenario_ids: jobScenarioIds(j), user_simulator: j.user_simulator || 'talk_bench', speech_complexity: j.speech_complexity || '' });
  document.getElementById('agentCard').scrollIntoView({ behavior: smoothScroll(), block: 'start' });
  setAgentStatus(`loaded from the test started ${fmtWhen(j.started)}`);
}

/* jobs table + log */
function jobStatusHTML(j) {
  const running = jobRunning(j);
  const cls = running ? 'running' : j.status === 'done' || j.status === 'error' ? j.status : '';
  const label = j.status === 'cancelling' ? 'stopping…'
    : j.status === 'done' ? (j.score && j.score.passed === j.score.total ? 'all passed' : 'done')
    : j.status;
  // a running dot is recreated on every poll: start it at the shared phase so its pulse never restarts
  const phase = running ? ` style="animation-delay:-${Math.round(performance.now() % 1200)}ms"` : '';
  return `<span class="status-dot ${cls}"${phase}></span>${esc(label)}`;
}

function jobResultHTML(j) {
  return j.score
    ? `<span class="badge ${j.score.passed === j.score.total ? 'pass' : 'fail'}">${j.score.passed}/${j.score.total} · ${j.score.pct.toFixed(0)}%</span>`
    : j.error ? `<span class="badge fail" title="${esc(j.error)}">${esc(j.status === 'interrupted' ? 'interrupted' : 'error')}</span>`
    : jobRunning(j) ? '<span class="muted">…</span>' : '<span class="muted">—</span>';
}

function jobRowHTML(j, resumable) {
  const running = jobRunning(j), ids = jobScenarioIds(j);
  const prog = j.progress?.total ? `${j.progress.done}/${j.progress.total}` : j.progress?.done ? String(j.progress.done) : '—';
  const actions = [
    `<button class="navbtn" type="button" data-job-log="${j.id}">Log</button>`,
    running ? `<button class="navbtn" type="button" data-job-cancel="${j.id}">Stop</button>` : '',
    j.run_path ? `<a class="navbtn" href="#/run/${encodeURIComponent(j.run_path)}">Open run</a>` : '',
    j.run_dir && !j.in_archive && (running || !j.run_path) ? `<button class="navbtn" type="button" data-job-sync="${j.id}" title="Copy the run directory into this archive now">${j.run_path ? 'Sync now' : 'Import'}</button>` : '',
    resumable.has(j.id) ? `<button class="navbtn" type="button" data-job-resume="${j.id}" title="talk-bench run --resume: ${
      j.status === 'done' ? `run the ${j.errored} errored scenario${j.errored === 1 ? '' : 's'} again` : 'redo unfinished scenarios'}">Resume</button>` : '',
    `<button class="navbtn" type="button" data-job-again="${j.id}" title="Load this agent.yaml and these settings into the editor">Run again…</button>`,
    !running ? `<button class="navbtn" type="button" data-job-del="${j.id}" title="Remove from this list (the run itself is kept)" aria-label="Remove">×</button>` : '',
  ].filter(Boolean).join('');
  return `
  <tr class="${testState.selected === j.id ? 'tr-selected' : ''}">
    <td class="nowrap">${jobStatusHTML(j)}</td>
    <td><b>${esc(j.agent_name)}</b><div class="subscore">${esc(shortModule(j.module))}${j.resume_of || j.cmd?.includes('--resume') ? ' · resume' : ''}</div>${
      j.scheduled_for ? `<div class="subscore" title="Scheduled for ${esc(fmtLocal(j.scheduled_for))} (${esc(BROWSER_TZ)})">scheduled · ${esc(j.schedule_name)}</div>` : ''}</td>
    <td class="nowrap">${esc(j.source)}${j.project_name && j.project_name !== 'talk-bench' ? `<div class="subscore">${esc(j.project_name)}</div>` : ''}${
      j.user_simulator === 'tau2' ? '<div class="subscore">τ² user simulator</div>' : ''}${
      j.speech_complexity ? `<div class="subscore">complexity ${esc(j.speech_complexity)}</div>` : ''}</td>
    <td class="nowrap">${esc(j.domain)} / ${esc(j.split)}${ids.length
      ? `<div class="subscore" title="${esc(ids.join(', '))}">${ids.length} scenario id${ids.length === 1 ? '' : 's'}</div>` : ''}</td>
    <td class="nowrap"><span class="mono muted">${esc(fmtWhen(j.started))}</span><div class="subscore">${fmtElapsed(j.started, j.finished)}</div></td>
    <td class="nowrap">${prog}</td>
    <td>${jobResultHTML(j)}</td>
    <td><div class="job-actions">${actions}</div></td>
  </tr>`;
}

const JOBS_COLLAPSED = 3;  // newest tests listed before "Show all"

function renderJobRows() {
  const rows = document.getElementById('jobRows');
  if (!rows) return;
  // collapsed: the newest few, plus any older one that is still running or whose log is open
  const collapsed = testState.jobs.filter((j, i) => i < JOBS_COLLAPSED || jobRunning(j) || j.id === testState.selected);
  const hidden = testState.jobs.length - collapsed.length;
  // Resume sits on the newest test of each run dir, once it ended with scenarios left (errored ones count)
  const seen = new Set(), resumable = new Set();
  for (const j of testState.jobs) {
    if (!j.run_dir || seen.has(j.run_dir)) continue;
    seen.add(j.run_dir);
    if (!jobRunning(j) && (j.status !== 'done' || j.errored)) resumable.add(j.id);
  }
  rows.innerHTML = (testState.showAllJobs ? testState.jobs : collapsed).map(j => jobRowHTML(j, resumable)).join('');
  document.getElementById('jobsMoreWrap').hidden = !hidden;
  const more = document.getElementById('jobsMore');
  more.classList.toggle('open', testState.showAllJobs);
  more.title = testState.showAllJobs ? 'Show fewer' : `Show all ${testState.jobs.length} tests`;
  more.setAttribute('aria-label', more.title);
  more.setAttribute('aria-expanded', testState.showAllJobs);
  const running = testState.jobs.filter(jobRunning).length;
  document.getElementById('jobsHint').textContent = running ? `${running} running` : '';
  document.getElementById('jobsEmpty').hidden = !!testState.jobs.length;
}

async function refreshJobs(force) {
  const d = await getJSON('/api/test/jobs');
  const json = JSON.stringify(d.jobs);
  const anyRunning = d.jobs.some(jobRunning);
  if (!force && json === testState.jobsJSON && !anyRunning) return;  // elapsed time ticks while running
  // a job that just copied its run into the archive (or wrote more of it there) changes the run list and sidebar counts
  const synced = j => j.run_path ? `${j.id}:${j.synced_at}` : '';
  const before = new Set(testState.jobs.map(synced).filter(Boolean));
  const newlySynced = d.jobs.some(j => synced(j) && !before.has(synced(j)));
  // a test a schedule just started leaves the scheduled list
  const fromSchedule = d.jobs.some(j => j.scheduled_for && !testState.jobs.some(o => o.id === j.id));
  // a test that just ended may have left scenarios to resume, or finished the ones listed
  const ended = testState.jobs.some(o => jobRunning(o) && d.jobs.some(j => j.id === o.id && !jobRunning(j)));
  testState.jobsJSON = json;
  testState.jobs = d.jobs;
  renderJobRows();
  if (fromSchedule) refreshSchedules().catch(() => {});
  if (ended) refreshResumable().catch(() => {});
  if (newlySynced) {
    invalidateRuns();
    loadRuns().then(renderSideNav).catch(() => {});
  }
}

async function pollJobLog() {
  const id = testState.selected, offset = testState.logOffset;
  if (!id) return;
  const d = await getJSON(`/api/test/jobs/${encodeURIComponent(id)}?offset=${offset}`);
  if (testState.selected !== id || testState.logOffset !== offset) return;  // another poll already read this chunk
  if (d.next_offset < testState.logOffset) testState.logText = '';  // log file was reset
  if (d.log) testState.logText += d.log;
  testState.logOffset = d.next_offset;
  renderLogCard(d);
  if (d.more) await pollJobLog();
}

function renderLogCard(d) {
  const card = document.getElementById('logCard');
  if (!card) return;
  const j = d.job;
  const setText = (id, t) => { const el = document.getElementById(id); if (el.textContent !== t) el.textContent = t; };  // unchanged text keeps the user's selection
  card.hidden = false;
  document.getElementById('logTitle').textContent = `${j.agent_name} · ${j.domain}/${j.split}`;
  document.getElementById('logMeta').innerHTML = `${jobStatusHTML(j)} · ${fmtElapsed(j.started, j.finished)}`
    + (j.exit_code != null ? ` · exit ${j.exit_code}` : '')
    + (j.progress?.total ? ` · ${j.progress.done}/${j.progress.total} scenarios` : '')
    + (j.error ? ` · <span style="color:var(--fail)">${esc(j.error)}</span>` : '');
  setText('logCmd', j.cmd?.length ? `cd ${shellQuote(j.cwd || '.')} && ${j.cmd.map(shellQuote).join(' ')}` : '');
  document.getElementById('logRun').innerHTML = j.run_dir
    ? `Run directory <span class="mono">${esc(j.run_dir)}</span>`
      + (j.run_path ? ` · <a href="#/run/${encodeURIComponent(j.run_path)}">open in the viewer</a>${j.synced_at && !j.in_archive ? ` <span class="muted">(copied ${fmtElapsed(j.synced_at)} ago)</span>` : ''}`
        : j.in_archive ? (jobRunning(j) ? ' · in the run list once a scenario starts' : ' · no scenario ran') : ' · not copied into the archive yet')
    : 'talk-bench has not created the run directory yet.';
  if (d.config_yaml != null) setText('logConfig', d.config_yaml);
  const pane = document.getElementById('logPane');
  setText('logPane', testState.logText || '(no output yet)');
  if (document.getElementById('logFollow').checked) pane.scrollTop = pane.scrollHeight;
}

function selectJob(id, scroll = true) {
  testState.selected = id;
  testState.logOffset = 0;
  testState.logText = '';
  renderJobRows();
  const card = document.getElementById('logCard');
  card.hidden = false;
  document.getElementById('logExport').href = `/api/test/jobs/${encodeURIComponent(id)}/log`;
  document.getElementById('logPane').textContent = 'loading…';
  pollJobLog().catch(e => { document.getElementById('logPane').textContent = '⚠ ' + e.message; });
  if (scroll) card.scrollIntoView({ behavior: smoothScroll(), block: 'start' });
}

function startTestPolling() {
  clearInterval(testPollTimer);
  let tick = 0;
  testPollTimer = setInterval(async () => {
    if (!document.getElementById('jobRows')) { clearInterval(testPollTimer); testPollTimer = null; return; }
    try {
      await refreshJobs();
      if (testState.selected) await pollJobLog();
      if (++tick % 10 === 0) await refreshSchedules();  // "in …" countdown, waiting / error state
    } catch (_) { /* transient — the next tick retries */ }
  }, 2000);
}

// what Start test sends — and what a schedule saves; null while the editor is empty
function testPayload() {
  const text = document.getElementById('agentYaml').value;
  if (!text.trim()) return null;
  const v = id => document.getElementById(id).value.trim();
  return { config_text: text, source: v('sSource'), domain: v('sDomain'), split: v('sSplit') || 'base', scenario_ids: pickedScenarioIds(), user_simulator: v('sUserSim'),
    speech_complexity: v('sSource') === 'tau2' ? v('sComplexity') || null : null };
}

async function startTest() {
  const status = document.getElementById('startStatus');
  const payload = testPayload();
  if (!payload) { status.textContent = 'The agent.yaml editor is empty.'; return; }
  const btn = document.getElementById('startTestBtn');
  setBusy(btn, true);
  status.textContent = 'starting…';
  try {
    const res = await postJSON('/api/test/jobs', payload);
    status.textContent = `started ${res.job.agent_name} on ${res.job.domain}/${res.job.split}${res.job.user_simulator === 'tau2' ? ' with the τ² user simulator' : ''}`;
    await refreshJobs(true);
    selectJob(res.job.id);
  } catch (e) {
    status.textContent = '⚠ ' + e.message;
  }
  setBusy(btn, false);
}

/* resume: `talk-bench run --resume <run dir>` for a run in a checkout or the archive that has scenarios left —
   errored, never finished or never scored — whichever page or terminal started it */
const resumeCounts = r => [
  r.planned != null ? `${r.finished}/${r.planned} finished` : `${r.finished} finished`,
  r.redo ? `${r.redo} to run again` : '',
  r.rescore ? `${r.rescore} to score` : '',
].filter(Boolean).join(' · ');
// files written lately and no results.json: talk-bench may still be running it from a terminal
const resumeRecent = r => !r.running_job && !r.has_results && Date.now() / 1000 - r.last_write < 180;

function resumeCardHTML() {
  return `
  <div class="card" id="resumeCard">
    <div class="report-head"><h3>Resume a partial run</h3><span class="muted" id="resumeHint" style="font-size:12px"></span></div>
    <p class="muted" style="font-size:12px;margin:6px 0 0"><code>--resume</code> runs a run's errored and unfinished scenarios again and scores the unscored ones, with the agent and task set its <code>run_config.json</code> recorded, and merges them into the same results.json. Listed: the runs with such scenarios in the checkouts (also those started from a terminal) and in the archive (those tests on this page wrote there).</p>
    <div class="form-grid"><div class="field wide">
      <label for="resumeSel">Run</label>
      <select id="resumeSel"><option value="">loading…</option></select>
      <span class="help" id="resumeInfo"></span>
    </div></div>
    <div class="cmdline" id="resumeCmd" style="margin-top:12px" hidden></div>
    <div class="actions-row">
      <button class="btn primary" type="button" id="resumeBtn" disabled>${ICONS.resume}Resume</button>
      <span class="muted" id="resumeStatus" style="font-size:12.5px" aria-live="polite"></span>
    </div>
  </div>`;
}

function renderResumeCard(pick) {
  const sel = document.getElementById('resumeSel');
  if (!sel) return;
  const runs = testState.resumable, keep = pick ?? sel.value;
  sel.innerHTML = runs.length
    ? '<option value="">pick a run…</option>' + runs.map(r => `<option value="${esc(r.name)}">${esc(r.agent_name)} · ${esc(r.domain)}/${esc(r.split)} · ${esc(bjStamp(r.timestamp, 16))} · ${esc(resumeCounts(r))}${r.running_job ? ' · running' : ''}</option>`).join('')
    : '<option value="">no run has scenarios left to resume</option>';
  sel.disabled = !runs.length;
  sel.value = runs.some(r => r.name === keep) ? keep : '';
  document.getElementById('resumeHint').textContent = runs.length ? `${runs.length} run${runs.length === 1 ? '' : 's'}` : '';
  updateResumeInfo();
}

function updateResumeInfo() {
  const r = testState.resumable.find(x => x.name === document.getElementById('resumeSel').value);
  const info = document.getElementById('resumeInfo'), cmd = document.getElementById('resumeCmd');
  cmd.hidden = !r;
  document.getElementById('resumeBtn').disabled = !r || !!r.running_job || r.scripted;
  if (!r) { info.textContent = ''; return; }
  const p = (currentProject()?.projects || []).find(x => x.id === r.project);
  cmd.textContent = `cd ${shellQuote(r.project)} && ${(r.user_simulator === 'tau2' ? p?.tau2_launcher : p?.launcher) || 'uv run talk-bench'} run --resume ${shellQuote(r.run_dir)}`;
  info.innerHTML = [
    esc(resumeCounts(r)),
    r.has_results ? '' : 'no results.json yet',
    r.user_simulator === 'tau2' ? 'τ² user simulator' : '',
    r.in_archive ? `<a href="#/run/${encodeURIComponent(r.name)}">open the run</a>` : '',
    r.running_job ? `<b>a test is running in it</b> — <a href="#" data-resume-log="${esc(r.running_job)}">show its log</a>` : '',
    resumeRecent(r) ? `<span style="color:var(--star)">files changed ${fmtElapsed(r.last_write)} ago — if talk-bench is still running it from a terminal, wait for that to end</span>` : '',
    r.scripted ? 'made with scripted_user_sim (removed) — cannot be resumed' : '',
  ].filter(Boolean).join(' · ');
}

async function refreshResumable(pick) {
  const d = await getJSON('/api/test/resumable');
  testState.resumable = d.runs;
  renderResumeCard(pick);
}

async function startResume() {
  const r = testState.resumable.find(x => x.name === document.getElementById('resumeSel').value);
  if (!r) return;
  if (resumeRecent(r) && !confirm(`This run's files changed ${fmtElapsed(r.last_write)} ago. If talk-bench is still running it outside this page, resuming now runs the same scenarios twice. Resume anyway?`)) return;
  const status = document.getElementById('resumeStatus'), btn = document.getElementById('resumeBtn');
  setBusy(btn, true);
  status.textContent = 'starting…';
  try {
    const res = await postJSON('/api/test/resume_run', { name: r.name });
    status.textContent = `resuming ${res.job.agent_name} on ${res.job.domain}/${res.job.split}`;
    await refreshJobs(true);
    selectJob(res.job.id);
    await refreshResumable().catch(() => {});
  } catch (e) {
    status.textContent = '⚠ ' + e.message;
  }
  setBusy(btn, false);
  updateResumeInfo();  // a run now being resumed keeps the button disabled
}

/* scheduled tests: the editor's test, started once at a chosen time — picked in this browser's
   time zone and sent as epoch seconds; the viewer starts it when due (see "scheduled tests" in app/main.py) */
const pad2 = n => String(n).padStart(2, '0');
const BROWSER_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || 'local';
const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
// <input type=datetime-local> value (wall time in this browser) <-> epoch seconds
const toLocalInput = ts => {
  const d = new Date(ts * 1000);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
};
const fromLocalInput = v => v ? new Date(v).getTime() / 1000 : NaN;
const fmtLocal = ts => `${WEEKDAYS[new Date(ts * 1000).getDay()]} ${toLocalInput(ts).replace('T', ' ')}`;

function schedFormHTML() {
  return `
  <div class="sched-form" id="schedForm" hidden>
    <h3 style="margin:0" id="schTitle">Schedule this test</h3>
    <p class="muted" style="font-size:12px;margin:6px 0 0">Saves the agent.yaml and scenario settings above and starts the test once, at this time. If the viewer is stopped or the Mac asleep then, it starts as soon as the viewer is back.</p>
    <div class="form-grid">
      <div class="field"><label for="schName">Name</label><input id="schName" maxlength="120" placeholder="agent · domain/split" autocomplete="off"></div>
      <div class="field"><label for="schAt">Start at</label><input type="datetime-local" id="schAt">
        <span class="help" id="schAtHelp"></span></div>
    </div>
    <div class="actions-row">
      <button class="btn primary" type="button" id="schSave">${ICONS.clock}Save schedule</button>
      <button class="navbtn" type="button" id="schCancel">Cancel</button>
      <span class="muted" id="schStatus" style="font-size:12.5px" aria-live="polite"></span>
    </div>
  </div>`;
}

function updateSchedAtHelp() {
  const help = document.getElementById('schAtHelp');
  if (!help) return;
  const ts = fromLocalInput(document.getElementById('schAt').value), now = Date.now() / 1000;
  help.textContent = `${BROWSER_TZ} time` + (!Number.isFinite(ts) ? '' : ts <= now ? ' — this is in the past' : ` · in ${fmtElapsed(now, ts)}`);
}

function openSchedForm(s = null) {
  testState.editingSchedule = s?.id || null;
  const now = Date.now() / 1000;
  document.getElementById('schTitle').textContent = s ? `Edit scheduled test “${s.name}”` : 'Schedule this test';
  document.getElementById('schSave').innerHTML = `${ICONS.clock}${s ? 'Update schedule' : 'Save schedule'}`;
  document.getElementById('schName').value = s?.name || '';
  const at = document.getElementById('schAt');
  // a pending schedule keeps its time; otherwise the first full hour at least 5 minutes away
  at.value = toLocalInput(s?.run_at > now ? s.run_at : Math.ceil((now + 300) / 3600) * 3600);
  at.min = toLocalInput(now);
  updateSchedAtHelp();
  document.getElementById('schStatus').textContent = '';
  document.getElementById('schedForm').hidden = false;
  renderSchedRows();
}

function closeSchedForm() {
  testState.editingSchedule = null;
  document.getElementById('schedForm').hidden = true;
  renderSchedRows();
}

async function saveSchedule() {
  const status = document.getElementById('schStatus');
  const test = testPayload();
  if (!test) { status.textContent = 'The agent.yaml editor is empty.'; return; }
  const runAt = fromLocalInput(document.getElementById('schAt').value);
  if (!Number.isFinite(runAt)) { status.textContent = 'Pick the date and time to start at.'; return; }
  const id = testState.editingSchedule;
  const body = { name: document.getElementById('schName').value.trim(), run_at: runAt, test };
  const btn = document.getElementById('schSave');
  setBusy(btn, true);
  status.textContent = 'saving…';
  try {
    const r = id ? await postJSON(`/api/test/schedules/${encodeURIComponent(id)}`, body, 'PUT')
      : await postJSON('/api/test/schedules', body);
    closeSchedForm();
    document.getElementById('startStatus').textContent = `${id ? 'updated' : 'scheduled'} “${r.schedule.name}” for ${fmtLocal(r.schedule.run_at)}`;
    await refreshSchedules();
    document.getElementById('schedCard').scrollIntoView({ behavior: smoothScroll(), block: 'nearest' });
  } catch (e) {
    status.textContent = '⚠ ' + e.message;
  }
  setBusy(btn, false);
}

async function editSchedule(id) {
  const s = (await getJSON(`/api/test/schedules/${encodeURIComponent(id)}`)).schedule, t = s.test;
  fillAgentYaml(t.config_text);
  applySettings(t);
  openSchedForm(s);
  setAgentStatus(`loaded the scheduled test “${s.name}” — change anything, then Update schedule`);
  document.getElementById('agentCard').scrollIntoView({ behavior: smoothScroll(), block: 'start' });
}

function schedStatusHTML(s) {
  if (s.error) return `<span class="badge fail" title="${esc(s.error)}">not started</span><div class="subscore" title="${esc(s.error)}">Edit… to fix it and pick a new time</div>`;
  if (s.waiting) return `<span class="status-dot"></span>waiting<div class="subscore" title="${esc(s.waiting)}">for a free test slot</div>`;
  const now = Date.now() / 1000;
  return s.run_at > now ? `<span class="status-dot"></span>pending<div class="subscore">in ${fmtElapsed(now, s.run_at)}</div>`
    : '<span class="status-dot"></span>starting…';
}

function schedRowHTML(s) {
  const t = s.test || {}, ids = (t.scenario_ids || []).length;
  return `
  <tr class="${testState.editingSchedule === s.id ? 'tr-selected' : ''}">
    <td><b>${esc(s.name)}</b></td>
    <td>${esc(s.agent_name)}<div class="subscore">${esc(shortModule(s.module))}</div></td>
    <td class="nowrap">${esc(t.domain)} / ${esc(t.split)}<div class="subscore">${esc(t.source)}${ids ? ` · ${ids} scenario id${ids === 1 ? '' : 's'}` : ''}${t.user_simulator === 'tau2' ? ' · τ² user' : ''}</div></td>
    <td class="nowrap"><span class="mono">${esc(fmtLocal(s.run_at))}</span></td>
    <td class="nowrap">${schedStatusHTML(s)}</td>
    <td><div class="job-actions">
      <button class="navbtn" type="button" data-sched-edit="${s.id}" title="Load into the editor above to change the test or the time">Edit…</button>
      <button class="navbtn" type="button" data-sched-del="${s.id}" title="Delete — the test will not run" aria-label="Delete">×</button>
    </div></td>
  </tr>`;
}

function renderSchedRows() {
  const card = document.getElementById('schedCard');
  if (!card) return;
  card.hidden = !testState.schedules.length;
  document.getElementById('schedRows').innerHTML = testState.schedules.map(schedRowHTML).join('');  // the server sorts by time
  document.getElementById('schedHint').textContent = `each runs once · times in ${BROWSER_TZ}`;
}

async function refreshSchedules() {
  testState.schedules = (await getJSON('/api/test/schedules')).schedules;
  renderSchedRows();
}

async function renderTest(params) {
  const seq = routeSeq;
  let opts;
  try {

    <div class="form-grid">

  </div>
  <div class="card">
    <h3 class="step-h" style="margin:0"><span class="step-n">2</span>Scenarios</h3>
    ${settingsFormHTML(project)}
    <div class="actions-row">
      <button class="btn primary" type="button" id="startTestBtn"${project ? '' : ' disabled'}>${ICONS.play}Start test</button>
      <button class="btn" type="button" id="schedToggle"${project ? '' : ' disabled'} title="Run this test on a schedule instead">${ICONS.clock}Schedule…</button>
      <span class="muted" id="startStatus" style="font-size:12.5px" aria-live="polite"></span>
    </div>

  <div class="card table-card" id="schedCard" hidden>
    <div class="list-meta"><span class="count">Scheduled tests</span><span class="hint" id="schedHint"></span></div>
    <div class="table-wrap jobs-wrap">
      <table id="schedTable">
        <thead><tr><th>Name</th><th>Agent</th><th>Domain / split</th><th>Starts at</th><th>Status</th><th></th></tr></thead>

    <div class="list-meta"><span class="count">Tests started from here</span><span class="hint" id="jobsHint"></span></div>

        <thead><tr><th>Status</th><th>Agent</th><th>Source</th><th>Domain / split</th><th>Started (Beijing)</th><th>Progress</th><th>Result</th><th></th></tr></thead>

      </table>

    <div class="report-head">
      <h3 id="logTitle">Log</h3>
      <span class="muted" id="logMeta" style="font-size:12px"></span>
      <label class="muted" style="margin-left:auto;font-size:12px;display:flex;align-items:center;gap:5px;cursor:pointer"><input type="checkbox" id="logFollow" checked> follow output</label>
      <a class="navbtn" id="logExport" style="margin-left:0" download title="Download the whole log as a .log file, with this test's settings, outcome and agent.yaml on top">Export log</a>
    </div>
    <div class="cmdline" id="logCmd" style="margin-top:10px"></div>
    <div class="muted" id="logRun" style="font-size:12px;margin-top:6px"></div>
    <details style="margin-top:8px"><summary>agent.yaml used for this test</summary><pre id="logConfig" class="mono"></pre></details>
    <pre class="log-pane" id="logPane" style="margin-top:10px"></pre>
  </div>`);

  renderAgentSource();
  refreshDomainOptions();

  const agentCard = document.getElementById('agentCard');
  agentCard.addEventListener('click', e => {
    const tab = e.target.closest('#agentTabs button');
    if (tab) { testState.tab = tab.dataset.tab; renderAgentSource(); return; }
    const preset = e.target.closest('.preset');
    if (preset) { applyPreset(preset.dataset.preset); return; }
    const paste = e.target.closest('[data-quick-paste]');
    if (paste) { quickPaste(paste.dataset.quickPaste); return; }
    if (e.target.closest('#yamlToggle, [data-yaml-open]')) {
      testState.showYaml = !!e.target.closest('[data-yaml-open]') || !testState.showYaml;
      renderQuickFields();
      updateAgentNotices();
      if (testState.showYaml) document.getElementById('agentYaml').focus();
    }
  });
  agentCard.addEventListener('input', e => {
    if (e.target.dataset.quickKey) quickApply(e.target.dataset.quickKey, e.target.value, false);
  });
  // ⌘V into a field takes the whole clipboard, reduced to the value (see quickClean)
  agentCard.addEventListener('paste', e => {
    const key = e.target.dataset?.quickKey;
    if (!key) return;
    e.preventDefault();
    e.target.value = quickClean(key, e.clipboardData.getData('text'));
    quickApply(key, e.target.value, true);
  });
  agentCard.addEventListener('change', async e => {
    if (e.target.dataset.quickKey) {
      quickApply(e.target.dataset.quickKey, e.target.value, true);
    } else if (e.target.id === 'impFile') {
      const f = e.target.files[0];
      if (!f) return;
      fillAgentYaml(await f.text());
      document.getElementById('impStatus').textContent = `loaded ${f.name}`;
      setAgentStatus(`imported ${f.name}`);
    } else if (e.target.id === 'impSample') {
      const file = e.target.value, project = e.target.selectedOptions[0]?.dataset.project || 'talk-bench';
      if (!file) return;
      try {
        const r = await getJSON(`/api/test/sample?file=${encodeURIComponent(file)}&project=${encodeURIComponent(project)}`);
        fillAgentYaml(r.text);
        setAgentStatus(`loaded ${project}/samples/${file}`);
      } catch (e2) { setAgentStatus('⚠ ' + e2.message); }
    } else if (e.target.id === 'archSel') {
      const a = (testState.options.archived || [])[Number(e.target.value)];
      if (!a) return;
      fillAgentYaml(a.yaml);
      applySettings({ source: a.source, domain: a.domain, split: a.split });
      setAgentStatus(`loaded the agent of ${a.run_path}`);
    }
  });
  document.getElementById('agentYaml').addEventListener('input', () => {
    testState.showYaml = true;  // typed into the YAML: keep it open even if the agent just became a compact one
    renderQuickFields();
    parseAgentYaml();
  });

  const settings = document.getElementById('sSource').closest('.card');
  settings.addEventListener('change', e => {
    if (e.target.id === 'sSource') refreshDomainOptions();
    else if (e.target.id === 'sDomain') refreshSplitOptions();
    else if (e.target.id === 'sSplit') { updateCmdPreview(); loadScenarioCatalog(); }
    else if (e.target.id === 'sUserSim' || e.target.id === 'sComplexity') updateCmdPreview();
    else if (e.target.matches('#scenList input[type=checkbox]')) {
      e.target.checked ? testState.picked.add(e.target.value) : testState.picked.delete(e.target.value);
      renderScenarioList();
    }
  });
  settings.addEventListener('input', e => {
    if (e.target.id === 'scenFilter') renderScenarioList();
  });
  document.getElementById('scenAll').addEventListener('click', () => { shownScenarios().forEach(s => testState.picked.add(s.id)); renderScenarioList(); });
  document.getElementById('scenNone').addEventListener('click', () => { testState.picked = new Set(); renderScenarioList(); });
  document.getElementById('startTestBtn').addEventListener('click', startTest);

  document.getElementById('schedToggle').addEventListener('click', () => document.getElementById('schedForm').hidden ? openSchedForm() : closeSchedForm());
  const schedForm = document.getElementById('schedForm');
  schedForm.addEventListener('input', e => { if (e.target.id === 'schAt') updateSchedAtHelp(); });
  document.getElementById('schSave').addEventListener('click', saveSchedule);
  document.getElementById('schCancel').addEventListener('click', () => closeSchedForm());
  document.getElementById('schedTable').addEventListener('click', async e => {
    const b = e.target.closest('button');
    if (!b) return;
    const ds = b.dataset;
    try {
      if (ds.schedEdit) { await editSchedule(ds.schedEdit); return; }
      if (ds.schedDel) {
        if (!confirm('Delete this scheduled test? It will not run.')) return;
        await postJSON(`/api/test/schedules/${encodeURIComponent(ds.schedDel)}`, null, 'DELETE');
        if (testState.editingSchedule === ds.schedDel) closeSchedForm();
      }
      await refreshSchedules();
    } catch (err) {
      b.disabled = false;
      setUpStatus('⚠ ' + err.message);
    }
  });

  document.getElementById('resumeSel').addEventListener('change', () => { document.getElementById('resumeStatus').textContent = ''; updateResumeInfo(); });
  document.getElementById('resumeBtn').addEventListener('click', startResume);
  document.getElementById('resumeInfo').addEventListener('click', e => {
    const a = e.target.closest('[data-resume-log]');
    if (a) { e.preventDefault(); selectJob(a.dataset.resumeLog); }
  });

  document.getElementById('jobsMore').addEventListener('click', () => { testState.showAllJobs = !testState.showAllJobs; renderJobRows(); });
  document.getElementById('jobsTable').addEventListener('click', async e => {
    const b = e.target.closest('button');
    if (!b) return;
    const ds = b.dataset;
    try {
      if (ds.jobLog) { selectJob(ds.jobLog); return; }
      if (ds.jobCancel) {
        if (!confirm('Stop this test? talk-bench has no graceful stop — its process group is killed. The run can be resumed afterwards.')) return;
        await postJSON(`/api/test/jobs/${encodeURIComponent(ds.jobCancel)}/cancel`);
      } else if (ds.jobSync) {
        b.disabled = true;
        await postJSON(`/api/test/jobs/${encodeURIComponent(ds.jobSync)}/sync`);
      } else if (ds.jobResume) {
        const r = await postJSON(`/api/test/jobs/${encodeURIComponent(ds.jobResume)}/resume`);
        await refreshJobs(true);
        selectJob(r.job.id);
        refreshResumable().catch(() => {});
        return;
      } else if (ds.jobAgain) {
        await loadJobIntoEditor(ds.jobAgain);
        return;
      } else if (ds.jobDel) {
        if (!confirm('Remove this test from the list? The run directory and the archived run are kept.')) return;
        await postJSON(`/api/test/jobs/${encodeURIComponent(ds.jobDel)}`, null, 'DELETE');
        if (testState.selected === ds.jobDel) { testState.selected = null; document.getElementById('logCard').hidden = true; }
      }
      await refreshJobs(true);
    } catch (err) {
      b.disabled = false;
      setUpStatus('⚠ ' + err.message);
    }
  });

  await refreshJobs(true).catch(e => setUpStatus('⚠ ' + e.message));
  if (seq !== routeSeq) return;
  await refreshSchedules().catch(e => setUpStatus('⚠ ' + e.message));
  if (seq !== routeSeq) return;  // left the page meanwhile: never start polling for it
  startTestPolling();

  const from = params.get('from');
  if (from) await prefillFromRun(from).catch(e => setAgentStatus('⚠ ' + e.message));
  if (seq !== routeSeq) return;
  // "Run test with it" on the Settings / Provision pages: <project>/<file in samples/>
  const sample = params.get('sample'), cut = sample ? sample.indexOf('/') : -1;
  if (cut > 0) {
    const project = sample.slice(0, cut), file = sample.slice(cut + 1);
    try {
      const r = await getJSON(`/api/test/sample?file=${encodeURIComponent(file)}&project=${encodeURIComponent(project)}`);
      if (seq !== routeSeq) return;
      fillAgentYaml(r.text);
      setAgentStatus(`loaded ${project}/samples/${file}`);
    } catch (e) { setAgentStatus('⚠ ' + e.message); }
  }
  const jobId = params.get('job');
  if (jobId && testState.jobs.some(j => j.id === jobId)) selectJob(jobId, false);
  // "Resume…" on a run page lands here with that run picked. Not awaited: route() puts the page at the
  // top once this returns, and the scroll to the card has to come after that.
  const resume = params.get('resume');
  refreshResumable(resume).then(() => {
    if (!resume || seq !== routeSeq) return;
    if (document.getElementById('resumeSel').value === resume) {
      document.getElementById('resumeCard').scrollIntoView({ behavior: smoothScroll(), block: 'start' });
    } else {
      document.getElementById('resumeStatus').textContent = `${resume} has nothing left to resume`;
    }
  }, e => {
    if (seq === routeSeq) document.getElementById('resumeSel').innerHTML = `<option value="">⚠ ${esc(e.message)}</option>`;
  });
}

/* ---------- settings: the checkout's config files and this viewer's .env ---------- */
// Secret values never reach the page (only their last four characters); a typed value replaces one.
// Edits stay in setState until Save, which sends just the changes: the env lines touched, the
// talkbench.yaml fields changed (the server rewrites them in place, comments kept) or a YAML text.
const setState = { meta: null, project: null, file: null, data: null, view: 'form', env: null, form: null };
const SET_LOCAL_NOTE = 'Read-only here: settings can only be saved on the Mac that runs the viewer (open it at localhost). Secret values are never shown.';
// the talkbench.yaml blocks the form shows; the others (defaults, agent, custom_*) are edited as YAML
const FORM_BLOCKS = ['simulator', 'evaluation', 'simulator_gate', 'mid_turn_speak_gate', 'terminal_hangup_gate', 'USE_S3_STORAGE_FOR_RESULTS'];
const FIELD_HELP = {
  'simulator.llm_model': 'LiteLLM model of the user simulator, provider/model.',
  'simulator.llm_temperature': 'Reasoning deployments accept only 1.',
  'simulator.tts_model': 'The caller\'s voice: azure-speech-tts/<voice> or elevenlabs/<model>.',
  'simulator.tts_voice': 'Persona gender mapping may override it per scenario.',
  'simulator.asr_model': 'Transcribes the agent: azure-speech/<locale> or deepgram/<model>.',
  'simulator.loop_detection_embedding_model': 'For the runner\'s loop detector during the live conversation, not for scoring.',
  'simulator.user_persona': 'Forced on every scenario of a run, over each scenario\'s own user_persona. Only talkbench.yaml can set it.',
  'simulator.user_persona.barge_in_mode': 'prepared_fact lets a barge-in fire from a fact prepared on an earlier turn; llm_only always asks the LLM.',
  'evaluation.judge_model': 'The LLM judge.',
  'evaluation.temperature': 'Judge temperature. Reasoning deployments need 1.',
  'simulator_gate.max_retries': '0 – 10.',
  'USE_S3_STORAGE_FOR_RESULTS': 'Upload finished runs to S3; needs the AWS_* keys and TALKBENCH_S3_BUCKET in .env.',
};
const FIELD_UNSET = {  // what applies while a field is unset
  'evaluation.judge_model': 'unset → simulator.llm_model',
  'evaluation.temperature': 'unset → 0',
  'mid_turn_speak_gate.model': 'unset → simulator.llm_model',
  'terminal_hangup_gate.model': 'unset → simulator.llm_model',
  'mid_turn_speak_gate.timeout_s': 'unset → 3.0',
  'terminal_hangup_gate.timeout_s': 'unset → 3.0',
  'mid_turn_speak_gate.enabled': 'unset (off)',
  'terminal_hangup_gate.enabled': 'unset (off)',
};
const fileTab = f => f === 'talkbench.yaml' || f === '.env' ? f : 'samples';
const settingsHash = (p, f) => `#/settings?p=${encodeURIComponent(p)}&f=${encodeURIComponent(f)}`;

async function renderSettings(params) {
  const seq = routeSeq;
  const meta = await getJSON('/api/settings');
  if (seq !== routeSeq) return;
  setState.meta = meta;
  const projects = meta.projects;
  const project = projects.find(p => p.name === params.get('p')) || projects.find(p => p.name !== 'viewer') || projects[0];
  const file = project.files.some(f => f.file === params.get('f')) ? params.get('f') : project.files[0].file;
  setView(`<div id="settingsPage">
    <div class="page-head"><h2>Settings</h2>
      <div class="muted" style="font-size:13px;margin-top:4px">The config files of the ai-ds-research checkout tests run in, and this viewer's own .env.</div></div>
    ${meta.local ? '' : `<div class="notice warn" style="margin:0 0 14px">${esc(SET_LOCAL_NOTE)}</div>`}
    <div class="set-top"><div class="seg" id="setProjects">${projects.map(p =>
      `<button type="button" data-set-project="${esc(p.name)}">${esc(p.name === 'viewer' ? 'This viewer' : p.name)}</button>`).join('')}</div></div>
    <div class="card set-card">
      <div class="card-head" id="setHead"></div>
      <div class="set-body" id="setBody"></div>
      <div class="set-foot"><span class="set-msg" id="setMsg"></span>
        <button class="navbtn" type="button" id="setDiscard">Discard</button>
        <button class="btn primary" type="button" id="setSave"${meta.local ? '' : ` disabled title="${esc(SET_LOCAL_NOTE)}"`}>Save</button></div>
    </div></div>`);
  await openSettingsFile(project.name, file, seq, true);
}

function settingsChanges() {
  const d = setState.data;
  if (!d) return 0;
  if (d.kind === 'env') return setState.env.edits.size + setState.env.adds.length;
  if (d.kind === 'project' && setState.view === 'form') return setState.form.size;
  const ta = document.getElementById('setYaml');
  return ta && ta.value !== d.text ? 1 : 0;
}

async function openSettingsFile(project, file, seq = routeSeq, force = false) {
  if (!force && settingsChanges() && !confirm('Discard the unsaved changes?')) return;
  const data = await getJSON(`/api/settings/file?project=${encodeURIComponent(project)}&file=${encodeURIComponent(file)}`);
  if (seq !== routeSeq) return;
  Object.assign(setState, { project, file, data, env: { edits: new Map(), adds: [] }, form: new Map() });
  if (data.kind === 'project' && !data.schema) setState.view = 'yaml';
  if (location.hash !== settingsHash(project, file)) history.replaceState(null, '', settingsHash(project, file));
  lastHash = decodeURIComponent(location.hash);
  renderSettingsHead();
  renderSettingsBody();
}

function renderSettingsHead() {
  const proj = setState.meta.projects.find(p => p.name === setState.project);
  document.querySelectorAll('[data-set-project]').forEach(b => b.classList.toggle('active', b.dataset.setProject === setState.project));
  const tab = fileTab(setState.file), samples = proj.files.filter(f => f.kind === 'agent');
  const tabs = proj.files.filter(f => f.kind !== 'agent').map(f => [f.file, f.file]);
  if (samples.length) tabs.push(['samples', `Agent samples <span class="seg-n">${samples.length}</span>`]);
  document.getElementById('setHead').innerHTML = `<div class="seg">${tabs.map(([k, label]) =>
    `<button type="button" class="${tab === k ? 'active' : ''}" data-set-tab="${esc(k)}">${label}</button>`).join('')}</div>
    <span class="set-path" title="${esc(setState.data.path)}">${esc(setState.data.path)}${setState.data.exists ? '' : ' · not created yet'}</span>`;
}

function renderSettingsBody() {
  const d = setState.data, body = document.getElementById('setBody');
  let html = '';
  if (d.kind === 'agent') {
    const proj = setState.meta.projects.find(p => p.name === setState.project);
    html += `<div class="set-bar"><select id="setSample" aria-label="Agent sample">${proj.files.filter(f => f.kind === 'agent').map(f =>
      `<option value="${esc(f.file)}"${f.file === setState.file ? ' selected' : ''}>${esc(f.file.slice(8))} — ${esc(f.name || '')} (${esc(shortModule(f.module))})</option>`).join('')}</select>
      <a class="navbtn" href="#/test?sample=${encodeURIComponent(setState.project + '/' + setState.file.slice(8))}" title="Open the Run test page with this file in the editor">Run test with it</a>
      <button class="navbtn" type="button" id="setSaveAs"${setState.meta.local ? '' : ' disabled'}>Save as new file…</button></div>`;
  }
  if (d.kind === 'project') {
    html += `<div class="set-bar"><span class="set-applies" style="margin:0">talk-bench reads it at the start of every run from ${esc(setState.project)}; agent YAML blocks and CLI flags override it.</span>
      <div class="seg">${['form', 'yaml'].map(v => `<button type="button" data-set-view="${v}" class="${setState.view === v ? 'active' : ''}"${v === 'form' && !d.schema ? ' disabled title="talk-bench\'s schema could not be loaded"' : ''}>${v === 'form' ? 'Form' : 'YAML'}</button>`).join('')}</div></div>`;
  }
  if (d.kind === 'env') html += `<p class="set-applies">${esc(d.applies)}</p>` + envEditorHTML();
  else if (d.kind === 'project' && setState.view === 'form') html += projectFormHTML();
  else html += `<div class="field"><textarea id="setYaml" spellcheck="false" rows="26" aria-label="${esc(setState.file)}">${esc(d.text)}</textarea></div>`;
  if (d.kind !== 'env' && (d.error || d.warnings?.length)) {
    html += `<div class="set-err">${esc(d.error ? 'The file on disk does not pass the check: ' + d.error : '')}${d.error && d.warnings?.length ? '\n' : ''}${
      d.warnings?.length ? `<span class="muted">${esc(d.warnings.join('\n'))}</span>` : ''}</div>`;
  }
  body.innerHTML = html;
  markEnvRows();
  updateSettingsFoot();
}

function updateSettingsFoot(msg = null, err = false) {
  const n = settingsChanges(), el = document.getElementById('setMsg');
  if (!el) return;
  el.classList.toggle('err', !!err);
  el.textContent = msg ?? (n ? `${n} unsaved change${n === 1 ? '' : 's'}` : 'No changes');
  document.getElementById('setDiscard').disabled = !n;
  if (setState.meta.local) document.getElementById('setSave').disabled = !n;
}

/* -- .env -- */
function envEditorHTML() {
  const items = setState.data.items;
  const rows = items.map(it => {
    if (it.type === 'heading') return `<div class="env-h">${esc(it.text)}</div>`;
    if (it.type === 'note') return `<div class="env-note">${esc(it.text)}</div>`;
    const help = [it.help, it.inline].filter(Boolean).join('\n');
    const helpHTML = !help ? '' : help.length > 140
      ? `<details class="env-help"><summary>${esc(help.split('\n')[0])}</summary>${esc(help.split('\n').slice(1).join('\n'))}</details>`
      : `<div class="env-help">${esc(help)}</div>`;
    const ph = it.secret ? (it.set ? `secret ${it.hint.startsWith('…') ? 'ending in ' + it.hint.slice(1) : 'set'} — type to replace` : 'not set') : 'empty';
    return `<div class="env-row" data-line="${it.line}">
      <label class="env-on" title="Unchecked: the line is commented out"><input type="checkbox" data-env-on${it.active ? ' checked' : ''} aria-label="Use ${esc(it.key)}"></label>
      <div class="env-key"><code>${esc(it.key)}</code>${it.secret ? `<span title="Secret: the value stays on the server">${ICONS.lock}</span>` : ''}${helpHTML}</div>
      <div class="env-val"><input type="text" data-env-val value="${esc(it.secret ? '' : it.value)}" placeholder="${esc(ph)}" spellcheck="false" autocomplete="off" aria-label="${esc(it.key)} value"><div class="env-dup" hidden></div></div>
      <button class="row-act env-del" type="button" data-env-del title="Delete this line" aria-label="Delete ${esc(it.key)}">${ICONS.trash}</button>
    </div>`;
  }).join('');
  const present = new Set(items.filter(i => i.type === 'entry').map(i => i.key));
  const known = (setState.data.example_keys || []).filter(k => !present.has(k.key));
  const adds = setState.env.adds.map((a, i) => `<div class="env-row changed" data-add="${i}">
      <span></span><div class="env-key"><code>${esc(a.key)}</code><div class="env-help">new line at the end of the file</div></div>
      <div class="env-val"><input type="text" value="${esc(a.value)}" disabled></div>
      <button class="row-act env-del" type="button" data-env-add-del="${i}" title="Remove" aria-label="Remove ${esc(a.key)}">${ICONS.trash}</button></div>`).join('');
  return `<div class="env-list">${rows || '<div class="env-note">The file is empty.</div>'}${adds}</div>
    <div class="env-add"><span></span>
      <input id="envAddKey" list="envKnown" placeholder="NEW_VARIABLE" spellcheck="false" autocomplete="off" aria-label="Variable name">
      <input id="envAddVal" placeholder="value" spellcheck="false" autocomplete="off" aria-label="Value">
      <button class="btn" type="button" id="envAddBtn">Add</button></div>
    <datalist id="envKnown">${known.map(k => `<option value="${esc(k.key)}">${esc((k.help || '').split('\n')[0].slice(0, 90))}</option>`).join('')}</datalist>`;
}

// changed / off / deleted marks and "set again below" warnings, from the edits (no re-render: typing keeps focus)
function markEnvRows() {
  if (setState.data?.kind !== 'env') return;
  const byLine = new Map(setState.data.items.filter(i => i.type === 'entry').map(i => [i.line, i]));
  const lastActive = new Map();
  for (const [line, it] of byLine) {
    const ed = setState.env.edits.get(line) || {};
    if ((ed.active ?? it.active) && !ed.delete) lastActive.set(it.key, line);
  }
  for (const a of setState.env.adds) if (a.active) lastActive.set(a.key, Infinity);
  document.querySelectorAll('.env-row[data-line]').forEach(row => {
    const line = Number(row.dataset.line), it = byLine.get(line), ed = setState.env.edits.get(line) || {};
    const active = ed.active ?? it.active;
    row.classList.toggle('changed', setState.env.edits.has(line));
    row.classList.toggle('off', !active);
    row.classList.toggle('deleted', !!ed.delete);
    const later = active && !ed.delete ? lastActive.get(it.key) : undefined;
    const dup = row.querySelector('.env-dup');
    dup.hidden = later === undefined || later === line;
    if (!dup.hidden) dup.textContent = later === Infinity ? 'set again by a new line below — that one wins' : `set again on line ${later + 1} — that one wins`;
  });
}

function envEdit(line, patch) {
  const it = setState.data.items.find(i => i.type === 'entry' && i.line === line);
  const ed = { ...(setState.env.edits.get(line) || {}), ...patch };
  if (ed.value !== undefined && (it.secret ? ed.value === '' : ed.value === it.value)) delete ed.value;
  if (ed.active !== undefined && ed.active === it.active) delete ed.active;
  if (!ed.delete) delete ed.delete;
  Object.keys(ed).length ? setState.env.edits.set(line, ed) : setState.env.edits.delete(line);
  markEnvRows();
  updateSettingsFoot();
}

/* -- talkbench.yaml form, built from talk-bench's own ProjectConfig JSON schema -- */
function schemaNode(schema, n) {
  if (n?.$ref) return schemaNode(schema, schema.$defs[n.$ref.split('/').pop()]);
  if (n?.anyOf) {
    const real = n.anyOf.filter(x => x.type !== 'null');
    if (real.length === 1) return { ...schemaNode(schema, real[0]), description: n.description };
  }
  return n || {};
}
const fieldKind = n => n.enum ? 'enum' : n.type === 'boolean' ? 'bool' : n.type === 'integer' ? 'int'
  : n.type === 'number' ? 'num' : n.type === 'string' ? 'text' : n.type === 'object' && n.properties ? 'object' : 'other';
const docAt = (doc, path) => path.reduce((o, k) => (o && typeof o === 'object' ? o[k] : undefined), doc);

function projectFormHTML() {
  const { schema, doc } = setState.data;
  if (!doc) return `<div class="set-err">talkbench.yaml is not valid YAML — fix it in the YAML view.</div>`;
  const props = schema.properties || {};
  const general = [], blocks = [];
  for (const key of FORM_BLOCKS) {
    if (!props[key]) continue;
    const n = schemaNode(schema, props[key]);
    if (fieldKind(n) === 'object') {
      const desc = FIELD_HELP[key] || n.description || '';
      blocks.push(`<fieldset class="set-block"><legend>${esc(key)}</legend>${desc ? `<p class="block-help">${esc(desc.split('\n\n')[0])}</p>` : ''}
        <div class="form-grid">${Object.entries(n.properties).map(([k, sub]) => formFieldHTML([key, k], schemaNode(schema, sub))).join('')}</div></fieldset>`);
    } else general.push(formFieldHTML([key], n));
  }
  const rest = Object.keys(doc).filter(k => !FORM_BLOCKS.includes(k) && k !== 'schema_version');
  return blocks.join('') + (general.length ? `<fieldset class="set-block"><legend>results</legend><div class="form-grid">${general.join('')}</div></fieldset>` : '')
    + `<p class="set-applies" style="margin:4px 0 0">An empty field is left out of the file, so talk-bench's default applies. ${rest.length
      ? `This file also sets <span class="mono">${rest.map(esc).join(', ')}</span> — edit ${rest.length === 1 ? 'it' : 'them'} in the YAML view.`
      : 'defaults, agent, custom_scenarios and custom_domains are edited in the YAML view.'}</p>`;
}

function formFieldHTML(path, n) {
  const pk = path.join('.'), kind = fieldKind(n), id = 'sf-' + path.join('-');
  if (kind === 'object') {
    return `<div class="set-sub"><div class="set-sub-h">${esc(path.at(-1))}</div>${FIELD_HELP[pk] ? `<div class="help" style="font-size:11.5px;color:var(--muted)">${esc(FIELD_HELP[pk])}</div>` : ''}
      <div class="form-grid">${Object.entries(n.properties).map(([k, sub]) => formFieldHTML([...path, k], schemaNode(setState.data.schema, sub))).join('')}</div></div>`;
  }
  const orig = docAt(setState.data.doc, path);
  const cur = setState.form.has(pk) ? setState.form.get(pk) : orig;
  const attrs = `id="${id}" data-path='${esc(JSON.stringify(path))}' data-kind="${kind}"`;
  const unset = FIELD_UNSET[pk] || 'unset';
  let input;
  if (kind === 'bool' || kind === 'enum') {
    const opts = kind === 'bool' ? ['true', 'false'] : n.enum;
    const val = cur === undefined || cur === null ? '' : String(cur);
    input = `<select ${attrs}><option value="">— ${esc(unset)} —</option>${opts.map(o => `<option${o === val ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  } else if (kind === 'int' || kind === 'num') {
    input = `<input type="number" ${attrs} step="${kind === 'int' ? 1 : 'any'}"${n.minimum != null ? ` min="${n.minimum}"` : ''}${n.maximum != null ? ` max="${n.maximum}"` : ''} value="${esc(cur ?? '')}" placeholder="${esc(unset)}">`;
  } else if (kind === 'text') {
    const sugg = setState.data.suggest?.[path.at(-1)] || [];
    input = `<input type="text" ${attrs} value="${esc(cur ?? '')}" placeholder="${esc(unset)}" spellcheck="false" autocomplete="off"${sugg.length ? ` list="${id}-dl"` : ''}>${
      sugg.length ? `<datalist id="${id}-dl">${sugg.map(s => `<option value="${esc(s)}">`).join('')}</datalist>` : ''}`;
  } else {
    input = `<input type="text" value="${esc(JSON.stringify(cur ?? null))}" disabled title="Edit in the YAML view">`;
  }
  return `<div class="field${setState.form.has(pk) ? ' changed' : ''}"><label for="${id}">${esc(path.at(-1))}</label>${input}${
    FIELD_HELP[pk] ? `<div class="help">${esc(FIELD_HELP[pk])}</div>` : ''}</div>`;
}

function formEdit(el) {
  const path = JSON.parse(el.dataset.path), pk = path.join('.'), kind = el.dataset.kind, raw = el.value;
  let v;
  if (kind === 'bool') v = raw === '' ? null : raw === 'true';
  else if (kind === 'enum') v = raw === '' ? null : raw;
  else if (kind === 'int' || kind === 'num') {
    if (raw.trim() === '') v = null;
    else if (Number.isNaN(Number(raw))) return;
    else v = kind === 'int' ? Math.trunc(Number(raw)) : Number(raw);
  } else v = raw.trim() === '' ? null : raw.trim();
  const orig = docAt(setState.data.doc, path) ?? null;
  JSON.stringify(v) === JSON.stringify(orig) ? setState.form.delete(pk) : setState.form.set(pk, v);
  el.closest('.field').classList.toggle('changed', setState.form.has(pk));
  updateSettingsFoot();
}

async function saveSettings() {
  const d = setState.data, btn = document.getElementById('setSave');
  const body = { project: setState.project, file: setState.file, version: d.version };
  if (d.kind === 'env') {
    body.env_edits = [...setState.env.edits].map(([line, ed]) => ({ line, key: d.items.find(i => i.line === line).key, ...ed }));
    body.env_adds = setState.env.adds;
  } else if (d.kind === 'project' && setState.view === 'form') {
    body.changes = [...setState.form].map(([pk, value]) => ({ path: pk.split('.'), value }));
  } else body.text = document.getElementById('setYaml').value;
  setBusy(btn, true);
  try {
    const res = await postJSON('/api/settings/file', body);
    setState.data = res;
    setState.env = { edits: new Map(), adds: [] };
    setState.form = new Map();
    renderSettingsHead();
    renderSettingsBody();
    const notes = [...(res.saved_warnings || []), ...(res.restart?.length ? [`${res.restart.join(', ')} takes effect after a viewer restart`] : [])];
    updateSettingsFoot(`Saved ${setState.file}${notes.length ? ' — ' + notes.join('; ') : ''}`);
    if (setState.project === 'viewer') invalidateRuns();  // /api/runs carries the Ask AI model
  } catch (e) {
    updateSettingsFoot(e.message, true);
  } finally {
    setBusy(btn, false);
    if (!settingsChanges()) btn.disabled = true;
  }
}

document.addEventListener('click', async e => {
  if (!e.target.closest('#settingsPage')) return;
  const t = e.target.closest('button, a');
  if (!t) return;
  if (t.dataset.setProject && t.dataset.setProject !== setState.project) {
    const proj = setState.meta.projects.find(p => p.name === t.dataset.setProject);
    const keep = proj.files.find(f => f.file === fileTab(setState.file)) || proj.files[0];
    openSettingsFile(proj.name, keep.file).catch(err => updateSettingsFoot(err.message, true));
  } else if (t.dataset.setTab) {
    const proj = setState.meta.projects.find(p => p.name === setState.project);
    const f = t.dataset.setTab === 'samples' ? proj.files.find(x => x.kind === 'agent').file : t.dataset.setTab;
    if (f !== setState.file) openSettingsFile(setState.project, f).catch(err => updateSettingsFoot(err.message, true));
  } else if (t.dataset.setView && t.dataset.setView !== setState.view) {
    if (settingsChanges() && !confirm('Discard the unsaved changes?')) return;
    setState.view = t.dataset.setView;
    setState.form = new Map();
    renderSettingsBody();
    document.querySelectorAll('[data-set-view]').forEach(b => b.classList.toggle('active', b.dataset.setView === setState.view));
  } else if (t.id === 'setSave') {
    saveSettings();
  } else if (t.id === 'setDiscard') {
    setState.env = { edits: new Map(), adds: [] };
    setState.form = new Map();
    renderSettingsBody();
  } else if (t.hasAttribute('data-env-del')) {
    const line = Number(t.closest('.env-row').dataset.line);
    envEdit(line, { delete: !setState.env.edits.get(line)?.delete });
  } else if (t.dataset.envAddDel !== undefined) {
    setState.env.adds.splice(Number(t.dataset.envAddDel), 1);
    renderSettingsBody();
  } else if (t.id === 'envAddBtn') {
    const key = document.getElementById('envAddKey').value.trim(), value = document.getElementById('envAddVal').value;
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(key)) { updateSettingsFoot('A variable name is letters, digits and _ and does not start with a digit', true); return; }
    setState.env.adds.push({ key, value, active: true });
    renderSettingsBody();
    document.getElementById('envAddKey').focus();
  } else if (t.id === 'setSaveAs') {
    const name = prompt('New file name in samples/ (.yaml)', setState.file.slice(8).replace(/\.ya?ml$/, '') + '_copy.yaml');
    if (!name) return;
    const file = 'samples/' + (/\.ya?ml$/.test(name) ? name : name + '.yaml');
    try {
      await postJSON('/api/settings/file', { project: setState.project, file, version: null, text: document.getElementById('setYaml').value });
      setState.meta = await getJSON('/api/settings');
      setState.data.text = document.getElementById('setYaml').value;  // the edits went into the new file
      await openSettingsFile(setState.project, file, routeSeq, true);
      updateSettingsFoot(`Created ${file}`);
    } catch (err) { updateSettingsFoot(err.message, true); }
  }
});
document.addEventListener('input', e => {
  if (!e.target.closest('#settingsPage')) return;
  if (e.target.hasAttribute('data-env-val')) envEdit(Number(e.target.closest('.env-row').dataset.line), { value: e.target.value });
  else if (e.target.dataset.path && e.target.tagName === 'INPUT') formEdit(e.target);
  else if (e.target.id === 'setYaml') updateSettingsFoot();
});
document.addEventListener('change', e => {
  if (!e.target.closest('#settingsPage')) return;
  if (e.target.hasAttribute('data-env-on')) envEdit(Number(e.target.closest('.env-row').dataset.line), { active: e.target.checked });
  else if (e.target.dataset.path && e.target.tagName === 'SELECT') formEdit(e.target);
  else if (e.target.id === 'setSample') {
    const prev = setState.file;
    openSettingsFile(setState.project, e.target.value).then(() => { if (setState.file === prev) e.target.value = prev; })
      .catch(err => updateSettingsFoot(err.message, true));
  }
});
document.addEventListener('keydown', e => {
  if (e.target.closest?.('#settingsPage') && (e.metaKey || e.ctrlKey) && e.key === 's') {
    e.preventDefault();
    if (setState.meta?.local && settingsChanges()) saveSettings();
  } else if (e.target.id === 'envAddVal' && e.key === 'Enter') document.getElementById('envAddBtn').click();
});
window.addEventListener('beforeunload', e => {
  if ((location.hash.startsWith('#/settings') && settingsChanges()) || (location.hash.startsWith('#/provision') && provDirty())) e.preventDefault();
});

/* ---------- provision: MCP server → talkdesk-agent provision → agent config, in talk-bench-talkdesk ---------- */
const provState = { data: null, json: '', cfgFile: '', cfgVersion: null, cfgText: '', checkSeq: 0, selected: null, logs: {} };
const TD_PROJECT = 'talk-bench-talkdesk';
const provDirty = () => { const ta = document.getElementById('provYaml'); return !!ta && ta.value !== provState.cfgText; };
const platformBadge = p => p ? `<span class="badge ${p === 'PRD' ? 'fail' : 'na'}">${esc(p)}</span>` : '';

  const seq = routeSeq;
  const d = await getJSON('/api/talkdesk');

  provState.data = d;
  provState.json = '';

      <div class="table-wrap jobs-wrap"><table id="mcpTable" style="min-width:640px"><thead><tr><th>Serves</th><th>Port</th><th>Public URL</th><th>Up</th><th></th></tr></thead><tbody id="mcpRows"></tbody></table></div>

      <div class="form-grid">

        <div class="field"><label for="mcpDomain">--domain</label><select id="mcpDomain"></select></div>
        <div class="field"><label for="mcpPort">--port</label><input id="mcpPort" type="number" min="1024" max="65535" value="3030"></div>

      </div>
      <div class="actions-row"><button class="btn" type="button" id="mcpStart"${lock}>${ICONS.play} Start server</button><span class="muted" style="font-size:12.5px" id="mcpStatus"></span></div>
      <div class="mcp-url">TALKDESK_MCP_URL in .env <span class="mono">${esc(d.mcp_url || 'not set')}</span>${d.mcp_url ? `<button class="navbtn" type="button" id="mcpCheck"${lock}>Check</button>` : ''}<span id="mcpCheckOut"></span>
        <a href="${settingsHash(TD_PROJECT, '.env')}" style="margin-left:auto">Edit .env</a></div>

    } catch (_) { /* transient — the next tick retries */ }

function fillMcpDomains() {

async function refreshProvision() {
