[project]
name = "talkbench-runs-viewer"
version = "0.1.0"
description = "Backup archive and web viewer for talk-bench / talk-bench-talkdesk run data"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    # >=1.83.0 is a security floor (OIDC cache-key-collision auth bypass fixed
    # in 1.83.0) — matches the constraint used across the talk-bench projects
    "litellm>=1.83.0",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
