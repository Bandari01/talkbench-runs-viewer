# Exact TalkBench-side simulator and judge profile used by the seven-domain
# Talkdesk QA run. Talkdesk is the agent under test; Luna simulates the caller
# and Sol evaluates the frozen task criteria.
schema_version: 1

USE_S3_STORAGE_FOR_RESULTS: false

simulator:
  llm_model: azure/gpt-5.6-luna
  llm_temperature: 1
  tts_model: azure-speech-tts/en-US-JennyNeural
  tts_voice: en-US-JennyNeural
  asr_model: azure-speech/en-US
  loop_detection_embedding_model: gemini/gemini-embedding-001

simulator_gate:
  enabled: false
  max_retries: 3
  evaluate_rejected_attempts: false

evaluation:
  judge_model: azure/gpt-5.6-sol
  # Reasoning deployments receive effort instead of a temperature parameter.
  temperature: 0
  reasoning_effort: xhigh
  # Experience and audio-quality metrics are observability only and are outside
  # this agent-definition iteration campaign.
  experience_enabled: false
  audio_mos_enabled: false

mid_turn_speak_gate:
  enabled: false
  timeout_s: 3.0

terminal_hangup_gate:
  enabled: false
  timeout_s: 3.0
